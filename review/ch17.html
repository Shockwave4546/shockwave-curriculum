      <h2>What Inheritance Does</h2>
      <p><strong>Inheritance</strong> lets one class inherit fields and methods from another. The class being inherited from is the <strong>superclass</strong> (or parent class); the class doing the inheriting is the <strong>subclass</strong> (or child class). Every FRC robot's subsystems share real structure — a name for logging, a <code class="inline">stop()</code> method, a <code class="inline">periodic()</code> method WPILib calls every loop — which makes them a natural fit for a shared superclass:</p>
      <pre class="code"><code><span class="k">public abstract class</span> <span class="t">Subsystem</span>
{
    <span class="k">private</span> <span class="t">String</span> name;

    <span class="k">public</span> <span class="me">Subsystem</span>(<span class="t">String</span> name) { <span class="k">this</span>.name = name; }
    <span class="k">public</span> <span class="t">String</span> <span class="me">getName</span>() { <span class="k">return</span> name; }
    <span class="k">public void</span> <span class="me">log</span>(<span class="t">String</span> msg) { System.out.<span class="me">println</span>(<span class="s">"["</span> + name + <span class="s">"] "</span> + msg); }
}

<span class="k">public class</span> <span class="t">Intake</span> <span class="k">extends</span> <span class="t">Subsystem</span>
{
    <span class="c">// inherits getName() and log() for free</span>
}</code></pre>
      <p><code class="inline">extends</code> is the keyword that sets up inheritance. A Java class can only <code class="inline">extends</code> <strong>one</strong> superclass — unlike a person with two biological parents, there's no multiple inheritance of this kind in Java. Omitting <code class="inline">extends</code> entirely doesn't mean "no parent" — it means the class implicitly inherits from Java's built-in <code class="inline">Object</code> class (Lesson 17.4).</p>
      <h2>The is-a Relationship</h2>
      <p>Inheritance should only model a genuine <strong>is-a</strong> relationship: an <code class="inline">Intake</code> <em>is a</em> <code class="inline">Subsystem</code>, a <code class="inline">Climber</code> <em>is a</em> <code class="inline">Subsystem</code>. The test to apply: could you substitute the subclass anywhere the superclass is expected, and have it still make sense? A <code class="inline">Vision</code> processor being asked to <code class="inline">stop()</code> and get <code class="inline">log()</code>ed makes sense as a <code class="inline">Subsystem</code> — but a <code class="inline">Robot</code> class itself, or a <code class="inline">Controller</code> wrapping a joystick, isn't a <em>kind of</em> <code class="inline">Subsystem</code>, even if it happens to interact with one.</p>
      <h2>is-a vs. has-a</h2>
      <p>The <strong>has-a</strong> relationship (also called <strong>association</strong>) is different: it's when one class simply holds a reference to another, without being a specialized kind of it. A <code class="inline">Robot</code> <em>has a</em> <code class="inline">Drivetrain</code>, an <code class="inline">Intake</code>, and a <code class="inline">Shooter</code> — it isn't a subclass of any of them:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Robot</span>
{
    <span class="k">private</span> <span class="t">Drivetrain</span> drivetrain;  <span class="c">// has-a: Robot holds a Drivetrain, isn't one</span>
    <span class="k">private</span> <span class="t">Intake</span> intake;          <span class="c">// has-a</span>
}</code></pre>
      <p>Compare that to <code class="inline">Intake extends Subsystem</code> — that's is-a: an <code class="inline">Intake</code> really is a specialized kind of <code class="inline">Subsystem</code>, not just something that happens to reference one.</p>
      <h2>Why Bother</h2>
      <p>Two forces motivate reaching for a superclass:</p>
      <ul>

      </ul>

    body: `
      <h2>Constructors Are Never Inherited</h2>
      <p>A subclass inherits its superclass's <code class="inline">public</code> methods and fields, but it does <strong>not</strong> inherit constructors, and it can't directly touch the superclass's <code class="inline">private</code> fields. Yet those inherited private fields still need to be properly set up before anything uses them — so how does a subclass initialize state that belongs to its superclass?</p>
      <h2>The super(...) Call</h2>
      <p>The keyword <code class="inline">super</code>, used like a method call, runs the superclass's constructor code in the context of the object already being built:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Subsystem</span>
{
    <span class="k">private</span> <span class="t">String</span> name;

    <span class="k">public</span> <span class="me">Subsystem</span>(<span class="t">String</span> name) { <span class="k">this</span>.name = name; }
    <span class="k">public</span> <span class="t">String</span> <span class="me">getName</span>() { <span class="k">return</span> name; }
}

<span class="k">public class</span> <span class="t">Intake</span> <span class="k">extends</span> <span class="t">Subsystem</span>
{
    <span class="k">private boolean</span> hasGamePiece;

    <span class="k">public</span> <span class="me">Intake</span>(<span class="t">String</span> name)
    {
        <span class="k">super</span>(name);          <span class="c">// runs Subsystem's constructor, setting the private `name` field</span>
        hasGamePiece = <span class="k">false</span>;  <span class="c">// Intake's own field</span>
    }
}</code></pre>
      <p><code class="inline">super(name)</code> isn't creating a second object — it's the one and only way to run <code class="inline">Subsystem</code>'s own initialization logic for the object currently under construction. Without it, <code class="inline">name</code> would never get set, since <code class="inline">Intake</code> has no direct access to that private field to assign it itself.</p>
      <h2>The Implicit super() Call</h2>
      <p>If a constructor doesn't start with an explicit <code class="inline">super(...)</code> call, Java automatically inserts a no-argument <code class="inline">super()</code> call for you. That only works if the superclass actually <em>has</em> a no-argument constructor — if it doesn't, any subclass constructor must explicitly call <code class="inline">super(...)</code> with arguments matching a constructor that does exist, or the code won't compile.</p>
      <h2>The Chain Bottoms Out at Object</h2>
      <p>Whether called explicitly or inserted implicitly, every chain of <code class="inline">super</code> calls eventually reaches <code class="inline">java.lang.Object</code>'s own no-argument constructor — the one class with no superclass of its own (Lesson 17.4). From there, construction "unwinds": <code class="inline">Object</code>'s constructor logic runs first, then each class going back down the hierarchy, ending with whichever class was actually instantiated. By the time your own constructor's body runs, every inherited field further up the chain has already been properly initialized.</p>
      <pre class="code"><code><span class="t">Intake</span> intake = <span class="k">new</span> <span class="t">Intake</span>(<span class="s">"Front Intake"</span>);
<span class="c">// Order of execution: Object() -> Subsystem(String) -> Intake(String)</span></code></pre>
    `,

      <h2>Multiple Subclasses, One Superclass</h2>
      <p>An <strong>inheritance hierarchy</strong> forms when several subclasses inherit (directly, or through another subclass) from a common superclass. <code class="inline">Intake</code>, <code class="inline">Shooter</code>, and <code class="inline">Climber</code> all extending <code class="inline">Subsystem</code> is a small hierarchy; <code class="inline">Object</code> sits at the very top of <em>every</em> hierarchy in Java, since every class ultimately inherits from it (Lesson 17.4).</p>
      <h2>A Superclass Reference Can Hold Any Subclass Object</h2>
      <p>A variable typed as the superclass can refer to an object of that class <em>or any of its subclasses</em>:</p>
      <pre class="code"><code><span class="t">Subsystem</span> s1 = <span class="k">new</span> <span class="t">Subsystem</span>(<span class="s">"Generic"</span>);

      <p>The reverse doesn't work — a subclass-typed variable cannot hold a plain superclass object, since not every <code class="inline">Subsystem</code> is specifically an <code class="inline">Intake</code>:</p>

    {

    }

  "17.4": {
    title: "Object Superclass",
    ref: "17.4 — Object Superclass (CSA 5.7)",
    body: `
      <h2>Every Class's Ultimate Parent</h2>
      <p><code class="inline">Object</code> (from <code class="inline">java.lang</code>) is the superclass of every class in Java — any class without an explicit <code class="inline">extends</code> inherits from it automatically. Two of <code class="inline">Object</code>'s methods matter enough to override in almost every class you write: <code class="inline">toString()</code> and <code class="inline">equals(Object other)</code>.</p>
      <h2>Overriding toString()</h2>
      <p><code class="inline">Object</code>'s default <code class="inline">toString()</code> produces an unhelpful string like <code class="inline">Subsystem@1a2b3c</code> (the class name plus a memory-address-derived hash). Overriding it to describe the object's real state is good practice in nearly every class:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Subsystem</span>
{
    <span class="k">private</span> <span class="t">String</span> name;

    <span class="k">public</span> <span class="me">Subsystem</span>(<span class="t">String</span> name) { <span class="k">this</span>.name = name; }

    <span class="me">@Override</span>
    <span class="k">public</span> <span class="t">String</span> <span class="me">toString</span>() { <span class="k">return</span> name; }
}</code></pre>
      <p>A subclass's own <code class="inline">toString()</code> can call <code class="inline">super.toString()</code> and build on it, rather than starting from scratch:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Intake</span> <span class="k">extends</span> <span class="t">Subsystem</span>
{
    <span class="k">private boolean</span> hasGamePiece;

    <span class="k">public</span> <span class="me">Intake</span>(<span class="t">String</span> name) { <span class="k">super</span>(name); }

    <span class="me">@Override</span>
    <span class="k">public</span> <span class="t">String</span> <span class="me">toString</span>()
    {
        <span class="k">return</span> <span class="k">super</span>.<span class="me">toString</span>() + <span class="s">" (hasGamePiece="</span> + hasGamePiece + <span class="s">")"</span>;
    }
}</code></pre>
      <h2>The equals() Method</h2>
      <p><code class="inline">equals(Object other)</code>, inherited from <code class="inline">Object</code>, tests whether two references point to the exact same object — the same result as <code class="inline">==</code> (Lesson 13's "== vs. .equals()" gotcha exists precisely because many classes, like <code class="inline">String</code>, override this default with something more useful).</p>
      <h2>Overriding equals() Correctly</h2>
      <p>Overriding <code class="inline">equals</code> is more involved than <code class="inline">toString</code>, since it has to satisfy five formal requirements to remain safe to use anywhere: <strong>reflexive</strong> (<code class="inline">o.equals(o)</code> is always <code class="inline">true</code>), <strong>symmetric</strong> (<code class="inline">a.equals(b)</code> matches <code class="inline">b.equals(a)</code>), <strong>transitive</strong> (<code class="inline">a.equals(b)</code> and <code class="inline">b.equals(c)</code> implies <code class="inline">a.equals(c)</code>), <strong>consistent</strong> (repeated calls give the same answer, if nothing changed), and <strong>never equal to null</strong>.</p>
      <p>A standard recipe satisfies all five:</p>
      <pre class="code"><code><span class="me">@Override</span>
<span class="k">public boolean</span> <span class="me">equals</span>(<span class="t">Object</span> other)
{
    <span class="k">if</span> (<span class="k">this</span> == other) <span class="k">return true</span>;               <span class="c">// 1. quick check: same object</span>
    <span class="k">if</span> (!(other <span class="k">instanceof</span> <span class="t">Subsystem</span>)) <span class="k">return false</span>; <span class="c">// 2. must be the same type</span>
    <span class="t">Subsystem</span> o = (<span class="t">Subsystem</span>) other;               <span class="c">// 3. safe to cast now</span>
    <span class="k">return this</span>.name.<span class="me">equals</span>(o.name);               <span class="c">// 4. compare the relevant fields</span>
}</code></pre>
      <p>Note the parameter type is always <code class="inline">Object</code>, never the class itself — <code class="inline">equals(Subsystem other)</code> would be a completely different method (overloading, not overriding), not the one <code class="inline">Object</code> actually declares.</p>
      <h2>The Subclass equals() Trap</h2>
      <p>Overriding <code class="inline">equals</code> again in a subclass of a class that's already overridden it is genuinely difficult to get right, and easy to accidentally break <strong>symmetry</strong>. If <code class="inline">Intake</code> (subclass of <code class="inline">Subsystem</code>) overrode <code class="inline">equals</code> to <em>also</em> compare <code class="inline">hasGamePiece</code>, then <code class="inline">genericSubsystem.equals(intakeObj)</code> would call <code class="inline">Subsystem</code>'s <code class="inline">equals</code> (comparing only <code class="inline">name</code>), while <code class="inline">intakeObj.equals(genericSubsystem)</code> would call <code class="inline">Intake</code>'s <code class="inline">equals</code> — which checks <code class="inline">other instanceof Intake</code> and returns <code class="inline">false</code>, since a plain <code class="inline">Subsystem</code> isn't an <code class="inline">Intake</code>. The two calls disagree, breaking the symmetry rule. The general guideline: only one class in a hierarchy should provide a real <code class="inline">equals</code> override.</p>
    `,
    pitfalls: [
      "Writing <code class=\"inline\">equals(Subsystem other)</code> instead of <code class=\"inline\">equals(Object other)</code>. That's overloading a new method, not overriding <code class=\"inline\">Object</code>'s.",
      "Forgetting the <code class=\"inline\">instanceof</code> check before casting. Casting <code class=\"inline\">other</code> without checking first throws <code class=\"inline\">ClassCastException</code> if it's an unrelated type.",
      "Overriding <code class=\"inline\">equals</code> again further down an inheritance hierarchy. This tends to violate symmetry — safest to let only one class in the hierarchy own the <code class=\"inline\">equals</code> override."
    ],
    takeaways: [
      "<code class=\"inline\">Object</code> is the superclass of every class in Java; <code class=\"inline\">toString()</code> and <code class=\"inline\">equals(Object other)</code> are its two methods worth overriding almost everywhere.",
      "A subclass's <code class=\"inline\">toString()</code> can call <code class=\"inline\">super.toString()</code> and extend it, rather than rebuilding the whole description from scratch.",
      "<code class=\"inline\">Object</code>'s default <code class=\"inline\">equals</code> is identity comparison (same as <code class=\"inline\">==</code>); a correct override must be reflexive, symmetric, transitive, consistent, and never <code class=\"inline\">true</code> against <code class=\"inline\">null</code>.",
      "The standard <code class=\"inline\">equals</code> recipe: check <code class=\"inline\">this == other</code>, check <code class=\"inline\">instanceof</code>, cast, then compare the relevant fields — always with parameter type <code class=\"inline\">Object</code>.",
      "Avoid overriding <code class=\"inline\">equals</code> more than once down an inheritance hierarchy — it tends to break symmetry."
    ],
    prov: "csawesome-2026: unit-5-inheritance-optional/5.07-object-superclass.md (CSA 5.7)"
  }
