      <h2>What Overriding Is</h2>
      <p>A subclass inherits all its superclass's <code class="inline">public</code> methods unchanged — but it can also <strong>override</strong> one, replacing the inherited version with its own. Overriding requires matching the superclass method's exact <strong>signature</strong>: same name, same parameter list, and the same (or a subtype of the) return type.</p>
      <pre class="code"><code><span class="k">public abstract class</span> <span class="t">Subsystem</span>
{
    <span class="k">public void</span> <span class="me">stop</span>() { System.out.<span class="me">println</span>(<span class="s">"Stopping subsystem"</span>); }

<span class="k">public class</span> <span class="t">Intake</span> <span class="k">extends</span> <span class="t">Subsystem</span>

    <span class="k">public void</span> <span class="me">stop</span>()

    }
}</code></pre>

      <h2>Overriding vs. Overloading</h2>
      <p>These sound similar but are entirely different things. <strong>Overriding</strong> means the exact same signature, in a subclass, replacing the superclass's version. <strong>Overloading</strong> means the same method <em>name</em>, in the <em>same</em> class, with a different parameter list:</p>

      <h2>Many Forms, One Piece of Code</h2>
      <p><strong>Polymorphism</strong> ("many forms") means the method that actually runs at runtime depends on the object's <em>actual</em> type — not the type its variable was declared with. This is the concrete payoff of everything Ch.17 and Lessons 18.1-18.2 built toward: real WPILib code treats a <code class="inline">TalonFX</code> or a <code class="inline">SparkMax</code> as just a <code class="inline">MotorController</code>, and calls the same method on either without caring which one it actually is:</p>
      <pre class="code"><code><span class="k">public void</span> <span class="me">driveForward</span>(<span class="t">MotorController</span> controller)
{
    controller.<span class="me">set</span>(<span class="n">0.5</span>); <span class="c">// works identically whether controller is a TalonFX or a SparkMax</span>
}</code></pre>
      <h2>Declared Type vs. Actual Type</h2>
      <p>Every variable has two types that matter: its <strong>declared (compile-time) type</strong> — what it's written as in the code — and its <strong>actual (runtime) type</strong> — the real class that was actually constructed with <code class="inline">new</code>:</p>
      <pre class="code"><code><span class="t">Subsystem</span> s = <span class="k">new</span> <span class="t">Intake</span>(<span class="s">"Front Intake"</span>);
<span class="c">// declared type: Subsystem</span>
<span class="c">// actual type:   Intake</span></code></pre>
      <p>The compiler only ever checks the <strong>declared</strong> type when deciding whether code compiles — it verifies that whatever method you're calling actually exists on that declared type (or an ancestor of it):</p>
      <pre class="code"><code><span class="t">Object</span> message = <span class="k">new</span> <span class="t">String</span>(<span class="s">"hi"</span>);
message.<span class="me">indexOf</span>(<span class="s">"h"</span>); <span class="c">// COMPILE ERROR — Object has no indexOf method, even though String does</span></code></pre>
      <p>Even though the real object here is a <code class="inline">String</code> (which absolutely does have <code class="inline">indexOf</code>), the compiler only looks at <code class="inline">message</code>'s <em>declared</em> type, <code class="inline">Object</code> — and refuses to compile, since <code class="inline">Object</code> never promises an <code class="inline">indexOf</code> method.</p>
      <h2>Runtime Dispatch: The Actual Type Decides Which Version Runs</h2>
      <p>Once code <em>does</em> compile, the JVM decides which overridden version of a method actually executes by looking at the object's real, actual type — starting there and searching upward through its superclasses if needed (same lookup process as Lesson 18.2's <code class="inline">super</code>):</p>
      <pre class="code"><code><span class="t">Subsystem</span> s = <span class="k">new</span> <span class="t">Intake</span>(<span class="s">"Front Intake"</span>); <span class="c">// declared Subsystem, actually an Intake</span>
s.<span class="me">stop</span>(); <span class="c">// the compiler only confirms Subsystem HAS a stop() method — but Intake's own override is what actually runs</span></code></pre>
      <p>This is exactly what makes the earlier <code class="inline">Subsystem[]</code>/<code class="inline">ArrayList&lt;Subsystem&gt;</code> examples (Lesson 17.3) genuinely useful — a single loop calling <code class="inline">s.stop()</code> on each element automatically runs whichever subclass's own <code class="inline">stop()</code> actually applies, without an <code class="inline">if</code>/<code class="inline">else</code> chain checking each one's specific type:</p>

{
    s.<span class="me">stop</span>(); <span class="c">// Intake's stop(), Climber's stop(), Shooter's stop() — whichever is actually correct for each object</span>
}</code></pre>
      <h2>Static Methods Don't Get This</h2>
      <p>Polymorphic dispatch only applies to regular (instance) methods. A <code class="inline">static</code> method call is resolved entirely by the declared type, at compile time — there's no runtime lookup involved at all, since static methods belong to the class itself, not to any particular object.</p>
    `,

      "Static methods don't participate in this — they're resolved entirely by declared type, at compile time."

      ${it.body}
      <div class="pitfalls"><div class="lbl">Common Pitfalls</div><ul>${it.pitfalls.map(p => `<li>${p}</li>`).join('')}</ul></div>
      <div class="takeaways"><div class="lbl">Key Takeaways</div><ul>${it.takeaways.map(t => `<li>${t}</li>`).join('')}</ul></div>
      <div class="prov"><strong>Derived from</strong> ${it.prov}</div>
    </div>
  `;
  document.getElementById('main').scrollTop = 0;
}

renderList();
renderMain();
</script>
</body>
</html>
