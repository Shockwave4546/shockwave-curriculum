<script>
const DATA = {
  "23.1": {
    title: "Scope and Access",
    ref: "23.1 — Scope and Access (CSA 3.8)",
    body: `
      <h2>What Scope Means</h2>
      <p>A variable's <strong>scope</strong> is where it's accessible — where it "lives and exists." Scope is determined by the nearest enclosing pair of curly braces <code class="inline">{}</code> around wherever the variable was declared. Trying to use a variable outside its scope isn't just bad practice — the variable genuinely doesn't exist there, and the code won't compile.</p>
      <h2>Three Levels of Scope</h2>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Intake</span>
{
    <span class="k">private boolean</span> hasGamePiece;             <span class="c">// CLASS scope — visible to every method in Intake</span>

    <span class="k">public void</span> <span class="me">setState</span>(<span class="k">boolean</span> detected)    <span class="c">// detected is a parameter — METHOD scope</span>
    {
        <span class="k">for</span> (<span class="k">int</span> i = <span class="n">0</span>; i &lt; <span class="n">3</span>; i++)           <span class="c">// i is a loop variable — BLOCK scope</span>
        {
            <span class="k">boolean</span> sample = detected;        <span class="c">// BLOCK scope — only exists inside this loop's braces</span>
        }
        hasGamePiece = detected;              <span class="c">// fine: class-scope field, reachable anywhere in the class</span>
    }
}</code></pre>
      <ul>
        <li><strong>Class scope</strong> — instance variables (fields), visible to every method in the class, regardless of whether they're <code class="inline">public</code> or <code class="inline">private</code>.</li>
        <li><strong>Method scope</strong> — local variables and parameters, declared inside a method or constructor; they exist only for that one method call, and can never be declared <code class="inline">public</code>/<code class="inline">private</code> themselves.</li>
        <li><strong>Block scope</strong> — variables declared inside any <code class="inline">{}</code> block narrower than a whole method (a loop, an <code class="inline">if</code>, etc.); they stop existing the instant that block ends.</li>
      </ul>
      <h2>Local Variables Only Live Where They're Declared</h2>
      <pre class="code"><code><span class="k">public</span> <span class="t">String</span> <span class="me">getStatus</span>()
{
    <span class="k">for</span> (<span class="k">int</span> i = <span class="n">0</span>; i &lt; <span class="n">3</span>; i++)
    {
        <span class="k">int</span> sample = i;
    }
    System.out.<span class="me">println</span>(sample); <span class="c">// COMPILE ERROR — sample only existed inside the loop's braces</span>
    <span class="k">return</span> <span class="s">"done"</span>;
}</code></pre>
      <p>Parameters follow the same rule: a constructor's parameter only exists for that constructor call, and isn't reachable from any other method in the class — including <code class="inline">toString()</code> or any other method that seems related.</p>
      <h2>Shadowing: When a Local Name Matches a Field Name</h2>
      <p>If a local variable (or parameter) shares a name with an instance variable, the <em>local</em> one wins inside that method — this is called <strong>shadowing</strong>:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Intake</span>
{
    <span class="k">private</span> <span class="t">String</span> name;

    <span class="me">@Override</span>
    <span class="k">public</span> <span class="t">String</span> <span class="me">toString</span>()
    {
        <span class="t">String</span> name = <span class="s">"unknown"</span>;  <span class="c">// this local variable shadows the instance variable name</span>
        <span class="k">return</span> name;              <span class="c">// returns "unknown", NOT the instance variable's real value</span>
    }
}</code></pre>
      <p>Ch.8 already introduced the fix for this exact situation inside constructors — <code class="inline">this.name</code> explicitly reaches the instance variable even when a same-named local variable or parameter is shadowing it.</p>
      <h2>Connecting Scope to Encapsulation</h2>
      <p>Encapsulation (Ch.7) is really scope applied deliberately: marking a field <code class="inline">private</code> doesn't change its <em>class</em> scope (every method in the class can still see it) — it restricts <em>outside</em> code from reaching it directly, forcing access through public getters/setters instead. Scope and access modifiers (<code class="inline">public</code>/<code class="inline">private</code>) are two separate but related ideas: scope is about <em>where a variable exists at all</em>; access modifiers are about <em>who outside the class is allowed to touch it</em>.</p>
      <h2>The final Keyword</h2>
      <p>A field, parameter, or local variable marked <code class="inline">final</code> can be assigned exactly once — any attempt to reassign it afterward is a compile error. This matters for anything that genuinely should never change after it's set:</p>
      <pre class="code"><code><span class="k">private final</span> <span class="t">TalonFX</span> motor = <span class="k">new</span> <span class="t">TalonFX</span>(<span class="n">1</span>); <span class="c">// this reference can never be reassigned to a different motor</span>

<span class="k">public double</span> <span class="me">getVelocity</span>()
{
    <span class="k">return</span> motor.<span class="me">getVelocity</span>().<span class="me">getValue</span>();
}</code></pre>
      <p><code class="inline">final</code> on an object reference only locks the <em>reference</em> itself — it doesn't make the object's own internal state unchangeable (<code class="inline">motor</code> can't be pointed at a different <code class="inline">TalonFX</code>, but the real <code class="inline">TalonFX</code> object it points to can still have its own state change via its own methods). True <strong>immutability</strong> — an object whose internal state can never change at all once constructed — is a stronger guarantee, and it's exactly why immutable classes like WPILib's <code class="inline">Pose2d</code> are thread-safe and predictable: nothing can ever be halfway through changing one, because nothing can change it at all.</p>
    `,
    pitfalls: [
      "Trying to use a loop or block-scoped variable after its block ends. It stops existing the instant the enclosing <code class=\"inline\">{}</code> closes — declare it at method scope instead if it needs to survive past the block.",
      "Assuming a shadowed local variable is the instance variable. Inside a method with a same-named local variable/parameter, the local one always wins — use <code class=\"inline\">this.fieldName</code> to reach the instance variable explicitly.",
      "Confusing <code class=\"inline\">final</code> with true immutability. <code class=\"inline\">final</code> only prevents reassigning a reference — the object it refers to can still have its own internal state changed, unless that object's own class was specifically designed to be immutable."
    ],
    takeaways: [
      "A variable's scope — class, method, or block — is set by the nearest enclosing <code class=\"inline\">{}</code> around its declaration; using it outside that scope doesn't compile.",
      "Local variables and parameters exist only for their method/constructor call; instance variables exist for the whole object, reachable from every method regardless of access modifier.",
      "A local variable or parameter sharing a name with an instance variable shadows it inside that method — <code class=\"inline\">this.fieldName</code> is how to reach the real instance variable when that happens.",
      "<code class=\"inline\">final</code> allows exactly one assignment to a variable — for object references, it locks the reference, not necessarily the referenced object's internal state.",
      "True immutability (an object whose state can never change after construction) is a stronger, separate guarantee from <code class=\"inline\">final</code> — and it's what makes classes like <code class=\"inline\">Pose2d</code> safe to share and reason about."
    ],
    prov: "csawesome-2026: unit-3-class-creation/3.08-scope-and-access.md (CSA 3.8) · Deck context: mechacoder-test/src/lessons/java-2.js, slide 9 (\"Encapsulation & Final\") — final TalonFX/Pose2d example"
  }
};

let currentItem = "23.1";

}

    <div class="doc">

  `;

}
