<script>
const DATA = {
  "20": {
    title: "The IO-Layer Pattern",
    ref: "20 — The IO-Layer Pattern (ADVKIT 40.1-11, JDP 50.1)",
    body: `
      <p>Everything Ch.17-19 built — inheritance, polymorphism, and especially interfaces as contracts — comes together here in a real, widely-used FRC architecture pattern: keeping hardware access completely separate from the logic that uses it.</p>
      <h2>The Problem: Hardware Everywhere Makes Testing (and Logging) Hard</h2>
      <p>A subsystem that talks directly to real motor controllers and sensors is genuinely hard to reason about: it can't run at all without the physical robot present, and there's no clean seam where you could intercept its data. Team 6328's own AdvantageKit logging framework is built around a stronger idea than typical FRC logging — instead of just logging a handful of chosen values, it logs <em>every</em> input flowing into the robot code, every loop cycle. Since every input is captured, a match can later be <strong>replayed</strong> in a simulator with the exact same inputs, running the exact same logic — turning logging from "a tool for checking specific values" into a genuine safety net for verifying how any part of the code actually behaved.</p>
      <p>That capability only works if hardware access is structured so all input data flows through one well-defined seam. This is what the <strong>IO layer</strong> is for.</p>
      <h2>Three Layers of a Subsystem</h2>
      <p>Traditionally, an FRC subsystem mixes three concerns in one class: its <strong>public interface</strong> (methods the rest of the robot calls), its <strong>control logic</strong> (deciding what to do with sensor data), and its <strong>hardware interface</strong> (actually reading sensors, actually commanding motors). The IO-Layer Pattern pulls that third piece out into its own object:</p>
      <pre class="code"><code><span class="k">public interface</span> <span class="t">IntakeIO</span>
{
    <span class="k">default void</span> <span class="me">updateInputs</span>(<span class="t">IntakeInputs</span> inputs) {}
    <span class="k">default void</span> <span class="me">setVoltage</span>(<span class="k">double</span> volts) {}
}</code></pre>
      <p><code class="inline">IntakeIO</code> is exactly the kind of contract from Lesson 19 — it says <em>what</em> an intake can do (report its inputs, accept a voltage command), without saying <em>how</em>. Two real implementations honor that same contract:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">IntakeIOSparkMax</span> <span class="k">implements</span> <span class="t">IntakeIO</span>
{
    <span class="c">// uses real CAN IDs and hardware APIs to move physical rollers</span>
}

<span class="k">public class</span> <span class="t">IntakeIOSim</span> <span class="k">implements</span> <span class="t">IntakeIO</span>
{
    <span class="c">// uses physics math (moment of inertia) to "fake" the robot in code</span>
}</code></pre>
      <p>The subsystem class itself only ever talks to the <code class="inline">IntakeIO</code> interface — it never knows, and never needs to know, which concrete implementation is actually running underneath.</p>
      <h2>Choosing the Implementation Once, at Construction</h2>
      <p>The whole point is decided in exactly one place — typically <code class="inline">RobotContainer</code>, at startup — by simply constructing the subsystem with a different <code class="inline">IntakeIO</code> implementation depending on whether the code is running on the real robot or in simulation:</p>
      <pre class="code"><code><span class="k">public</span> <span class="me">RobotContainer</span>()
{
    <span class="k">if</span> (isReal())
    {
        intake = <span class="k">new</span> <span class="t">Intake</span>(<span class="k">new</span> <span class="t">IntakeIOSparkMax</span>());
    }
    <span class="k">else</span>
    {
        intake = <span class="k">new</span> <span class="t">Intake</span>(<span class="k">new</span> <span class="t">IntakeIOSim</span>());
    }
}</code></pre>
      <p><code class="inline">Intake</code> (the subsystem) accepts an <code class="inline">IntakeIO</code> in its constructor and stores it — every call from then on goes through that reference, polymorphically (Lesson 18.3) dispatching to whichever implementation was actually supplied.</p>
      <h2>Inputs Flow Through a Loggable Object</h2>
      <p>Outputs (commands like <code class="inline">setVoltage</code>) are simple, one-way method calls. Inputs are handled more carefully, since they need to be logged <em>and</em> later replayable: each IO interface defines an accompanying inputs class holding public fields for every value that comes off the hardware, plus methods (<code class="inline">toLog</code>/<code class="inline">fromLog</code>) for saving and restoring that data from a log file:</p>
      <pre class="code"><code>io.<span class="me">updateInputs</span>(inputs);                         <span class="c">// pull fresh data from the IO layer into 'inputs'</span>
<span class="t">Logger</span>.<span class="me">processInputs</span>(<span class="s">"Intake"</span>, inputs);          <span class="c">// send it to the logging framework (or restore it, during replay)</span></code></pre>
      <p>The rest of the subsystem then reads from the <code class="inline">inputs</code> object — never straight from the IO layer — for a critical reason: every piece of code within one loop cycle sees the exact same cached values, so a replay from the log looks byte-for-byte identical to what really happened on the field.</p>
      <h2>The General Pattern Behind This: Ports and Adapters</h2>
      <p>This isn't an FRC-specific trick — it's a specific application of a broader, well-known software architecture idea called <strong>Hexagonal Architecture</strong> (or <strong>Ports and Adapters</strong>): keep core logic decoupled from whatever external system it happens to talk to (a database, a UI, real hardware), by defining a <strong>port</strong> (the interface — <code class="inline">IntakeIO</code>) that any number of <strong>adapters</strong> (<code class="inline">IntakeIOSparkMax</code>, <code class="inline">IntakeIOSim</code>) can plug into. The core logic only ever depends on the port, never on any specific adapter — exactly mirroring <code class="inline">Intake</code> only ever depending on <code class="inline">IntakeIO</code>. The tradeoff is real: it's more abstraction and more files than talking to hardware directly, which is overkill for a one-off script — but it pays for itself the moment testability, simulation, or swappable hardware actually matter, which for a competition robot, they do.</p>
    `,
    pitfalls: [
      "Letting the subsystem read hardware directly, bypassing the IO layer. That reintroduces exactly the coupling the pattern exists to remove — no sim support, no clean replay.",
      "Reading straight from the IO layer instead of the cached inputs object. Values read directly from <code class=\"inline\">io</code> could change mid-cycle in ways a replayed log never could — always read from <code class=\"inline\">inputs</code>.",
      "Treating the IO layer as optional overhead on a small subsystem. It's genuinely more files and more ceremony — but the payoff (simulation, replay, decoupled testing) is exactly why competitive FRC codebases use it anyway."
    ],
    takeaways: [
      "The IO-Layer Pattern separates a subsystem's hardware access into its own interface, so the subsystem's own logic never touches real hardware APIs directly.",
      "One interface, multiple implementations (real hardware vs. simulated), chosen once at construction — everything else dispatches polymorphically through the shared interface.",
      "Inputs flow through a dedicated, loggable object (<code class=\"inline\">updateInputs</code> + <code class=\"inline\">toLog</code>/<code class=\"inline\">fromLog</code>), so a match's exact inputs can be replayed later with identical results.",
      "This is FRC's specific application of the general Hexagonal Architecture (Ports and Adapters) pattern: core logic depends only on a port (interface), never on a specific adapter (implementation)."
    ],
    prov: "other-reference-repo: advantagekit/getting-started/01-what-is-advantagekit.md (ADVKIT 40.1), advantagekit/data-flow/08-io-interfaces.md (ADVKIT 40.8), java-design-patterns/hexagonal-architecture.md (JDP 50.1) · Deck context: mechacoder-test/src/lessons/java-2.js, slide 7 — IntakeIOSparkMax/IntakeIOSim example"
  }
};

</script>
