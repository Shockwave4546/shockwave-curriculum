<script>
const DATA = {
  "15": {
    title: "Advanced Collections (Set/Queue/Map)",
    ref: "15 — Advanced Collections (Set/Queue/Map) (ORACLE 13.1-4)",
    body: `
      <p>Ch.9 covered <code class="inline">ArrayList</code> and a basic <code class="inline">HashMap</code>. Three more collection types round out the toolbox, each solving a problem the others don't: <strong>Set</strong> (no duplicates, ever), <strong>Queue</strong>/<strong>Deque</strong> (order of processing matters more than random access), and a deeper look at <strong>Map</strong> (iterating both keys and values together, and choosing an ordering).</p>
      <h2>Set: No Duplicates, Ever</h2>
      <p>A <code class="inline">Set</code> is a collection that flatly refuses duplicate elements — calling <code class="inline">add</code> with something already present just does nothing (and returns <code class="inline">false</code>), rather than adding a second copy:</p>
      <pre class="code"><code><span class="t">Set</span>&lt;<span class="t">Integer</span>&gt; usedCanIds = <span class="k">new</span> <span class="t">HashSet</span>&lt;<span class="t">Integer</span>&gt;();
usedCanIds.<span class="me">add</span>(<span class="n">5</span>);  <span class="c">// true — added</span>
usedCanIds.<span class="me">add</span>(<span class="n">5</span>);  <span class="c">// false — already present, nothing changed</span></code></pre>
      <p>That makes <code class="inline">Set</code> the natural tool for catching configuration conflicts — e.g. verifying no two devices on the robot were accidentally wired to the same CAN ID:</p>
      <pre class="code"><code><span class="t">Set</span>&lt;<span class="t">Integer</span>&gt; seenIds = <span class="k">new</span> <span class="t">HashSet</span>&lt;<span class="t">Integer</span>&gt;();
<span class="k">for</span> (<span class="k">int</span> id : allConfiguredCanIds)
{
    <span class="k">if</span> (!seenIds.<span class="me">add</span>(id)) <span class="c">// add() returns false if it was already there</span>
    {
        <span class="me">reportWarning</span>(<span class="s">"Duplicate CAN ID detected: "</span> + id);
    }
}</code></pre>
      <p><code class="inline">HashSet</code> (fastest, no ordering guarantee) is the usual default; <code class="inline">LinkedHashSet</code> remembers insertion order; <code class="inline">TreeSet</code> keeps elements sorted. All three still refuse duplicates — they only differ in iteration order.</p>
      <p><code class="inline">Set</code> also supports set algebra directly as methods: <code class="inline">s1.containsAll(s2)</code> (is <code class="inline">s2</code> a subset of <code class="inline">s1</code>?), <code class="inline">s1.addAll(s2)</code> (union), <code class="inline">s1.retainAll(s2)</code> (intersection — keep only what's in both), <code class="inline">s1.removeAll(s2)</code> (difference — remove anything also in <code class="inline">s2</code>).</p>
      <h2>Queue: First-In, First-Out</h2>
      <p>A <code class="inline">Queue</code> holds elements for later processing, normally in <strong>FIFO</strong> order (first-in-first-out) — think of a queue of autonomous routine steps waiting to run in the order they were scheduled. Every operation comes in two flavors: one throws an exception on failure, the other returns a safe placeholder value instead.</p>
      <table class="cmp"><thead><tr><th>Operation</th><th>Throws on failure</th><th>Returns a placeholder</th></tr></thead><tbody>
        <tr><td>Insert</td><td>add(e)</td><td>offer(e) (returns false)</td></tr>
        <tr><td>Remove</td><td>remove()</td><td>poll() (returns null if empty)</td></tr>
        <tr><td>Peek (don't remove)</td><td>element()</td><td>peek() (returns null if empty)</td></tr>
      </tbody></table>
      <pre class="code"><code><span class="t">Queue</span>&lt;<span class="t">String</span>&gt; pendingFaults = <span class="k">new</span> <span class="t">LinkedList</span>&lt;<span class="t">String</span>&gt;();
pendingFaults.<span class="me">add</span>(<span class="s">"Camera 1 disconnected"</span>);
pendingFaults.<span class="me">add</span>(<span class="s">"Low battery voltage"</span>);

<span class="k">while</span> (!pendingFaults.isEmpty())
{
    System.out.<span class="me">println</span>(<span class="s">"Handling: "</span> + pendingFaults.<span class="me">poll</span>()); <span class="c">// removes and returns the oldest fault first</span>
}</code></pre>
      <p><code class="inline">poll()</code>/<code class="inline">peek()</code> are usually the safer default in real code — they hand back <code class="inline">null</code> instead of throwing when the queue happens to be empty, which is often a completely normal state (no faults right now) rather than an error.</p>
      <h2>Deque: Both Ends at Once</h2>
      <p>A <strong>Deque</strong> ("deck," double-ended queue) supports inserting and removing from <em>either</em> end, which means a single <code class="inline">Deque</code> can act as a FIFO queue, a LIFO stack, or both:</p>
      <table class="cmp"><thead><tr><th>Operation</th><th>First (front)</th><th>Last (back)</th></tr></thead><tbody>
        <tr><td>Insert</td><td>addFirst(e) / offerFirst(e)</td><td>addLast(e) / offerLast(e)</td></tr>
        <tr><td>Remove</td><td>removeFirst() / pollFirst()</td><td>removeLast() / pollLast()</td></tr>
        <tr><td>Examine</td><td>getFirst() / peekFirst()</td><td>getLast() / peekLast()</td></tr>
      </tbody></table>
      <p>A common use: an undo stack for the last few climb-sequence steps, where you only ever add/remove from one end (LIFO — last one added is the first one undone):</p>
      <pre class="code"><code><span class="t">Deque</span>&lt;<span class="t">String</span>&gt; climbSteps = <span class="k">new</span> <span class="t">ArrayDeque</span>&lt;<span class="t">String</span>&gt;();
climbSteps.<span class="me">addLast</span>(<span class="s">"Extend to high bar"</span>);
climbSteps.<span class="me">addLast</span>(<span class="s">"Release from mid bar"</span>);

<span class="t">String</span> lastStep = climbSteps.<span class="me">removeLast</span>(); <span class="c">// "Release from mid bar" — undo the most recent step</span></code></pre>
      <p><code class="inline">ArrayDeque</code> is the standard general-purpose <code class="inline">Deque</code> implementation — generally faster than <code class="inline">LinkedList</code> for this purpose, with no capacity limit.</p>
      <h2>Map, Revisited: Iterating Both Keys and Values</h2>
      <p>Ch.9.3 covered <code class="inline">put</code>/<code class="inline">get</code> and looping over <code class="inline">keySet()</code>. <code class="inline">Map.entrySet()</code> gives every key <em>and</em> value together in one pass, avoiding a repeated <code class="inline">get()</code> call for each key:</p>
      <pre class="code"><code><span class="t">Map</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt; motorOffsets = <span class="k">new</span> <span class="t">HashMap</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt;();
motorOffsets.<span class="me">put</span>(<span class="n">5</span>, <span class="n">0.02</span>);
motorOffsets.<span class="me">put</span>(<span class="n">6</span>, -<span class="n">0.01</span>);

<span class="k">for</span> (<span class="t">Map</span>.<span class="t">Entry</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt; entry : motorOffsets.<span class="me">entrySet</span>())
{
    System.out.<span class="me">println</span>(<span class="s">"CAN ID "</span> + entry.<span class="me">getKey</span>() + <span class="s">" -> offset "</span> + entry.<span class="me">getValue</span>());
}</code></pre>
      <p>Just like <code class="inline">Set</code>, a plain <code class="inline">HashMap</code> gives no ordering guarantee. Swapping the implementation type is enough to change that, with no other code changes needed:</p>
      <pre class="code"><code><span class="t">Map</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt; sorted = <span class="k">new</span> <span class="t">TreeMap</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt;(motorOffsets);       <span class="c">// sorted by key</span>
<span class="t">Map</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt; byInsertOrder = <span class="k">new</span> <span class="t">LinkedHashMap</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt;(motorOffsets); <span class="c">// insertion order</span></code></pre>
      <p>This is the payoff of always declaring a variable by its interface type (<code class="inline">Map&lt;K, V&gt;</code>, <code class="inline">Set&lt;E&gt;</code>, <code class="inline">Queue&lt;E&gt;</code>) rather than its concrete implementation (<code class="inline">HashMap</code>, <code class="inline">HashSet</code>, <code class="inline">LinkedList</code>) — changing which concrete class gets constructed is a one-line change, because every line that <em>uses</em> the collection only ever depends on the interface.</p>
    `,
    pitfalls: [
      "Assuming a <code class=\"inline\">HashSet</code> or <code class=\"inline\">HashMap</code> remembers insertion order. Neither does — reach for <code class=\"inline\">LinkedHashSet</code>/<code class=\"inline\">LinkedHashMap</code> if insertion order actually matters, or <code class=\"inline\">TreeSet</code>/<code class=\"inline\">TreeMap</code> if sorted order does.",
      "Using <code class=\"inline\">remove()</code>/<code class=\"inline\">element()</code> on a queue that might be empty. Both throw when empty — prefer <code class=\"inline\">poll()</code>/<code class=\"inline\">peek()</code> unless an empty queue genuinely represents a bug that should crash loudly.",
      "Declaring a collection variable by its concrete type instead of its interface. <code class=\"inline\">HashMap&lt;K,V&gt; m = new HashMap&lt;&gt;();</code> locks every line that touches <code class=\"inline\">m</code> to <code class=\"inline\">HashMap</code>'s specific behavior — declare it <code class=\"inline\">Map&lt;K,V&gt; m = new HashMap&lt;&gt;();</code> instead, so the implementation can change later without touching anything else."
    ],
    takeaways: [
      "<code class=\"inline\">Set</code> guarantees no duplicates; <code class=\"inline\">HashSet</code> is fastest with no ordering, <code class=\"inline\">LinkedHashSet</code> keeps insertion order, <code class=\"inline\">TreeSet</code> keeps sorted order.",
      "<code class=\"inline\">Queue</code> processes elements FIFO by default; every operation has a throwing form (<code class=\"inline\">add</code>/<code class=\"inline\">remove</code>/<code class=\"inline\">element</code>) and a safe form (<code class=\"inline\">offer</code>/<code class=\"inline\">poll</code>/<code class=\"inline\">peek</code>) that returns a placeholder instead of throwing.",
      "<code class=\"inline\">Deque</code> supports both ends at once, letting one type serve as either a queue or a stack; <code class=\"inline\">ArrayDeque</code> is the standard general-purpose implementation.",
      "<code class=\"inline\">Map.entrySet()</code> iterates keys and values together; switching between <code class=\"inline\">HashMap</code>, <code class=\"inline\">TreeMap</code>, and <code class=\"inline\">LinkedHashMap</code> changes ordering with no other code changes.",
      "Always declare collection variables by their interface type, not their concrete implementation — it's what makes swapping implementations a one-line change."
    ],
    prov: "other-reference-repo: oracle-java-tutorials/collections-interfaces/01-04 (ORACLE 13.1-4)"
  }
};

let currentItem = "15";

function renderList(){
  const host = document.getElementById('itemlist');
  host.innerHTML = '';
  Object.keys(DATA).forEach(key => {
    const it = DATA[key];
    const el = document.createElement('div');
    el.className = 'item' + (key === currentItem ? ' on' : '');
    el.innerHTML = `<span class="iref">Ch.${key}</span><span class="ititle">${it.title}</span>`;
    el.addEventListener('click', () => { currentItem = key; renderList(); renderMain(); });
    host.appendChild(el);
  });
}

function renderMain(){
  const it = DATA[currentItem];
  const host = document.getElementById('maininner');
  host.innerHTML = `
    <div class="doc">
      <h1 class="doctitle">${it.title}</h1>
      <div class="refline">Outline ref: ${it.ref}</div>
      <div class="statusline">Status: new — authored lesson</div>
      ${it.body}
      <div class="pitfalls"><div class="lbl">Common Pitfalls</div><ul>${it.pitfalls.map(p => `<li>${p}</li>`).join('')}</ul></div>
      <div class="takeaways"><div class="lbl">Key Takeaways</div><ul>${it.takeaways.map(t => `<li>${t}</li>`).join('')}</ul></div>
      <div class="prov"><strong>Derived from</strong> ${it.prov}</div>
    </div>
  `;
  document.getElementById('main').scrollTop = 0;
}

renderList();
renderMain();
</script>
