<script>
const DATA = {
  "21": {
    title: "Static Factories",
    ref: "21 — Static Factories (T5817 30.2)",
    body: `
      <h2>Why Not Just new?</h2>
      <p>A <strong>static factory method</strong> is a <code class="inline">public static</code> method that returns an object, used <em>instead of</em> calling a constructor directly. At first glance this looks like extra ceremony for no reason — but it buys a few concrete things a plain constructor can't:</p>
      <ul>
        <li><strong>A descriptive name.</strong> <code class="inline">Command.printMessage("Ready")</code> says exactly what you're getting; <code class="inline">new PrintCommand("Ready")</code> doesn't communicate intent nearly as clearly.</li>
        <li><strong>The freedom to not construct a new object at all.</strong> A factory method can return a cached, already-existing instance instead of a fresh one.</li>
        <li><strong>The freedom to return a completely different concrete type</strong>, chosen by logic inside the method — the caller only ever sees the return type (often an interface), never which concrete class was actually picked.</li>
      </ul>
      <pre class="code"><code><span class="k">public static</span> <span class="t">Command</span> <span class="me">printMessage</span>(<span class="t">String</span> msg)
{
    <span class="k">return new</span> <span class="t">InstantCommand</span>(() -&gt; System.out.<span class="me">println</span>(msg));
}</code></pre>
      <p>Calling <code class="inline">printMessage("Ready")</code> reads clearly as "give me a command that prints this message" — the caller never needs to know or care that it's actually an <code class="inline">InstantCommand</code> wrapping a lambda underneath.</p>
      <h2>The Real Payoff: Choosing an Implementation by Condition</h2>
      <p>The pattern's biggest use in FRC code is picking between real and simulated hardware — deciding <em>which</em> concrete class to construct, in exactly one place, based on a condition:</p>
      <pre class="code"><code><span class="k">public interface</span> <span class="t">Drivetrain</span>
{
    <span class="k">void</span> <span class="me">drive</span>(<span class="k">double</span> speed, <span class="k">double</span> turn);
}

<span class="k">public class</span> <span class="t">RealDrivetrain</span> <span class="k">implements</span> <span class="t">Drivetrain</span>
{
    <span class="k">public void</span> <span class="me">drive</span>(<span class="k">double</span> speed, <span class="k">double</span> turn) { <span class="c">/* control real Talons/Sparks */</span> }
}

<span class="k">public class</span> <span class="t">SimDrivetrain</span> <span class="k">implements</span> <span class="t">Drivetrain</span>
{
    <span class="k">public void</span> <span class="me">drive</span>(<span class="k">double</span> speed, <span class="k">double</span> turn) { <span class="c">/* simulate motion via WPILib sim */</span> }
}

<span class="k">public class</span> <span class="t">DrivetrainFactory</span>
{
    <span class="k">public static</span> <span class="t">Drivetrain</span> <span class="me">createDrivetrain</span>()
    {
        <span class="k">if</span> (RobotBase.isReal())
        {
            <span class="k">return new</span> <span class="t">RealDrivetrain</span>();
        }
        <span class="k">else</span>
        {
            <span class="k">return new</span> <span class="t">SimDrivetrain</span>();
        }
    }
}</code></pre>
      <pre class="code"><code><span class="t">Drivetrain</span> drivetrain = <span class="t">DrivetrainFactory</span>.<span class="me">createDrivetrain</span>(); <span class="c">// caller never picks the concrete class itself</span></code></pre>
      <p>This is a genuine alternative to the constructor-injection style from the IO-Layer Pattern (Ch.20) — instead of the caller deciding which <code class="inline">IntakeIO</code> to pass in, the factory itself makes that decision, centralizing the real-vs-sim logic in one place instead of duplicating an <code class="inline">if (isReal())</code> check everywhere a subsystem gets built.</p>
      <h2>Factories for More Than Hardware</h2>
      <p>The same idea works for building the right object out of a whole family of choices — not just two (real/sim), but any number, selected by some other input:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">AutoFactory</span>
{
    <span class="k">public static</span> <span class="t">Command</span> <span class="me">createAuto</span>(<span class="t">String</span> mode)
    {
        <span class="k">return switch</span> (mode)
        {
            <span class="k">case</span> <span class="s">"Taxi"</span> -&gt; <span class="k">new</span> <span class="t">DriveForwardCommand</span>(<span class="n">3.0</span>);
            <span class="k">case</span> <span class="s">"2 Ball"</span> -&gt; <span class="k">new</span> <span class="t">TwoBallAutoCommand</span>();
            <span class="k">case</span> <span class="s">"Nothing"</span> -&gt; <span class="k">new</span> <span class="t">WaitCommand</span>(<span class="n">0.1</span>);
            <span class="k">default</span> -&gt; <span class="k">new</span> <span class="t">PrintCommand</span>(<span class="s">"Unknown Auto Mode"</span>);
        };
    }
}</code></pre>
      <pre class="code"><code><span class="t">Command</span> auto = <span class="t">AutoFactory</span>.<span class="me">createAuto</span>(chooser.<span class="me">getSelected</span>()); <span class="c">// built from whatever the driver station selected</span></code></pre>
    `,
    pitfalls: [
      "Returning a concrete class instead of an interface. <code class=\"inline\">public static RealDrivetrain createDrivetrain()</code> locks callers into one specific implementation — return the interface type instead.",
      "Duplicating the same real-vs-sim <code class=\"inline\">if</code> check in multiple places. The whole point of a factory is centralizing that decision in one method.",
      "Confusing a factory with a constructor. A factory method is just a regular <code class=\"inline\">static</code> method — it can validate arguments, return a cached instance, or pick any subtype; a constructor always returns a new instance of its own exact class."
    ],
    takeaways: [
      "A static factory method returns an object in place of a direct constructor call, with a descriptive name, the option to return a cached instance, and the freedom to choose the actual concrete type internally.",
      "Its most common FRC use: centralizing real-vs-simulated (or comp-bot-vs-practice-bot) selection logic in one place, so callers only ever depend on an interface.",
      "Factories generalize beyond hardware — anything selected by a condition (an autonomous mode, a config option) is a natural fit.",
      "Always return the interface type from a factory method, not a specific concrete class."
    ],
    prov: "other-reference-repo: team-5817-training/design-patterns/factory.md (T5817 30.2) · Deck context: mechacoder-test/src/lessons/java-2.js, slide 7 (\"Static Factories\")"
  }
};

  });
}

  `;
  document.getElementById('main').scrollTop = 0;
}
