<script>
const DATA = {
  "8.1-8.2": {
    title: "Constructors & \"this\"",
    ref: "8.1 (Writing Constructors, CSA 3.4) + 8.2 (this Keyword, CSA 3.9)",
    body: `
      <h2>A Constructor's Job</h2>
      <p>A constructor's only job is to put a new object into a <strong>valid state</strong> — every instance variable set to something usable. Its signature looks like a method's, but with two differences: no return type (not even <code class="inline">void</code>), and its name is always exactly the class's name.</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Climber</span>
{
    <span class="k">private int</span> motorPort;

    <span class="k">public</span> <span class="me">Climber</span>(<span class="k">int</span> motorPort) <span class="c">// same name as the class, no return type</span>
    {
        <span class="k">this</span>.motorPort = motorPort;
    }
}</code></pre>
      <h2>The Default Constructor</h2>
      <p>If you don't write any constructor at all, Java gives your class a free no-argument one that sets every instance variable to its type's default (<code class="inline">0</code> for <code class="inline">int</code>, <code class="inline">0.0</code> for <code class="inline">double</code>, <code class="inline">false</code> for <code class="inline">boolean</code>, <code class="inline">null</code> for any reference type). The moment you write even one constructor yourself, that free one disappears — you have to cover every way you want objects of your class to be built.</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Climber</span>
{
    <span class="k">private int</span> motorPort; <span class="c">// if no constructor is written, this defaults to 0</span>
}</code></pre>
      <h2>Overloaded Constructors</h2>
      <p>Just like methods (Ch.4.1), a class can have several constructors, distinguished by their parameter lists — this is the same <strong>overloading</strong> concept:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Climber</span>
{
    <span class="k">private int</span> motorPort;
    <span class="k">private double</span> climbSpeed;

    <span class="k">public</span> <span class="me">Climber</span>(<span class="k">int</span> motorPort)
    {
        <span class="k">this</span>.motorPort = motorPort;
        <span class="k">this</span>.climbSpeed = <span class="n">0.5</span>; <span class="c">// a sensible default</span>
    }

    <span class="k">public</span> <span class="me">Climber</span>(<span class="k">int</span> motorPort, <span class="k">double</span> climbSpeed)
    {
        <span class="k">this</span>.motorPort = motorPort;
        <span class="k">this</span>.climbSpeed = climbSpeed;
    }
}</code></pre>
      <h2>this: Referring to the Current Object</h2>
      <p>Inside an instance method or constructor, <code class="inline">this</code> refers to the specific object the method/constructor is currently running for. It's most useful when a parameter shares a name with an instance variable — <code class="inline">this.motorPort</code> unambiguously means "this object's <code class="inline">motorPort</code>," while bare <code class="inline">motorPort</code> means the parameter:</p>
      <pre class="code"><code><span class="k">public</span> <span class="me">Climber</span>(<span class="k">int</span> motorPort)
{
    <span class="k">this</span>.motorPort = motorPort; <span class="c">// left side: instance variable. right side: parameter.</span>
}</code></pre>
      <p>Without <code class="inline">this</code>, <code class="inline">motorPort = motorPort;</code> would just assign the parameter to itself — the instance variable would never actually get set.</p>
      <p><code class="inline">this</code> only exists inside instance methods and constructors — a <code class="inline">static</code> method has no current object to refer to, so it has no <code class="inline">this</code> (Ch.7.4).</p>
      <h2>this as an Argument</h2>
      <p><code class="inline">this</code> is a real reference, usable anywhere an object reference is expected — including passing the current object into another method or constructor:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Climber</span>
{
    <span class="k">private double</span> currentHeight;

    <span class="k">public void</span> <span class="me">reportTo</span>(<span class="t">ClimbLogger</span> logger)
    {
        logger.<span class="me">record</span>(<span class="k">this</span>); <span class="c">// pass the current Climber object itself</span>
    }
}</code></pre>
    `,
    pitfalls: [
      "Forgetting <code class=\"inline\">this</code> when a parameter shadows an instance variable. <code class=\"inline\">motorPort = motorPort;</code> (no <code class=\"inline\">this</code>) does nothing useful — it assigns the parameter to itself, leaving the actual instance variable untouched.",
      "Assuming a class always gets a free default constructor. Only true if you write zero constructors yourself. Write even one, and you're responsible for every constructor your class needs."
    ],
    takeaways: [
      "A constructor's signature has no return type and always matches the class's name; its job is to leave the object in a valid state.",
      "With no constructor written, Java provides a default one that zeroes/nulls every instance variable — writing any constructor yourself removes that default.",
      "Constructors can be overloaded, just like methods, distinguished by parameter lists.",
      "<code class=\"inline\">this</code> refers to the current object inside an instance method or constructor — essential for disambiguating a parameter from an instance variable of the same name.",
      "<code class=\"inline\">this</code> can be passed as an argument, like any other object reference. Static methods have no <code class=\"inline\">this</code>."
    ],
    prov: "Deck context: mechacoder-test/src/lessons/java-1.js, slide 8 (\"CONSTRUCTORS\")"
  }
};

let currentItem = "8.1-8.2";

function renderList(){

  host.innerHTML = '';
  Object.keys(DATA).forEach(key => {
    const it = DATA[key];
    const el = document.createElement('div');
    el.className = 'item' + (key === currentItem ? ' on' : '');
    el.innerHTML = `<span class="iref">${key}</span><span class="ititle">${it.title}</span>`;
    el.addEventListener('click', () => { currentItem = key; renderList(); renderMain(); });
    host.appendChild(el);
  });
}

function renderMain(){
  const it = DATA[currentItem];
  const host = document.getElementById('maininner');
  host.innerHTML = `
    <div class="doc">
      <h1 class="doctitle">${it.title}</h1>
      <div class="refline">Outline ref: ${it.ref}</div>
      <div class="statusline">Status: new — authored lesson (fuller depth than the teaser slide)</div>
      ${it.body}
      <div class="pitfalls"><div class="lbl">Common Pitfalls</div><ul>${it.pitfalls.map(p => `<li>${p}</li>`).join('')}</ul></div>
      <div class="takeaways"><div class="lbl">Key Takeaways</div><ul>${it.takeaways.map(t => `<li>${t}</li>`).join('')}</ul></div>
      <div class="prov"><strong>Derived from</strong> ${it.prov}</div>
    </div>
  `;
  document.getElementById('main').scrollTop = 0;
}

renderList();
renderMain();
</script>
