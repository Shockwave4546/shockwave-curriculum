        <h2>Primitive Types: a Small, Fixed List</h2>
        <p>Java has exactly 8 <strong>primitive types</strong> — the only types built directly into the language. A primitive variable holds its value directly, with nothing more underneath it.</p>
        <p>The ones you'll use constantly in FRC code:</p>
        <ul>
          <li><code class="inline">int</code> — a whole number, like <code class="inline">5</code> or <code class="inline">-12</code>. CAN IDs, ports, loop counters.</li>
          <li><code class="inline">long</code> — a bigger whole number, for values too large for <code class="inline">int</code> (like a timestamp). Written with an <code class="inline">L</code>: <code class="inline">100L</code>.</li>
          <li><code class="inline">double</code> — a decimal number, like <code class="inline">0.85</code>. Almost anything measured — speed, distance, voltage.</li>
          <li><code class="inline">float</code> — a smaller, less precise decimal number. Written with an <code class="inline">f</code>: <code class="inline">1.5f</code>. Most FRC code (including WPILib itself) prefers <code class="inline">double</code> instead.</li>
          <li><code class="inline">boolean</code> — only ever <code class="inline">true</code> or <code class="inline">false</code>.</li>
        </ul>
        <p>The rest exist too, but you'll rarely reach for them directly:</p>
        <ul>
          <li><code class="inline">byte</code>, <code class="inline">short</code> — smaller whole numbers than <code class="inline">int</code>. Rarely needed.</li>
          <li><code class="inline">char</code> — one single character, like <code class="inline">'A'</code>. You won't use this much on its own, but it's worth knowing: this is what <code class="inline">String</code> is actually built from underneath.</li>
        </ul>
        <p>That's the full list — nothing else in Java is a primitive. <strong>Everything else is built out of these 8</strong>, most obviously <code class="inline">String</code>, which is really a sequence of <code class="inline">char</code>s glued together. Later, when you write your own classes (starting in Ch.7), those will be built by bundling primitives together — a robot subsystem might combine a <code class="inline">double</code> for speed, a <code class="inline">boolean</code> for "is it ready," and more, all wrapped into one object. Keep this in the back of your mind going forward: every new type you meet is either one of this fixed list, or something built on top of it.</p>
        <h2>Declaring and Assigning</h2>
        <p>To create a variable, write its type, then its name, then a semicolon:</p>
        <pre class="code"><code><span class="k">int</span> motorSpeed;</code></pre>
        <p><code class="inline">motorSpeed</code> now exists, but it doesn't hold a value yet. Give it one with <code class="inline">=</code>:</p>
        <pre class="code"><code>motorSpeed = <span class="n">5</span>;</code></pre>
        <p>Read that line as: <strong>motorSpeed gets assigned the value 5.</strong> Not "motorSpeed equals 5" — <code class="inline">=</code> in code isn't the same as <code class="inline">=</code> in math class. It's an instruction: take what's on the right, and store it in the box on the left.</p>
        <p>Usually you do both steps at once:</p>
        <pre class="code"><code><span class="k">int</span> motorSpeed = <span class="n">5</span>;</code></pre>
        <p>Read this the same way: <strong>motorSpeed, of type int, is assigned the value 5.</strong></p>
        <p>A variable declared inside a method body, like everything here, is called a <strong>local variable</strong> — it only exists inside that method. (Java has other kinds of variables too — you'll meet those once classes and methods are on the table, starting in Ch.7.)</p>
        <h2>Naming Variables (camelCase)</h2>
        <p>A name must start with a letter and can't contain spaces. Java's style — you'll see this in every piece of code from here on — is <strong>camelCase</strong>: start lowercase, then capitalize the first letter of each new word.</p>
        <pre class="code"><code><span class="k">double</span> maxSpeed = <span class="n">0.85</span>;   <span class="c">// not max_speed, not MaxSpeed</span>
<span class="k">boolean</span> isReady = <span class="k">false</span>;</code></pre>
        <p>Pick a name that says what the value <em>is</em>. <code class="inline">speed</code> tells you something; <code class="inline">x</code> doesn't.</p>
        <h2>Worked Example</h2>
        <pre class="code"><code><span class="k">int</span> motorSpeed = <span class="n">5</span>;         <span class="c">// a whole number — no decimal needed here</span>
<span class="k">double</span> maxOutput = <span class="n">0.85</span>;    <span class="c">// a percentage like 85% — needs a decimal</span>
<span class="k">boolean</span> isReady = <span class="k">false</span>;    <span class="c">// only ever true or false</span>
<span class="t">String</span> robotName = <span class="s">"Titan"</span>; <span class="c">// text, built out of primitives under the hood</span>

System.out.<span class="me">println</span>(<span class="s">"Robot "</span> + robotName + <span class="s">" is set to speed "</span> + motorSpeed);</code></pre>
      `,

        <h2>Printing Output</h2>
        <p>Two ways to print in Java:</p>
        <ul>
          <li><code class="inline">System.out.println(value)</code> — prints, then moves to a new line.</li>
          <li><code class="inline">System.out.print(value)</code> — prints, and stays on the same line.</li>
        </ul>
        <pre class="code"><code>System.out.<span class="me">print</span>(<span class="s">"Score: "</span>);
System.out.<span class="me">println</span>(<span class="n">24</span>);
<span class="c">// Output: Score: 24</span></code></pre>
        <h2>Math Expressions</h2>
        <p><code class="inline">+ - * /</code> work the same way you'd expect, with one big exception: <strong>dividing two whole numbers throws away the decimal part.</strong></p>
        <pre class="code"><code>System.out.<span class="me">println</span>(<span class="n">7</span> / <span class="n">2</span>); <span class="c">// prints 3, not 3.5</span></code></pre>
        <p>This is called <strong>truncating division</strong>, and it's the single most common source of "wrong answer, no error message" bugs you'll run into. If you want the decimal part, at least one of the two numbers needs to be a <code class="inline">double</code>:</p>
        <pre class="code"><code>System.out.<span class="me">println</span>(<span class="n">7.0</span> / <span class="n">2</span>); <span class="c">// prints 3.5</span></code></pre>
        <h2>Order of Operations</h2>
        <p>Same rules as math class: <code class="inline">*</code> and <code class="inline">/</code> happen before <code class="inline">+</code> and <code class="inline">-</code>. Parentheses override that.</p>
        <pre class="code"><code>System.out.<span class="me">println</span>(<span class="n">2</span> + <span class="n">3</span> * <span class="n">2</span>);   <span class="c">// 8</span>
System.out.<span class="me">println</span>((<span class="n">2</span> + <span class="n">3</span>) * <span class="n">2</span>); <span class="c">// 10</span></code></pre>
        <h2>The Remainder Operator (%)</h2>
        <p><code class="inline">%</code> gives you what's left over after dividing. <code class="inline">5 % 2</code> is <code class="inline">1</code>, because 2 fits into 5 twice, with 1 left over.</p>
        <pre class="code"><code><span class="k">int</span> totalSeconds = <span class="n">150</span>;
System.out.<span class="me">println</span>(totalSeconds / <span class="n">60</span>); <span class="c">// 2 — whole minutes</span>
System.out.<span class="me">println</span>(totalSeconds % <span class="n">60</span>); <span class="c">// 30 — leftover seconds</span>
<span class="c">// 150 seconds = 2 minutes, 30 seconds</span></code></pre>

        <h2>Assignment, One More Time</h2>
        <p><code class="inline">=</code> always has one variable on the left, and a value (or a math expression) on the right. Read it as "gets assigned," not "equals."</p>
        <pre class="code"><code><span class="k">int</span> score = <span class="n">10</span> * <span class="n">2</span> + <span class="n">5</span>; <span class="c">// score is assigned the value 25</span></code></pre>

        <pre class="code"><code><span class="k">int</span> x = <span class="n">3</span>;
<span class="k">int</span> y = <span class="n">2</span>;
x = y;   <span class="c">// x is now assigned a copy of y's value: 2</span>
y = <span class="n">5</span>;   <span class="c">// y changes — x is still 2, unaffected</span></code></pre>
        <h2>Every Variable Needs a Value First</h2>
        <p>You can't use a variable in an expression before it's been assigned something, and the value has to match the type:</p>

<span class="k">double</span> y = <span class="n">2.2</span>;
x = <span class="n">2</span> * y;   <span class="c">// won't compile — 2 * y is a double, and x is an int</span></code></pre>
        <p>The fix here isn't to force it — it's to make <code class="inline">x</code> a <code class="inline">double</code> in the first place, since that's what it's actually meant to hold.</p>
        <h2>Updating a Value Using Itself</h2>
        <p>A common pattern: change a variable based on its own current value.</p>
        <pre class="code"><code><span class="k">int</span> step = <span class="n">0</span>;
step = step + <span class="n">1</span>; <span class="c">// uses the OLD value of step, then stores the new result back into it</span></code></pre>

      body: `
        <h2>Converting Between Types (Casting)</h2>
        <p>Put <code class="inline">(int)</code> or <code class="inline">(double)</code> right before a value to convert it to that type on the spot:</p>
        <pre class="code"><code>(<span class="k">double</span>) <span class="n">1</span> / <span class="n">3</span>   <span class="c">// 0.333... — the 1 becomes a double first, then divides</span>
(<span class="k">int</span>) <span class="n">3.6</span>        <span class="c">// 3 — cuts off everything after the decimal point</span></code></pre>
        <p><code class="inline">(int)</code> always cuts off the decimal — it never rounds. <code class="inline">(int) 3.9</code> is <code class="inline">3</code>, not <code class="inline">4</code>.</p>
        <p>If you actually want to round, add <code class="inline">0.5</code> first, then cast:</p>
        <pre class="code"><code><span class="k">int</span> rounded = (<span class="k">int</span>)(<span class="n">5.7</span> + <span class="n">0.5</span>); <span class="c">// 6 — this is rounding, not truncating</span></code></pre>
        <h2>The Fix for Truncating Division</h2>
        <p>Lesson 2.2 showed that dividing two whole numbers cuts off the decimal. Casting one of them fixes it — but only if the cast happens <em>before</em> the division:</p>
        <pre class="code"><code><span class="k">int</span> total = <span class="n">17</span>;
<span class="k">int</span> games = <span class="n">5</span>;

<span class="k">double</span> average = (<span class="k">double</span>) total / games;   <span class="c">// correct: 3.4</span>
<span class="k">double</span> wrong    = (<span class="k">double</span>) (total / games); <span class="c">// wrong: divides as whole numbers first (3), then casts: 3.0</span></code></pre>
        <h2>Whole Numbers Have a Limit</h2>
        <p>An <code class="inline">int</code> can only hold values in a fixed range (roughly ±2.1 billion). Go past that limit, and the number silently wraps around to a wrong value — no error, no warning.</p>
        <pre class="code"><code>System.out.<span class="me">println</span>(<span class="t">Integer</span>.MAX_VALUE + <span class="n">1</span>); <span class="c">// wraps to the smallest possible int</span></code></pre>
        <p>This is unlikely to come up in a match, but it's a real risk for a counter that keeps growing and is never reset.</p>
        <h2>Decimals Have a Precision Limit Too</h2>
        <p>A <code class="inline">double</code> can only store so many digits (about 14-15). Beyond that, the extra digits get quietly rounded off. This is why comparing two decimals with <code class="inline">==</code> is risky — two values that "should" be equal might differ by a tiny rounding amount.</p>
      `,

        <h2>A Shortcut for "Update Using the Old Value"</h2>
        <p><code class="inline">x = x + 1;</code> comes up so often that Java has a shortcut: <code class="inline">x += 1;</code>. Same idea works for every operator: <code class="inline">+= -= *= /= %=</code>.</p>
        <pre class="code"><code>score += <span class="n">10</span>;   <span class="c">// same as: score = score + 10;</span>
power *= <span class="n">0.5</span>;  <span class="c">// same as: power = power * 0.5;</span></code></pre>
        <h2>Increment and Decrement</h2>
        <p>Adding or subtracting exactly 1 is common enough to get its own shortcut: <code class="inline">++</code> and <code class="inline">--</code>.</p>
        <pre class="code"><code>step++;   <span class="c">// same as step += 1, same as step = step + 1</span>
timer--;</code></pre>
        <h2>A Real Example: Ramping Up Power</h2>
        <p>Instead of jumping straight to full power, increase it gradually, a little bit each time:</p>
        <pre class="code"><code><span class="k">double</span> power = <span class="n">0.0</span>;
<span class="k">double</span> rampRate = <span class="n">0.02</span>; <span class="c">// add 2% each time this runs</span>

power += rampRate;
<span class="k">if</span> (power > targetPower) {
    power = targetPower; <span class="c">// stop it from going past the target</span>
}</code></pre>
        <p>That <code class="inline">if</code> check matters — without it, <code class="inline">power</code> would just keep climbing past where you wanted it to stop.</p>
        <h2>Tracing Code by Hand</h2>
        <p>Tracing means walking through code line by line, by hand, updating each variable as you go — a genuinely useful way to find bugs when just reading the code isn't enough.</p>

<span class="k">int</span> delta = <span class="n">5</span>;
<span class="k">int</span> total = <span class="n">1</span>;

step++;              <span class="c">// step: 1</span>
delta -= <span class="n">3</span>;          <span class="c">// delta: 2</span>
total = step + delta; <span class="c">// total: 1 + 2 = 3</span>
step = total * <span class="n">2</span>;    <span class="c">// step: 3 * 2 = 6</span>
delta %= <span class="n">2</span>;          <span class="c">// delta: 2 % 2 = 0</span>
total--;             <span class="c">// total: 2</span></code></pre>
        <p>Final values: <code class="inline">step = 6</code>, <code class="inline">delta = 0</code>, <code class="inline">total = 2</code>.</p>

  });
  document.getElementById('main').scrollTop = 0;
}

renderList();
renderMain();
</script>
