const DATA = {
  "12": {
    title: "Exceptions & try/catch",
    ref: "12 — Exceptions & try/catch (ORACLE 11.1-16)",
    body: `
      <h2>What an Exception Is</h2>
      <p>An <strong>exception</strong> is an "exceptional event" — something that disrupts a program's normal flow while it runs (a file that doesn't exist, an array index that's out of range, dividing by zero). When an error occurs, the method creates an <strong>exception object</strong> describing what went wrong and hands it to the Java runtime — this is called <strong>throwing</strong> the exception.</p>
      <p>The runtime then searches back up the <strong>call stack</strong> (the chain of methods that led to this point) looking for an <strong>exception handler</strong> — a block of code able to deal with that type of exception. The first matching handler it finds is said to <strong>catch</strong> the exception. If nothing on the whole call stack can handle it, the runtime terminates the program: on a robot, an uncaught exception in <code class="inline">periodic()</code> is exactly what turns the Driver Station's "Robot Code" indicator red.</p>
      <h2>try / catch</h2>
      <p>A <code class="inline">try</code> block wraps code that might throw; a <code class="inline">catch</code> block that follows it handles a specific exception type if one occurs:</p>
      <pre class="code"><code><span class="k">try</span>
{
    config = <span class="me">loadFromFile</span>(<span class="s">"tuning.json"</span>);
}
<span class="k">catch</span> (<span class="t">IOException</span> e)
{
    <span class="c">// Recover: fall back to defaults</span>
    config = <span class="t">Config</span>.<span class="me">defaults</span>();
    <span class="me">reportWarning</span>(<span class="s">"Using default tuning"</span>);
}</code></pre>
      <p>If <code class="inline">loadFromFile</code> throws an <code class="inline">IOException</code>, execution jumps straight into the matching <code class="inline">catch</code> block — the rest of the <code class="inline">try</code> block is skipped. If no exception occurs, the <code class="inline">catch</code> block never runs at all.</p>
      <p>A <code class="inline">try</code> can have multiple <code class="inline">catch</code> blocks, checked in order, for handling different exception types differently:</p>
      <pre class="code"><code><span class="k">try</span>
{
    camera = <span class="k">new</span> <span class="t">UsbCamera</span>(<span class="s">"Camera 1"</span>, <span class="n">0</span>);
}
<span class="k">catch</span> (<span class="t">VideoException</span> e)
{
    <span class="me">reportWarning</span>(<span class="s">"Camera unavailable — skipping vision this match"</span>);
}
<span class="k">catch</span> (<span class="t">IllegalArgumentException</span> e)
{
    <span class="me">reportWarning</span>(<span class="s">"Bad camera config — check the port number"</span>);
}</code></pre>
      <h2>finally</h2>
      <p>An optional <code class="inline">finally</code> block, after all the <code class="inline">catch</code> blocks, always runs — whether an exception was thrown or not, and even if the <code class="inline">catch</code> block itself returns early. It's the right place for cleanup that must happen no matter what (closing a file, releasing a resource):</p>
      <pre class="code"><code><span class="t">Scanner</span> scan = <span class="k">null</span>;
<span class="k">try</span>
{
    scan = <span class="k">new</span> <span class="t">Scanner</span>(<span class="k">new</span> <span class="t">File</span>(<span class="s">"auto_config.csv"</span>));
    <span class="c">// ... read the file ...</span>
}
<span class="k">catch</span> (<span class="t">FileNotFoundException</span> e)
{
    <span class="me">reportWarning</span>(<span class="s">"Missing auto_config.csv — using default route"</span>);
}
<span class="k">finally</span>
{
    <span class="k">if</span> (scan != <span class="k">null</span>)
    {
        scan.<span class="me">close</span>(); <span class="c">// runs whether the try succeeded, failed, or even returned early</span>
    }
}</code></pre>
      <h2>Checked vs. Unchecked Exceptions</h2>
      <p>Java splits exceptions into two kinds, and the difference matters for what the compiler demands of you:</p>
      <ul>
        <li><strong>Checked exceptions</strong> (like <code class="inline">IOException</code>) — the compiler forces you to either <code class="inline">catch</code> them or declare them with a <code class="inline">throws</code> clause. They represent problems a caller could reasonably be expected to recover from.</li>
        <li><strong>Unchecked exceptions</strong> (<code class="inline">RuntimeException</code> and its subclasses — <code class="inline">NullPointerException</code>, <code class="inline">ArrayIndexOutOfBoundsException</code>, <code class="inline">ArithmeticException</code>) — the compiler does not require handling them at all, though you're always allowed to. They almost always represent a genuine programming bug (a null you forgot to check, an index you miscalculated) rather than something the caller can meaningfully recover from at runtime.</li>
      </ul>
      <p>Guideline from the language's own designers: <em>if a client can reasonably be expected to recover from a problem, make it checked; if a client can't do anything useful about it, make it unchecked.</em> This is also why CSA covers unchecked-exception concepts (NullPointerException, ArrayIndexOutOfBoundsException) as topics in their own right, without ever teaching the <code class="inline">try</code>/<code class="inline">catch</code> mechanism itself — the AP exam doesn't test it.</p>
      <h2>The throws Clause</h2>
      <p>If a method doesn't want to handle a checked exception itself, it can instead declare that it might throw one, pushing the decision up to whoever calls it:</p>
      <pre class="code"><code><span class="k">public void</span> <span class="me">writeList</span>() <span class="k">throws</span> <span class="t">IOException</span>
{
    <span class="t">PrintWriter</span> out = <span class="k">new</span> <span class="t">PrintWriter</span>(<span class="k">new</span> <span class="t">FileWriter</span>(<span class="s">"OutFile.txt"</span>));
    <span class="c">// ...</span>
    out.<span class="me">close</span>();
}</code></pre>
      <p><code class="inline">throws</code> goes after the parameter list, before the method body's opening brace. Unchecked exceptions never need to appear in a <code class="inline">throws</code> clause (though nothing stops you from listing one).</p>
      <h2>The throw Statement</h2>
      <p>Any code — yours, a library's, or the Java runtime itself — can trigger an exception with the <code class="inline">throw</code> statement, given any object that's a <code class="inline">Throwable</code> (or a subclass):</p>
      <pre class="code"><code><span class="k">public void</span> <span class="me">setTargetAngle</span>(<span class="k">double</span> degrees)
{
    <span class="k">if</span> (degrees &lt; <span class="n">0</span> || degrees &gt; <span class="n">180</span>)
    {
        <span class="k">throw new</span> <span class="t">IllegalArgumentException</span>(<span class="s">"Angle out of range: "</span> + degrees);
    }
    <span class="k">this</span>.targetAngle = degrees;
}</code></pre>
      <p>Every exception type in Java descends from <code class="inline">Throwable</code>. Its two direct children are <code class="inline">Error</code> (serious JVM-level failures — not something ordinary code catches or throws) and <code class="inline">Exception</code> (everything an ordinary program throws and catches), and <code class="inline">RuntimeException</code> is the branch of <code class="inline">Exception</code> reserved for unchecked exceptions.</p>
    `,
    pitfalls: [
      "Catch-and-ignore. An empty <code class=\"inline\">catch</code> block silently swallows a real problem — at minimum, log or report it (<code class=\"inline\">reportWarning(...)</code> above), even if there's nothing more to do.",
      "Catching to \"fix\" a bug instead of fixing it. Wrapping buggy code in <code class=\"inline\">try</code>/<code class=\"inline\">catch</code> to suppress a <code class=\"inline\">NullPointerException</code> hides the actual mistake instead of correcting it — reserve catching for genuinely recoverable situations (a missing file, an unreachable camera), not programming errors.",
      "Forgetting <code class=\"inline\">finally</code> runs even on an early <code class=\"inline\">return</code> inside <code class=\"inline\">try</code>/<code class=\"inline\">catch</code>. Cleanup code that must always run belongs in <code class=\"inline\">finally</code>, not duplicated at the end of every branch."
    ],
    takeaways: [
      "Throwing an exception creates an object describing the problem and hands it to the runtime, which searches the call stack for a matching handler; an unhandled exception crashes the program (a red \"Robot Code\" indicator, on a robot).",
      "<code class=\"inline\">try</code> wraps risky code; one or more <code class=\"inline\">catch</code> blocks handle specific exception types; an optional <code class=\"inline\">finally</code> block always runs, for cleanup.",
      "Checked exceptions (like <code class=\"inline\">IOException</code>) must be caught or declared with <code class=\"inline\">throws</code>; unchecked exceptions (<code class=\"inline\">RuntimeException</code> and its subclasses) don't require either, since they usually signal a real bug rather than a recoverable situation.",
      "<code class=\"inline\">throw someObject;</code> triggers an exception yourself, given any <code class=\"inline\">Throwable</code>.",
      "Never catch-and-ignore — recover meaningfully, or at least report the problem."
    ],
    prov: "other-reference-repo: oracle-java-tutorials/exceptions/01, 03, 09, 10, 13 (ORACLE 11.1-16) · Deck context: mechacoder-test/src/lessons/java-1.js, slide 11 (\"Exceptions & try/catch\")"
  }
};
