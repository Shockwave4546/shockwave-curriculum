<script>
const DATA = {
  "13": {
    title: "Common Gotchas",
    ref: "13 — Common Gotchas (no citation — deck-original content)",
    body: `
      <p>This chapter is a quick-reference checklist, not new material — each item below is taught in full elsewhere in this curriculum. Its job is to put the most common real mistakes side by side, since they tend to resurface long after the lesson that first covered them. <strong>Note:</strong> this list is expected to grow once real code-review and exercise practice surfaces more of the mistakes people actually make — it currently only covers what the original deck flagged.</p>
      <h2>== vs. .equals()</h2>
      <p><code class="inline">==</code> compares primitives (<code class="inline">int</code>, <code class="inline">double</code>, <code class="inline">boolean</code>) by value, which is correct and sufficient for them. For objects — including <code class="inline">String</code> — <code class="inline">==</code> instead checks whether two variables point at the <em>exact same object in memory</em>, which is almost never what you actually want to ask:</p>
      <pre class="code"><code><span class="t">String</span> a = <span class="k">new</span> <span class="t">String</span>(<span class="s">"BlueAlliance-Left"</span>);
<span class="t">String</span> b = <span class="k">new</span> <span class="t">String</span>(<span class="s">"BlueAlliance-Left"</span>);
a == b;        <span class="c">// false — two different objects, even with identical text</span>
a.<span class="me">equals</span>(b);   <span class="c">// true — compares the actual characters</span></code></pre>
      <p>Use <code class="inline">.equals()</code> (or <code class="inline">.equals()</code>-style comparisons) for any object type, including boxed numbers like <code class="inline">Integer</code> and <code class="inline">Double</code>. See Lesson 6.1 for the full explanation.</p>
      <h2>Integer Division</h2>
      <p>Dividing two <code class="inline">int</code>s produces an <code class="inline">int</code> — the fractional part is silently discarded (truncated), not rounded:</p>
      <pre class="code"><code><span class="k">int</span> result = <span class="n">5</span> / <span class="n">2</span>;       <span class="c">// 2, not 2.5 — the .5 is thrown away, not rounded</span>
<span class="k">double</span> result2 = <span class="n">5.0</span> / <span class="n">2.0</span>; <span class="c">// 2.5 — at least one operand must be a floating-point type</span></code></pre>
      <p>This bites often when averaging (<code class="inline">total / count</code> where both are <code class="inline">int</code>) — cast at least one operand to <code class="inline">double</code> first. See Lesson 2.4 for casting rules in full.</p>
      <h2>NullPointerException</h2>
      <p>Calling a method or accessing a field on a variable that's <code class="inline">null</code> (declared but never assigned a real object) throws <code class="inline">NullPointerException</code> — one of the most common runtime crashes in any Java program, robot code included:</p>
      <pre class="code"><code><span class="t">Drivetrain</span> drivetrain; <span class="c">// declared, but never assigned — currently null</span>
drivetrain.<span class="me">stop</span>();      <span class="c">// NullPointerException — nothing to call stop() on</span></code></pre>
      <p>The fix is always the same shape: make sure every object is actually constructed (<code class="inline">new Drivetrain(...)</code>) before anything calls a method on it, and check for <code class="inline">null</code> explicitly at any point where a value might legitimately be missing (e.g., a <code class="inline">HashMap.get()</code> that found no match — see Lesson 9.3).</p>
      <h2>Off-by-One</h2>
      <p>Arrays (and <code class="inline">ArrayList</code>) are indexed starting at <code class="inline">0</code> — the last valid index is always <code class="inline">length - 1</code> (or <code class="inline">size() - 1</code>), never <code class="inline">length</code> itself:</p>
      <pre class="code"><code><span class="k">int</span>[] canBusIds = <span class="k">new int</span>[<span class="n">10</span>]; <span class="c">// valid indices: 0 through 9</span>
canBusIds[<span class="n">10</span>]; <span class="c">// ArrayIndexOutOfBoundsException — 10 is one past the end</span></code></pre>
      <p>This is the single most common loop-bound mistake — writing <code class="inline">i &lt;= array.length</code> instead of <code class="inline">i &lt; array.length</code>. See Lesson 9.1 (arrays) and 9.2 (ArrayList) for the full indexing rules.</p>
    `,
    pitfalls: [
      "Treating this chapter as the complete list of Java mistakes. It isn't — it's the handful the original deck happened to flag. Real practice will surface plenty more (this chapter is expected to grow).",
      "Fixing the symptom instead of the cause. E.g., wrapping a <code class=\"inline\">NullPointerException</code> in a <code class=\"inline\">try</code>/<code class=\"inline\">catch</code> (Lesson 12) instead of fixing why the object was never constructed in the first place."
    ],
    takeaways: [
      "Use <code class=\"inline\">==</code> for primitives, <code class=\"inline\">.equals()</code> for objects (Lesson 6.1).",
      "<code class=\"inline\">int / int</code> truncates; make at least one operand a floating-point type to keep the fractional part (Lesson 2.4).",
      "<code class=\"inline\">NullPointerException</code> means something was used before it was actually constructed — always initialize before use (Lessons 4.4–4.6, 9.1).",
      "Valid indices run from <code class=\"inline\">0</code> to <code class=\"inline\">length - 1</code> (or <code class=\"inline\">size() - 1</code>) — never <code class=\"inline\">length</code> itself (Lessons 9.1, 9.2).",
      "This is a living checklist, not a finished one — expect it to grow as more real gotchas surface through practice."
    ],
    prov: "mechacoder-test: src/lessons/java-1.js, slide 13 (\"Common Gotchas\") — original deck content, no external citation"
  }
};

let currentItem = "13";

function renderList(){
  const host = document.getElementById('itemlist');
  host.innerHTML = '';
  Object.keys(DATA).forEach(key => {
    const it = DATA[key];
    const el = document.createElement('div');
    el.className = 'item' + (key === currentItem ? ' on' : '');
    el.innerHTML = `<span class="iref">Ch.${key}</span><span class="ititle">${it.title}</span>`;
    el.addEventListener('click', () => { currentItem = key; renderList(); renderMain(); });
    host.appendChild(el);
  });
}

function renderMain(){
  const it = DATA[currentItem];
  const host = document.getElementById('maininner');
  host.innerHTML = `
    <div class="doc">
      <h1 class="doctitle">${it.title}</h1>
      <div class="refline">Outline ref: ${it.ref}</div>
      <div class="statusline">Status: new — authored lesson (fuller depth than the teaser slide)</div>
      ${it.body}
      <div class="pitfalls"><div class="lbl">Common Pitfalls</div><ul>${it.pitfalls.map(p => `<li>${p}</li>`).join('')}</ul></div>
      <div class="takeaways"><div class="lbl">Key Takeaways</div><ul>${it.takeaways.map(t => `<li>${t}</li>`).join('')}</ul></div>
      <div class="prov"><strong>Derived from</strong> ${it.prov}</div>
    </div>
  `;
  document.getElementById('main').scrollTop = 0;
}

renderList();
renderMain();
</script>
