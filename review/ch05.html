      <p>Chain <code class="inline">else if</code> to pick between three or more paths — only the first true branch runs:</p>

}
<span class="k">else</span>

<span class="k">else</span> <span class="k">if</span> (score &gt;= <span class="n">80</span>) { grade = <span class="s">"B"</span>; }
<span class="k">else</span> { grade = <span class="s">"C"</span>; }

<span class="c">// NOT connected — multiple could run, overwriting each other</span>
<span class="k">if</span> (score &gt;= <span class="n">90</span>) { grade = <span class="s">"A"</span>; }

      "Skipping the trailing <code class=\"inline\">else</code> when a local variable is only assigned inside branches. The compiler won't let you read a local variable that isn't definitely assigned on every path — add an <code class=\"inline\">else</code>, or give the variable a starting value.",
      "Stacking ternaries. <code class=\"inline\">a ? x : b ? y : z</code> is legal but hard to read — for three or more choices, use an <code class=\"inline\">else if</code> chain."
    ],
    takeaways: [
      "<code class=\"inline\">else if</code> chains pick exactly one branch — the first condition that's true, and nothing after it.",
      "Unconnected, separate <code class=\"inline\">if</code> statements are checked independently and can overwrite each other's results.",
      "An <code class=\"inline\">else</code> always attaches to the nearest unmatched <code class=\"inline\">if</code> — braces are the only reliable way to control this.",
      "<code class=\"inline\">condition ? a : b</code> picks one of two values in a single expression — a compact stand-in for an <code class=\"inline\">if</code>/<code class=\"inline\">else</code> that only assigns."
    ],

  "5.6": {
    title: "Compound Boolean Expressions",
    ref: "5.6 — Compound Boolean Expressions (CSA 2.5)",
    body: `
      <h2>And, Or, Not</h2>
      <p>Combine conditions with <code class="inline">&amp;&amp;</code> (and), <code class="inline">||</code> (or), and <code class="inline">!</code> (not):</p>
      <pre class="code"><code><span class="k">if</span> (armReady &amp;&amp; intakeReady)
{
    shooter.<span class="me">score</span>();
}</code></pre>
      <p><code class="inline">&amp;&amp;</code> needs both sides true; <code class="inline">||</code> needs just one (or both). <code class="inline">!</code> flips a boolean's value.</p>
      <h2>Short-Circuit Evaluation</h2>
      <p>Java stops checking as soon as the answer is already known — it never evaluates more than it needs to:</p>
      <ul>
        <li>In <code class="inline">a &amp;&amp; b</code>: if <code class="inline">a</code> is false, <code class="inline">b</code> is never even checked — the whole thing is already false.</li>
        <li>In <code class="inline">a || b</code>: if <code class="inline">a</code> is true, <code class="inline">b</code> is never checked — the whole thing is already true.</li>
      </ul>
      <p>This isn't just an optimization — it's a real safety pattern:</p>
      <pre class="code"><code><span class="k">if</span> (sensor != <span class="k">null</span> &amp;&amp; sensor.<span class="me">isFaulty</span>())
{
    <span class="me">report</span>(sensor);
}</code></pre>
      <p>If <code class="inline">sensor</code> is <code class="inline">null</code>, the left side is false, so <code class="inline">&amp;&amp;</code> never evaluates <code class="inline">sensor.isFaulty()</code> — which would otherwise throw a <code class="inline">NullPointerException</code>. The order here matters: the null check has to come <em>first</em>.</p>
      <h2>Operator Precedence</h2>
      <p><code class="inline">!</code> binds tightest, then <code class="inline">&amp;&amp;</code>, then <code class="inline">||</code> — parentheses override all of it and make intent explicit:</p>
      <pre class="code"><code><span class="k">if</span> (!ready &amp;&amp; !armed) { ... }        <span class="c">// ! applies to each: true only if BOTH are false</span>
<span class="k">if</span> (!(ready &amp;&amp; armed)) { ... }       <span class="c">// different! true if EITHER one is false</span></code></pre>
    `,
    pitfalls: [
      "Putting the null check on the wrong side. <code class=\"inline\">sensor.isFaulty() &amp;&amp; sensor != null</code> checks the faulty status <em>first</em> — if <code class=\"inline\">sensor</code> is <code class=\"inline\">null</code>, it crashes before the null check ever runs. The null check must come first for short-circuiting to protect you.",
      "Assuming <code class=\"inline\">!(a &amp;&amp; b)</code> is the same as <code class=\"inline\">!a &amp;&amp; !b</code>. It's not — that's a real logic error (the correct equivalent, De Morgan's Law, comes in the next lesson)."
    ],
    takeaways: [
      "<code class=\"inline\">&amp;&amp;</code> requires both sides true; <code class=\"inline\">||</code> requires at least one; <code class=\"inline\">!</code> flips a boolean.",
      "Short-circuit evaluation skips the right side once the left side already determines the result — order a null-check first specifically to exploit this.",
      "<code class=\"inline\">!</code> has higher precedence than <code class=\"inline\">&amp;&amp;</code>, which has higher precedence than <code class=\"inline\">||</code>; use parentheses when the default grouping isn't what you mean."
    ],
    prov: "csawesome-2026: unit-2-selection-and-iteration/2.05-compound-boolean-expressions.md (CSA 2.5)"
  },
  "5.7": {
    title: "Comparing Boolean Expressions (De Morgan's Laws)",
    ref: "5.7 — Comparing Boolean Expressions (De Morgan's Laws) (CSA 2.6)",
    body: `
      <h2>De Morgan's Laws</h2>
      <p>Negating a compound condition flips both the operator and each individual comparison:</p>
      <pre class="code"><code>!(a && b)  is equivalent to  !a || !b
!(a || b)  is equivalent to  !a && !b</code></pre>
      <p>A simple way to remember it: push the <code class="inline">!</code> inward, and flip <code class="inline">&&</code> to <code class="inline">||</code> (or <code class="inline">||</code> to <code class="inline">&&</code>) as it moves in.</p>
      <h2>Flipping Relational Operators Under Negation</h2>
      <p>The same idea applies to relational operators — negating a comparison flips its sign:</p>
      <pre class="code"><code>!(c == d)  is  c != d
!(c &lt; d)   is  c &gt;= d
!(c &gt; d)   is  c &lt;= d</code></pre>
      <p>Putting both rules together: <code class="inline">!(x < 3 && y > 2)</code> becomes <code class="inline">!(x < 3) || !(y > 2)</code>, which simplifies further to <code class="inline">(x >= 3 || y <= 2)</code>.</p>
      <h2>Why Bother Simplifying</h2>
      <p><code class="inline">!(ready && armed)</code> and <code class="inline">!ready || !armed</code> always evaluate to the same result — but the second one reads more directly as "either one isn't ready" instead of "it's not true that both are ready." Simplifying a negated condition often makes the code's actual intent clearer.</p>
      <pre class="code"><code><span class="k">if</span> (!ready || !armed) {
    <span class="me">abort</span>();
}</code></pre>
      <h2>A Preview: Comparing Objects</h2>
      <p><code class="inline">==</code> on objects (a preview from Lesson 5.4) compares whether two variables point at the <em>same</em> object, not whether their contents match. This matters for <code class="inline">String</code>s specifically, which get their own full treatment in Ch.6 — for now, the short version: use <code class="inline">.equals()</code> to compare what two objects actually contain, and reserve <code class="inline">==</code>/<code class="inline">!=</code> for checking against <code class="inline">null</code>.</p>
      <pre class="code"><code><span class="k">if</span> (sensor != <span class="k">null</span> && sensor.<span class="me">isFaulty</span>()) { ... } <span class="c">// == used correctly, against null</span></code></pre>
    `,
    pitfalls: [
      "Forgetting to flip the operator, not just add a <code class=\"inline\">!</code>. <code class=\"inline\">!(x < 3)</code> is <code class=\"inline\">x >= 3</code>, not <code class=\"inline\">x !< 3</code> (which isn't valid Java) and not <code class=\"inline\">x > 3</code> (which misses the equal case).",
      "Applying De Morgan's Law only to one side. Both the operator (<code class=\"inline\">&&</code>/<code class=\"inline\">||</code>) and both individual comparisons flip — doing only one produces a wrong, non-equivalent expression."
    ],
    takeaways: [
      "<code class=\"inline\">!(a && b)</code> is equivalent to <code class=\"inline\">!a || !b</code>; <code class=\"inline\">!(a || b)</code> is equivalent to <code class=\"inline\">!a && !b</code>.",
      "Negating a relational operator flips its sign: <code class=\"inline\"><</code> becomes <code class=\"inline\">>=</code>, <code class=\"inline\">></code> becomes <code class=\"inline\"><=</code>, <code class=\"inline\">==</code> becomes <code class=\"inline\">!=</code>.",
      "Simplifying a negated condition often makes its intent easier to read, even though it's logically equivalent either way.",
      "<code class=\"inline\">==</code> on objects checks identity, not content — <code class=\"inline\">.equals()</code> (covered fully in Ch.6) is for comparing what's actually inside."
    ],
    prov: "csawesome-2026: unit-2-selection-and-iteration/2.06-comparing-boolean-expressions-de-morgan-s-laws.md (CSA 2.6)"
  },
  "5.8": {
    title: "While Loops",
    ref: "5.8 — While Loops (CSA 2.7)",
    body: `
      <h2>The Three Steps of a Loop</h2>
      <p>A <code class="inline">while</code> loop repeats its body as long as a condition holds, checked <em>before</em> every pass, including the first:</p>
      <pre class="code"><code><span class="k">int</span> attempts = <span class="n">0</span>;             <span class="c">// 1. initialize</span>
<span class="k">while</span> (attempts &lt; <span class="n">3</span> &amp;&amp; !connected) <span class="c">// 2. test</span>
{
    connected = <span class="me">tryConnect</span>();
    attempts++;                <span class="c">// 3. update</span>
}</code></pre>
      <p>Every loop needs these same three steps — initialize the loop variable, test it, update it inside the loop. A <code class="inline">for</code> loop (Lesson 5.1-5.2) just packs all three into one header line; a <code class="inline">while</code> loop spreads them out, which is more natural when the "update" isn't a simple counter.</p>
      <h2>Infinite Loops</h2>
      <p>Forget step 3 and the condition never changes — the loop runs forever:</p>
      <pre class="code"><code><span class="k">int</span> i = <span class="n">0</span>;
<span class="k">while</span> (i &lt; <span class="n">10</span>)
{
    System.out.<span class="me">println</span>(i); <span class="c">// i never changes — this never stops</span>
}</code></pre>
      <p>An infinite loop on a robot doesn't just print forever — it can freeze the whole robot's control loop, since nothing after it ever gets a chance to run.</p>
      <h2>When to Reach for <code class="inline">while</code> Instead of <code class="inline">for</code></h2>
      <p><code class="inline">for</code> fits naturally when you already know the number of iterations. <code class="inline">while</code> fits better when you're repeating until a <em>condition</em> changes, not counting to a number — like retrying a connection a limited number of times:</p>
      <pre class="code"><code><span class="k">int</span> attempts = <span class="n">0</span>;
<span class="k">while</span> (!gyro.<span class="me">isConnected</span>() &amp;&amp; attempts &lt; <span class="n">5</span>)
{
    gyro.<span class="me">reconnect</span>(); <span class="c">// assume our gyro class has this retry method</span>
    attempts++;
}</code></pre>
      <p>This tries at most 5 times, then moves on whether or not the gyro came back. What it must never do is <em>wait</em>: robot code runs in short, repeating cycles many times per second, and a loop that sits spinning until a sensor finally responds holds up everything else — the freeze described above. In robot code, check a condition once per cycle instead of looping until it changes.</p>
      <h2>do-while: Run the Body at Least Once</h2>
      <p>A <code class="inline">do-while</code> loop checks its condition <em>after</em> each pass instead of before, so the body always runs at least once:</p>
      <pre class="code"><code><span class="k">int</span> attempts = <span class="n">0</span>;
<span class="k">do</span>
{
    connected = <span class="me">tryConnect</span>();
    attempts++;
} <span class="k">while</span> (!connected &amp;&amp; attempts &lt; <span class="n">3</span>); <span class="c">// this semicolon is required</span></code></pre>
      <p>This is the first loop in this lesson, reshaped: the first connection attempt happens unconditionally, and the test only decides whether to try <em>again</em>. Use <code class="inline">do-while</code> when there's nothing to test until the body has run once; otherwise, a plain <code class="inline">while</code> is the usual choice.</p>
      <h2>Leaving a Loop Early: break and continue</h2>
      <p>Two statements change a loop's flow from inside its body. <code class="inline">break</code> ends the loop immediately; <code class="inline">continue</code> skips the rest of the current pass and moves on to the next one:</p>
      <pre class="code"><code><span class="k">for</span> (<span class="k">int</span> port = <span class="n">0</span>; port &lt; <span class="n">10</span>; port++)
{
    <span class="k">if</span> (port == <span class="n">3</span>)
    {
        <span class="k">continue</span>; <span class="c">// port 3 is reserved: skip to the next pass</span>
    }
    <span class="k">if</span> (<span class="me">isFree</span>(port))
    {
        System.out.<span class="me">println</span>(<span class="s">"First free port: "</span> + port);
        <span class="k">break</span>;    <span class="c">// found one: stop the whole loop now</span>
    }
}</code></pre>
      <p>In a <code class="inline">for</code> loop, <code class="inline">continue</code> still runs the update (<code class="inline">port++</code>) before the next test; in a <code class="inline">while</code> loop, it jumps straight to the test. Inside nested loops, both affect only the innermost loop they're in. (<code class="inline">break</code> also ends a case in a <code class="inline">switch</code> statement — Lesson 5.12.)</p>
    `,
    pitfalls: [
      "Forgetting to update the loop variable. The single most common cause of an infinite loop — every <code class=\"inline\">while</code> loop needs something inside it that eventually makes the condition false.",
      "A condition that's false from the very first check. If the condition never holds, the loop body never runs at all — not even once. Double-check the loop variable's starting value against the condition.",
      "Leaving off the semicolon after a <code class=\"inline\">do-while</code>'s condition. <code class=\"inline\">} while (attempts &lt; 3)</code> with no <code class=\"inline\">;</code> won't compile. The opposite mistake, a stray <code class=\"inline\">;</code> right after a plain <code class=\"inline\">while (...)</code> header, gives the loop an empty body — and an infinite loop if the condition starts true.",
      "A <code class=\"inline\">continue</code> in a <code class=\"inline\">while</code> loop that skips the update. If the update (<code class=\"inline\">i++</code>) comes after the <code class=\"inline\">continue</code>, the skipped pass never reaches it, and the loop repeats the same value forever."
    ],
    takeaways: [
      "Every loop needs three steps: initialize, test, update — <code class=\"inline\">while</code> just doesn't bundle them into one line like <code class=\"inline\">for</code> does.",
      "A <code class=\"inline\">while</code> loop's condition is checked before every pass, including the first — if it starts false, the body never runs.",
      "Forgetting to update the loop variable is the classic cause of an infinite loop, which can freeze a robot's control code.",
      "<code class=\"inline\">while</code> fits naturally when you're repeating until a condition changes rather than counting a known number of iterations.",
      "A <code class=\"inline\">do-while</code> checks its condition after each pass, so its body always runs at least once — and its closing <code class=\"inline\">while (...)</code> needs a semicolon.",
      "<code class=\"inline\">break</code> ends the innermost loop immediately; <code class=\"inline\">continue</code> skips to that loop's next pass."
    ],
    prov: "csawesome-2026: unit-2-selection-and-iteration/2.07-while-loops.md (CSA 2.7)"
  },
  "5.9": {
    title: "Implementing Selection and Iteration Algorithms",
    ref: "5.9 — Implementing Selection and Iteration Algorithms (CSA 2.9)",
    body: `
      <p>A handful of loop-and-selection patterns come up constantly. Once you recognize them, you'll see the same shape everywhere.</p>
      <p><em>The examples below loop over an existing collection (<code class="inline">visionLatencies</code>, <code class="inline">sensors</code>) with an enhanced <code class="inline">for</code> — building your own comes in Ch.9. Read <code class="inline">for (double sample : visionLatencies)</code> as "for each <code class="inline">sample</code> in <code class="inline">visionLatencies</code>": the loop variable takes each value in turn, first to last, with no index to manage (Lesson 9.4 covers it fully). For now, focus on the accumulator/selection shape itself; it applies the same way once you get there.</em></p>
      <h2>The Accumulator Pattern</h2>
      <p>Build up a running total across a loop: initialize before the loop, update inside it, use the result after.</p>
      <pre class="code"><code><span class="k">double</span> sum = <span class="n">0</span>;
<span class="k">for</span> (<span class="k">double</span> sample : visionLatencies)
{
    sum += sample; <span class="c">// accumulate</span>
}
<span class="k">double</span> average = sum / visionLatencies.<span class="me">size</span>();</code></pre>
      <h2>Min/Max with an if Inside a Loop</h2>
      <p>Track the smallest or largest value seen so far by pairing an accumulator with an <code class="inline">if</code> inside the loop:</p>
      <pre class="code"><code><span class="k">double</span> max = <span class="t">Double</span>.NEGATIVE_INFINITY; <span class="c">// below every real number</span>
<span class="k">for</span> (<span class="k">double</span> sample : visionLatencies)
{
    <span class="k">if</span> (sample &gt; max)
    {
        max = sample; <span class="c">// running max</span>
    }
}</code></pre>
      <p><code class="inline">Double.NEGATIVE_INFINITY</code> is a special <code class="inline">double</code> value smaller than every real number, so the first sample always replaces it. (<code class="inline">Double</code> is Java's wrapper class for <code class="inline">double</code>; its constants and the other wrapper classes come in Lesson 9.2.) Watch out for the similar-looking <code class="inline">Double.MIN_VALUE</code>: despite the name, it's the smallest <em>positive</em> <code class="inline">double</code> (about <code class="inline">4.9E-324</code>), so a max seeded with it stays wrong whenever every sample is zero or negative.</p>
      <h2>Frequency Counting</h2>
      <p>Count how many values in a sequence meet some criterion, using a counter incremented inside a conditional:</p>
      <pre class="code"><code><span class="k">int</span> faultyCount = <span class="n">0</span>;
<span class="k">for</span> (Sensor sensor : sensors)
{
    <span class="k">if</span> (sensor.<span class="me">isFaulty</span>())
    {
        faultyCount++;
    }
}</code></pre>
      <h2>Simulating Probability with Math.random()</h2>
      <p><code class="inline">Math.random() &lt; p</code> is true with probability <code class="inline">p</code> — a real way to simulate an event that happens some percentage of the time (useful for testing code against randomized simulated sensor noise, for instance):</p>
      <pre class="code"><code><span class="k">if</span> (Math.<span class="me">random</span>() &lt; <span class="n">0.1</span>) <span class="c">// roughly 10% of the time</span>
{
    <span class="me">simulateSensorGlitch</span>();
}</code></pre>
    `,
    pitfalls: [
      "Initializing an accumulator with the wrong starting value. A sum starts at <code class=\"inline\">0</code>; a max should start below every possible value (<code class=\"inline\">Double.NEGATIVE_INFINITY</code> for a <code class=\"inline\">double</code>, <code class=\"inline\">Integer.MIN_VALUE</code> for an <code class=\"inline\">int</code>) so the very first real value always replaces it. Not <code class=\"inline\">Double.MIN_VALUE</code> — that's the smallest <em>positive</em> <code class=\"inline\">double</code>, not the most negative one.",
      "Putting the accumulator update outside the loop. It has to be <em>inside</em> the loop body to actually accumulate across every iteration."
    ],
    takeaways: [
      "The accumulator pattern: initialize before the loop, update inside it, use the result after.",
      "Min/max tracking pairs an accumulator with an <code class=\"inline\">if</code> inside the loop, comparing each new value against the best one seen so far.",
      "Frequency counting increments a counter inside a conditional, once per matching iteration.",
      "<code class=\"inline\">Math.random() &lt; p</code> simulates an event with probability <code class=\"inline\">p</code>."
    ],
    prov: "csawesome-2026: unit-2-selection-and-iteration/2.09-implementing-selection-and-iteration-algorithms.md (CSA 2.9)"
  },
  "5.10": {
    title: "Nested Iteration",
    ref: "5.10 — Nested Iteration (CSA 2.11)",
    body: `
      <h2>A Loop Inside a Loop</h2>
      <p>Nesting one loop inside another means the inner loop runs to completion for <em>every single pass</em> of the outer one:</p>
      <pre class="code"><code><span class="k">for</span> (<span class="k">int</span> row = <span class="n">0</span>; row &lt; <span class="n">8</span>; row++)
{
    <span class="k">for</span> (<span class="k">int</span> col = <span class="n">0</span>; col &lt; <span class="n">8</span>; col++)
    {
        visionGrid[row][col] = <span class="me">sampleCell</span>(row, col);
    }
}</code></pre>
      <p>For each value of <code class="inline">row</code>, the inner loop runs all the way through every <code class="inline">col</code> value before the outer loop advances to the next <code class="inline">row</code>. The inner loop restarts from scratch each time.</p>
      <h2>Why This Matters</h2>
      <p>Nested loops are the natural shape for anything grid-like: scanning a 2D vision frame, checking every pair of sensors against each other, or generating a table of test cases. (2D arrays, which pair naturally with nested loops, get their own full chapter — Ch.10.)</p>
    `,
    pitfalls: [
      "Reusing the same loop variable name for both loops. <code class=\"inline\">for (int i ...)</code> nested inside another <code class=\"inline\">for (int i ...)</code> won't compile — the outer <code class=\"inline\">i</code> is still in scope inside the inner loop, so the compiler reports <code class=\"inline\">variable i is already defined</code>. Use distinct names (<code class=\"inline\">row</code>/<code class=\"inline\">col</code>, <code class=\"inline\">i</code>/<code class=\"inline\">j</code>).",
      "Assuming the inner loop's variable persists across outer iterations. It doesn't — a loop variable declared in the <code class=\"inline\">for</code> header is freshly initialized every time that loop starts, including every restart of an inner loop."
    ],
    takeaways: [
      "A loop nested inside another runs completely, every single time the outer loop takes one step.",
      "Nested loops are the standard shape for anything grid-shaped — rows and columns, pairs of items, tables of test cases.",
      "Use distinct loop variable names for nested loops (<code class=\"inline\">row</code>/<code class=\"inline\">col</code>, not <code class=\"inline\">i</code>/<code class=\"inline\">i</code>)."
    ],
    prov: "csawesome-2026: unit-2-selection-and-iteration/2.11-nested-iteration.md (CSA 2.11)"
  },
  "5.11": {
    title: "Informal Runtime Analysis of Loops",
    ref: "5.11 — Informal Runtime Analysis of Loops (CSA 2.12)",
    body: `
      <h2>Counting Iterations Without Running the Code</h2>
      <p>You can predict exactly how many times a loop runs just by reading its header:</p>
      <pre class="code"><code><span class="k">for</span> (<span class="k">int</span> i = <span class="n">3</span>; i &lt; <span class="n">7</span>; i++) { ... } <span class="c">// runs 6 - 3 + 1 = 4 times</span></code></pre>
      <p>The formula: <code class="inline">largest value the loop variable reaches − smallest value + 1</code>. For a <code class="inline">&lt;</code> bound, the largest value is one less than the limit; for <code class="inline">&lt;=</code>, it's the limit itself.</p>
      <h2>Nested Loops Multiply</h2>
      <p>A nested loop's total iteration count is outer iterations × inner iterations:</p>
      <pre class="code"><code><span class="c">// 5 outer passes × 10 inner passes = 50 total iterations</span>
<span class="k">for</span> (<span class="k">int</span> row = <span class="n">0</span>; row &lt; <span class="n">5</span>; row++)
{
    <span class="k">for</span> (<span class="k">int</span> col = <span class="n">0</span>; col &lt; <span class="n">10</span>; col++) { ... }
}</code></pre>
      <h2>Why This Matters</h2>
      <p>Being able to predict a loop's iteration count without running it is a real debugging tool — if a loop is running way more (or fewer) times than expected, tracing through this formula by hand usually finds the off-by-one or the wrong bound immediately, faster than adding print statements and re-running.</p>
    `,
    pitfalls: [
      "Forgetting to subtract 1 for a <code class=\"inline\">&lt;</code> bound. <code class=\"inline\">i &lt; 7</code> starting at <code class=\"inline\">3</code> reaches <code class=\"inline\">3, 4, 5, 6</code> — four values, not <code class=\"inline\">7 − 3 + 1 = 5</code> (that would treat <code class=\"inline\">7</code> itself as reached).",
      "Multiplying the wrong two numbers for a nested loop. It's outer-count × inner-count-per-outer-pass, not outer-count + inner-count."
    ],
    takeaways: [
      "A loop's iteration count is <code class=\"inline\">largest reachable value − smallest value + 1</code>.",
      "Nested loops multiply: total iterations = outer count × inner count.",
      "Counting iterations by hand is a fast way to catch an off-by-one bug before it turns into a mysterious runtime problem."
    ],

    ref: "5.12 — switch Statements and Expressions (not in AP CSA; added by the 2026-09-25 content audit)",
    body: `
      <p>When one value decides between many fixed choices, an <code class="inline">else if</code> chain (Lesson 5.5) ends up comparing the same variable over and over. A <code class="inline">switch</code> says it directly: look at one value, then jump to the case that matches it.</p>
      <h2>The Classic switch Statement</h2>
      <pre class="code"><code><span class="k">int</span> autoMode = <span class="n">2</span>;

<span class="k">switch</span> (autoMode)
{
    <span class="k">case</span> <span class="n">1</span>:
        System.out.<span class="me">println</span>(<span class="s">"Drive forward"</span>);
        <span class="k">break</span>;
    <span class="k">case</span> <span class="n">2</span>:
        System.out.<span class="me">println</span>(<span class="s">"Score one piece"</span>);
        <span class="k">break</span>;
    <span class="k">case</span> <span class="n">3</span>:
        System.out.<span class="me">println</span>(<span class="s">"Score two pieces"</span>);
        <span class="k">break</span>;
    <span class="k">default</span>:
        System.out.<span class="me">println</span>(<span class="s">"Do nothing"</span>);
        <span class="k">break</span>;
}</code></pre>
      <p>Java evaluates the value in parentheses once, jumps to the <code class="inline">case</code> whose label matches it, and runs the statements from there. <code class="inline">break</code> ends the whole <code class="inline">switch</code> — the same <code class="inline">break</code> that leaves a loop early in Lesson 5.8. <code class="inline">default</code> runs when no label matches, like the trailing <code class="inline">else</code> of an <code class="inline">else if</code> chain; it's optional in a <code class="inline">switch</code> statement, but leaving it off makes "do nothing" a real outcome.</p>
      <p>Case labels must be fixed values, like <code class="inline">2</code> or <code class="inline">"RED"</code> — never a condition such as <code class="inline">autoMode &gt; 2</code>. For ranges, use an <code class="inline">if</code>/<code class="inline">else</code> chain. You can switch on an <code class="inline">int</code>, a <code class="inline">char</code>, a <code class="inline">String</code> or an enum (Ch.11) — but not on a <code class="inline">long</code>, a <code class="inline">double</code> or a <code class="inline">boolean</code>.</p>
      <h2>Fall-Through: What Happens Without break</h2>
      <p>Leave out a <code class="inline">break</code>, and execution doesn't stop at the next label — it <em>falls through</em> and keeps running the following case's statements, ignoring that case's label, until it reaches a <code class="inline">break</code> or the end of the <code class="inline">switch</code>:</p>
      <pre class="code"><code><span class="k">switch</span> (autoMode)
{
    <span class="k">case</span> <span class="n">1</span>:
        System.out.<span class="me">println</span>(<span class="s">"Drive forward"</span>);
        <span class="c">// no break: falls through into case 2</span>
    <span class="k">case</span> <span class="n">2</span>:
        System.out.<span class="me">println</span>(<span class="s">"Score one piece"</span>);
        <span class="k">break</span>;
    <span class="k">default</span>:
        System.out.<span class="me">println</span>(<span class="s">"Do nothing"</span>);
        <span class="k">break</span>;
}</code></pre>
      <p>With <code class="inline">autoMode</code> set to <code class="inline">1</code>, this prints both <code class="inline">Drive forward</code> and <code class="inline">Score one piece</code>. Fall-through is occasionally what you want, but far more often it's a forgotten <code class="inline">break</code>.</p>
      <h2>Several Labels, One Action</h2>
      <p>When several values should do the same thing, list them in one <code class="inline">case</code>, separated by commas:</p>
      <pre class="code"><code><span class="k">switch</span> (buttonNumber)
{
    <span class="k">case</span> <span class="n">1</span>, <span class="n">2</span>:
        System.out.<span class="me">println</span>(<span class="s">"Intake"</span>);
        <span class="k">break</span>;
    <span class="k">case</span> <span class="n">3</span>:
        System.out.<span class="me">println</span>(<span class="s">"Shoot"</span>);
        <span class="k">break</span>;
    <span class="k">default</span>:
        System.out.<span class="me">println</span>(<span class="s">"Unmapped button"</span>);
        <span class="k">break</span>;
}</code></pre>
      <p>Older code gets the same effect with fall-through, stacking <code class="inline">case 1:</code> and <code class="inline">case 2:</code> on separate lines with nothing between them. The comma form says it more clearly.</p>
      <h2>Switching on a String</h2>
      <pre class="code"><code><span class="t">String</span> alliance = <span class="s">"RED"</span>;

<span class="k">switch</span> (alliance)
{
    <span class="k">case</span> <span class="s">"RED"</span>:
        System.out.<span class="me">println</span>(<span class="s">"Start on the left"</span>);
        <span class="k">break</span>;
    <span class="k">case</span> <span class="s">"BLUE"</span>:
        System.out.<span class="me">println</span>(<span class="s">"Start on the right"</span>);
        <span class="k">break</span>;
    <span class="k">default</span>:
        System.out.<span class="me">println</span>(<span class="s">"Unknown alliance"</span>);
        <span class="k">break</span>;
}</code></pre>
      <p>A <code class="inline">String</code> case matches only the exact same text, capital letters included — <code class="inline">"red"</code> would land in <code class="inline">default</code>. (Ch.6 explains how Java compares Strings.)</p>
      <h2>The Arrow Form: No Fall-Through</h2>
      <p>Writing <code class="inline">case ... -&gt;</code> instead of <code class="inline">case ...:</code> gives each case its own separate body. It never falls through, so there's no <code class="inline">break</code> to forget:</p>
      <pre class="code"><code><span class="k">switch</span> (autoMode)
{
    <span class="k">case</span> <span class="n">1</span> -&gt; System.out.<span class="me">println</span>(<span class="s">"Drive forward"</span>);
    <span class="k">case</span> <span class="n">2</span> -&gt;
    {
        System.out.<span class="me">println</span>(<span class="s">"Score one piece"</span>);
        System.out.<span class="me">println</span>(<span class="s">"Then back up"</span>);
    }
    <span class="k">case</span> <span class="n">3</span>, <span class="n">4</span> -&gt; System.out.<span class="me">println</span>(<span class="s">"Score two pieces"</span>);
    <span class="k">default</span> -&gt; System.out.<span class="me">println</span>(<span class="s">"Do nothing"</span>);
}</code></pre>
      <p>A case with one statement puts it right after the arrow; a case with several wraps them in braces. One <code class="inline">switch</code> must use one form throughout — you can't mix <code class="inline">:</code> and <code class="inline">-&gt;</code> cases. For new code, the arrow form is usually the better choice.</p>
      <h2>switch Expressions: Producing a Value</h2>
      <p>A <code class="inline">switch</code> can also <em>produce a value</em>, the way <code class="inline">?:</code> does in Lesson 5.5, but for any number of choices:</p>
      <pre class="code"><code><span class="k">int</span> autoMode = <span class="n">3</span>;

<span class="t">String</span> plan = <span class="k">switch</span> (autoMode)
{
    <span class="k">case</span> <span class="n">1</span> -&gt; <span class="s">"Drive forward"</span>;
    <span class="k">case</span> <span class="n">2</span> -&gt; <span class="s">"Score one piece"</span>;
    <span class="k">case</span> <span class="n">3</span>, <span class="n">4</span> -&gt; <span class="s">"Score two pieces"</span>;
    <span class="k">default</span> -&gt; <span class="s">"Do nothing"</span>;
};

System.out.<span class="me">println</span>(plan); <span class="c">// Score two pieces</span></code></pre>
      <p>Each case's value becomes the value of the whole <code class="inline">switch</code>. Two rules come with that. The semicolon after the closing brace is required, because the <code class="inline">switch</code> is part of an assignment statement. And a <code class="inline">switch</code> expression must be <em>exhaustive</em>: every possible value has to produce a result, so a switch expression on an <code class="inline">int</code> or a <code class="inline">String</code> needs a <code class="inline">default</code>.</p>
      <h2>yield: When a Case Needs More Than One Line</h2>
      <p>If a case in a <code class="inline">switch</code> expression needs to do some work before producing its value, give it a block and hand the value back with <code class="inline">yield</code>:</p>
      <pre class="code"><code><span class="k">double</span> speed = <span class="k">switch</span> (gear)
{
    <span class="k">case</span> <span class="n">1</span> -&gt; <span class="n">0.3</span>;
    <span class="k">case</span> <span class="n">2</span> -&gt; <span class="n">0.6</span>;
    <span class="k">case</span> <span class="n">3</span> -&gt;
    {
        System.out.<span class="me">println</span>(<span class="s">"Top gear: watch the corners"</span>);
        <span class="k">yield</span> <span class="n">1.0</span>;
    }
    <span class="k">default</span> -&gt; <span class="n">0.0</span>;
};</code></pre>
      <p><code class="inline">yield</code> means "this is the switch's value" — <code class="inline">return</code> would try to leave the whole method instead. <code class="inline">yield</code> also replaces <code class="inline">break</code> if you ever write a <code class="inline">switch</code> expression in the colon form (<code class="inline">case 1: yield 0.3;</code>).</p>
      <h2>switch and Enums (Ch.11)</h2>
      <p><code class="inline">switch</code> is at its best with enums, the named sets of choices that Ch.11 introduces — that chapter picks up right where this lesson leaves off. One Java version note to carry there: on Java 21 and later, including Java 25 (this course's target), an enum case label can be written either bare (<code class="inline">case INTAKE -&gt;</code>) or qualified with the enum's name (<code class="inline">case ArmPosition.INTAKE -&gt;</code>). On Java 17, only the bare name compiles. Everything else in this lesson — arrow cases, comma-separated labels, <code class="inline">switch</code> expressions and <code class="inline">yield</code> — has been standard since Java 14, so it works the same on Java 17 and Java 25.</p>
    `,

      "Leaving out <code class=\"inline\">default</code> in a <code class=\"inline\">switch</code> expression on an <code class=\"inline\">int</code> or <code class=\"inline\">String</code>. It won't compile, because some values would have no result.",
      "Forgetting the semicolon after a <code class=\"inline\">switch</code> expression. <code class=\"inline\">String plan = switch (autoMode) { ... }</code> needs a <code class=\"inline\">;</code> after the closing brace, like any other assignment.",
