<script>
const DATA = {
  "22": {
    title: "The Builder Pattern",
    ref: "22 — The Builder Pattern (T5817 30.1)",
    body: `
      <h2>The Problem: "Constructor Hell"</h2>
      <p>A constructor with many parameters — especially several of the same type, or several optional ones — becomes genuinely hard to read and easy to get wrong:</p>
      <pre class="code"><code><span class="t">Shooter</span> shooter = <span class="k">new</span> <span class="t">Shooter</span>(<span class="n">0.01</span>, <span class="n">0.3</span>, <span class="n">0.02</span>, <span class="k">true</span>, <span class="k">false</span>, <span class="n">12.0</span>, <span class="n">0.5</span>);</code></pre>
      <p>What does each number actually mean? Swap two arguments of the same type by mistake, and the compiler won't catch it — it'll just silently misconfigure the shooter. This is sometimes called "constructor hell," and it gets worse the more optional settings a class has, since a constructor either forces every caller to specify every parameter, or multiplies into a pile of overloads trying to cover every combination.</p>
      <h2>The Builder Pattern: Construct Step by Step</h2>
      <p>The <strong>Builder Pattern</strong> separates <em>building</em> an object from <em>using</em> it — a separate <code class="inline">Builder</code> object collects settings one at a time, through named, chainable methods, then produces the final object only once, via a <code class="inline">build()</code> call:</p>
      <pre class="code"><code><span class="t">Shooter</span> shooter = <span class="k">new</span> <span class="t">Shooter</span>.<span class="t">Builder</span>()
    .<span class="me">setKP</span>(<span class="n">0.01</span>)
    .<span class="me">setKI</span>(<span class="n">0.3</span>)
    .<span class="me">setKD</span>(<span class="n">0.02</span>)
    .<span class="me">enableFeedforward</span>(<span class="k">true</span>)
    .<span class="me">setMaxRPM</span>(<span class="n">12.0</span>)
    .<span class="me">setMinRPM</span>(<span class="n">0.5</span>)
    .<span class="me">build</span>();</code></pre>
      <p>Every call is now self-documenting — <code class="inline">.setKP(0.01)</code> says exactly what <code class="inline">0.01</code> means, in a way a bare constructor argument never could.</p>
      <h2>Implementing a Builder</h2>
      <p>The target class (<code class="inline">Shooter</code>) gets a <code class="inline">private</code> constructor — callers can no longer construct it directly, only through the builder — plus a <code class="inline">public static</code> nested <code class="inline">Builder</code> class that collects the settings:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Shooter</span>
{
    <span class="k">private final double</span> kP, kI, kD;
    <span class="k">private final boolean</span> feedforward;
    <span class="k">private final double</span> maxRPM, minRPM;

    <span class="k">private</span> <span class="me">Shooter</span>(<span class="t">Builder</span> builder)
    {
        <span class="k">this</span>.kP = builder.kP;
        <span class="k">this</span>.kI = builder.kI;
        <span class="k">this</span>.kD = builder.kD;
        <span class="k">this</span>.feedforward = builder.feedforward;
        <span class="k">this</span>.maxRPM = builder.maxRPM;
        <span class="k">this</span>.minRPM = builder.minRPM;
    }

    <span class="k">public static class</span> <span class="t">Builder</span>
    {
        <span class="k">private double</span> kP = <span class="n">0</span>, kI = <span class="n">0</span>, kD = <span class="n">0</span>;
        <span class="k">private boolean</span> feedforward = <span class="k">false</span>;
        <span class="k">private double</span> maxRPM = <span class="n">0</span>, minRPM = <span class="n">0</span>;

        <span class="k">public</span> <span class="t">Builder</span> <span class="me">setKP</span>(<span class="k">double</span> kP) { <span class="k">this</span>.kP = kP; <span class="k">return this</span>; }
        <span class="k">public</span> <span class="t">Builder</span> <span class="me">setKI</span>(<span class="k">double</span> kI) { <span class="k">this</span>.kI = kI; <span class="k">return this</span>; }
        <span class="k">public</span> <span class="t">Builder</span> <span class="me">setKD</span>(<span class="k">double</span> kD) { <span class="k">this</span>.kD = kD; <span class="k">return this</span>; }
        <span class="k">public</span> <span class="t">Builder</span> <span class="me">enableFeedforward</span>(<span class="k">boolean</span> ff) { <span class="k">this</span>.feedforward = ff; <span class="k">return this</span>; }
        <span class="k">public</span> <span class="t">Builder</span> <span class="me">setMaxRPM</span>(<span class="k">double</span> max) { <span class="k">this</span>.maxRPM = max; <span class="k">return this</span>; }
        <span class="k">public</span> <span class="t">Builder</span> <span class="me">setMinRPM</span>(<span class="k">double</span> min) { <span class="k">this</span>.minRPM = min; <span class="k">return this</span>; }

        <span class="k">public</span> <span class="t">Shooter</span> <span class="me">build</span>() { <span class="k">return new</span> <span class="t">Shooter</span>(<span class="k">this</span>); }
    }
}</code></pre>
      <h2>The Fluent Chain: Why return this; Matters</h2>
      <p>Every <code class="inline">Builder</code> method ends with <code class="inline">return this;</code> — returning the same builder object it was just called on. That's exactly what makes chaining possible: each call's result is another <code class="inline">Builder</code>, ready for the next call in the chain, all the way until <code class="inline">.build()</code> finally produces the real <code class="inline">Shooter</code>. This style (a method call chain, each step returning the object it was called on) is called a <strong>fluent interface</strong>.</p>
      <h2>Why the Result Is Safer, Not Just Prettier</h2>
      <ul>
        <li>Every setting has a readable name at the call site, instead of an anonymous position in an argument list.</li>
        <li>Optional settings simply aren't called, rather than needing a separate constructor overload for every combination.</li>
        <li>The final object is typically built as immutable — every field is <code class="inline">final</code> and set exactly once, inside the private constructor, from the builder's already-finished values.</li>
      </ul>
      <h2>Real Patterns This Mirrors in WPILib</h2>
      <p>Several real WPILib classes already use builder-like chaining, even without a nested <code class="inline">Builder</code> class:</p>
      <pre class="code"><code><span class="t">TrajectoryConfig</span> config = <span class="k">new</span> <span class="t">TrajectoryConfig</span>(maxSpeed, maxAccel)
    .<span class="me">setKinematics</span>(driveKinematics)
    .<span class="me">addConstraint</span>(voltageConstraint);</code></pre>
      <p><code class="inline">SequentialCommandGroup</code> and <code class="inline">ParallelCommandGroup</code> follow the same underlying idea — building up a larger thing step by step, out of smaller declared pieces, rather than one giant constructor call.</p>
      <h2>When Not to Reach for a Builder</h2>
      <p>A builder is genuine overhead — a whole extra nested class — that only pays for itself once a constructor's parameter list gets long or has several optional pieces. For a class with 2-3 simple, always-required parameters, a plain constructor (or, per Ch.21, a static factory method) is simpler and should be preferred.</p>
    `,
    pitfalls: [
      "Forgetting <code class=\"inline\">return this;</code> in a builder method. Without it, the method returns <code class=\"inline\">void</code>, and chaining the next call fails to compile.",
      "Making the target class's constructor <code class=\"inline\">public</code> alongside the builder. That defeats the pattern's purpose — the real constructor should stay <code class=\"inline\">private</code>.",
      "Reaching for a builder on a simple, 2-3-parameter class. That's exactly the case the pattern isn't meant for."
    ],
    takeaways: [
      "The Builder Pattern separates step-by-step construction from a class's actual usage, avoiding \"constructor hell.\"",
      "A builder is a nested <code class=\"inline\">static</code> class collecting settings via named, chainable methods (each returning <code class=\"inline\">this</code> — a fluent interface), finishing with <code class=\"inline\">build()</code>.",
      "The target class's real constructor is <code class=\"inline\">private</code>, taking the finished builder and copying its values into <code class=\"inline\">final</code> fields.",
      "Real WPILib classes (<code class=\"inline\">TrajectoryConfig</code>, command groups) already use this same chaining idea.",
      "Skip the builder for simple classes with few, always-required parameters — a constructor or static factory (Ch.21) is simpler there."
    ],
    prov: "other-reference-repo: team-5817-training/design-patterns/builder.md (T5817 30.1) · Deck context: mechacoder-test/src/lessons/java-2.js, slide 8 (\"The Builder Pattern\") — MotorConfig fluent-builder example"
  }
};
