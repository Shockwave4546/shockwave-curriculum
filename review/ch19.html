<script>
const DATA = {
  "19": {
    title: "Interfaces as Contracts",
    ref: "19 — Interfaces as Contracts (ORACLE 15.1-6)",
    body: `
      <h2>What vs. How</h2>
      <p>An <strong>interface</strong> defines <em>what</em> an object can do, without specifying <em>how</em> it does it. It's a "contract" — a set of method signatures any implementing class agrees to provide, with no implementation of its own for those methods. This matters enormously in real engineering: it lets two groups write code against a shared agreement without either needing to know the other's internals — a hardware vendor and an application team can each build against the same interface independently, as long as both honor it.</p>
      <pre class="code"><code><span class="k">public interface</span> <span class="t">IntakeIO</span>
{
    <span class="k">void</span> <span class="me">updateInputs</span>(<span class="t">IntakeInputs</span> inputs);
    <span class="k">void</span> <span class="me">setVoltage</span>(<span class="k">double</span> volts);
}</code></pre>
      <p>Method signatures inside an interface have no body — just a semicolon, no braces. <code class="inline">interface</code> is the keyword; a class agrees to the contract with <code class="inline">implements</code>:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">RealIntakeIO</span> <span class="k">implements</span> <span class="t">IntakeIO</span>
{
    <span class="me">@Override</span>
    <span class="k">public void</span> <span class="me">updateInputs</span>(<span class="t">IntakeInputs</span> inputs) { <span class="c">/* real sensor reads */</span> }

    <span class="me">@Override</span>
    <span class="k">public void</span> <span class="me">setVoltage</span>(<span class="k">double</span> volts) { <span class="c">/* real motor.setVoltage(volts) */</span> }
}</code></pre>
      <p>A class implementing an interface must provide a real method body for <em>every</em> method the interface declares (default and static methods excepted — see below) — or the class fails to compile.</p>
      <h2>Multiple Interfaces, One Superclass</h2>
      <p>Unlike <code class="inline">extends</code> (limited to exactly one superclass — Lesson 17.1), a class can <code class="inline">implements</code> as many interfaces as it needs:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Robot</span> <span class="k">implements</span> <span class="t">Loggable</span>, <span class="t">Sendable</span>
{
    <span class="c">// must provide every method declared by BOTH Loggable and Sendable</span>
}</code></pre>
      <p>This is one of the biggest practical differences between inheritance and interfaces: a class has one parent, but can honor any number of separate contracts at once.</p>
      <h2>Using an Interface as a Type</h2>
      <p>Just like a superclass (Lesson 17.3), an interface is a real reference type — a variable, parameter, array, or collection can be declared against an interface type, and hold any object whose class implements it:</p>
      <pre class="code"><code><span class="k">public void</span> <span class="me">configureIntake</span>(<span class="t">IntakeIO</span> io)
{
    io.<span class="me">setVoltage</span>(<span class="n">0.0</span>); <span class="c">// works for RealIntakeIO, SimIntakeIO, or any other IntakeIO implementation</span>
}</code></pre>
      <p>Code written against <code class="inline">IntakeIO</code> never needs to know or care which concrete implementation it's actually working with — real hardware, or a simulated stand-in (this exact pattern is the foundation of the IO-Layer Pattern, Ch.20).</p>
      <h2>Default and Static Methods</h2>
      <p>Normally every method in an interface is abstract (no body). A <strong>default method</strong> is the one exception — it provides a real implementation directly inside the interface, marked with the <code class="inline">default</code> keyword, which implementing classes inherit automatically without being forced to write it themselves:</p>
      <pre class="code"><code><span class="k">public interface</span> <span class="t">IntakeIO</span>
{
    <span class="k">default void</span> <span class="me">updateInputs</span>(<span class="t">IntakeInputs</span> inputs) {}  <span class="c">// default: does nothing unless overridden</span>
    <span class="k">default void</span> <span class="me">setVoltage</span>(<span class="k">double</span> volts) {}           <span class="c">// default: does nothing unless overridden</span>
}</code></pre>
      <p>This matters for a very practical reason: default methods let an interface add new methods later without breaking every class that already implements it — existing implementations simply inherit the default behavior rather than suddenly failing to compile. A class can still override a default method with its own real implementation, exactly like overriding an inherited method from a superclass (Lesson 18.1).</p>
      <p>An interface can also declare <strong>static methods</strong> — utility methods associated with the interface itself, not with any implementing object, called directly on the interface name rather than through an instance.</p>
    `,
    pitfalls: [
      "Forgetting to implement every abstract method an interface declares. A class that leaves even one required method unimplemented fails to compile.",
      "Confusing <code class=\"inline\">extends</code> and <code class=\"inline\">implements</code>. A class <code class=\"inline\">extends</code> exactly one class, but can <code class=\"inline\">implements</code> any number of interfaces.",
      "Assuming every interface method needs to be written from scratch. Default methods come \"for free\" — only override one if the default behavior isn't what you want."
    ],
    takeaways: [
      "An interface is a contract: method signatures with no implementation (default/static methods aside), specifying <em>what</em> a class can do, not <em>how</em>.",
      "A class agrees to an interface's contract with <code class=\"inline\">implements</code>, and can implement any number of interfaces at once.",
      "An interface is a real type — variables, parameters, arrays, and collections can all be declared against it.",
      "A <code class=\"inline\">default</code> method provides a real implementation directly in the interface, letting implementing classes inherit it without writing their own."
    ],
    prov: "other-reference-repo: oracle-java-tutorials/interfaces/01-06 (ORACLE 15.1-6) · Deck context: mechacoder-test/src/lessons/java-2.js, slide 6 (\"Interfaces as Contracts\") — IntakeIO example"
  },
  "19.1": {
    title: "Lambdas & Method References",
    ref: "19.1 — Lambdas & Method References (ORACLE 12.1-2) — relocated here since a lambda is really shorthand for a functional interface",
    body: `
      <h2>The Problem Lambdas Solve</h2>
      <p>When an interface declares exactly <strong>one</strong> abstract method (a <strong>functional interface</strong>), implementing it with a full named class — or even an anonymous class — is a lot of ceremony for something conceptually simple: "here's the one bit of behavior you asked for." A <strong>lambda expression</strong> lets you write that one method's body directly, with no class declaration at all:</p>
      <pre class="code"><code><span class="k">public interface</span> <span class="t">DoubleSupplier</span>
{
    <span class="k">double</span> <span class="me">getAsDouble</span>(); <span class="c">// exactly one abstract method — this is a functional interface</span>
}</code></pre>
      <pre class="code"><code><span class="c">// Without a lambda: a full anonymous class just to supply one value</span>
<span class="t">DoubleSupplier</span> speed = <span class="k">new</span> <span class="t">DoubleSupplier</span>()
{
    <span class="me">@Override</span>
    <span class="k">public double</span> <span class="me">getAsDouble</span>() { <span class="k">return</span> joystick.<span class="me">getY</span>(); }
};

<span class="c">// With a lambda: the same thing, far more directly</span>
<span class="t">DoubleSupplier</span> speed = () -&gt; joystick.<span class="me">getY</span>();</code></pre>
      <p><code class="inline">WPILib</code> commands and suppliers are built almost entirely on this pattern — this is exactly what makes lambdas so central to command-based programming (Ch.25).</p>
      <h2>Lambda Syntax</h2>
      <p>A lambda expression has three parts: a parameter list in parentheses, the arrow <code class="inline">-&gt;</code>, and a body:</p>
      <pre class="code"><code>(parameters) -&gt; expression</code></pre>
      <ul>
        <li><strong>Parameter types are inferred</strong>, not written — the compiler already knows them from the functional interface being implemented.</li>
        <li><strong>Parentheses can be dropped</strong> around a single parameter: <code class="inline">p -&gt; p.getY()</code> is valid, just like <code class="inline">(p) -&gt; p.getY()</code>.</li>
        <li><strong>A single expression is the return value automatically</strong> — no <code class="inline">return</code> keyword needed. A multi-statement body needs braces and an explicit <code class="inline">return</code>.</li>
      </ul>
      <pre class="code"><code><span class="t">DoubleSupplier</span> speed = () -&gt; joystick.<span class="me">getY</span>();              <span class="c">// single expression — auto-returned</span>

<span class="t">DoubleSupplier</span> clampedSpeed = () -&gt; {                       <span class="c">// multi-statement body needs braces + return</span>
    <span class="k">double</span> raw = joystick.<span class="me">getY</span>();
    <span class="k">return</span> <span class="t">Math</span>.<span class="me">max</span>(-<span class="n">1.0</span>, <span class="t">Math</span>.<span class="me">min</span>(<span class="n">1.0</span>, raw));
};</code></pre>
      <p>A lambda with more than one parameter lists them comma-separated inside the parentheses:</p>
      <pre class="code"><code><span class="k">public interface</span> <span class="t">IntBinaryOperation</span>
{
    <span class="k">int</span> <span class="me">apply</span>(<span class="k">int</span> a, <span class="k">int</span> b);
}

<span class="t">IntBinaryOperation</span> add = (a, b) -&gt; a + b;</code></pre>
      <h2>Common Functional Interfaces You'll Actually Use</h2>
      <p>Java (and WPILib) ship several ready-made functional interfaces, so you rarely need to declare your own:</p>
      <pre class="code"><code><span class="t">Runnable</span> stopAll = () -&gt; intake.<span class="me">stop</span>();                 <span class="c">// no arguments, no return value</span>
<span class="t">DoubleSupplier</span> speed = () -&gt; joystick.<span class="me">getY</span>();            <span class="c">// no arguments, returns a double</span>
<span class="t">BooleanSupplier</span> hasGamePiece = () -&gt; intake.<span class="me">hasPiece</span>();  <span class="c">// no arguments, returns a boolean</span></code></pre>
      <h2>Method References: An Even Shorter Form</h2>
      <p>When a lambda's <em>entire</em> body is just calling one existing method, a <strong>method reference</strong> (<code class="inline">::</code>) says the same thing even more directly:</p>
      <pre class="code"><code><span class="t">Runnable</span> stopAll = () -&gt; intake.<span class="me">stop</span>(); <span class="c">// a lambda...</span>
<span class="t">Runnable</span> stopAll2 = intake::stop;       <span class="c">// ...is exactly equivalent to this method reference</span></code></pre>
      <p><code class="inline">intake::stop</code> reads as "the <code class="inline">stop</code> method, called on <code class="inline">intake</code>" — Java fills in the call automatically, with whatever arguments the functional interface's method expects. Method references exist purely as a shorthand for a lambda that does nothing but forward to an existing method.</p>
    `,
    pitfalls: [
      "Writing parameter types into a lambda. <code class=\"inline\">(Person p) -&gt; p.getAge()</code> — while technically legal — is unusual style; letting the compiler infer the type is the normal convention.",
      "Forgetting <code class=\"inline\">return</code> in a multi-statement lambda body. A single-expression lambda auto-returns its value, but a <code class=\"inline\">{ }</code> block body needs an explicit <code class=\"inline\">return</code>.",
      "Reaching for a method reference when the lambda does more than forward one call. A method reference only replaces a lambda that does nothing but call one existing method."
    ],
    takeaways: [
      "A lambda expression is a compact way to implement a functional interface (an interface with exactly one abstract method) inline, without writing a class.",
      "Syntax: <code class=\"inline\">(parameters) -&gt; expression</code> (or a braced block for multi-statement bodies); parameter types are inferred.",
      "<code class=\"inline\">Runnable</code>, <code class=\"inline\">DoubleSupplier</code>, and <code class=\"inline\">BooleanSupplier</code> are common ready-made functional interfaces WPILib code uses constantly.",
      "A method reference (<code class=\"inline\">object::method</code>) is exact shorthand for a lambda that does nothing but call one existing method."
    ],
    prov: "other-reference-repo: oracle-java-tutorials/lambdas/lambda-expressions.md (ORACLE 12.2) · Deck context: mechacoder-test/src/lessons/java-1.js, slide 12 (\"Lambdas & Method References\")"
  }
};
