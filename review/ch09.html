      <h2>What an Array Is</h2>
      <p>An array is a fixed-size block of memory holding several values of the same type, accessed by position (<strong>index</strong>) instead of by separate variable names — the fix for needing <code class="inline">motor1</code>, <code class="inline">motor2</code>, <code class="inline">motor3</code>... variables.</p>
      <pre class="code"><code><span class="k">int</span>[] canBusIds = {<span class="n">1</span>, <span class="n">2</span>, <span class="n">3</span>, <span class="n">4</span>}; <span class="c">// an initializer list — size inferred, values set immediately</span></code></pre>
      <h2>Two Ways to Create One</h2>
      <pre class="code"><code><span class="k">int</span>[] canBusIds;              <span class="c">// declares the variable — no array exists yet (it's null)</span>
canBusIds = <span class="k">new int</span>[<span class="n">4</span>];       <span class="c">// creates a 4-element array — all elements start at 0</span>

<span class="k">int</span>[] canBusIds2 = {<span class="n">1</span>, <span class="n">2</span>, <span class="n">3</span>, <span class="n">4</span>}; <span class="c">// initializer list: create + fill in one step</span></code></pre>
      <p>An array is itself an object — a declared-but-not-yet-created array variable holds <code class="inline">null</code>, exactly like any other reference type.</p>
      <p>When you create an array with <code class="inline">new</code> and a size, every element starts at that type's default: <code class="inline">0</code> for <code class="inline">int</code>, <code class="inline">0.0</code> for <code class="inline">double</code>, <code class="inline">false</code> for <code class="inline">boolean</code>, <code class="inline">null</code> for <code class="inline">String</code> or any reference type.</p>
      <h2>Indexing</h2>
      <p>Indices start at 0; the last valid index is always <code class="inline">length - 1</code> (a <code class="inline">public final int</code> field, not a method — no parentheses, unlike <code class="inline">String.length()</code>).</p>
      <pre class="code"><code>System.out.<span class="me">println</span>(canBusIds.length); <span class="c">// 4</span>
canBusIds[<span class="n">0</span>] = <span class="n">5</span>;                     <span class="c">// assign</span>
System.out.<span class="me">println</span>(canBusIds[<span class="n">0</span>]);     <span class="c">// read — prints 5</span></code></pre>
      <p>Accessing an index outside <code class="inline">0</code> to <code class="inline">length - 1</code> throws <code class="inline">ArrayIndexOutOfBoundsException</code> — one of the most common real runtime errors.</p>
      <h2>Parallel Arrays</h2>
      <p>Two (or more) arrays, kept in the same order, where index <code class="inline">i</code> in one corresponds to index <code class="inline">i</code> in the other:</p>
      <pre class="code"><code><span class="t">String</span>[] autoNames = {<span class="s">"3-Piece-Left"</span>, <span class="s">"1-Piece-Safe"</span>, <span class="s">"Mobility-Only"</span>};
<span class="k">double</span>[] autoTimes = {<span class="n">14.2</span>, <span class="n">8.5</span>, <span class="n">3.1</span>}; <span class="c">// autoTimes[i] is the recorded time for autoNames[i]</span></code></pre>
      <h2>Arrays of Objects</h2>
      <p>An array can hold any type, including your own classes — but each element still has to be constructed individually:</p>
      <pre class="code"><code><span class="t">TalonFX</span>[] driveMotors = <span class="k">new</span> <span class="t">TalonFX</span>[<span class="n">4</span>]; <span class="c">// 4 slots, all currently null</span>
driveMotors[<span class="n">0</span>] = <span class="k">new</span> <span class="t">TalonFX</span>(<span class="n">1</span>);        <span class="c">// must construct each element separately</span>
driveMotors[<span class="n">0</span>].<span class="me">set</span>(<span class="n">0.5</span>);                <span class="c">// then call methods through the index</span></code></pre>

      <h2>Why ArrayList Exists</h2>
      <p>An array's size is fixed forever once created. <strong>ArrayList</strong> is Java's resizable alternative — use it whenever you don't know the final size up front, or items will be added/removed while the program runs (a growing log of events, for instance).</p>
      <pre class="code"><code><span class="k">import</span> java.util.ArrayList;

<span class="t">ArrayList</span>&lt;<span class="t">String</span>&gt; logs = <span class="k">new</span> <span class="t">ArrayList</span>&lt;<span class="t">String</span>&gt;();
logs.<span class="me">add</span>(<span class="s">"Robot Initialized"</span>);</code></pre>
      <h2>The Type Parameter</h2>
      <p><code class="inline">ArrayList&lt;Type&gt;</code> — the type in angle brackets is what kind of object the list holds. <code class="inline">ArrayList</code> can only hold objects, never primitives directly — a list of numbers uses the wrapper types <code class="inline">Integer</code>/<code class="inline">Double</code> (Java auto-converts back and forth, called autoboxing/unboxing):</p>
      <pre class="code"><code><span class="t">ArrayList</span>&lt;<span class="t">Double</span>&gt; sensorReadings = <span class="k">new</span> <span class="t">ArrayList</span>&lt;<span class="t">Double</span>&gt;();
sensorReadings.<span class="me">add</span>(<span class="n">2.4</span>); <span class="c">// autoboxed into a Double automatically</span></code></pre>
      <h2>Core Methods</h2>
      <pre class="code"><code><span class="t">ArrayList</span>&lt;<span class="t">String</span>&gt; logs = <span class="k">new</span> <span class="t">ArrayList</span>&lt;<span class="t">String</span>&gt;();
logs.<span class="me">size</span>();          <span class="c">// number of elements (like length, but a method — () required)</span>
logs.<span class="me">add</span>(<span class="s">"started"</span>);  <span class="c">// appends to the end</span>
logs.<span class="me">add</span>(<span class="n">0</span>, <span class="s">"boot"</span>);  <span class="c">// inserts at index 0, shifting everything else right</span>
logs.<span class="me">get</span>(<span class="n">0</span>);           <span class="c">// reads the element at index 0</span>
logs.<span class="me">set</span>(<span class="n">0</span>, <span class="s">"ready"</span>);  <span class="c">// replaces the element at index 0</span>
logs.<span class="me">remove</span>(<span class="n">0</span>);        <span class="c">// removes the element at index 0, shifting later ones left</span></code></pre>

      <h2>Array vs. ArrayList, Side by Side</h2>

      </tbody></table>

      <h2>Key-Value Pairs</h2>
      <p>A <strong>HashMap</strong> stores pairs — each unique <strong>key</strong> maps to a <strong>value</strong>, like a real dictionary mapping a word to its definition:</p>
      <pre class="code"><code><span class="k">import</span> java.util.HashMap;

<span class="t">HashMap</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt; motorOffsets = <span class="k">new</span> <span class="t">HashMap</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt;();
motorOffsets.<span class="me">put</span>(<span class="n">5</span>, <span class="n">0.02</span>);   <span class="c">// CAN ID 5's calibration offset is 0.02</span>
motorOffsets.<span class="me">put</span>(<span class="n">6</span>, -<span class="n">0.01</span>);

<span class="k">double</span> offset = motorOffsets.<span class="me">get</span>(<span class="n">5</span>); <span class="c">// 0.02</span></code></pre>
      <p><code class="inline">put(key, value)</code> adds or replaces a pair; <code class="inline">get(key)</code> retrieves the value for a key.</p>
      <h2>When to Reach for a HashMap</h2>
      <p>Arrays and <code class="inline">ArrayList</code> are naturally indexed by position (0, 1, 2...). A <code class="inline">HashMap</code> is for when the natural "index" is something else entirely — a name, an ID number, a label — and you want to look values up by that instead of a position:</p>
      <pre class="code"><code><span class="t">HashMap</span>&lt;<span class="t">String</span>, <span class="t">String</span>&gt; subsystemStatus = <span class="k">new</span> <span class="t">HashMap</span>&lt;<span class="t">String</span>, <span class="t">String</span>&gt;();
subsystemStatus.<span class="me">put</span>(<span class="s">"Intake"</span>, <span class="s">"Ready"</span>);
subsystemStatus.<span class="me">put</span>(<span class="s">"Shooter"</span>, <span class="s">"Spinning Up"</span>);</code></pre>
      <h2>Looping Through Every Pair</h2>
      <p><code class="inline">keySet()</code> gives you every key, which you can then use with <code class="inline">get()</code> to reach each value:</p>
      <pre class="code"><code><span class="k">for</span> (<span class="t">String</span> name : subsystemStatus.<span class="me">keySet</span>()) {
    <span class="t">String</span> status = subsystemStatus.<span class="me">get</span>(name);
    System.out.<span class="me">println</span>(name + <span class="s">": "</span> + status);
}</code></pre>

      <h2>Looping Through an Array</h2>
      <p><strong>Traversing</strong> an array means visiting its elements, usually with a loop. The loop variable doubles as the index:</p>
      <pre class="code"><code><span class="k">double</span>[] sensorReadings = {<span class="n">2.1</span>, <span class="n">2.4</span>, <span class="n">1.9</span>, <span class="n">2.2</span>};

    System.out.<span class="me">println</span>(sensorReadings[i]);
}</code></pre>
      <p>Writing the loop against <code class="inline">.length</code> (not a hardcoded number) means the same code keeps working no matter how many elements the array actually has.</p>
      <h2>Arrays Are Objects — Passed by Reference</h2>
      <p>An array is an object, so passing one into a method passes the reference — changes a method makes to the array's contents are visible back in the caller, same as any mutable object (Ch.7.3):</p>
      <pre class="code"><code><span class="k">public static void</span> <span class="me">zeroOut</span>(<span class="k">double</span>[] values) {
    <span class="k">for</span> (<span class="k">int</span> i = <span class="n">0</span>; i &lt; values.length; i++) {
        values[i] = <span class="n">0.0</span>; <span class="c">// this really does change the caller's array</span>
    }
}</code></pre>
      <h2>The Enhanced For-Each Loop</h2>
      <p>When you just need every value, with no index and no plan to modify elements, the for-each form is simpler:</p>
      <pre class="code"><code><span class="k">for</span> (<span class="k">double</span> reading : sensorReadings) {
    System.out.<span class="me">println</span>(reading);
}</code></pre>
      <p>It always starts at index 0 and runs through every element in order. It's genuinely equivalent to an indexed loop — just more concise when you don't need the index.</p>
      <h2>What For-Each Can't Do</h2>
      <ul>
        <li><strong>Can't modify a primitive array's elements.</strong> <code class="inline">reading = 0.0;</code> inside the loop only changes the local copy, not the real array.</li>
        <li><strong>Can't get the index.</strong> If you need to know where something is, use an indexed loop.</li>
        <li><strong>Can't skip around or go partway.</strong> For-each always visits every element in order, front to back.</li>
      </ul>
    `,
    pitfalls: [
      "Off-by-one on the loop bound. <code class=\"inline\">i <= values.length</code> runs one iteration too many and throws <code class=\"inline\">ArrayIndexOutOfBoundsException</code>; the correct bound is always <code class=\"inline\">i < values.length</code>.",
      "Expecting a for-each loop to change array values. <code class=\"inline\">for (double v : values) { v = 0.0; }</code> compiles, runs, and does absolutely nothing to the real array.",
      "Returning \"not found\" too early in a search. A search loop must check every element before concluding something isn't present."
    ],
    takeaways: [

      <p>A handful of patterns, all built from a loop plus a little bookkeeping, cover almost everything you'll want to do with an array.</p>
      <h2>Sum / Average (Accumulator)</h2>
      <pre class="code"><code><span class="k">double</span> sum = <span class="n">0</span>;
<span class="k">for</span> (<span class="k">double</span> reading : sensorReadings) {
    sum += reading;
}
<span class="k">double</span> average = sum / sensorReadings.length;</code></pre>
      <h2>Min / Max</h2>
      <pre class="code"><code><span class="k">double</span> max = sensorReadings[<span class="n">0</span>]; <span class="c">// seed with the first element, not 0 — a reading could be negative</span>
<span class="k">for</span> (<span class="k">double</span> reading : sensorReadings) {
    <span class="k">if</span> (reading &gt; max) {
        max = reading;
    }
}</code></pre>
      <h2>Search — Check Everything Before Giving Up</h2>
      <pre class="code"><code><span class="k">public static boolean</span> <span class="me">contains</span>(<span class="k">double</span>[] values, <span class="k">double</span> target) {
    <span class="k">for</span> (<span class="k">double</span> v : values) {
        <span class="k">if</span> (v == target) {
            <span class="k">return true</span>; <span class="c">// fine to return early on a MATCH</span>
        }
    }
    <span class="k">return false</span>; <span class="c">// only after checking every element</span>
}</code></pre>
      <h2>"At Least One" / "All" / "Count"</h2>
      <pre class="code"><code><span class="c">// at least one has the property</span>
<span class="k">for</span> (<span class="k">double</span> v : values) { <span class="k">if</span> (isFaulty(v)) <span class="k">return true</span>; }
<span class="k">return false</span>;

<span class="c">// all have the property (check the NEGATION, bail early on a counter-example)</span>
<span class="k">for</span> (<span class="k">double</span> v : values) { <span class="k">if</span> (!isFaulty(v)) <span class="k">return false</span>; }
<span class="k">return true</span>;

<span class="c">// count how many have the property</span>
<span class="k">int</span> count = <span class="n">0</span>;
<span class="k">for</span> (<span class="k">double</span> v : values) { <span class="k">if</span> (isFaulty(v)) count++; }</code></pre>

<span class="k">for</span> (<span class="k">int</span> i = <span class="n">0</span>; i &lt; values.length; i++) {
    <span class="k">for</span> (<span class="k">int</span> j = i + <span class="n">1</span>; j &lt; values.length; j++) {
        <span class="k">if</span> (values[i] == values[j]) <span class="k">return true</span>;

}

<span class="c">// reversing — swap from both ends toward the middle</span>

<span class="k">while</span> (start &lt; end) {

    values[start] = values[end];
    values[end] = temp;

}</code></pre>

      <h2>Same Loop Shapes as Arrays</h2>
      <p>For-each, indexed <code class="inline">for</code>, and <code class="inline">while</code> all work on an <code class="inline">ArrayList</code> — just with <code class="inline">get(i)</code> instead of <code class="inline">[i]</code>, and <code class="inline">.size()</code> instead of <code class="inline">.length</code>:</p>
      <pre class="code"><code><span class="k">for</span> (<span class="t">String</span> log : logs) { System.out.<span class="me">println</span>(log); }             <span class="c">// for-each — read-only pass</span>
<span class="k">for</span> (<span class="k">int</span> i = <span class="n">0</span>; i &lt; logs.size(); i++) { System.out.<span class="me">println</span>(logs.get(i)); } <span class="c">// indexed</span></code></pre>
      <h2>The Big Restriction: Don't Resize During a For-Each</h2>
      <p>Adding or removing elements from an <code class="inline">ArrayList</code> while a for-each loop is traversing it throws <code class="inline">ConcurrentModificationException</code>. If you need to add or remove while looping, use an indexed <code class="inline">for</code> or <code class="inline">while</code> loop instead.</p>
      <h2>Removing While Looping — The Careful Way</h2>
      <p>Removing an element shifts every later element down by one index. If you increment the loop index unconditionally after a removal, you skip checking the element that just got shifted into the spot you were on:</p>
      <pre class="code"><code><span class="k">int</span> i = <span class="n">0</span>;
<span class="k">while</span> (i &lt; logs.size()) {
    <span class="k">if</span> (shouldRemove(logs.get(i))) {
        logs.<span class="me">remove</span>(i); <span class="c">// don't increment i here — the next element just shifted into index i</span>
    } <span class="k">else</span> {
        i++; <span class="c">// only advance when nothing was removed this iteration</span>
    }
}</code></pre>
      <h2>Chaining Through a List of Objects</h2>
      <pre class="code"><code><span class="t">ArrayList</span>&lt;<span class="t">Subsystem</span>&gt; subsystems = <span class="k">new</span> <span class="t">ArrayList</span>&lt;<span class="t">Subsystem</span>&gt;();
<span class="t">String</span> firstName = subsystems.<span class="me">get</span>(<span class="n">0</span>).<span class="me">getName</span>(); <span class="c">// chain: get the object, then call a method on it</span></code></pre>
    `,

      "Incrementing the index unconditionally after a <code class=\"inline\">remove</code>. This skips the element that shifted into the just-vacated slot.",

    body: `
      <p>Every pattern from Lesson 9.5 (sum/average, min/max, search, property checks, duplicates, reversing) applies to <code class="inline">ArrayList</code> too — just swap <code class="inline">[i]</code>/<code class="inline">.length</code> for <code class="inline">get(i)</code>/<code class="inline">.size()</code>.</p>
      <h2>Min / Max / Average</h2>
      <pre class="code"><code><span class="k">public static double</span> <span class="me">average</span>(<span class="t">ArrayList</span>&lt;<span class="t">Double</span>&gt; nums) {
    <span class="k">double</span> sum = <span class="n">0</span>;
    <span class="k">for</span> (<span class="k">int</span> i = <span class="n">0</span>; i &lt; nums.size(); i++) {
        sum += nums.get(i);
    }
    <span class="k">return</span> sum / nums.size();
}</code></pre>
      <h2>Duplicates — Use .equals(), Not ==</h2>
      <p>For <code class="inline">ArrayList&lt;Integer&gt;</code> (or any object type), comparing with <code class="inline">==</code> checks identity, not value — use <code class="inline">.equals()</code> instead:</p>
      <pre class="code"><code><span class="k">for</span> (<span class="k">int</span> i = <span class="n">0</span>; i &lt; nums.size(); i++) {
    <span class="k">for</span> (<span class="k">int</span> j = i + <span class="n">1</span>; j &lt; nums.size(); j++) {
        <span class="k">if</span> (nums.get(i).<span class="me">equals</span>(nums.get(j))) { <span class="c">// .equals(), not ==</span>
            <span class="k">return true</span>;
        }
    }
}</code></pre>
      <h2>Rotating (In Place)</h2>
      <pre class="code"><code><span class="k">public static void</span> <span class="me">rotateRight</span>(<span class="t">ArrayList</span>&lt;<span class="t">Double</span>&gt; nums) {
    <span class="k">double</span> last = nums.get(nums.size() - <span class="n">1</span>);
    <span class="k">for</span> (<span class="k">int</span> i = nums.size() - <span class="n">1</span>; i &gt; <span class="n">0</span>; i--) {
        nums.set(i, nums.get(i - <span class="n">1</span>));
    }
    nums.set(<span class="n">0</span>, last);
}</code></pre>
      <h2>Parallel ArrayLists</h2>
      <p>Same idea as parallel arrays (Ch.9.1) — two lists kept in sync by index:</p>
      <pre class="code"><code><span class="t">ArrayList</span>&lt;<span class="t">String</span>&gt; autoNames = <span class="k">new</span> <span class="t">ArrayList</span>&lt;<span class="t">String</span>&gt;();
<span class="t">ArrayList</span>&lt;<span class="t">Double</span>&gt; autoTimes = <span class="k">new</span> <span class="t">ArrayList</span>&lt;<span class="t">Double</span>&gt;();
<span class="c">// autoTimes.get(i) is the recorded time for autoNames.get(i)</span></code></pre>
    `,

    takeaways: [
      "Every array algorithm pattern transfers directly to <code class=\"inline\">ArrayList</code> — just swap <code class=\"inline\">[i]</code>/<code class=\"inline\">.length</code> for <code class=\"inline\">get(i)</code>/<code class=\"inline\">.size()</code>.",

    body: `
      <h2>Why Read From a File</h2>
      <p>A file's data persists even when the program isn't running — useful for loading configuration or data too large (or too changeable) to hard-code into your source. A robot might load a table of autonomous starting positions from a file instead of hardcoding them.</p>
      <h2>Opening a File</h2>
      <p><code class="inline">File</code> (from <code class="inline">java.io</code>) represents the file itself; <code class="inline">Scanner</code> (from <code class="inline">java.util</code>) reads from it:</p>
      <pre class="code"><code><span class="k">import</span> java.io.*;
<span class="k">import</span> java.util.*;

<span class="t">File</span> configFile = <span class="k">new</span> <span class="t">File</span>(<span class="s">"auto_config.csv"</span>);
<span class="t">Scanner</span> scan = <span class="k">new</span> <span class="t">Scanner</span>(configFile); <span class="c">// can throw FileNotFoundException</span></code></pre>
      <p>Since opening a file can fail (wrong name, missing file), Java requires you to acknowledge that. The simplest way: add <code class="inline">throws IOException</code> to the method's header:</p>
      <pre class="code"><code><span class="k">public static void</span> <span class="me">main</span>(<span class="t">String</span>[] args) <span class="k">throws</span> <span class="t">IOException</span> {
    <span class="t">File</span> configFile = <span class="k">new</span> <span class="t">File</span>(<span class="s">"auto_config.csv"</span>);
    <span class="t">Scanner</span> scan = <span class="k">new</span> <span class="t">Scanner</span>(configFile);
    <span class="c">// ...</span>
    scan.<span class="me">close</span>();
}</code></pre>
      <h2>Reading Line by Line</h2>
      <pre class="code"><code><span class="k">while</span> (scan.hasNext()) {
    <span class="t">String</span> line = scan.<span class="me">nextLine</span>();
    <span class="c">// process this line</span>
}
scan.<span class="me">close</span>(); <span class="c">// always close when done</span></code></pre>
      <h2>Splitting a CSV Line</h2>
      <pre class="code"><code><span class="c">// One line of auto_config.csv: "3-Piece-Left,14.2,BlueAlliance"</span>
<span class="t">String</span> line = scan.<span class="me">nextLine</span>();
<span class="t">String</span>[] fields = line.<span class="me">split</span>(<span class="s">","</span>);
<span class="t">String</span> routeName = fields[<span class="n">0</span>];       <span class="c">// "3-Piece-Left"</span>
<span class="k">double</span> routeTime = <span class="t">Double</span>.<span class="me">parseDouble</span>(fields[<span class="n">1</span>]); <span class="c">// "14.2" -> 14.2</span>
<span class="t">String</span> alliance = fields[<span class="n">2</span>];        <span class="c">// "BlueAlliance"</span></code></pre>
      <h2>Reading Into Objects</h2>
      <p>Rather than working with raw <code class="inline">String[]</code> rows, define a class matching the file's columns and build one object per row:</p>
      <pre class="code"><code><span class="t">ArrayList</span>&lt;<span class="t">AutoRoute</span>&gt; routes = <span class="k">new</span> <span class="t">ArrayList</span>&lt;<span class="t">AutoRoute</span>&gt;();

}</code></pre>
