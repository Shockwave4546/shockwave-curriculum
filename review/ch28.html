}</code></pre>

      <h2>Selection Sort</h2>
      <p><strong>Selection sort</strong> repeatedly finds the smallest remaining value and swaps it into its correct, final position:</p>
      <pre class="code"><code><span class="k">public static void</span> <span class="me">selectionSort</span>(<span class="k">double</span>[] sensorReadings)

      <p>This is <strong>infinite recursion</strong> — it eventually crashes with <code class="inline">StackOverflowError</code>, since a program can only recurse so deep before running out of space to track all those in-progress calls.</p>
      <h2>Two Required Ingredients</h2>
      <p>Every well-behaved recursive method needs at least one <strong>base case</strong> (stops the recursion, returns directly) and at least one <strong>recursive call</strong> (moves the problem closer to the base case). The classic example, factorial:</p>
      <pre class="code"><code><span class="k">public static int</span> <span class="me">factorial</span>(<span class="k">int</span> n)

    <span class="k">if</span> (n == <span class="n">0</span>)         <span class="c">// base case — the smallest input this method answers directly</span>
    {
        <span class="k">return</span> <span class="n">1</span>;
    }
    <span class="k">else</span>
    {
        <span class="k">return</span> n * <span class="me">factorial</span>(n - <span class="n">1</span>); <span class="c">// recursive call — moves toward the base case</span>
    }
}</code></pre>

      <pre class="code"><code>factorial(3) returns 3 * factorial(2)
factorial(2) returns 2 * factorial(1)
factorial(1) returns 1 * factorial(0)
factorial(0) returns 1</code></pre>
      <p>Then substituting values back upward from the base case:</p>
      <pre class="code"><code>factorial(1) returns 1 * factorial(0) = 1 * 1 = 1
factorial(2) returns 2 * factorial(1) = 2 * 1 = 2
factorial(3) returns 3 * factorial(2) = 3 * 2 = 6</code></pre>

      <h2>Recursive Binary Search</h2>
      <p>The iterative binary search from Lesson 28.1 tracks <code class="inline">left</code>/<code class="inline">right</code> bounds in loop variables. A recursive version instead passes the shrinking range as parameters:</p>
      <pre class="code"><code><span class="k">public static int</span> <span class="me">recursiveBinarySearch</span>(<span class="k">int</span>[] elements, <span class="k">int</span> start, <span class="k">int</span> end, <span class="k">int</span> target)
{
    <span class="k">if</span> (end &lt; start)                          <span class="c">// base case 1: range is empty — not found</span>
    {
        <span class="k">return</span> -<span class="n">1</span>;
    }
    <span class="k">int</span> middle = (start + end) / <span class="n">2</span>;
    <span class="k">if</span> (target == elements[middle])            <span class="c">// base case 2: found it</span>
    {
        <span class="k">return</span> middle;
    }
    <span class="k">else if</span> (target &lt; elements[middle])
    {
        <span class="k">return</span> <span class="me">recursiveBinarySearch</span>(elements, start, middle - <span class="n">1</span>, target); <span class="c">// search the left half</span>
    }
    <span class="k">else</span>
    {
        <span class="k">return</span> <span class="me">recursiveBinarySearch</span>(elements, middle + <span class="n">1</span>, end, target);   <span class="c">// search the right half</span>
    }
}</code></pre>
      <p>This has <strong>two base cases</strong>: a match at the middle, or an exhausted range. Removing the <code class="inline">end &lt; start</code> check would mean a not-found search keeps recursing into an already-empty range forever — exactly the missing-base-case bug from Lesson 28.3.</p>
      <h2>Merge Sort: A Third Sorting Algorithm</h2>
      <p>Selection sort and insertion sort (Lesson 28.2) both cost roughly n² in the worst case. <strong>Merge sort</strong> is a <strong>divide-and-conquer</strong> algorithm — like binary search, it splits the problem in half repeatedly, which makes it substantially faster on large data (roughly n log n instead of n²):</p>
      <ol>
        <li>Split the array into two halves.</li>
        <li>Recursively sort each half (a single-element array is trivially already sorted — the base case).</li>
        <li><strong>Merge</strong> the two now-sorted halves back together, in order.</li>
      </ol>
      <pre class="code"><code><span class="k">public static void</span> <span class="me">mergeSort</span>(<span class="k">int</span>[] elements)
{
    <span class="k">int</span> n = elements.length;
    <span class="k">int</span>[] temp = <span class="k">new int</span>[n]; <span class="c">// scratch space used during merging</span>
    <span class="me">mergeSortHelper</span>(elements, <span class="n">0</span>, n - <span class="n">1</span>, temp);
}

<span class="k">private static void</span> <span class="me">mergeSortHelper</span>(<span class="k">int</span>[] elements, <span class="k">int</span> from, <span class="k">int</span> to, <span class="k">int</span>[] temp)
{
    <span class="k">if</span> (from &gt;= to) <span class="k">return</span>; <span class="c">// base case: a range of 0 or 1 elements is already sorted</span>
    <span class="k">int</span> middle = (from + to) / <span class="n">2</span>;
    <span class="me">mergeSortHelper</span>(elements, from, middle, temp);      <span class="c">// recursively sort the left half</span>
    <span class="me">mergeSortHelper</span>(elements, middle + <span class="n">1</span>, to, temp);    <span class="c">// recursively sort the right half</span>
    <span class="me">merge</span>(elements, from, middle, to, temp);            <span class="c">// combine the two sorted halves</span>
}</code></pre>
      <p>Tracing the split-then-merge structure for <code class="inline">{86, 3, 43, 5}</code>:</p>
      <pre class="code"><code>Split:  { {86, 3} , {43, 5} }
Split:  { { {86}, {3} } , { {43}, {5} } }   &lt;- single elements: base case reached
Merge:  { {3, 86} , {5, 43} }
Merge:  { 3, 5, 43, 86 }</code></pre>
      <p>Because its divide-and-conquer approach scales so much better than n² sorting, merge sort is the fastest of the three algorithms in this curriculum, most of the time, especially as the data set grows.</p>
      <h2>Iterative vs. Recursive: Same Algorithm, Different Shape</h2>
      <p>Binary search exists in both forms — a good concrete reminder of Lesson 28.3's point that many algorithms can be written either way. Iteration is usually preferred in real code (no risk of <code class="inline">StackOverflowError</code>, generally a bit more efficient) — but a recursive version can be more compact and can make a divide-and-conquer structure much more natural to express.</p>
    `,
    pitfalls: [
      "Forgetting either base case in recursive binary search. Both the \"found it\" and \"range exhausted\" cases are needed — missing the exhausted-range check risks infinite recursion on a not-found search.",
      "Merging without first ensuring both halves are actually sorted. Merge sort's merge step assumes its two inputs are already individually sorted — that's exactly what the recursive calls before it guarantee.",
      "Assuming recursive is always \"better\" than iterative, or vice versa. Each has real tradeoffs (stack depth risk vs. code clarity) — the right choice depends on the specific algorithm and data size."
    ],
    takeaways: [
      "Recursive binary search replaces loop-tracked bounds with a shrinking range passed as parameters, and needs two base cases: a match, or an exhausted range.",
      "Merge sort is a recursive, divide-and-conquer sort: split in half, recursively sort each half (base case: 1 element), then merge the sorted halves back together.",
      "Merge sort scales better than selection/insertion sort on large data (n log n vs. n²), and its performance doesn't depend on the input's initial order.",
      "The same algorithm can often be written iteratively or recursively — the choice is a real tradeoff, not a universal \"better\" answer either way."
