<script>
const DATA = {
  "16": {
    title: "Writing Your Own Generics",
    ref: "16 — Writing Your Own Generics (ORACLE 14.1-5)",
    body: `
      <p><code class="inline">List&lt;String&gt;</code>, <code class="inline">Map&lt;Integer, Double&gt;</code>, <code class="inline">ArrayList&lt;TalonFX&gt;</code> — every collection since Ch.9 has <em>used</em> a generic type someone else wrote. This chapter is about writing your own.</p>
      <h2>Why Generics Exist</h2>
      <p>Before generics, a reusable container had to work with the generic <code class="inline">Object</code> type, requiring an explicit cast every time you got something back out — and nothing stopped the wrong type from going in in the first place:</p>
      <pre class="code"><code><span class="t">List</span> list = <span class="k">new</span> <span class="t">ArrayList</span>();         <span class="c">// no generics</span>
list.<span class="me">add</span>(<span class="s">"hello"</span>);
<span class="t">String</span> s = (<span class="t">String</span>) list.<span class="me">get</span>(<span class="n">0</span>);     <span class="c">// cast required, and could fail at runtime</span></code></pre>
      <p>With a type parameter, the compiler enforces correctness <em>before</em> the program ever runs, and the cast disappears entirely:</p>
      <pre class="code"><code><span class="t">List</span>&lt;<span class="t">String</span>&gt; list = <span class="k">new</span> <span class="t">ArrayList</span>&lt;<span class="t">String</span>&gt;();
list.<span class="me">add</span>(<span class="s">"hello"</span>);
<span class="t">String</span> s = list.<span class="me">get</span>(<span class="n">0</span>);              <span class="c">// no cast — the compiler already knows it's a String</span></code></pre>
      <h2>Writing a Generic Class</h2>
      <p>A generic class introduces one or more <strong>type parameters</strong> in angle brackets after the class name. Here's a value wrapper — a natural fit for logging a tunable robot value alongside its current setpoint, using a placeholder type instead of committing to <code class="inline">double</code> or <code class="inline">String</code> up front:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">LoggedValue</span>&lt;<span class="t">T</span>&gt;
{
    <span class="k">private</span> <span class="t">T</span> value;

    <span class="k">public void</span> <span class="me">set</span>(<span class="t">T</span> v) { value = v; }
    <span class="k">public</span> <span class="t">T</span> <span class="me">get</span>() { <span class="k">return</span> value; }
}</code></pre>
      <p><code class="inline">T</code> isn't a real type — it's a <strong>type variable</strong>, a placeholder standing in for whatever concrete type gets supplied when the class is actually used:</p>
      <pre class="code"><code><span class="t">LoggedValue</span>&lt;<span class="t">Double</span>&gt; setpoint = <span class="k">new</span> <span class="t">LoggedValue</span>&lt;&gt;(); <span class="c">// the "diamond" <> — compiler infers Double from the left side</span>
setpoint.<span class="me">set</span>(<span class="n">3.5</span>);    <span class="c">// OK</span>
setpoint.<span class="me">set</span>(<span class="s">"fast"</span>); <span class="c">// compile error — a String doesn't belong in a LoggedValue&lt;Double&gt;</span></code></pre>
      <p>By convention, type parameters are single uppercase letters — <code class="inline">T</code> (Type), <code class="inline">E</code> (Element, used throughout the collections you already know), <code class="inline">K</code>/<code class="inline">V</code> (Key/Value, as in <code class="inline">Map&lt;K, V&gt;</code>), <code class="inline">N</code> (Number). This convention exists specifically so a type variable is instantly recognizable and never confused with a real class name.</p>
      <p>A generic class can take more than one type parameter, exactly like <code class="inline">Map&lt;K, V&gt;</code> does:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Pair</span>&lt;<span class="t">K</span>, <span class="t">V</span>&gt;
{
    <span class="k">private</span> <span class="t">K</span> key;
    <span class="k">private</span> <span class="t">V</span> value;

    <span class="k">public</span> <span class="me">Pair</span>(<span class="t">K</span> key, <span class="t">V</span> value)
    {
        <span class="k">this</span>.key = key;
        <span class="k">this</span>.value = value;
    }

    <span class="k">public</span> <span class="t">K</span> <span class="me">getKey</span>()   { <span class="k">return</span> key; }
    <span class="k">public</span> <span class="t">V</span> <span class="me">getValue</span>() { <span class="k">return</span> value; }
}

<span class="t">Pair</span>&lt;<span class="t">String</span>, <span class="t">Double</span>&gt; reading = <span class="k">new</span> <span class="t">Pair</span>&lt;&gt;(<span class="s">"Front-Left Current"</span>, <span class="n">12.4</span>);</code></pre>
      <h2>Generic Methods</h2>
      <p>A single method — even inside an otherwise non-generic class — can introduce its own type parameter, written in angle brackets right before the return type. Its scope is limited to that one method:</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Util</span>
{
    <span class="k">public static</span> &lt;<span class="t">K</span>, <span class="t">V</span>&gt; <span class="k">boolean</span> <span class="me">sameEntry</span>(<span class="t">Pair</span>&lt;<span class="t">K</span>, <span class="t">V</span>&gt; p1, <span class="t">Pair</span>&lt;<span class="t">K</span>, <span class="t">V</span>&gt; p2)
    {
        <span class="k">return</span> p1.<span class="me">getKey</span>().<span class="me">equals</span>(p2.<span class="me">getKey</span>()) &amp;&amp; p1.<span class="me">getValue</span>().<span class="me">equals</span>(p2.<span class="me">getValue</span>());
    }
}</code></pre>
      <p>Almost always, the compiler figures out the type on its own from how you call it — this is <strong>type inference</strong> — so you can call <code class="inline">Util.sameEntry(p1, p2)</code> directly, without ever writing the type parameter yourself.</p>
      <h2>Bounded Type Parameters</h2>
      <p>Sometimes a generic type shouldn't accept <em>just anything</em> — a method built around numeric comparisons only makes sense for actual numbers. <code class="inline">extends</code> restricts a type parameter to a specific type (or subtype of it) — here meaning "any subtype of <code class="inline">Number</code>," which covers <code class="inline">Integer</code>, <code class="inline">Double</code>, and the rest:</p>
      <pre class="code"><code><span class="k">public static</span> &lt;<span class="t">T</span> <span class="k">extends</span> <span class="t">Number</span>&gt; <span class="k">double</span> <span class="me">clampedValue</span>(<span class="t">T</span> value, <span class="k">double</span> min, <span class="k">double</span> max)
{
    <span class="k">double</span> v = value.<span class="me">doubleValue</span>(); <span class="c">// legal — Number guarantees a doubleValue() method</span>
    <span class="k">if</span> (v &lt; min) <span class="k">return</span> min;
    <span class="k">if</span> (v &gt; max) <span class="k">return</span> max;
    <span class="k">return</span> v;
}</code></pre>
      <p>Without the <code class="inline">extends Number</code> bound, <code class="inline">value.doubleValue()</code> wouldn't compile at all — the compiler would only know <code class="inline">value</code> is <em>some</em> type, with no guarantee it has a <code class="inline">doubleValue()</code> method to call. The bound is what unlocks calling methods that only <code class="inline">Number</code> (and its subtypes) actually have.</p>
      <h2>Wildcards: A Quick Preview</h2>
      <p>The <code class="inline">?</code> wildcard represents an unknown type, mostly useful for parameters and fields where you want to accept "a <code class="inline">List</code> of anything" without pinning down exactly what. Wildcard variations (upper-bounded, lower-bounded) go beyond what this chapter covers — the short version to remember for now is: <code class="inline">?</code> is never used when <em>creating</em> a generic type (<code class="inline">new Box&lt;?&gt;()</code> isn't a thing) — only when referring to one you don't need to be specific about.</p>
    `,
    pitfalls: [
      "Forgetting the <code class=\"inline\">&lt;T&gt;</code> on the class declaration itself. <code class=\"inline\">public class Box { private T t; }</code> doesn't compile — <code class=\"inline\">T</code> has to be introduced with <code class=\"inline\">public class Box&lt;T&gt;</code> before it can be used anywhere inside the class.",
      "Using a primitive as a type argument. <code class=\"inline\">LoggedValue&lt;double&gt;</code> doesn't compile — type arguments must be reference types, so use the wrapper (<code class=\"inline\">LoggedValue&lt;Double&gt;</code>) instead, same rule as <code class=\"inline\">ArrayList</code> (Lesson 9.2).",
      "Calling a bound-specific method without the bound. <code class=\"inline\">value.doubleValue()</code> only compiles once <code class=\"inline\">T</code> is declared <code class=\"inline\">extends Number</code> — without the bound, the compiler only knows <code class=\"inline\">T</code> is <em>some</em> type, with no guaranteed methods beyond what every <code class=\"inline\">Object</code> has."
    ],
    takeaways: [
      "A generic class introduces type parameters in angle brackets after its name (<code class=\"inline\">class LoggedValue&lt;T&gt;</code>); the type variable then stands in for a real type anywhere in the class.",
      "Generic types replace the old cast-from-<code class=\"inline\">Object</code> pattern with compile-time type safety — a wrong type is now a compile error, not a runtime surprise.",
      "A generic method can introduce its own type parameter, scoped to just that method; the compiler usually infers the type automatically.",
      "<code class=\"inline\">&lt;T extends SomeType&gt;</code> restricts what a type parameter can be, and unlocks calling <code class=\"inline\">SomeType</code>'s own methods on values of that type.",
      "The <code class=\"inline\">?</code> wildcard represents an unknown type for referring to a generic type generically — it's never used when constructing one."
    ],
    prov: "other-reference-repo: oracle-java-tutorials/generics/01-05 (ORACLE 14.1-5) · Deck context: mechacoder-test/src/lessons/java-2.js, slide 2 (\"Writing Your Own Generics\")"
  }
};

let currentItem = "16";

function renderList(){
  const host = document.getElementById('itemlist');
  host.innerHTML = '';
  Object.keys(DATA).forEach(key => {
    const it = DATA[key];
    const el = document.createElement('div');
    el.className = 'item' + (key === currentItem ? ' on' : '');
    el.innerHTML = `<span class="iref">Ch.${key}</span><span class="ititle">${it.title}</span>`;
    el.addEventListener('click', () => { currentItem = key; renderList(); renderMain(); });
    host.appendChild(el);
  });
}

function renderMain(){
  const it = DATA[currentItem];
  const host = document.getElementById('maininner');
  host.innerHTML = `
    <div class="doc">
      <h1 class="doctitle">${it.title}</h1>
      <div class="refline">Outline ref: ${it.ref}</div>
      <div class="statusline">Status: new — authored lesson (fuller depth than the teaser slide)</div>
      ${it.body}
      <div class="pitfalls"><div class="lbl">Common Pitfalls</div><ul>${it.pitfalls.map(p => `<li>${p}</li>`).join('')}</ul></div>
      <div class="takeaways"><div class="lbl">Key Takeaways</div><ul>${it.takeaways.map(t => `<li>${t}</li>`).join('')}</ul></div>
      <div class="prov"><strong>Derived from</strong> ${it.prov}</div>
    </div>
  `;
  document.getElementById('main').scrollTop = 0;
}

renderList();
renderMain();
</script>
