const DATA = {
  "24": {
    title: "Optional: Avoiding Null Pointer Exceptions",
    ref: "24 — Optional: Avoiding Null Pointer Exceptions (ORACLE 16.1)",
    body: `
      <h2>The Null Problem</h2>
      <p>Returning <code class="inline">null</code> to mean "there's no value here" is one of the most common sources of bugs in any Java program — Tony Hoare, who introduced the null reference in 1965, later called it his "billion-dollar mistake." The trouble is that <code class="inline">null</code> is invisible in a method's signature: nothing about <code class="inline">Pose2d getVisionPose()</code> warns a caller that it might come back <code class="inline">null</code>, so it's easy to forget the check and get a <code class="inline">NullPointerException</code> (Ch.12/13) instead.</p>
      <p>The classic FRC case: a vision pose estimator can only report a robot position if a camera actually sees an AprilTag <em>this frame</em> — plenty of frames, it can't. Returning <code class="inline">null</code> on those frames leaves every caller responsible for remembering to check first.</p>
      <h2>Optional: Making "Might Be Absent" Part of the Type</h2>
      <p><code class="inline">java.util.Optional&lt;T&gt;</code> is a container that either holds a value, or is explicitly <strong>empty</strong> — and unlike <code class="inline">null</code>, that possibility is written directly into the method's return type:</p>
      <pre class="code"><code><span class="k">public</span> <span class="t">Optional</span>&lt;<span class="t">Pose2d</span>&gt; <span class="me">getPose</span>()
{
    <span class="k">if</span> (!hasTargetThisFrame())
    {
        <span class="k">return</span> <span class="t">Optional</span>.<span class="me">empty</span>();       <span class="c">// explicitly "no value" — not null</span>
    }
    <span class="k">return</span> <span class="t">Optional</span>.<span class="me">of</span>(currentPose);   <span class="c">// wraps a real, non-null value</span>
}</code></pre>
      <p>Just by reading <code class="inline">Optional&lt;Pose2d&gt; getPose()</code>'s signature, a caller already knows the pose might not be there this frame — the type itself documents it, instead of relying on a comment or tribal knowledge.</p>
      <h2>Creating an Optional</h2>
      <pre class="code"><code><span class="t">Optional</span>&lt;<span class="t">Pose2d</span>&gt; empty = <span class="t">Optional</span>.<span class="me">empty</span>();           <span class="c">// definitely no value</span>
<span class="t">Optional</span>&lt;<span class="t">Pose2d</span>&gt; present = <span class="t">Optional</span>.<span class="me">of</span>(currentPose);  <span class="c">// wraps a value — throws immediately if currentPose is null</span>
<span class="t">Optional</span>&lt;<span class="t">Pose2d</span>&gt; maybe = <span class="t">Optional</span>.<span class="me">ofNullable</span>(currentPose); <span class="c">// empty if currentPose is null, present otherwise</span></code></pre>
      <p><code class="inline">Optional.of(...)</code> is a deliberate safety check: if you accidentally pass it a <code class="inline">null</code>, it throws right away — better to fail loudly at the source than to silently wrap a <code class="inline">null</code> and have it surface as a confusing failure somewhere else later.</p>
      <h2>Handling Both Cases Honestly</h2>
      <pre class="code"><code><span class="t">Optional</span>&lt;<span class="t">Pose2d</span>&gt; visionPose = vision.<span class="me">getPose</span>();

<span class="c">// Run logic only when a value exists</span>
visionPose.<span class="me">ifPresent</span>(pose -&gt; estimator.<span class="me">addVisionMeasurement</span>(pose, timestamp));

<span class="c">// Or supply a fallback value for the empty case</span>
<span class="t">Pose2d</span> pose = visionPose.<span class="me">orElse</span>(lastKnownPose);

<span class="c">// Or throw a specific exception if a value was truly required</span>
<span class="t">Pose2d</span> requiredPose = visionPose.<span class="me">orElseThrow</span>(IllegalStateException::<span class="k">new</span>);</code></pre>
      <p><code class="inline">ifPresent</code> runs a lambda (Lesson 19.1) only if a value is actually there — nothing happens otherwise. <code class="inline">orElse</code> supplies a fallback value for the empty case. <code class="inline">orElseThrow</code> is for the rarer case where an empty <code class="inline">Optional</code> really does mean something has gone wrong, and continuing anyway wouldn't make sense.</p>
      <h2>The One Pitfall That Defeats the Whole Point</h2>
      <p><code class="inline">Optional</code> has an <code class="inline">isPresent()</code> check and a <code class="inline">get()</code> method that returns the wrapped value — but calling <code class="inline">get()</code> without checking <code class="inline">isPresent()</code> first throws <code class="inline">NoSuchElementException</code> on an empty <code class="inline">Optional</code>, which is exactly the same class of crash <code class="inline">Optional</code> exists to prevent, just under a different exception name:</p>
      <pre class="code"><code><span class="t">Pose2d</span> pose = visionPose.<span class="me">get</span>(); <span class="c">// never do this blind — this is a NullPointerException with extra steps</span></code></pre>
      <p>Even the safer <code class="inline">isPresent()</code> + <code class="inline">get()</code> pairing is discouraged — it's really just a nested-null-check in disguise. <code class="inline">ifPresent</code>, <code class="inline">orElse</code>, and <code class="inline">orElseThrow</code> all handle both cases directly, without ever needing to call bare <code class="inline">get()</code>.</p>
      <h2>Filtering and Transforming (a Brief Look)</h2>
      <p>Beyond the core methods above, <code class="inline">Optional</code> supports <code class="inline">filter</code> (keep the value only if it matches a condition, otherwise become empty) and <code class="inline">map</code> (transform the value, if present, into something else) — useful for chaining a couple of extra checks without falling back into nested <code class="inline">if</code> statements:</p>
      <pre class="code"><code>visionPose
    .<span class="me">filter</span>(pose -&gt; pose.<span class="me">getX</span>() &gt;= <span class="n">0</span>)         <span class="c">// only proceed if the pose has a valid X coordinate</span>
    .<span class="me">ifPresent</span>(pose -&gt; estimator.<span class="me">addVisionMeasurement</span>(pose, timestamp));</code></pre>
      <p>These compose well for simple cases; genuinely complex chains of <code class="inline">Optional</code> transformations are a more advanced topic than this curriculum covers in depth.</p>
    `,
    pitfalls: [
      "Calling <code class=\"inline\">.get()</code> without checking first. This throws on an empty <code class=\"inline\">Optional</code>, defeating the entire purpose of using one.",
      "Using <code class=\"inline\">Optional</code> for every field or parameter, out of habit. It's meant for genuinely optional results (especially return values) — not a blanket replacement for every reference type.",
      "Passing a <code class=\"inline\">null</code> to <code class=\"inline\">Optional.of(...)</code>. That throws immediately — use <code class=\"inline\">Optional.ofNullable(...)</code> instead when the value genuinely might be <code class=\"inline\">null</code>."
    ],
    takeaways: [
      "<code class=\"inline\">Optional&lt;T&gt;</code> makes \"this might not have a value\" visible directly in a method's return type, instead of relying on an invisible, easy-to-forget <code class=\"inline\">null</code> check.",
      "Create one with <code class=\"inline\">Optional.empty()</code>, <code class=\"inline\">Optional.of(value)</code> (throws if null), or <code class=\"inline\">Optional.ofNullable(value)</code> (safe either way).",
      "Handle both cases with <code class=\"inline\">ifPresent(...)</code>, <code class=\"inline\">orElse(fallback)</code>, or <code class=\"inline\">orElseThrow(...)</code> — never call bare <code class=\"inline\">.get()</code> without checking first.",
      "<code class=\"inline\">filter</code> and <code class=\"inline\">map</code> let you chain a couple of extra conditions/transformations without falling back into nested <code class=\"inline\">if</code> checks."
    ],
    prov: "other-reference-repo: oracle-java-tutorials/optional/java8-optional.md (ORACLE 16.1) · Deck context: mechacoder-test/src/lessons/java-2.js, slide 9b (\"Optional: Maybe a Value\") — vision pose estimator example"
  }
};
