    body: `
      <h2>Libraries and APIs</h2>
      <p>A <strong>library</strong> is a collection of code someone else already wrote, that you can reuse instead of writing it yourself. WPILib — the library every FRC robot depends on — is exactly this: motor control, sensors, the whole command-based framework, all written once and reused by thousands of teams.</p>
      <p>The <strong>API</strong> (Application Programming Interface) is the instructions for how to actually use a library: what classes it gives you, what each one can do, and what you need to pass in. You don't need to know how a library's code works internally — you just need its API.</p>
      <h2>Classes, Attributes, and Behaviors</h2>
      <p>A <strong>class</strong> is the building block a library gives you — it defines a new kind of value, the same way <code class="inline">int</code> or <code class="inline">double</code> do, except you (or a library author) define what it means. An <strong>object</strong> is one specific thing built from a class.</p>
      <p>Every class bundles two things together:</p>
      <ul>
        <li><strong>Attributes</strong> — the data it holds. Stored in variables.</li>
        <li><strong>Behaviors</strong> — what it can do. Defined as methods.</li>
      </ul>
      <pre class="code"><code><span class="t">TalonFX</span> shooterMotor = <span class="k">new</span> <span class="t">TalonFX</span>(<span class="n">5</span>); <span class="c">// shooterMotor is an object, built from the TalonFX class</span>

shooterMotor.<span class="me">set</span>(<span class="n">0.8</span>); <span class="c">// a behavior — call a method with the dot operator</span></code></pre>
      <p>The <code class="inline">.</code> (dot operator) is how you reach an object's behaviors and attributes. <code class="inline">shooterMotor.set(0.8)</code> means: find the <code class="inline">set</code> method defined in the <code class="inline">TalonFX</code> class, and run it on this specific motor object.</p>
      <h2>Why This Matters</h2>
      <p>You don't need to know how <code class="inline">TalonFX</code> is implemented internally — motor controller firmware, CAN bus protocol, none of it — to use <code class="inline">shooterMotor.set(0.8)</code> correctly. That's the entire point of a library: someone else solved the hard problem once, documented how to use their solution, and you build on top of it instead of starting from scratch.</p>
    `,

      "Forgetting the dot operator. <code class=\"inline\">shooterMotor set(0.8)</code> isn't valid — the dot is what connects an object to its behavior."
    ],
    takeaways: [
      "A library is reusable code written by someone else; its API documents how to use it.",
      "A class defines a new kind of value, bundling attributes (data) and behaviors (methods) together.",
      "An object is one specific instance built from a class.",
      "The dot operator (<code class=\"inline\">.</code>) accesses an object's attributes and behaviors."
    ],
    prov: "csawesome-2026: unit-1-using-objects-and-methods/1.07-apis-and-libraries.md (CSA 1.7)"
  },
  "3.2": {
    title: "Documentation with Comments and Preconditions",
    ref: "3.2 — Documentation with Comments and Preconditions (CSA 1.8)",

      <h2>Three Kinds of Comments</h2>
      <pre class="code"><code><span class="c">// single-line comment</span>
<span class="c">/* multi-line
   comment */</span>
<span class="c">/** a documentation comment — describes a class or method for other programmers */</span></code></pre>
      <p>The compiler ignores all three completely — they exist for whoever reads the code next, including future-you.</p>
      <h2>Preconditions and Postconditions</h2>
      <p>A <strong>precondition</strong> is what has to be true before a method is called for it to work correctly. A <strong>postcondition</strong> is what's guaranteed true after it runs.</p>
      <pre class="code"><code><span class="c">/**
 * @param targetRPM the speed to spin up to
 * Precondition: targetRPM is between 0 and the motor's max RPM.
 * Postcondition: the motor ramps toward targetRPM.
 */</span>
<span class="k">public void</span> <span class="me">spinUpTo</span>(<span class="k">double</span> targetRPM) { ... }</code></pre>
      <p>Java doesn't enforce preconditions automatically — nothing stops you from calling <code class="inline">spinUpTo(-500)</code>. A precondition is a documented expectation, not a guarantee the method checks it. <code class="inline">Math.sqrt(-4)</code> is a real example: nothing crashes, but the result is <code class="inline">NaN</code> ("not a number") because negative input violates <code class="inline">sqrt</code>'s precondition.</p>
      <h2>Why Bother Documenting This</h2>
      <p>Once you write a method, other people (including future-you, and your whole team) will call it without reading its implementation. Documenting preconditions and postconditions is how they know what's safe to pass in and what to expect back — without documentation, the only way to find out is to read the method's full source or guess.</p>
    `,
    pitfalls: [
      "Assuming a precondition is enforced. Documenting a precondition doesn't make Java check it — passing a bad value can still silently produce a wrong result (like <code class=\"inline\">NaN</code>) instead of an error.",
      "Skipping documentation on methods other people will call. The cost of a two-line comment is much smaller than the cost of a teammate guessing wrong about what a method expects."
    ],
    takeaways: [

      "A precondition is what must be true before a method is called; a postcondition is what's guaranteed true after it returns.",
      "Preconditions are documented expectations, not automatically enforced — violating one can produce a wrong result without an error."
    ],
    prov: "csawesome-2026: unit-1-using-objects-and-methods/1.08-documentation-with-comments-and-preconditions.md (CSA 1.8)"
  },

    body: `
      <h2>Packages Are Folders for Classes</h2>
      <p>A <strong>package</strong> groups related classes together — like a folder. <code class="inline">edu.wpi.first.wpilibj2.command</code> is a real WPILib package holding all the command-based framework's classes.</p>
      <h2>Importing a Class</h2>
      <p>To use a class from another package, <code class="inline">import</code> it at the top of your file:</p>
      <pre class="code"><code><span class="k">package</span> frc.robot.subsystems;

<span class="k">import</span> edu.wpi.first.wpilibj2.command.<span class="t">SubsystemBase</span>;
<span class="k">import</span> com.revrobotics.<span class="t">CANSparkMax</span>;

<span class="k">public class</span> <span class="t">Drivetrain</span> <span class="k">extends</span> <span class="t">SubsystemBase</span> { ... }</code></pre>
      <p>The <code class="inline">package</code> line at the top says where <em>this</em> file lives; each <code class="inline">import</code> brings in one class from somewhere else so you can use it by its short name (<code class="inline">SubsystemBase</code>) instead of its full path.</p>
      <h2>One Package Needs No Import</h2>
      <p><code class="inline">java.lang</code> is special — its classes (<code class="inline">String</code>, <code class="inline">System</code>, and a handful of others) are always available, in every Java file, with no <code class="inline">import</code> needed. That's why you've been able to use <code class="inline">System.out.println</code> and <code class="inline">String</code> this whole time without importing anything.</p>
    `,
    pitfalls: [
      "Forgetting an import. If a class isn't in <code class=\"inline\">java.lang</code> and isn't in your own package, using it without importing it is a compile error.",
      "Importing something you don't use. Not a functional bug, but most IDEs will flag it — it's just clutter."
    ],
    takeaways: [
      "A package groups related classes together, the way a folder groups related files.",
      "<code class=\"inline\">import</code> brings a class from another package into your file so you can use its short name.",
      "<code class=\"inline\">java.lang</code> (which includes <code class=\"inline\">String</code> and <code class=\"inline\">System</code>) never needs an import — it's always available."
    ],
    prov: "csawesome-2026: unit-1-using-objects-and-methods/1.07-apis-and-libraries.md (CSA 1.7 §1.7.2)"
  }
