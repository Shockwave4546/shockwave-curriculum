<script>
const DATA = {
  "26": {
    title: "Architecture Takeaways",
    ref: "26 — Architecture Takeaways (DRY/YAGNI/SOLID) (no citation — deck-original content)",
    body: `
      <p>Java II opened (Ch.14) with why patterns matter at all. This closing chapter names the general software-engineering principles that everything since — inheritance, interfaces, the IO-Layer Pattern, factories, builders, command-based itself — has actually been demonstrating in FRC-specific form. These aren't FRC-specific or Java-specific ideas; they're widely known across the software industry, which is exactly why they're worth naming explicitly.</p>
      <h2>DRY: Don't Repeat Yourself</h2>
      <p>If the same logic (or the same literal value) appears in more than one place, a future change has to remember to update every copy — and it's easy to miss one. The fix is almost always one of the tools this curriculum already covered: pull shared behavior into a common superclass (Ch.17), a shared utility method, or a single <code class="inline">Constants</code> class (Ch.25.7) instead of copy-pasting a magic number into five different files.</p>
      <pre class="code"><code><span class="c">// NOT DRY — the same speed value is hardcoded in three places</span>
intakeMotor.<span class="me">set</span>(<span class="n">0.8</span>);
indexerMotor.<span class="me">set</span>(<span class="n">0.8</span>);
feederMotor.<span class="me">set</span>(<span class="n">0.8</span>);

<span class="c">// DRY — one named constant, one place to change it</span>
intakeMotor.<span class="me">set</span>(IntakeConstants.kRollerSpeed);
indexerMotor.<span class="me">set</span>(IntakeConstants.kRollerSpeed);
feederMotor.<span class="me">set</span>(IntakeConstants.kRollerSpeed);</code></pre>
      <h2>YAGNI: You Ain't Gonna Need It</h2>
      <p>Don't build flexibility or abstraction for a requirement that doesn't exist yet — every layer of abstraction (a <code class="inline">Builder</code>, Ch.22; a generic type, Ch.16; an extra interface) has a real cost in complexity, and that cost is only worth paying once the actual need shows up. A <code class="inline">Builder</code> for a 2-parameter class, or a factory (Ch.21) that only ever returns one concrete implementation, is YAGNI in practice: solving a problem the code doesn't actually have yet, at the expense of a codebase that's harder to read today for a payoff that may never arrive.</p>
      <h2>SOLID: Five Principles, One Letter Each</h2>
      <p>SOLID isn't a single idea — it's an acronym for five distinct principles, each addressing a different way a class or module's design can go wrong. All five show up somewhere in this curriculum already, even though they weren't named until now:</p>
      <p><strong>S — Single Responsibility.</strong> A class should have one, and only one, reason to change. A <code class="inline">Subsystem</code> (Ch.20/25) that only manages one piece of hardware is a direct application of this.</p>
      <p><strong>O — Open/Closed.</strong> A module should be open for extension, but closed for modification. The IO-Layer Pattern (Ch.20) is a textbook example: adding a brand-new <code class="inline">IntakeIOSim</code> implementation never requires touching <code class="inline">Intake</code>'s own logic, since both honor the same <code class="inline">IntakeIO</code> contract.</p>
      <p><strong>L — Liskov Substitution.</strong> A subclass should be usable anywhere its superclass is expected, without breaking anything — exactly the is-a substitution test from Ch.17.1.</p>
      <p><strong>I — Interface Segregation.</strong> Don't force a class to implement methods it doesn't actually need, just because they're bundled into one large interface. Several small, focused interfaces beat one bloated one.</p>
      <p><strong>D — Dependency Inversion.</strong> Code should depend on abstractions (interfaces), not concrete implementations. Every constructor that accepts an <code class="inline">IntakeIO</code> instead of hardcoding <code class="inline">new IntakeIOSparkMax()</code> directly (Ch.20/21), and every static factory returning an interface type rather than a specific class (Ch.21), is dependency inversion in action.</p>
      <h2>Why Name These at All</h2>
      <p>None of DRY, YAGNI, or SOLID are FRC-specific or even Java-specific — they're widely-used vocabulary across the whole software industry, which is exactly the "common language" benefit Ch.14 opened with. Being able to say "this violates single responsibility" or "that's YAGNI" communicates a specific, well-understood critique in a few words, to any programmer familiar with these terms — not just people who've read this particular curriculum.</p>
    `,
    pitfalls: [
      "Applying DRY so aggressively that unrelated code gets forced together. Two pieces of code that look similar today, for unrelated reasons, don't necessarily belong in one shared abstraction.",
      "Treating YAGNI as an excuse to never plan ahead. It argues against building unneeded flexibility <em>now</em> — the IO-Layer Pattern (Ch.20) is worth its overhead precisely because simulation and hardware-swapping are real, common needs.",
      "Only remembering the \"S\" of SOLID. The deck's own shorthand (\"one class, one responsibility\") is genuinely just Single Responsibility — SOLID names four more distinct principles beyond that one."
    ],
    takeaways: [
      "DRY: don't duplicate logic or values — a single source of truth means one place to fix or change something.",
      "YAGNI: don't build abstraction or flexibility for a need that doesn't exist yet — every layer of indirection has a real cost, worth paying only once it's actually needed.",
      "SOLID is five separate principles — Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion — each already demonstrated somewhere in this curriculum's FRC examples.",
      "These principles are industry-standard vocabulary, not FRC- or Java-specific — naming them precisely is itself a form of the \"common language\" benefit patterns provide (Ch.14)."
    ],
    prov: "mechacoder-test: src/lessons/java-2.js, slide 13 (\"Architecture Takeaways\") — original deck content, expanded here since SOLID is a real five-principle acronym the original slide only partially named"
  }
};

let currentItem = "26";

function renderList(){
  const host = document.getElementById('itemlist');
  host.innerHTML = '';
  Object.keys(DATA).forEach(key => {
    const it = DATA[key];
    const el = document.createElement('div');
    el.className = 'item' + (key === currentItem ? ' on' : '');
    el.innerHTML = `<span class="iref">Ch.${key}</span><span class="ititle">${it.title}</span>`;
    el.addEventListener('click', () => { currentItem = key; renderList(); renderMain(); });
    host.appendChild(el);
  });
}

function renderMain(){
  const it = DATA[currentItem];
  const host = document.getElementById('maininner');
  host.innerHTML = `
    <div class="doc">
      <h1 class="doctitle">${it.title}</h1>
      <div class="refline">Outline ref: ${it.ref}</div>
      <div class="statusline">Status: new — authored lesson (fuller depth than the teaser slide)</div>
      ${it.body}
      <div class="pitfalls"><div class="lbl">Common Pitfalls</div><ul>${it.pitfalls.map(p => `<li>${p}</li>`).join('')}</ul></div>
      <div class="takeaways"><div class="lbl">Key Takeaways</div><ul>${it.takeaways.map(t => `<li>${t}</li>`).join('')}</ul></div>
      <div class="prov"><strong>Derived from</strong> ${it.prov}</div>
    </div>
  `;
  document.getElementById('main').scrollTop = 0;
}

renderList();
renderMain();
</script>
