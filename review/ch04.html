      <h2>What a Method Is</h2>
      <p>A <strong>method</strong> is a named block of code that runs when you call it. <code class="inline">System.out.println(...)</code> is a method call — you've been calling methods since Lesson 1.2 without needing to know how <code class="inline">println</code> is implemented internally. That's the whole benefit: you use a method by its name and what it does, not by reading its insides.</p>
      <h2>Signature, Parameters, Arguments</h2>
      <p>A method's <strong>signature</strong> is its name plus its parameter types — what you need to know to call it correctly. The return type is <em>not</em> part of the signature, so two methods in one class can't differ only in what they return.</p>
      <pre class="code"><code><span class="k">public</span> <span class="k">void</span> rampTo(<span class="k">double</span> targetSpeed) { ... }</code></pre>
      <p><code class="inline">targetSpeed</code> here is a <strong>parameter</strong> — a variable declared in the method's header, usable inside the method's body. When you actually call the method:</p>
      <pre class="code"><code>drivetrain.<span class="me">rampTo</span>(<span class="n">0.8</span>);</code></pre>
      <p><code class="inline">0.8</code> is the <strong>argument</strong> — the real value being passed in. "Parameter" and "argument" describe the same slot from two different sides: the parameter is the variable <em>in the method</em>; the argument is the value <em>at the call site</em>.</p>
      <h2>Call by Value</h2>
      <p>Java copies the argument's value into the parameter — <strong>call by value</strong>. If the method changes its own parameter internally, the original value the caller passed in is unaffected; only a copy went in. (When the argument is an object, what gets copied is the reference to it — Lesson 7.3 shows what that means.)</p>
      <h2>Overloading</h2>
      <p>Two methods can share the same name if their parameter lists differ in number or type — this is <strong>overloading</strong>. <code class="inline">System.out.println()</code> is a real example: there's a version for no arguments, one for a <code class="inline">String</code>, one for an <code class="inline">int</code>, and more — Java picks the right one based on what you pass in.</p>
      <pre class="code"><code><span class="k">void</span> println()          <span class="c">// no parameters</span>
<span class="k">void</span> println(<span class="t">String</span> x)  <span class="c">// takes a String</span>
<span class="k">void</span> println(<span class="k">int</span> x)     <span class="c">// takes an int</span></code></pre>

      <p>A method marked <code class="inline">static</code> belongs to the class itself, not to any object — called a <strong>class method</strong> or <strong>static method</strong>. <code class="inline">main</code> is static too: in this course it's always <code class="inline">public static void main(String[] args)</code>. Call a static method using the class name and the dot operator:</p>

      <pre class="code"><code><span class="k">public</span> <span class="k">static</span> <span class="k">int</span> square(<span class="k">int</span> number)
{

}</code></pre>

      <h2>Class as Blueprint, Object as Instance</h2>
      <p>A <strong>class</strong> is a blueprint; an <strong>object</strong> is one specific thing built from it — the way a cookie cutter (class) stamps out cookies (objects), all the same shape but each its own cookie. <code class="inline">DriveMotor</code> is a class; <code class="inline">leftMotor</code> and <code class="inline">rightMotor</code> are two separate objects built from it.</p>
      <p><code class="inline">DriveMotor</code> stands for your team's own motor class — assume it already exists in your robot project (you'll write classes like it yourself in Ch.7). Its constructor takes the PWM channel the motor is plugged into.</p>
      <pre class="code"><code><span class="t">DriveMotor</span> leftMotor;
<span class="t">DriveMotor</span> rightMotor;</code></pre>
      <p>A class also defines a new <em>type</em>, the same way <code class="inline">int</code> or <code class="inline">double</code> do — <code class="inline">DriveMotor leftMotor;</code> declares a variable exactly like <code class="inline">int score;</code> does, just holding a <code class="inline">DriveMotor</code> instead of a whole number.</p>
      <h2>Attributes and Behaviors, Revisited</h2>
      <p>Every object has:</p>
      <ul>
        <li><strong>Attributes</strong> — the data it holds (its PWM channel, its current throttle).</li>
        <li><strong>Behaviors</strong> — what it can do, defined as methods (<code class="inline">setThrottle()</code>, <code class="inline">getThrottle()</code>).</li>
      </ul>
      <p>The class defines <em>what</em> attributes and behaviors exist; each individual object has its <em>own</em> values for them. <code class="inline">leftMotor</code> and <code class="inline">rightMotor</code> are both <code class="inline">DriveMotor</code> objects, but each has its own PWM channel and its own current throttle.</p>
      <h2>Reference Variables</h2>
      <p>A variable like <code class="inline">leftMotor</code> doesn't hold the motor object directly — it holds a <strong>reference</strong> to it, like a tracking number pointing at where the real object lives in memory. This is different from a primitive variable (<code class="inline">int</code>, <code class="inline">double</code>), which holds its value directly with nothing in between.</p>
      <p>You can create as many objects from one class as you need:</p>
      <pre class="code"><code><span class="t">DriveMotor</span> leftMotor = <span class="k">new</span> <span class="t">DriveMotor</span>(<span class="n">1</span>);
<span class="t">DriveMotor</span> rightMotor = <span class="k">new</span> <span class="t">DriveMotor</span>(<span class="n">2</span>);
<span class="t">DriveMotor</span> intakeMotor = <span class="k">new</span> <span class="t">DriveMotor</span>(<span class="n">3</span>);</code></pre>
      <p>Three separate objects, one class.</p>
    `,

      <h2>Building an Object with new</h2>
      <p>A <strong>constructor</strong> initializes a new object's attributes when it's created. To build one, use <code class="inline">new</code> followed by the class name — that's actually a call to the constructor:</p>
      <pre class="code"><code><span class="t">DriveMotor</span> leftMotor = <span class="k">new</span> <span class="t">DriveMotor</span>(<span class="n">5</span>); <span class="c">// 5 is the PWM channel it's plugged into</span></code></pre>
      <p>(<code class="inline">DriveMotor</code> is the team's own motor class from Lesson 4.4 — assume it exists.)</p>
      <h2>Constructors Can Be Overloaded</h2>
      <p>A class can offer more than one constructor — different ways to set up an object, distinguished by their parameter lists. This is the same <strong>overloading</strong> concept from methods (Lesson 4.1), applied to constructors. WPILib's <code class="inline">Pose2d</code> class (a robot's position and heading on the field) has several:</p>
      <pre class="code"><code><span class="c">// no-argument constructor: defaults to (0, 0, facing 0°)</span>
<span class="t">Pose2d</span> start1 = <span class="k">new</span> <span class="t">Pose2d</span>();
<span class="c">// x, y, and heading, explicitly</span>
<span class="t">Pose2d</span> start2 = <span class="k">new</span> <span class="t">Pose2d</span>(<span class="n">1.0</span>, <span class="n">2.0</span>, <span class="k">new</span> <span class="t">Rotation2d</span>());</code></pre>
      <p><code class="inline">Pose2d</code> and <code class="inline">Rotation2d</code> are real WPILib classes, from the package <code class="inline">org.wpilib.math.geometry</code>; a pose's x and y are measured in meters.</p>
      <p>Argument order matters — mixing up which number means what (is it x-then-y, or y-then-x?) produces a real, silent bug: the code compiles fine, but the object ends up with the wrong values.</p>
      <h2>Object References and null</h2>
      <p>A reference variable can be declared without pointing at any object yet — that's <code class="inline">null</code>, meaning "doesn't refer to anything."</p>
      <pre class="code"><code><span class="t">DriveMotor</span> intakeMotor = <span class="k">null</span>; <span class="c">// no object yet</span>
intakeMotor = <span class="k">new</span> <span class="t">DriveMotor</span>(<span class="n">7</span>); <span class="c">// now it does</span></code></pre>
      <p>Calling a method on a <code class="inline">null</code> reference — one that still holds <code class="inline">null</code> because no object was ever assigned to it — throws a <code class="inline">NullPointerException</code> at runtime (more on this in the next lesson).</p>
      <h2>Constructor Signatures</h2>
      <p>Just like methods, a constructor has a signature: its name (always the same as the class) plus its parameter types. Look up a library class's constructors in its documentation (its API page's Constructor Summary — Lesson 3.2) to see what arguments it expects and in what order.</p>
      <pre class="code"><code><span class="k">public</span> <span class="k">class</span> <span class="t">Pose2d</span> {
    <span class="k">public</span> <span class="t">Pose2d</span>() { <span class="c">/* not shown */</span> }
    <span class="k">public</span> <span class="t">Pose2d</span>(<span class="k">double</span> x, <span class="k">double</span> y, <span class="t">Rotation2d</span> rotation) { <span class="c">/* not shown */</span> }
}</code></pre>
    `,
    pitfalls: [

      "Calling a method on a <code class=\"inline\">null</code> reference throws a <code class=\"inline\">NullPointerException</code>.",

      <h2>Instance Methods vs. Static Methods</h2>
      <p>Lesson 4.2 covered static (class) methods, called via the class name. An <strong>instance method</strong> is the opposite: it's always called on a specific object, and it reads or changes <em>that object's</em> attributes.</p>
      <pre class="code"><code><span class="c">// instance method — acts on leftMotor specifically, not DriveMotor in general</span>
leftMotor.<span class="me">setThrottle</span>(<span class="n">0.5</span>);</code></pre>
      <p><code class="inline">Math.sqrt(9)</code> doesn't care which object called it (there is no object) — it's pure computation. <code class="inline">leftMotor.setThrottle(0.5)</code> only makes sense applied to one specific motor. (<code class="inline">leftMotor</code> is a <code class="inline">DriveMotor</code>, the team's own motor class from Lesson 4.4.)</p>
      <h2>NullPointerException</h2>
      <p>Calling a method on a reference that holds <code class="inline">null</code> — set to <code class="inline">null</code> and never assigned a real object with <code class="inline">new</code> — throws a <code class="inline">NullPointerException</code> at runtime. This is one of the most common real bugs in object-oriented code:</p>
      <pre class="code"><code><span class="t">DriveMotor</span> intakeMotor = <span class="k">null</span>;
intakeMotor.<span class="me">setThrottle</span>(<span class="n">0.5</span>); <span class="c">// crashes: intakeMotor doesn't refer to a real object</span></code></pre>
      <h2>Methods With Arguments</h2>
      <p>Just like the constructors from the last lesson, instance methods can take arguments:</p>
      <pre class="code"><code>leftMotor.<span class="me">setThrottle</span>(<span class="n">0.5</span>);    <span class="c">// 0.5 is the argument: half throttle forward</span>

      <h2>Getters (Accessors)</h2>
      <p>A method that just reports one of an object's attributes — no side effects, just returns a value — is a <strong>getter</strong> (formally, an accessor). By convention its name starts with <code class="inline">get</code>, and its return value should actually be used. <code class="inline">getThrottle()</code> reports the last throttle this motor was told to run at:</p>
      <pre class="code"><code><span class="k">double</span> throttle = leftMotor.<span class="me">getThrottle</span>(); <span class="c">// a getter — use the returned value</span>
System.out.<span class="me">println</span>(<span class="s">"Current throttle: "</span> + leftMotor.<span class="me">getThrottle</span>());</code></pre>
