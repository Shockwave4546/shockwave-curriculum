      <h2>What a Method Is</h2>
      <p>A <strong>method</strong> is a named block of code that runs when you call it. <code class="inline">System.out.println(...)</code> is a method call — you've been calling methods since Lesson 1.2 without needing to know how <code class="inline">println</code> is implemented internally. That's the whole benefit: you use a method by its name and what it does, not by reading its insides.</p>
      <h2>Signature, Parameters, Arguments</h2>
      <p>A method's <strong>signature</strong> is its name plus its parameter types — what you need to know to call it correctly.</p>
      <pre class="code"><code><span class="k">public void</span> <span class="me">rampTo</span>(<span class="k">double</span> targetSpeed) { ... }</code></pre>
      <p><code class="inline">targetSpeed</code> here is a <strong>parameter</strong> — a variable declared in the method's header, usable inside the method's body. When you actually call the method:</p>
      <pre class="code"><code>drivetrain.<span class="me">rampTo</span>(<span class="n">0.8</span>);</code></pre>
      <p><code class="inline">0.8</code> is the <strong>argument</strong> — the real value being passed in. "Parameter" and "argument" describe the same slot from two different sides: the parameter is the variable <em>in the method</em>; the argument is the value <em>at the call site</em>.</p>
      <h2>Call by Value</h2>
      <p>Java copies the argument's value into the parameter — <strong>call by value</strong>. If the method changes its own parameter internally, the original value the caller passed in is unaffected; only a copy went in.</p>
      <h2>Overloading</h2>
      <p>Two methods can share the same name if their parameter lists differ in number or type — this is <strong>overloading</strong>. <code class="inline">System.out.println()</code> is a real example: there's a version for no arguments, one for a <code class="inline">String</code>, one for an <code class="inline">int</code>, and more — Java picks the right one based on what you pass in.</p>
      <pre class="code"><code><span class="k">void</span> println()          <span class="c">// no parameters</span>
<span class="k">void</span> println(<span class="t">String</span> x)  <span class="c">// takes a String</span>
<span class="k">void</span> println(<span class="k">int</span> x)     <span class="c">// takes an int</span></code></pre>

      <h2>Constructors Can Be Overloaded</h2>
      <p>A class can offer more than one constructor — different ways to set up an object, distinguished by their parameter lists. This is the same <strong>overloading</strong> concept from methods (Lesson 4.1), applied to constructors:</p>
      <pre class="code"><code><span class="t">Pose2d</span> start1 = <span class="k">new</span> <span class="t">Pose2d</span>();                       <span class="c">// no-argument constructor: defaults to (0, 0, facing 0°)</span>
<span class="t">Pose2d</span> start2 = <span class="k">new</span> <span class="t">Pose2d</span>(<span class="n">1.0</span>, <span class="n">2.0</span>, <span class="k">new</span> <span class="t">Rotation2d</span>()); <span class="c">// x, y, and heading, explicitly</span></code></pre>
      <p>Argument order matters — mixing up which number means what (is it x-then-y, or y-then-x?) produces a real, silent bug: the code compiles fine, but the object ends up with the wrong values.</p>
      <h2>Object References and null</h2>
      <p>A reference variable can be declared without pointing at any object yet — that's <code class="inline">null</code>, meaning "doesn't refer to anything."</p>
      <pre class="code"><code><span class="t">TalonFX</span> intakeMotor = <span class="k">null</span>; <span class="c">// no object yet</span>
intakeMotor = <span class="k">new</span> <span class="t">TalonFX</span>(<span class="n">7</span>); <span class="c">// now it does</span></code></pre>
      <p>Calling a method on a <code class="inline">null</code> reference — one that was declared but never actually constructed — throws a <code class="inline">NullPointerException</code> at runtime (more on this in the next lesson).</p>
      <h2>Constructor Signatures</h2>
      <p>Just like methods, a constructor has a signature: its name (always the same as the class) plus its parameter types. Look up a library class's constructors in its documentation to see what arguments it expects and in what order.</p>
      <pre class="code"><code><span class="k">public class</span> <span class="t">Pose2d</span> {
    <span class="k">public</span> <span class="t">Pose2d</span>() { <span class="c">/* implementation not shown */</span> }
    <span class="k">public</span> <span class="t">Pose2d</span>(<span class="k">double</span> x, <span class="k">double</span> y, <span class="t">Rotation2d</span> rotation) { <span class="c">/* implementation not shown */</span> }
}</code></pre>
    `,
    pitfalls: [
      "Forgetting <code class=\"inline\">new</code>. <code class=\"inline\">TalonFX leftMotor = TalonFX(5);</code> doesn't compile — creating an object always requires <code class=\"inline\">new</code>.",
      "Mixing up argument order. A constructor taking <code class=\"inline\">(x, y, rotation)</code> called as <code class=\"inline\">(rotation, x, y)</code> either won't compile (wrong types) or, worse, compiles with the wrong values silently swapped.",
      "Calling a method on an unconstructed reference. Declaring <code class=\"inline\">TalonFX m;</code> without ever assigning <code class=\"inline\">new TalonFX(...)</code> to it leaves <code class=\"inline\">m</code> as <code class=\"inline\">null</code> — calling <code class=\"inline\">m.set(0.5)</code> crashes with a <code class=\"inline\">NullPointerException</code>."
    ],
    takeaways: [
      "<code class=\"inline\">new ClassName(arguments)</code> calls a constructor to build and initialize an object.",
      "A class can have multiple overloaded constructors, differing in their parameter lists.",
      "A reference variable can be <code class=\"inline\">null</code> — pointing at no object at all — until it's assigned a real one with <code class=\"inline\">new</code>.",
      "Calling a method on a <code class=\"inline\">null</code> reference throws a <code class=\"inline\">NullPointerException</code>.",
      "Constructor argument order must match the constructor's signature exactly."
    ],
    prov: "csawesome-2026: unit-1-using-objects-and-methods/1.13-creating-and-initializing-objects-constructors.md (CSA 1.13)"
  },
  "4.6": {
    title: "Calling Instance Methods",
    ref: "4.6 — Calling Instance Methods (CSA 1.14)",
    body: `
      <h2>Instance Methods vs. Static Methods</h2>
      <p>Lesson 4.2 covered static (class) methods, called via the class name. An <strong>instance method</strong> is the opposite: it's always called on a specific object, and it reads or changes <em>that object's</em> attributes.</p>
      <pre class="code"><code>leftMotor.<span class="me">set</span>(<span class="n">0.5</span>); <span class="c">// instance method — acts on leftMotor specifically, not TalonFX in general</span></code></pre>
      <p><code class="inline">Math.sqrt(9)</code> doesn't care which object called it (there is no object) — it's pure computation. <code class="inline">leftMotor.set(0.5)</code> only makes sense applied to one specific motor.</p>
      <h2>NullPointerException</h2>
      <p>Calling a method on a reference that's <code class="inline">null</code> — declared but never actually built with <code class="inline">new</code> — throws a <code class="inline">NullPointerException</code> at runtime. This is one of the most common real bugs in object-oriented code:</p>
      <pre class="code"><code><span class="t">TalonFX</span> intakeMotor = <span class="k">null</span>;
intakeMotor.<span class="me">set</span>(<span class="n">0.5</span>); <span class="c">// crashes: intakeMotor doesn't refer to a real object yet</span></code></pre>
      <h2>Methods With Arguments</h2>
      <p>Just like the constructors from the last lesson, instance methods can take arguments:</p>
      <pre class="code"><code>leftMotor.<span class="me">set</span>(<span class="n">0.5</span>);          <span class="c">// no extra behavior beyond the speed itself</span>
elevator.<span class="me">moveToPosition</span>(<span class="n">24.0</span>); <span class="c">// 24.0 is the argument, saved into the method's parameter</span></code></pre>
      <h2>Getters (Accessors)</h2>
      <p>A method that just reports one of an object's attributes — no side effects, just returns a value — is a <strong>getter</strong> (formally, an accessor). By convention its name starts with <code class="inline">get</code>, and its return value must actually be used:</p>
      <pre class="code"><code><span class="k">double</span> speed = leftMotor.<span class="me">getVelocity</span>(); <span class="c">// a getter — must use the returned value</span>
System.out.<span class="me">println</span>(<span class="s">"Current speed: "</span> + leftMotor.<span class="me">getVelocity</span>());</code></pre>
    `,
    pitfalls: [
      "Calling an instance method without an object. <code class=\"inline\">TalonFX.set(0.5)</code> doesn't make sense — <code class=\"inline\">set</code> needs a specific motor to act on; only <code class=\"inline\">leftMotor.set(0.5)</code> does.",
      "Calling a method on a <code class=\"inline\">null</code> reference. The single most common source of <code class=\"inline\">NullPointerException</code> — make sure every object is actually constructed with <code class=\"inline\">new</code> before calling anything on it.",
      "Ignoring a getter's return value. <code class=\"inline\">leftMotor.getVelocity();</code> alone does nothing useful — a getter exists specifically to report a value you then use."
    ],
    takeaways: [
      "An instance method is called on a specific object and can read/change that object's own attributes; a static method belongs to the class itself.",
      "Calling a method on a <code class=\"inline\">null</code> reference throws a <code class=\"inline\">NullPointerException</code> — one of the most common real bugs.",
      "A getter (accessor) reports one of an object's attributes; its return value must be used, not ignored."
    ],
    prov: "csawesome-2026: unit-1-using-objects-and-methods/1.14-calling-instance-methods.md (CSA 1.14)"
  }
};

let currentItem = "4.1";

function renderList(){
  const host = document.getElementById('itemlist');
  host.innerHTML = '';
  Object.keys(DATA).forEach(key => {
    const it = DATA[key];
    const el = document.createElement('div');
    el.className = 'item' + (key === currentItem ? ' on' : '');
    el.innerHTML = `<span class="iref">${key}</span><span class="ititle">${it.title}</span>`;
    el.addEventListener('click', () => { currentItem = key; renderList(); renderMain(); });
    host.appendChild(el);
  });
}

function renderMain(){
  const it = DATA[currentItem];
  const host = document.getElementById('maininner');
  host.innerHTML = `
    <div class="doc">
      <h1 class="doctitle">${it.title}</h1>
      <div class="refline">Outline ref: ${it.ref}</div>
      <div class="statusline">Status: new — authored lesson (fuller depth than the teaser slide)</div>
      ${it.body}
      <div class="pitfalls"><div class="lbl">Common Pitfalls</div><ul>${it.pitfalls.map(p => `<li>${p}</li>`).join('')}</ul></div>

      <div class="prov"><strong>Derived from</strong> ${it.prov}</div>
    </div>
  `;
  document.getElementById('main').scrollTop = 0;
}

renderList();
renderMain();
