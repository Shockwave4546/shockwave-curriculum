<script>
const DATA = {
  "11": {
    title: "Enums: Named Choices",
    ref: "11 — Enums: Named Choices (ORACLE 10.1)",
    body: `
      <h2>Why Enums Exist</h2>
      <p>An <strong>enum</strong> ("enumerated type") is a type with a fixed, predefined set of named values — a variable of that type can only ever be one of those values, nothing else. Before enums, code often used plain integers or strings to represent a fixed set of states (<code class="inline">int armState = 2;</code>), which lets any number in — including ones that mean nothing. An enum makes invalid states impossible to even compile:</p>
      <pre class="code"><code><span class="k">public enum</span> <span class="t">ArmPosition</span>
{
    STOWED, INTAKE, SCORE
}

<span class="t">ArmPosition</span> target = <span class="t">ArmPosition</span>.INTAKE; <span class="c">// legal</span>
<span class="t">ArmPosition</span> target = <span class="t">ArmPosition</span>.CLIMB;  <span class="c">// compile error — CLIMB was never defined</span></code></pre>
      <p>By convention, enum constants are written in <code class="inline">SCREAMING_SNAKE_CASE</code>, the same naming style used for other constants (Lesson 1.2).</p>
      <h2>Switching Over an Enum</h2>
      <p>A <code class="inline">switch</code> over an enum reads close to plain English, and (with modern arrow-style <code class="inline">case</code>) needs no <code class="inline">break</code>:</p>
      <pre class="code"><code><span class="k">switch</span> (target)
{
    <span class="k">case</span> STOWED -&gt; arm.<span class="me">setAngle</span>(<span class="n">0</span>);
    <span class="k">case</span> INTAKE -&gt; arm.<span class="me">setAngle</span>(<span class="n">35</span>);
    <span class="k">case</span> SCORE  -&gt; arm.<span class="me">setAngle</span>(<span class="n">110</span>);
}</code></pre>
      <p>Notice the case labels are just <code class="inline">STOWED</code>, not <code class="inline">ArmPosition.STOWED</code> — inside a switch over an enum, Java already knows the type, so the prefix would be redundant (and doesn't compile).</p>
      <h2>An Enum Is Really a Class</h2>
      <p>An enum isn't just a fancier set of named integers — it's a full class. Its body can declare fields, a constructor, and methods, letting each constant carry its own data:</p>
      <pre class="code"><code><span class="k">public enum</span> <span class="t">ArmPosition</span>
{
    STOWED(<span class="n">0</span>), INTAKE(<span class="n">35</span>), SCORE(<span class="n">110</span>); <span class="c">// constants, WITH constructor arguments</span>

    <span class="k">private final double</span> angleDegrees;

    <span class="me">ArmPosition</span>(<span class="k">double</span> angleDegrees)
    {
        <span class="k">this</span>.angleDegrees = angleDegrees;
    }

    <span class="k">public double</span> <span class="me">getAngleDegrees</span>()
    {
        <span class="k">return</span> angleDegrees;
    }
}</code></pre>
      <p>Two rules this pattern depends on: the list of constants must come <strong>first</strong> in the enum body, and once there are fields or methods after it, that constant list must end with a semicolon. Each constant listed (<code class="inline">STOWED(0)</code>, <code class="inline">INTAKE(35)</code>, <code class="inline">SCORE(110)</code>) calls the constructor with its own arguments — an enum's constructor is implicitly <code class="inline">private</code>, since you're never allowed to write <code class="inline">new ArmPosition(...)</code> yourself; the only <code class="inline">ArmPosition</code> objects that will ever exist are the ones listed in the enum body.</p>
      <p>With this version, the earlier switch could be simplified — every position now carries its own target angle:</p>
      <pre class="code"><code>arm.<span class="me">setAngle</span>(target.<span class="me">getAngleDegrees</span>());</code></pre>
      <h2>Iterating Every Value: values()</h2>
      <p>Every enum automatically gets a static <code class="inline">values()</code> method, returning an array of all its constants in declared order — handy for looping over every possibility:</p>
      <pre class="code"><code><span class="k">for</span> (<span class="t">ArmPosition</span> position : <span class="t">ArmPosition</span>.values())
{
    System.out.<span class="me">println</span>(position + <span class="s">" -> "</span> + position.<span class="me">getAngleDegrees</span>() + <span class="s">" degrees"</span>);
}</code></pre>
      <h2>What Enums Can't Do</h2>
      <p>Every enum implicitly extends <code class="inline">java.lang.Enum</code> behind the scenes. Since Java only allows extending one parent class, an enum can never <code class="inline">extends</code> anything else of its own — though it can still <code class="inline">implement</code> interfaces.</p>
      <h2>Looking Ahead</h2>
      <p>This chapter's ideas — a fixed set of named states, plus a <code class="inline">switch</code> that reacts to whichever one is currently active — are exactly the foundation the <strong>State Machine</strong> pattern (Java II) builds on, where a subsystem tracks "which named state am I in right now" and transitions between them over time.</p>
    `,
    pitfalls: [
      "Writing the enum type prefix inside a <code class=\"inline\">switch</code>. <code class=\"inline\">case ArmPosition.INTAKE -&gt;</code> doesn't compile inside a switch over an <code class=\"inline\">ArmPosition</code> — just <code class=\"inline\">case INTAKE -&gt;</code>.",
      "Forgetting the semicolon after the constant list once fields/methods follow. <code class=\"inline\">STOWED(0), INTAKE(35), SCORE(110)</code> with no trailing <code class=\"inline\">;</code> before <code class=\"inline\">private final double angleDegrees;</code> fails to compile.",
      "Trying to <code class=\"inline\">new</code> an enum constant. <code class=\"inline\">new ArmPosition(...)</code> is illegal — the only instances that will ever exist are the constants declared in the enum body itself."
    ],
    takeaways: [
      "An enum defines a fixed, named set of legal values for a type — the compiler rejects anything not in that list.",
      "Enum constant names use <code class=\"inline\">SCREAMING_SNAKE_CASE</code>; a <code class=\"inline\">switch</code> over an enum omits the type prefix on each <code class=\"inline\">case</code>.",
      "An enum is a real class — it can have its own fields, a constructor, and methods, letting each constant carry its own data.",
      "<code class=\"inline\">EnumType.values()</code> returns every constant, in order, for looping.",
      "An enum implicitly extends <code class=\"inline\">java.lang.Enum</code>, so it can't extend any other class (interfaces are still fine)."
    ],
    prov: "other-reference-repo: oracle-java-tutorials/enums/enum-types.md (ORACLE 10.1) · Deck context: mechacoder-test/src/lessons/java-1.js, slide 9 (\"Enums: Named Choices\")"
  }
};

    host.appendChild(el);
  });
}

    </div>
  `;
  document.getElementById('main').scrollTop = 0;
}
