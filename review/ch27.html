    title: "Abstraction and Program Design",
    ref: "27.1 — Abstraction and Program Design (CSA 3.1)",
    body: `
      <div class="optbadge">⚠ Optional</div>
      <p>This chapter sits conceptually between Java I and Java II — it's the general, from-scratch program-design thinking that applies to any object-oriented code, not just FRC robot code. It's informational, not a required gateway, since real FRC teams build on top of WPILib's already-imposed architecture (command-based, Ch.25) regardless.</p>
      <h2>Designing Before Writing: Object-Oriented Design</h2>
      <p>Before writing a single class, it helps to first decide <em>which</em> classes a program actually needs, and what data/behavior each one owns. A reliable trick: read the problem description and look for the <strong>nouns</strong> — they're usually your classes. Given "the robot has a drivetrain, an intake that picks up game pieces, and a shooter that scores them," the nouns <code class="inline">drivetrain</code>, <code class="inline">intake</code>, and <code class="inline">shooter</code> are exactly the <code class="inline">Subsystem</code> subclasses (Ch.17/20) a real codebase would end up with.</p>
      <h2>UML Class Diagrams</h2>
      <p>A <strong>UML class diagram</strong> is a simple box-based sketch of a class — its attributes (instance variables) and methods, with <code class="inline">-</code> marking private members and <code class="inline">+</code> marking public ones. These diagrams don't need to be formal; a whiteboard sketch before writing code is often enough to catch a design problem before it's baked into actual Java.</p>
      <h2>Data Abstraction: Naming Data Without Its Details</h2>
      <p><strong>Data abstraction</strong> separates a data type's abstract properties from the concrete details of how it's represented — you can use an <code class="inline">Intake</code> object without knowing exactly how its internal state is stored. Ch.7 already introduced the specific vocabulary this curriculum uses for this: <strong>instance variables</strong> (unique per object) and <strong>class/static variables</strong> (shared across every instance).</p>
      <h2>Procedural Abstraction: Naming a Process Without Its Details</h2>
      <p><strong>Procedural abstraction</strong> gives a process a name, letting it be used by knowing <em>what</em> it does without needing to know <em>how</em> — calling <code class="inline">intake.retract()</code> doesn't require knowing exactly how the retraction is implemented underneath. This is exactly the value of a well-named method (Ch.4/7): three real benefits fall out of it:</p>
      <ul>
        <li><strong>Organization</strong> — breaking a large behavior into smaller, named methods keeps any one piece of code manageable.</li>
        <li><strong>Reuse</strong> — a method written once can be called from many places, instead of duplicating the same logic (Ch.26's DRY, in disguise).</li>
        <li><strong>Maintainability</strong> — smaller, well-named methods are far easier to read, debug, and reason about.</li>
      </ul>
      <p>Procedural abstraction also means a method's <em>internal</em> implementation can change freely without breaking any code that calls it, as long as the method's signature and observable behavior stay the same. Adding parameters extends this further, letting one method generalize across a whole range of inputs instead of needing a near-duplicate method for each case.</p>
      <h2>Applying This to an FRC Robot</h2>
      <p>Before writing <code class="inline">Robot.java</code>, sketching out "what are the nouns" for an actual robot — <code class="inline">Drivetrain</code>, <code class="inline">Intake</code>, <code class="inline">Shooter</code>, <code class="inline">Climber</code> — and roughly what data/behavior each needs, is exactly the kind of upfront design this lesson describes. It's the same thinking that led to the <code class="inline">Subsystem</code> abstraction in Ch.17 and Ch.20 in the first place.</p>
    `,
    pitfalls: [
      "Skipping design entirely and writing code directly. Even a rough five-minute sketch catches structural mistakes far more cheaply than discovering them later.",
      "Confusing data abstraction with encapsulation. They're related but distinct: data abstraction is about naming data without exposing its representation; encapsulation (Ch.7/23) is the mechanism that enforces it.",
      "Assuming procedural abstraction only matters for long methods. Even a short method benefits from a name that documents intent."
    ],
    takeaways: [
      "Object-oriented design starts by identifying the nouns in a problem description — they're usually the classes a program needs.",
      "A UML class diagram is a simple, informal way to sketch a class's attributes and methods before writing real code.",
      "Data abstraction separates what data represents from how it's stored; procedural abstraction separates what a method does from how it's implemented.",
      "Procedural abstraction's real payoff: organization, code reuse, and the freedom to change a method's internals without breaking its callers."
    ],
    prov: "csawesome-2026: unit-3-class-creation/3.01-abstraction-and-program-design.md (CSA 3.1)"
  },
  "27.2": {
    title: "Impact of Program Design",
    ref: "27.2 — Impact of Program Design (CSA 3.2)",
    body: `
      <div class="optbadge">⚠ Optional</div>
      <p>Like 27.1, this is general software-engineering context rather than FRC-specific mechanics.</p>
      <h2>System Reliability</h2>
      <p><strong>System reliability</strong> means a program performs its intended task correctly, under stated conditions, without failure. On a competition robot, reliability isn't abstract — code that only works "most of the time" is code that costs matches. Testing under a real range of conditions (a dead battery, a jammed mechanism, a sensor that's disconnected) is what catches failures before they happen on the field rather than during a match.</p>
      <h2>Code Has Real Consequences</h2>
      <p>Software increasingly has direct impacts on people, not just abstract "users" — and the effects of a program can be beneficial, harmful, or both, sometimes in ways its authors never intended. An FRC robot is a literal example of code controlling a real physical machine: a bug in motor-output code isn't just a wrong number on a screen, it's a real mechanism moving in an unexpected or unsafe way. This is exactly why WPILib's safety defaults exist (motors disabled unless explicitly commanded, a watchdog that stops the robot if code stops responding) — real design decisions made because the code's failures have real physical consequences.</p>
      <h2>Legal and Licensing Considerations</h2>
      <p>Reusing other people's code is extremely common — this entire curriculum's provenance system (every lesson's "Derived from" line) exists because <em>properly attributing what you build on</em> matters, whether that's an open-source library, WPILib itself, or another team's published code. <strong>Open source</strong> code is free to use (often under specific license terms worth actually reading); code that isn't published as open source generally requires explicit permission — sometimes payment — before it can be legally incorporated into another program. This matters directly in FRC: vendor libraries each carry their own license terms, and most FRC teams' own robot code is itself published openly for other teams to learn from — the culture this very curriculum is a part of.</p>
      <h2>Ethical Questions in AI and Automation</h2>
      <p>As software takes on more autonomous decision-making — self-driving cars being the most commonly cited example — genuinely hard ethical questions arise: who's responsible when an autonomous system has to make a split-second decision with real consequences? These aren't questions with a clean technical answer, but they're worth being aware of as automation (including AI-assisted coding itself) becomes a bigger part of how software gets built.</p>
    `,
    pitfalls: [
      "Treating \"it compiled\" as equivalent to \"it's reliable.\" Reliability requires actually testing behavior under realistic (and edge-case) conditions.",
      "Reusing code without checking its license or attribution requirements. Even easily-copied code may carry real legal obligations.",
      "Assuming design choices are ethically neutral. A default behavior, a permission granted too broadly, or an untested edge case can carry real consequences."
    ],
    takeaways: [
      "System reliability means performing correctly under real, tested conditions — not just \"it worked once.\"",
      "Software's real-world impact can be beneficial or harmful, often beyond its original intended use — especially concrete for FRC, where code directly controls physical hardware.",
      "Reusing code carries real legal/licensing obligations — open-source code is free to use (under its license terms), other code generally requires explicit permission.",
      "Increasingly autonomous software (AI included) raises genuine ethical questions worth being aware of, even without a clean technical answer."
    ],
    prov: "csawesome-2026: unit-3-class-creation/3.02-impact-of-program-design.md (CSA 3.2)"
