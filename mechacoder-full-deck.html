    `<span class="tag">// 04 · control.open_loop()</span>
    <h2><span class="y">Open-Loop</span> Control</h2>
    <p class="lead">Manual power control using percent output or voltage.</p>
    <div class="code">
<span class="cl"><span class="c">// Request -1.0 to 1.0 duty cycle</span></span>
<span class="cl"><span class="k">var</span> request = <span class="k">new</span> <span class="t">DutyCycleOut</span>(<span class="n">0.5</span>);</span>
<span class="cl">motor.<span class="me">setControl</span>(request);</span>
<span class="cl"></span>
<span class="cl"><span class="c">// Or request specific voltage (compensated)</span></span>
<span class="cl"><span class="k">var</span> vRequest = <span class="k">new</span> <span class="t">VoltageOut</span>(<span class="n">10.0</span>);</span>
<span class="cl">motor.<span class="me">setControl</span>(vRequest);</span>
    </div>
    <ul class="bullets" style="margin-top:20px">
      <li><span class="bul">▸</span><span>Phoenix 6 uses <span class="b">ControlRequest</span> objects.</span></li>
      <li><span class="bul">▸</span><span><span class="y">DutyCycleOut</span>: Simple percent output.</span></li>
      <li><span class="bul">▸</span><span><span class="g">VoltageOut</span>: Ignores battery sag for consistency.</span></li>
    </ul>`,

    // 6. Closed-loop control
    `<span class="tag">// 05 · control.closed_loop()</span>
    <h2><span class="y">Closed-Loop</span> Control</h2>
    <div class="two">
      <div class="code">
<span class="cl"><span class="t">Slot0Configs</span> pid = cfg.<span class="t">Slot0</span>;</span>
<span class="cl">pid.<span class="t">kP</span> = <span class="n">0.12</span>; pid.<span class="t">kI</span> = <span class="n">0.0</span>; pid.<span class="t">kD</span> = <span class="n">0.01</span>;</span>
<span class="cl"></span>
<span class="cl"><span class="c">// Position control (rotations)</span></span>
<span class="cl">motor.<span class="me">setControl</span>(<span class="k">new</span> <span class="t">PositionVoltage</span>(<span class="n">10.0</span>));</span>
<span class="cl"></span>
<span class="cl"><span class="c">// Velocity control (RPS)</span></span>
<span class="cl">motor.<span class="me">setControl</span>(<span class="k">new</span> <span class="t">VelocityVoltage</span>(<span class="n">50.0</span>));</span>
      </div>
      <ul class="bullets">
        <li><span class="bul">▸</span><span>PID logic runs <span class="b">on the motor controller</span> (1kHz).</span></li>
        <li><span class="bul">▸</span><span><span class="y">Slot0Configs</span>: Store your PID gains here.</span></li>
        <li><span class="bul">▸</span><span>Units are <span class="g">Rotations</span> and <span class="g">Rotations per Second</span>.</span></li>
        <li><span class="bul">▸</span><span><span class="p">Motion Magic</span>: Smooth profiles for position.</span></li>
      </ul>
    </div>`,

    // 7. Status signals
    `<span class="tag">// 06 · status.signals()</span>
    <h2>Reading <span class="y">Sensor Data</span></h2>
    <div class="code">
<span class="cl"><span class="c">// Get signal objects</span></span>
<span class="cl"><span class="t">StatusSignal</span>&lt;<span class="t">Double</span>&gt; pos = motor.<span class="me">getPosition</span>();</span>
<span class="cl"><span class="t">StatusSignal</span>&lt;<span class="t">Double</span>&gt; vel = motor.<span class="me">getVelocity</span>();</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Refresh to get latest CAN data</span></span>
<span class="cl">pos.<span class="me">refresh</span>();</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Extract as double</span></span>
<span class="cl"><span class="k">double</span> rotations = pos.<span class="me">getValueAsDouble</span>();</span>
    </div>
    <ul class="bullets" style="margin-top:20px">
      <li><span class="bul">▸</span><span>Signals are <span class="b">latency-compensated</span> automatically.</span></li>
      <li><span class="bul">▸</span><span>Use <span class="y">refresh()</span> to fetch the newest value.</span></li>
      <li><span class="bul">▸</span><span>Call <span class="g">getValueAsDouble()</span> for your logic.</span></li>
    </ul>`,

    // 8. Phoenix Tuner X
    `<span class="tag">// 07 · software.tuner_x()</span>
    <h2>Phoenix <span class="y">Tuner X</span></h2>
    <p class="lead">The essential desktop and mobile utility for CTRE devices.</p>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="b">Configuration</span>: Live editing of device parameters.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Firmware</span>: Update devices to the latest version.</span></li>
      <li><span class="bul">▸</span><span><span class="g">Self-Test</span>: Diagnose hardware and CAN issues.</span></li>
      <li><span class="bul">▸</span><span><span class="p">Plotting</span>: Real-time graphs of velocity, current, and PID error.</span></li>
      <li><span class="bul">▸</span><span>Available on Windows, Android, and iOS.</span></li>
    </ul>`,

    // 9. Best practices
    `<span class="tag">// 08 · best.practices()</span>
    <h2>TalonFX <span class="y">Pro Tips</span></h2>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">safety</div>
        <div class="ftitle r">Current Limits</div>
        <div class="fdesc">Always set Stator/Supply limits to prevent brownouts and motor burnouts.</div>
      </div>
      <div class="fcard">
        <div class="flabel">workflow</div>
        <div class="ftitle g">Factory Default</div>
        <div class="fdesc">Apply a fresh config on every boot to ensure no "sticky" settings remain.</div>
      </div>
      <div class="fcard">
        <div class="flabel">units</div>
        <div class="ftitle b">Rotations</div>
        <div class="fdesc">Phoenix 6 uses rotations, not "counts". 1.0 = one full turn of the motor.</div>
      </div>
      <div class="fcard">
        <div class="flabel">performance</div>
        <div class="ftitle p">CAN FD</div>
        <div class="fdesc">Use a CANivore for high-bandwidth telemetry and higher update rates.</div>
      </div>
    </div>`,

    // 10. Recap
    `<div data-center>
      <span class="tag">// session.complete()</span>
      <h1>Mastering the <span class="y">TalonFX</span></h1>
      <p class="lead">You've seen the basics of Phoenix 6.<br>Configuration, Control, and Feedback.</p>
      <div class="stats">
        <div class="stat"><div class="sn">6</div><div class="sl">Phoenix Version</div></div>
        <div class="stat"><div class="sn">1kHz</div><div class="sl">Control Rate</div></div>
        <div class="stat"><div class="sn">0</div><div class="sl">Excuse for No Limits</div></div>
      </div>
    </div>`
  ]
});

</script>

<!-- ===== vision-1.js ===== -->
<script>
window.registerLesson('vision-1', {
  title: 'Vision I — AprilTags & Pose',
  tag: '// vision.apriltags()',
  slides: [
    // 1. HERO
    `<div data-center>
      <span class="tag">// vision.apriltags()</span>
      <h1>AprilTags &amp; <span class="y">Pose</span></h1>
      <p class="lead">Teaching the robot to know where it is by looking at the walls.</p>
      <div style="margin-top: 20px;">
        <span class="badge by">Level 1</span>
        <span class="badge bb">AprilTags</span>
        <span class="badge bg">Pose Estimation</span>
      </div>
    </div>`,

    // 2. FIDUCIALS
    `<span class="tag">// 01 · fiducials.why()</span>
    <h2>What's a <span class="y">Fiducial?</span></h2>
    <div class="bigq">"A marker designed to be trivially machine-readable — even when blurry, tilted, or half-covered."</div>
    <ul class="bullets">
      <li><span class="bul">▸</span><span>FRC fields use the <span class="y">36h11</span> AprilTag family (since 2024).</span></li>
      <li><span class="bul">▸</span><span>Each tag carries a <span class="b">unique ID</span> — the robot knows WHICH tag it sees.</span></li>
      <li><span class="bul">▸</span><span>One detection yields a full <span class="g">3D camera-to-tag transform</span> — not just "something is over there."</span></li>
      <li><span class="bul">▸</span><span>Robust to lighting and partial occlusion — a huge upgrade over the retroreflective-tape era.</span></li>
    </ul>`,

    // 3. DETECTION PIPELINE
    `<span class="tag">// 02 · detection.pipeline()</span>
    <h2>From Pixels to <span class="y">Pose</span></h2>
    <div class="tl">
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Find Quad Corners</div><div class="tldesc">The detector scans the frame for dark/light quadrilaterals — tag candidates.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Decode the ID</div><div class="tldesc">The bit grid inside the quad is read and error-checked against the 36h11 family.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Solve PnP</div><div class="tldesc">Known tag size + camera calibration + corner pixels = the 3D transform from camera to tag.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div></div>
        <div class="tlc"><div class="tltitle">Chain the Transforms</div><div class="tldesc">Tag pose on field + camera-to-tag + robot-to-camera = robot pose on field.</div></div>
      </div>
    </div>`,

    // 4. FIELD LAYOUT
    `<span class="tag">// 03 · field.layout()</span>
    <h2>The Field <span class="y">Layout</span></h2>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Every tag's exact pose on the field ships as a <span class="y">layout JSON</span> with WPILib.</span></li>
        <li><span class="bul">▸</span><span>Tag ID &harr; field landmark: "ID 7" means a specific spot on a specific wall.</span></li>
        <li><span class="bul">▸</span><span><span class="r">Caveat:</span> there are <span class="b">welded</span> vs <span class="b">AndyMark</span> field variants with slightly different tag positions — verify which layout your event uses.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="t">AprilTagFieldLayout</span> layout =</span>
<span class="cl hl">&nbsp;&nbsp;<span class="t">AprilTagFieldLayout</span>.<span class="me">loadField</span>(</span>
<span class="cl hl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">AprilTagFields</span>.kDefaultField);</span>
<span class="cl"></span>
<span class="cl"><span class="c">// Where is tag 7?</span></span>
<span class="cl">layout.<span class="me">getTagPose</span>(<span class="n">7</span>); <span class="c">// Optional&lt;Pose3d&gt;</span></span>
      </div>
    </div>`,

    // 5. AMBIGUITY
    `<span class="tag">// 04 · ambiguity()</span>
    <h2>Why Vision <span class="y">Lies</span> Sometimes</h2>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">the flip</div>
        <div class="ftitle r">Pose Ambiguity</div>
        <div class="fdesc">A flat tag viewed nearly head-on has TWO plausible 3D solutions. The solver can pick the wrong one — the "flip."</div>
      </div>
      <div class="fcard">
        <div class="flabel">distance</div>
        <div class="ftitle y">Accuracy Falls Off</div>
        <div class="fdesc">Corner-pixel errors grow with distance and shallow viewing angles. A tag 6 meters away is a rumor, not a measurement.</div>
      </div>
      <div class="fcard">
        <div class="flabel">jitter</div>
        <div class="ftitle b">Single-Tag Jumpiness</div>
        <div class="fdesc">One-tag estimates bounce frame to frame. Don't feed raw single-tag poses straight into anything important.</div>
      </div>
      <div class="fcard">
        <div class="flabel">the fix</div>
        <div class="ftitle g">Multi-Tag Solves</div>
        <div class="fdesc">Solving against several tags at once (MegaTag-style) collapses the ambiguity and steadies the estimate.</div>
      </div>
    </div>`,

    // 6. CAMERA TRANSFORM
    `<span class="tag">// 05 · camera.transform()</span>
    <h2>Where's the <span class="y">Camera?</span></h2>
    <p class="lead">The pipeline reports where the CAMERA is. You want the ROBOT. The difference is one transform you must measure.</p>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">robotToCamera:</span> a Transform3d from robot center to camera lens — x, y, z, roll, pitch, yaw.</span></li>
        <li><span class="bul">▸</span><span>The estimate is only as good as this measurement. <span class="r">Centimeters of error here = centimeters of error everywhere.</span></span></li>
        <li><span class="bul">▸</span><span><span class="g">Calibrate intrinsics</span> (lens model) and <span class="b">measure extrinsics</span> (mounting) before tuning anything else.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="c">// Measured from CAD, verified by hand</span></span>
<span class="cl"><span class="t">Transform3d</span> robotToCamera = <span class="k">new</span> <span class="t">Transform3d</span>(</span>
<span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">Translation3d</span>(<span class="n">0.25</span>, <span class="n">0.0</span>, <span class="n">0.22</span>),</span>
<span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">Rotation3d</span>(<span class="n">0</span>, <span class="t">Units</span>.<span class="me">degreesToRadians</span>(-<span class="n">15</span>), <span class="n">0</span>));</span>
      </div>
    </div>`,

    // 7. WHY FUSE
    `<span class="tag">// 06 · why.fuse()</span>
    <h2>Why <span class="y">Fuse?</span></h2>
    <div class="bigq">"Odometry is smooth but drifts. Vision is absolute but noisy, laggy, and intermittent. Fusion gets you both."</div>
    <div class="stats">
      <div class="stat">
        <div class="sn">Odometry</div>
        <div class="sl">Fast + Smooth, but Drifts</div>
      </div>
      <div class="stat">
        <div class="sn">Vision</div>
        <div class="sl">Absolute Truth, but Noisy</div>
      </div>
      <div class="stat">
        <div class="sn">Fused</div>
        <div class="sl">Fast AND True</div>
      </div>
    </div>`,

    // 8. ADDVISIONMEASUREMENT
    `<span class="tag">// 07 · addVisionMeasurement()</span>
    <h2>The <span class="y">Fusion API</span></h2>
    <div class="code">
<span class="cl"><span class="c">// Every loop: dead-reckoning update (WPILib II odometry)</span></span>
<span class="cl">poseEstimator.<span class="me">update</span>(gyro.<span class="me">getRotation2d</span>(), modulePositions);</span>
<span class="cl"></span>
<span class="cl"><span class="c">// Whenever a vision result arrives:</span></span>
<span class="cl hl">poseEstimator.<span class="me">addVisionMeasurement</span>(</span>
<span class="cl hl">&nbsp;&nbsp;visionPose,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="c">// where vision says we are</span></span>
<span class="cl hl">&nbsp;&nbsp;captureTime,&nbsp;&nbsp;&nbsp;<span class="c">// when the FRAME was captured</span></span>
<span class="cl hl">&nbsp;&nbsp;stdDevs);&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="c">// how much to trust it</span></span>
    </div>
    <ul class="bullets">
      <li><span class="bul">▸</span><span>The timestamp is the <span class="y">capture time</span>, not "now" — the estimator rewinds, applies the measurement, and replays. That's <span class="g">latency compensation</span>.</span></li>
      <li><span class="bul">▸</span><span>Vision estimators return <span class="b">Optional</span> — the camera may see nothing. Never .get() blind (Java II).</span></li>
    </ul>`,

    // 9. STD DEVS
    `<span class="tag">// 08 · std.devs()</span>
    <h2>Trust, <span class="y">Quantified</span></h2>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Standard deviations tell the estimator <span class="y">how much to trust</span> a measurement — bigger = trust less.</span></li>
        <li><span class="bul">▸</span><span>Scale trust <span class="r">down with distance</span>, <span class="g">up with tag count</span>.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Reject outright:</span> poses off the field, high-ambiguity solves, a single distant tag, frames taken while spinning fast.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="c">// x meters, y meters, theta radians</span></span>
<span class="cl"><span class="t">Matrix</span>&lt;<span class="t">N3</span>, <span class="t">N1</span>&gt; stdDevs =</span>
<span class="cl">&nbsp;&nbsp;<span class="t">VecBuilder</span>.<span class="me">fill</span>(<span class="n">0.3</span>, <span class="n">0.3</span>, <span class="n">0.9</span>);</span>
<span class="cl"></span>
<span class="cl"><span class="c">// Tighter when close + multi-tag:</span></span>
<span class="cl"><span class="t">VecBuilder</span>.<span class="me">fill</span>(<span class="n">0.05</span>, <span class="n">0.05</span>, <span class="n">0.4</span>);</span>
      </div>
    </div>`,

    // 10. MEGATAG2
    `<span class="tag">// 09 · megatag2.gyro()</span>
    <h2>Gyro-Seeded <span class="y">Solving</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">MegaTag2-style solving:</span> feed the camera your gyro yaw, and it solves x/y with the rotation pinned — dramatically tighter estimates.</span></li>
      <li><span class="bul">▸</span><span>Consequence: <span class="b">trust &theta; from the gyro</span>, not vision — set a huge theta std dev on vision measurements.</span></li>
      <li><span class="bul">▸</span><span>Works with <span class="g">Limelight</span> (see the Limelight lesson for the interface) or PhotonVision — the concept is vendor-neutral.</span></li>
      <li><span class="bul">▸</span><span>Run vision through an <span class="p">IO layer</span> so camera inputs are logged — then pose fusion replays deterministically (AdvantageKit II).</span></li>
    </ul>`,

    // 11. CLOSING
    `<div data-center>
      <span class="tag">// vision.complete()</span>
      <h2>The Robot <span class="y">Knows</span> Where It Is</h2>
      <div class="stats">
        <div class="stat">
          <div class="sn">36h11</div>
          <div class="sl">One Family to Rule Them All</div>
        </div>
        <div class="stat">
          <div class="sn">&plusmn;cm</div>
          <div class="sl">Fused Accuracy</div>
        </div>
        <div class="stat">
          <div class="sn">t &minus; latency</div>
          <div class="sl">Always Timestamp It</div>
        </div>
      </div>
      <p class="lead" style="margin-top:30px;">Odometry guesses. Vision corrects. The estimator referees.</p>
    </div>`
  ]
});

</script>

<!-- ===== wpilib-alert.js ===== -->
<script>
window.registerLesson('wpilib-alert', {
  title: 'WPILib — Alerts',
  tag: '// wpilib.alerts()',
  slides: [
    // 1. Hero / Title (data-center)
    `<div data-center>
      <span class="tag">// wpilib.alerts()</span>
      <h1>Robot <span class="y">Alerts</span></h1>
      <p class="lead">Surfacing critical hardware faults, warnings, and diagnostic telemetry to drive station dashboards.</p>
      <div class="stats">
        <div class="stat"><div class="sn">6328</div><div class="sl">Original Creator</div></div>
        <div class="stat"><div class="sn">3</div><div class="sl">Severity Levels</div></div>
        <div class="stat"><div class="sn">2027</div><div class="sl">Driver Station Native</div></div>
      </div>
    </div>`,

    // 2. The Problem with Console Logs
    `<span class="tag">// 01 · motivation</span>
    <h2>Beyond the <span class="y">Console</span></h2>
    <p class="lead">During an intense match or fast pit turnaround, critical error messages get lost in console spam.</p>
    <div class="two">
      <div class="fcard">
        <div class="flabel">The Old Way</div>
        <div class="ftitle r">System.out.println()</div>
        <div class="fdesc">Prints once and scrolls off-screen. If a motor disconnects during autonomous, nobody notices until the robot is back in the pit.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Modern Standard</div>
        <div class="ftitle g">Persistent Alerts</div>
        <div class="fdesc">Creates high-visibility banner widgets on driver dashboards that remain active until the condition is resolved.</div>
      </div>
    </div>
    <div class="frow" style="margin-top:16px;">
      <div class="ftitle"><span class="y">Purpose:</span> Ensure pit crew and drive teams immediately identify broken sensors, CAN bus disconnects, and low battery voltages before stepping onto the field.</div>
    </div>`,

    // 3. 6328 Fun Fact & WPILib Adoption
    `<span class="tag">// 02 · history</span>
    <h2>6328 Origin: <span class="y">A Fun Fact</span></h2>
    <p class="lead">The WPILib <span class="t">Alert</span> class was created right here on Team 6328 Mechanical Advantage!</p>
    <div class="two">
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle y">2020 · Born on 6328</div><div class="tldesc">Team 6328 engineers created the <code>Alert</code> utility to solve persistent fault tracking on our competition robots.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--blue2);box-shadow:0 0 0 2px var(--blue2)"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle b">2025 · Adopted by WPILib</div><div class="tldesc">Recognizing its widespread utility, WPILib adopted Alert directly into official WPILib core (<code>edu.wpi.first.wpilibj.Alert</code>).</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div></div>
          <div class="tlc"><div class="tltitle g">2027 · Official Driver Station</div><div class="tldesc">In 2027, Alerts will transition to being a first-class, built-in feature of the official FIRST Driver Station application!</div></div>
        </div>
      </div>
      <div>
        <div class="bigq">From a 6328 team utility to the global FRC standard across thousands of teams worldwide.</div>
      </div>
    </div>`,

    // 4. Severity Levels
    `<span class="tag">// 03 · severity</span>
    <h2>Severity <span class="y">Levels</span></h2>
    <p class="lead">Alerts communicate the urgency of a situation using three standardized severity tiers.</p>
    <div class="fgrid three">
      <div class="fcard">
        <div class="flabel">Green / Blue</div>
        <div class="ftitle g">AlertType.kInfo</div>
        <div class="fdesc">Operational notifications (e.g., "Auto Routine: 3-Piece Center Selected", "Practice Mode Active").</div>
      </div>
      <div class="fcard">
        <div class="flabel">Yellow</div>
        <div class="ftitle y">AlertType.kWarning</div>
        <div class="fdesc">Degraded functionality (e.g., "Battery Voltage &lt; 11.5V", "Vision target lost; falling back to odometry").</div>
      </div>
      <div class="fcard">
        <div class="flabel">Red</div>
        <div class="ftitle r">AlertType.kError</div>
        <div class="fdesc">Critical robot-breaking faults (e.g., "Arm CAN Bus Disconnected!", "Pigeon Gyro Offline!").</div>
      </div>
    </div>`,

    // 5. Creating and Managing Alerts
    `<span class="tag">// 04 · alert.lifecycle</span>
    <h2>Alert <span class="y">Lifecycle</span></h2>
    <p class="lead">Instantiate alerts once in your subsystem and toggle them dynamically inside <code>periodic()</code>.</p>
    <div class="code">
      <span class="cl"><span class="k">public class</span> <span class="t">ArmSubsystem</span> <span class="k">extends</span> <span class="t">SubsystemBase</span> {</span>
      <span class="cl">&nbsp;&nbsp;<span class="c">// 1. Declare persistent Alert instance</span></span>
      <span class="cl">&nbsp;&nbsp;<span class="k">private final</span> <span class="t">Alert</span> canError = <span class="k">new</span> <span class="t">Alert</span>(</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="s">"Arm"</span>, <span class="s">"Arm motor CAN bus disconnected!"</span>, <span class="t">AlertType</span>.kError</span>
      <span class="cl">&nbsp;&nbsp;);</span>
      <span class="cl">&nbsp;</span>
      <span class="cl">&nbsp;&nbsp;<span class="me">@Override</span></span>
      <span class="cl">&nbsp;&nbsp;<span class="k">public void</span> <span class="me">periodic</span>() {</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="c">// 2. Set active state conditionally every 20ms:</span></span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;canError.<span class="me">set</span>(!armMotor.<span class="me">isCANConnected</span>());</span>
      <span class="cl">&nbsp;&nbsp;}</span>
      <span class="cl">}</span>
    </div>`,

    // 6. Dynamic Text Updates
    `<span class="tag">// 05 · dynamic.text</span>
    <h2>Dynamic <span class="y">Alert Text</span></h2>
    <p class="lead">Update the message string on active alerts to provide actionable context to the pit crew.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Update message with live temperature reading</span></span>
        <span class="cl"><span class="k">public static void</span> <span class="me">updateOverheat</span>(<span class="t">Alert</span> alert, <span class="k">double</span> tempC) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">if</span> (tempC &gt; <span class="n">80.0</span>) {</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;alert.<span class="me">setText</span>(<span class="t">String</span>.<span class="me">format</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="s">"Shooter motor overheating! (%.1f°C)"</span>, tempC));</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;alert.<span class="me">set</span>(<span class="k">true</span>);</span>
        <span class="cl">&nbsp;&nbsp;} <span class="k">else</span> {</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;alert.<span class="me">set</span>(<span class="k">false</span>);</span>
        <span class="cl">&nbsp;&nbsp;}</span>
        <span class="cl">}</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Pit Crew Experience</div>
          <div class="ftitle">Actionable Feedback</div>
          <div class="fdesc">Instead of guessing why a mechanism is sluggish, the dashboard directly informs the team: <i>"Shooter motor overheating! (88.4°C)"</i>.</div>
        </div>
      </div>
    </div>`,

    // 7. Grouping by Subsystems
    `<span class="tag">// 06 · grouping</span>
    <h2>Organizing by <span class="y">Subsystem Groups</span></h2>
    <p class="lead">Prefixing alerts with subsystem group names clusters related alerts cleanly on dashboard UIs.</p>
    <div class="code">
      <span class="cl"><span class="c">// Construct alerts within a named subsystem group:</span></span>
      <span class="cl"><span class="k">public static</span> <span class="t">Alert</span>[] <span class="me">subsystemAlerts</span>(<span class="t">String</span> subsystemName) {</span>
      <span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">Alert</span>[] {</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">new</span> <span class="t">Alert</span>(subsystemName, <span class="s">"Ready for match"</span>, <span class="t">AlertType</span>.kInfo),</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">new</span> <span class="t">Alert</span>(subsystemName, <span class="s">"High temperature warning"</span>, <span class="t">AlertType</span>.kWarning),</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">new</span> <span class="t">Alert</span>(subsystemName, <span class="s">"Hardware offline fault"</span>, <span class="t">AlertType</span>.kError)</span>
      <span class="cl">&nbsp;&nbsp;};</span>
      <span class="cl">}</span>
    </div>`,

    // 8. Best Practices
    `<span class="tag">// 07 · best.practices</span>
    <h2>Alert <span class="y">Best Practices</span></h2>
    <div class="fgrid">
      <div class="fcard no-bracket">
        <div class="ftitle r">Never re-instantiate in periodic()</div>
        <div class="fdesc">Create <code>Alert</code> objects once during robot initialization. In <code>periodic()</code>, only call <code>alert.set(boolean)</code>.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle y">Latch intermittent errors</div>
        <div class="fdesc">If a CAN frame drops once, latch the alert true for a few seconds so transient faults are visible to operators.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle g">Pre-match checklist</div>
        <div class="fdesc">The drive team's golden rule: <b>Never hit the green light on the field if any red Alert is showing!</b></div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle b">AdvantageScope integration</div>
        <div class="fdesc">Alerts stream to NetworkTables and appear in real time on AdvantageScope and Elastic dashboards.</div>
      </div>
    </div>`,

    // 9. Recap (data-center)
    `<div data-center>
      <span class="tag">// end.alerts()</span>
      <h2>Alerts <span class="y">Mastered</span></h2>
      <p class="lead">You know how to build robust, persistent robot diagnostics that keep your team ahead in competition.</p>
      <div class="fgrid">
        <div class="fcard no-bracket"><div class="sn">01</div><div class="sl">Persistent UI · Immediate visual fault indicators</div></div>
        <div class="fcard no-bracket"><div class="sn">02</div><div class="sl">Severity Tiers · Info, Warning, and Error</div></div>
        <div class="fcard no-bracket"><div class="sn">03</div><div class="sl">Dynamic Text · Actionable temperature &amp; voltage context</div></div>
        <div class="fcard no-bracket"><div class="sn">04</div><div class="sl">6328 Heritage · From team tool to FRC standard</div></div>
      </div>
    </div>`
  ]
});

</script>

<!-- ===== wpilib-cmd.js ===== -->
<script>
window.registerLesson('wpilib-cmd', {
  title: 'WPILib — Commands & Composition',
  tag: '// wpilib.commands()',
  slides: [
    // 1. Hero / Title (data-center)
    `<div data-center>
      <span class="tag">// wpilib.commands()</span>
      <h1>WPILib <span class="y">Commands</span></h1>
      <p class="lead">Building powerful robot actions and autonomous routines through declarative composition.</p>
      <div class="stats">
        <div class="stat"><div class="sn">4</div><div class="sl">Lifecycle Methods</div></div>
        <div class="stat"><div class="sn">Factory</div><div class="sl">Modern Fluent API</div></div>
        <div class="stat"><div class="sn">Async</div><div class="sl">Non-Blocking Concurrency</div></div>
      </div>
    </div>`,

    // 2. Command Architecture & Subsystems
    `<span class="tag">// 01 · architecture</span>
    <h2>The Command-Based <span class="y">Pattern</span></h2>
    <p class="lead">Separate <b>what the robot does</b> (Commands) from <b>what the robot is made of</b> (Subsystems).</p>
    <div class="two">
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Hardware Owner</div>
          <div class="ftitle">Subsystem</div>
          <div class="fdesc">Encapsulates motors and sensors (e.g. <code>Flywheel</code>, <code>Drive</code>, <code>Arm</code>). Controls physical access.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Action Unit</div>
          <div class="ftitle">Command</div>
          <div class="fdesc">A state machine representing a task. Declares which subsystems it <b>requires</b> for exclusive access.</div>
        </div>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><b>Single Subsystem Ownership:</b> Only one command can control a given subsystem at any time.</span></li>
          <li><span class="bul">▸</span><span>Scheduling a new command automatically <b>interrupts</b> any currently running command that shares the same requirements.</span></li>
          <li><span class="bul">▸</span><span><b>Factory Methods:</b> Modern WPILib creates commands with static factory methods (<code>Commands.*</code>).</span></li>
        </ul>
      </div>
    </div>`,

    // 3. Command Lifecycle
    `<span class="tag">// 02 · lifecycle</span>
    <h2>The Command <span class="y">Lifecycle</span></h2>
    <p class="lead">Every command follows four distinct phases managed automatically by the scheduler.</p>
    <div class="two">
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle y">1. initialize()</div><div class="tldesc">Runs once when the command starts. Set up timers, reset controllers, or log start.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--blue2);box-shadow:0 0 0 2px var(--blue2)"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle b">2. execute()</div><div class="tldesc">Runs repeatedly every 20ms (50Hz) while active. Update motor outputs.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--purple);box-shadow:0 0 0 2px var(--purple)"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle p">3. isFinished()</div><div class="tldesc">Polled every 20ms. When it returns true, the command completes normally.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div></div>
          <div class="tlc"><div class="tltitle g">4. end(interrupted)</div><div class="tldesc">Runs once when finished OR interrupted. Turn off motors and clean up state.</div></div>
        </div>
      </div>
      <div class="code">
        <span class="cl"><span class="c">// Traditional Command Structure</span></span>
        <span class="cl"><span class="k">public class</span> <span class="t">IntakeNote</span> <span class="k">extends</span> <span class="t">Command</span> {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">public</span> <span class="me">IntakeNote</span>(<span class="t">Intake</span> intake) {</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="me">addRequirements</span>(intake);</span>
        <span class="cl">&nbsp;&nbsp;}</span>
        <span class="cl">&nbsp;&nbsp;<span class="me">@Override</span> <span class="k">public void</span> <span class="me">initialize</span>() { ... }</span>
        <span class="cl">&nbsp;&nbsp;<span class="me">@Override</span> <span class="k">public void</span> <span class="me">execute</span>() { ... }</span>
        <span class="cl">&nbsp;&nbsp;<span class="me">@Override</span> <span class="k">public boolean</span> <span class="me">isFinished</span>() { ... }</span>
        <span class="cl">&nbsp;&nbsp;<span class="me">@Override</span> <span class="k">public void</span> <span class="me">end</span>(<span class="k">boolean</span> interrupted) { ... }</span>
        <span class="cl">}</span>
      </div>
    </div>`,

    // 4. Basic Factories: runOnce & run
    `<span class="tag">// 03 · basic.factories</span>
    <h2>Instant &amp; Periodic <span class="y">Factories</span></h2>
    <p class="lead">Modern WPILib lets you create inline commands using <code>Commands.runOnce()</code> and <code>Commands.run()</code>.</p>
    <div class="two">
      <div>
        <div class="fcard">
          <div class="flabel">Instant (1 Tick)</div>
          <div class="ftitle"><code>Commands.runOnce(action, reqs)</code></div>
          <div class="fdesc">Executes the runnable once and finishes immediately in the same cycle.</div>
        </div>
        <div class="code tight" style="margin-top:10px;">
          <span class="cl"><span class="c">// Run once and immediately finish:</span></span>
          <span class="cl"><span class="t">Command</span> resetGyro = <span class="t">Commands</span>.<span class="me">runOnce</span>(</span>
          <span class="cl">&nbsp;&nbsp;() -&gt; drive.<span class="me">zeroHeading</span>(),</span>
          <span class="cl">&nbsp;&nbsp;drive</span>
          <span class="cl">);</span>
        </div>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Continuous (Forever)</div>
          <div class="ftitle"><code>Commands.run(action, reqs)</code></div>
          <div class="fdesc">Executes the runnable repeatedly every 20ms loop until explicitly cancelled or timed out.</div>
        </div>
        <div class="code tight" style="margin-top:10px;">
          <span class="cl"><span class="c">// Runs continuously every 20ms:</span></span>
          <span class="cl"><span class="t">Command</span> runFeeder = <span class="t">Commands</span>.<span class="me">run</span>(</span>
          <span class="cl">&nbsp;&nbsp;() -&gt; feeder.<span class="me">setVoltage</span>(<span class="n">10.0</span>),</span>
          <span class="cl">&nbsp;&nbsp;feeder</span>
          <span class="cl">);</span>
        </div>
      </div>
    </div>`,

    // 5. Cleanup Factories: startEnd & runEnd
    `<span class="tag">// 04 · cleanup.factories</span>
    <h2>Ensuring Safe Cleanup: <span class="y">startEnd &amp; runEnd</span></h2>
    <p class="lead">Never leave motors spinning when a command finishes or is cancelled unexpectedly!</p>
    <div class="two">
      <div>
        <div class="fcard">
          <div class="flabel">Start and Clean Up</div>
          <div class="ftitle"><code>Commands.startEnd(start, end, reqs)</code></div>
          <div class="fdesc">Runs <code>start</code> once on startup; runs <code>end</code> once on finish/interrupt.</div>
        </div>
        <div class="code tight" style="margin-top:10px;">
          <span class="cl"><span class="t">Command</span> spinFlywheel = <span class="t">Commands</span>.<span class="me">startEnd</span>(</span>
          <span class="cl">&nbsp;&nbsp;() -&gt; flywheel.<span class="me">setRPM</span>(<span class="n">4000</span>),</span>
          <span class="cl">&nbsp;&nbsp;() -&gt; flywheel.<span class="me">stop</span>(),</span>
          <span class="cl">&nbsp;&nbsp;flywheel</span>
          <span class="cl">);</span>
        </div>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Run Loop and Clean Up</div>
          <div class="ftitle"><code>Commands.runEnd(run, end, reqs)</code></div>
          <div class="fdesc">Runs <code>run</code> continuously every 20ms; runs <code>end</code> once on termination.</div>
        </div>
        <div class="code tight" style="margin-top:10px;">
          <span class="cl"><span class="t">Command</span> intakeNote = <span class="t">Commands</span>.<span class="me">runEnd</span>(</span>
          <span class="cl">&nbsp;&nbsp;() -&gt; intake.<span class="me">setPercent</span>(<span class="n">0.8</span>),</span>
          <span class="cl">&nbsp;&nbsp;() -&gt; intake.<span class="me">stop</span>(),</span>
          <span class="cl">&nbsp;&nbsp;intake</span>
          <span class="cl">);</span>
        </div>
      </div>
    </div>`,

    // 6. Idle, Wait & Conditionals
    `<span class="tag">// 05 · utility.factories</span>
    <h2>Idle, Wait &amp; <span class="y">Conditionals</span></h2>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">Subsystem Locking</div>
        <div class="ftitle"><code>Commands.idle(requirements)</code></div>
        <div class="fdesc">Does nothing every tick, but maintains subsystem requirement to lock out default commands.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Non-Blocking Wait</div>
        <div class="ftitle"><code>Commands.waitSeconds(seconds)</code></div>
        <div class="fdesc">A command that finishes after the specified time. Never use <code>Thread.sleep()</code>!</div>
      </div>
      <div class="fcard">
        <div class="flabel">Branching</div>
        <div class="ftitle"><code>Commands.either(onTrue, onFalse, cond)</code></div>
        <div class="fdesc">Picks between two commands based on a boolean condition supplier evaluated at start.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Lazy Construction</div>
        <div class="ftitle"><code>Commands.defer(supplier, reqs)</code></div>
        <div class="fdesc">Builds the command dynamically when scheduled (useful for reading live auto selections).</div>
      </div>
    </div>`,

    // 7. Sequential Composition
    `<span class="tag">// 06 · composition.sequential</span>
    <h2>Sequential <span class="y">Composition</span></h2>
    <p class="lead">Run commands one after another in order. Step B begins only after Step A finishes.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Sequence using factory method:</span></span>
        <span class="cl"><span class="t">Command</span> autoRoutine = <span class="t">Commands</span>.<span class="me">sequence</span>(</span>
        <span class="cl">&nbsp;&nbsp;arm.<span class="me">deploy</span>(),</span>
        <span class="cl">&nbsp;&nbsp;drive.<span class="me">driveForward</span>().<span class="me">withTimeout</span>(<span class="n">2.5</span>),</span>
        <span class="cl">&nbsp;&nbsp;shooter.<span class="me">shoot</span>(),</span>
        <span class="cl">&nbsp;&nbsp;arm.<span class="me">stow</span>()</span>
        <span class="cl">);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Fluent chaining with .andThen():</span></span>
        <span class="cl"><span class="t">Command</span> prepAndScore = arm.<span class="me">deploy</span>()</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">andThen</span>(shooter.<span class="me">shoot</span>());</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><b>Sequential Execution:</b> Runs step 1 until <code>isFinished()</code>, then step 2, and so on.</span></li>
          <li><span class="bul">▸</span><span><b>Combined Requirements:</b> A sequence requires the union of all subsystems used in all steps.</span></li>
          <li><span class="bul">▸</span><span><span class="r">Watch out:</span> If step 1 never finishes (e.g. infinite <code>run()</code>), step 2 will never start!</span></li>
        </ul>
      </div>
    </div>`,

    // 8. Parallel Composition (alongWith)
    `<span class="tag">// 07 · composition.parallel</span>
    <h2>Parallel <span class="y">Composition</span></h2>
    <p class="lead">Run multiple commands simultaneously. Finishes when <b>ALL</b> child commands complete.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Spin up flywheel WHILE raising arm:</span></span>
        <span class="cl"><span class="t">Command</span> prepareToScore = <span class="t">Commands</span>.<span class="me">parallel</span>(</span>
        <span class="cl">&nbsp;&nbsp;arm.<span class="me">raiseToScoringPosition</span>(),</span>
        <span class="cl">&nbsp;&nbsp;flywheel.<span class="me">spinUpToSpeed</span>()</span>
        <span class="cl">);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Fluent alternative:</span></span>
        <span class="cl"><span class="t">Command</span> combo = arm.<span class="me">raise</span>()</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">alongWith</span>(flywheel.<span class="me">spinUp</span>());</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Critical Rule</div>
          <div class="ftitle r">Disjoint Requirements</div>
          <div class="fdesc">Commands in a parallel group <b>MUST NOT</b> require the same subsystem. If two commands share a requirement, the scheduler will throw an exception on creation!</div>
        </div>
        <ul class="bullets" style="margin-top:14px;">
          <li><span class="bul">▸</span><span>Intake (Arm) + Shooter (Flywheel) = <span class="g">Valid Parallel</span></span></li>
          <li><span class="bul">▸</span><span>DriveForward (Drive) + TurnToAngle (Drive) = <span class="r">Illegal Parallel</span></span></li>
        </ul>
      </div>
    </div>`,

    // 9. Parallel Race (raceWith / withTimeout)
    `<span class="tag">// 08 · composition.race</span>
    <h2>Parallel <span class="y">Race</span></h2>
    <p class="lead">Runs multiple commands simultaneously. Finishes when <b>ANY ONE</b> command completes; the rest are cancelled.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Intake until sensor triggers OR 3s timeout:</span></span>
        <span class="cl"><span class="t">Command</span> intakeWithTimeout = <span class="t">Commands</span>.<span class="me">race</span>(</span>
        <span class="cl">&nbsp;&nbsp;intake.<span class="me">runIntake</span>(),</span>
        <span class="cl">&nbsp;&nbsp;<span class="t">Commands</span>.<span class="me">waitSeconds</span>(<span class="n">3.0</span>)</span>
        <span class="cl">);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// withTimeout decorator is shorthand for a race:</span></span>
        <span class="cl"><span class="t">Command</span> autoDrive = drive.<span class="me">driveForward</span>()</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">withTimeout</span>(<span class="n">2.0</span>);</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><b>First one across the finish line wins:</b> The winning command ends normally; all other running commands receive <code>end(true)</code> (interrupted).</span></li>
          <li><span class="bul">▸</span><span>Essential for safety timeouts on sensor-based operations.</span></li>
        </ul>
      </div>
    </div>`,

    // 10. Parallel Deadline
    `<span class="tag">// 09 · composition.deadline</span>
    <h2>Parallel <span class="y">Deadline</span></h2>
    <p class="lead">Runs multiple commands in parallel, but <b>ONE designated leader command</b> determines when the group finishes.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Drive is the deadline leader;</span></span>
        <span class="cl"><span class="c">// intake runs alongside and stops when drive finishes:</span></span>
        <span class="cl"><span class="t">Command</span> driveAndIntake = <span class="t">Commands</span>.<span class="me">deadline</span>(</span>
        <span class="cl">&nbsp;&nbsp;drive.<span class="me">driveForTime</span>(<span class="n">2.0</span>), <span class="c">// Leader</span></span>
        <span class="cl">&nbsp;&nbsp;intake.<span class="me">runContinuous</span>()  <span class="c">// Follower</span></span>
        <span class="cl">);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Fluent:</span></span>
        <span class="cl"><span class="t">Command</span> routine = leader.<span class="me">deadlineWith</span>(follower);</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span>When the <b>leader command finishes</b>, all follower commands are immediately interrupted.</span></li>
          <li><span class="bul">▸</span><span>If a follower command finishes early, the leader continues running unimpeded.</span></li>
        </ul>
      </div>
    </div>`,

    // 11. Run Until Condition
    `<span class="tag">// 10 · run.until</span>
    <h2>Terminating on Conditions: <span class="y">until()</span></h2>
    <p class="lead">Wrap any continuous command with <code>.until(BooleanSupplier)</code> to add an active sensor termination condition.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Drive forward until line sensor trips, then stop:</span></span>
        <span class="cl"><span class="k">public static</span> <span class="t">Command</span> <span class="me">driveUntilLine</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Drivetrain</span> drive, <span class="t">BooleanSupplier</span> lineSensor) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return</span> <span class="t">Commands</span>.<span class="me">runEnd</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;() -&gt; drive.<span class="me">arcadeDrive</span>(<span class="n">0.4</span>, <span class="n">0.0</span>),</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;() -&gt; drive.<span class="me">arcadeDrive</span>(<span class="n">0.0</span>, <span class="n">0.0</span>),</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;drive</span>
        <span class="cl">&nbsp;&nbsp;).<span class="me">until</span>(lineSensor);</span>
        <span class="cl">}</span>
      </div>
      <div>
        <div class="frow">
          <div class="ftitle"><code>command.until(condition)</code></div>
        </div>
        <p class="m" style="margin-top:10px;">Checks the condition supplier every 20ms cycle. When true, triggers normal command completion and cleanup.</p>
      </div>
    </div>`,

    // 12. Mixed / Complex Composition
    `<span class="tag">// 11 · complex.composition</span>
    <h2>Hierarchical <span class="y">Routines</span></h2>
    <p class="lead">Nesting sequential and parallel groups allows constructing sophisticated autonomous routines with concise code.</p>
    <div class="code">
      <span class="cl"><span class="c">// 1. Drive to target WHILE extending arm (Parallel)</span></span>
      <span class="cl"><span class="c">// 2. Then fire the shooter (Sequential)</span></span>
      <span class="cl"><span class="c">// 3. Then stow the arm (Sequential)</span></span>
      <span class="cl"><span class="k">public static</span> <span class="t">Command</span> <span class="me">scoreRoutine</span>(<span class="t">Drive</span> drive, <span class="t">Arm</span> arm, <span class="t">Shooter</span> shooter) {</span>
      <span class="cl">&nbsp;&nbsp;<span class="k">return</span> <span class="t">Commands</span>.<span class="me">sequence</span>(</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Commands</span>.<span class="me">parallel</span>(</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;drive.<span class="me">driveToTarget</span>(),</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;arm.<span class="me">extend</span>()</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;),</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;shooter.<span class="me">fire</span>(),</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;arm.<span class="me">stow</span>()</span>
      <span class="cl">&nbsp;&nbsp;);</span>
      <span class="cl">}</span>
    </div>`,

    // 13. Composition Comparison Table
    `<span class="tag">// 12 · composition.matrix</span>
    <h2>Composition <span class="y">Cheat Sheet</span></h2>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">Sequential</div>
        <div class="ftitle"><code>Commands.sequence(A, B)</code></div>
        <div class="fdesc">Runs A, then B. Finishes when <b>last command finishes</b>.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Parallel</div>
        <div class="ftitle"><code>Commands.parallel(A, B)</code></div>
        <div class="fdesc">Runs A and B together. Finishes when <b>ALL finish</b>.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Parallel Race</div>
        <div class="ftitle"><code>Commands.race(A, B)</code></div>
        <div class="fdesc">Runs A and B together. Finishes when <b>ANY ONE finishes</b>.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Parallel Deadline</div>
        <div class="ftitle"><code>Commands.deadline(A, B)</code></div>
        <div class="fdesc">Runs A and B together. Finishes when <b>leader A finishes</b>.</div>
      </div>
    </div>`,

    // 14. Recap (data-center)
    `<div data-center>
      <span class="tag">// end.commands()</span>
      <h2>Commands <span class="y">Mastered</span></h2>
      <p class="lead">You know how to build clean, non-blocking robot actions and compose them safely.</p>
      <div class="fgrid">
        <div class="fcard no-bracket"><div class="sn">01</div><div class="sl">runOnce &amp; run · Instant / Continuous actions</div></div>
        <div class="fcard no-bracket"><div class="sn">02</div><div class="sl">startEnd &amp; runEnd · Guaranteed motor safety cleanup</div></div>
        <div class="fcard no-bracket"><div class="sn">03</div><div class="sl">sequence &amp; parallel · Concurrency &amp; steps</div></div>
        <div class="fcard no-bracket"><div class="sn">04</div><div class="sl">race &amp; deadline · Smart condition termination</div></div>
      </div>
    </div>`
  ]
});

</script>

<!-- ===== wpilib-geo.js ===== -->
<script>
window.registerLesson('wpilib-geo', {
  title: 'WPILib — Geometry & 2D Coordinates',
  tag: '// wpilib.geometry()',
  slides: [
    // 1. Hero / Title (data-center)
    `<div data-center>
      <span class="tag">// wpilib.geometry()</span>
      <h1>WPILib <span class="y">Geometry</span></h1>
      <p class="lead">Understanding translations, rotations, coordinate frames, and 2D spatial math on FRC robots.</p>
      <div class="stats">
        <div class="stat"><div class="sn">2D</div><div class="sl">Bird's-Eye Plane</div></div>
        <div class="stat"><div class="sn">NWU</div><div class="sl">Standard Axes</div></div>
        <div class="stat"><div class="sn">0 Trig</div><div class="sl">WPILib Handles Math</div></div>
      </div>
    </div>`,

    // 2. Overview
    `<span class="tag">// 01 · overview</span>
    <h2>Why Geometry <span class="y">Classes</span>?</h2>
    <p class="lead">Robots live in 3D, but FRC navigation is effectively 2D (bird's-eye perspective on the field plane).</p>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">Motion Profiling</span>: Guiding the drivetrain smoothly along autonomous paths.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Vision &amp; Targeting</span>: Transforming camera detections into field positions.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Manipulator Control</span>: Computing arm angles and turret aiming vectors.</span></li>
        <li><span class="bul">▸</span><span><span class="p">Clean Abstraction</span>: WPILib handles sin, cos, and matrix transforms under the hood!</span></li>
      </ul>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Core Type</div>
          <div class="ftitle">Translation2d</div>
          <div class="fdesc">Linear displacement (X, Y) in meters.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Core Type</div>
          <div class="ftitle">Rotation2d</div>
          <div class="fdesc">Heading &amp; angle with built-in trig caching.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Core Type</div>
          <div class="ftitle">Pose2d</div>
          <div class="fdesc">Position + Heading (defines a coordinate frame).</div>
        </div>
        <div class="fcard">
          <div class="flabel">Core Type</div>
          <div class="ftitle">Transform2d</div>
          <div class="fdesc">Delta movement between two poses.</div>
        </div>
      </div>
    </div>`,

    // 3. Background: Coordinate System (NWU)
    `<span class="tag">// 02 · coordinate.system</span>
    <h2>The Standard <span class="y">Coordinate System</span></h2>
    <p class="lead">FRC uses standard <b>NWU</b> (North-West-Up) right-handed 2D Cartesian coordinates.</p>
    <div class="two">
      <div style="background:rgba(4,8,22,0.7);border:1px solid rgba(45,123,255,0.2);border-radius:6px;padding:16px;display:flex;justify-content:center;align-items:center;">
        <svg viewBox="-140 -140 280 280" width="260" height="260" style="overflow:visible;">
          <!-- Grid lines -->
          <line x1="-120" y1="0" x2="120" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <line x1="0" y1="-120" x2="0" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <!-- +X axis (horizontal right) -->
          <line x1="0" y1="0" x2="110" y2="0" stroke="#f44767" stroke-width="3"/>
          <polygon points="118,0 106,-5 106,5" fill="#f44767"/>
          <text x="118" y="4" fill="#f44767" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="bold">+X (0°)</text>
          <!-- +Y axis (vertical up) -->
          <line x1="0" y1="0" x2="0" y2="-110" stroke="#4ec9b0" stroke-width="3"/>
          <polygon points="0,-118 -5,-106 5,-106" fill="#4ec9b0"/>
          <text x="-32" y="-115" fill="#4ec9b0" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="bold">+Y (+90° / π/2)</text>
          <!-- Vector theta -->
          <line x1="0" y1="0" x2="80" y2="-70" stroke="#e8a020" stroke-width="2.5" stroke-dasharray="4,2"/>
          <circle cx="80" cy="-70" r="4" fill="#e8a020"/>
          <!-- Arc for theta -->
          <path d="M 45 0 A 45 45 0 0 0 32 -32" fill="none" stroke="#f5c842" stroke-width="2"/>
          <text x="48" y="-18" fill="#f5c842" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="bold">θ (theta)</text>
        </svg>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><span class="r">0 radians (0°)</span> points along the <b>positive X direction</b>.</span></li>
          <li><span class="bul">▸</span><span><span class="g">+90° (π/2 radians)</span> points along the <b>positive Y direction</b>.</span></li>
          <li><span class="bul">▸</span><span>Angles measure <b>counter-clockwise (CCW) positive</b> from the +X axis.</span></li>
          <li><span class="bul">▸</span><span>We call an angle in this 2D plane <span class="y">&theta; (theta)</span>.</span></li>
        </ul>
      </div>
    </div>`,

    // 4. Perspective: Why X+ is Forward
    `<span class="tag">// 03 · frc.perspective</span>
    <h2>Looking <span class="y">Forwards</span> = 0°</h2>
    <p class="lead">In FRC robotics, we orient the coordinate frame so that looking straight ahead is 0° instead of 90°.</p>
    <div class="two">
      <div style="background:rgba(4,8,22,0.7);border:1px solid rgba(45,123,255,0.2);border-radius:6px;padding:16px;display:flex;justify-content:center;align-items:center;">
        <svg viewBox="-140 -140 280 280" width="260" height="260" style="overflow:visible;">
          <!-- Grid -->
          <line x1="-120" y1="0" x2="120" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <line x1="0" y1="-120" x2="0" y2="120" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <!-- +X Forward (upward in robot view) -->
          <line x1="0" y1="0" x2="0" y2="-110" stroke="#f44767" stroke-width="3.5"/>
          <polygon points="0,-118 -6,-106 6,-106" fill="#f44767"/>
          <text x="10" y="-105" fill="#f44767" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="bold">+X (Forwards, 0°)</text>
          <!-- +Y Left -->
          <line x1="0" y1="0" x2="-110" y2="0" stroke="#4ec9b0" stroke-width="3.5"/>
          <polygon points="-118,0 -106,-6 -106,6" fill="#4ec9b0"/>
          <text x="-125" y="20" fill="#4ec9b0" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="bold">+Y (Left, +90°)</text>
          <!-- Robot silhouette -->
          <rect x="-24" y="-30" width="48" height="60" rx="4" fill="rgba(45,123,255,0.25)" stroke="#2d7bff" stroke-width="1.5"/>
          <polygon points="0,-24 -8,-8 8,-8" fill="#e8a020"/>
        </svg>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><span class="r">+X points FORWARD</span> (robot drive direction).</span></li>
          <li><span class="bul">▸</span><span><span class="g">+Y points to the LEFT</span> (strafe left).</span></li>
          <li><span class="bul">▸</span><span><span class="y">+θ rotates COUNTER-CLOCKWISE</span> (turning left).</span></li>
          <li><span class="bul">▸</span><span>This matches standard mathematical coordinate frames rotated for an intuitive driver viewpoint.</span></li>
        </ul>
      </div>
    </div>`,

    // 5. Translation2d
    `<span class="tag">// 04 · translation2d</span>
    <h2><span class="y">Translation2d</span>: Linear Movement</h2>
    <p class="lead">A <span class="t">Translation2d</span> represents a relative displacement vector &lang;x, y&rang; between two locations.</p>
    <div class="two">
      <div style="background:rgba(4,8,22,0.7);border:1px solid rgba(45,123,255,0.2);border-radius:6px;padding:16px;display:flex;justify-content:center;align-items:center;">
        <svg viewBox="-30 -140 220 170" width="260" height="200">
          <line x1="0" y1="0" x2="160" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
          <line x1="0" y1="0" x2="0" y2="-120" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
          <!-- +X and +Y axis cues -->
          <line x1="0" y1="0" x2="0" y2="-100" stroke="#f44767" stroke-width="2"/>
          <line x1="0" y1="0" x2="100" y2="0" stroke="#4ec9b0" stroke-width="2"/>
          <!-- Vector (2, 3) -->
          <line x1="0" y1="0" x2="90" y2="-80" stroke="#f5c842" stroke-width="3"/>
          <polygon points="90,-80 78,-72 84,-62" fill="#f5c842"/>
          <circle cx="90" cy="-80" r="4" fill="#f5c842"/>
          <text x="96" y="-82" fill="#f5c842" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="bold">(2, 3)</text>
          <text x="32" y="-45" fill="#c8d3e8" font-family="'JetBrains Mono',monospace" font-size="11">&lang;2, 3&rang;</text>
        </svg>
      </div>
      <div class="code">
        <span class="cl"><span class="c">// Construct with X and Y in meters</span></span>
        <span class="cl"><span class="t">Translation2d</span> t1 = <span class="k">new</span> <span class="t">Translation2d</span>(<span class="n">2.0</span>, <span class="n">3.0</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="k">double</span> x = t1.<span class="me">getX</span>(); <span class="c">// 2.0</span></span>
        <span class="cl"><span class="k">double</span> y = t1.<span class="me">getY</span>(); <span class="c">// 3.0</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Norm is straight-line distance from origin</span></span>
        <span class="cl"><span class="k">double</span> distance = t1.<span class="me">getNorm</span>(); <span class="c">// √(2² + 3²)</span></span>
      </div>
    </div>
    <div class="frow">
      <div class="ftitle"><span class="y">Key concept:</span> A translation is the <b>arrow (the operation of moving)</b>, not just a standalone point!</div>
    </div>`,

    // 6. Adding Translations (Tip to Tail)
    `<span class="tag">// 05 · vector.addition</span>
    <h2>Adding <span class="y">Translations</span></h2>
    <p class="lead">Translations add component-by-component. Graphically, this is <b>tip-to-tail vector addition</b>.</p>
    <div class="two">
      <div style="background:rgba(4,8,22,0.7);border:1px solid rgba(45,123,255,0.2);border-radius:6px;padding:12px;display:flex;justify-content:center;align-items:center;">
        <svg viewBox="-20 -150 240 170" width="260" height="200">
          <line x1="0" y1="0" x2="200" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <line x1="0" y1="0" x2="0" y2="-130" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <!-- T1: (1, 2) -->
          <line x1="0" y1="0" x2="30" y2="-60" stroke="#2d7bff" stroke-width="2.5"/>
          <text x="6" y="-30" fill="#5b9bff" font-family="'JetBrains Mono',monospace" font-size="11">T1 &lang;1,2&rang;</text>
          <!-- T2 from tip of T1 -->
          <line x1="30" y1="-60" x2="120" y2="-90" stroke="#e8a020" stroke-width="2.5" stroke-dasharray="4,2"/>
          <text x="65" y="-85" fill="#f5c842" font-family="'JetBrains Mono',monospace" font-size="11">T2 &lang;3,1&rang;</text>
          <!-- Result T1 + T2 = <4, 3> -->
          <line x1="0" y1="0" x2="120" y2="-90" stroke="#4ec9b0" stroke-width="3"/>
          <circle cx="120" cy="-90" r="4" fill="#4ec9b0"/>
          <text x="126" y="-92" fill="#4ec9b0" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="bold">T1+T2 &lang;4,3&rang;</text>
        </svg>
      </div>
      <div class="code">
        <span class="cl"><span class="t">Translation2d</span> t1 = <span class="k">new</span> <span class="t">Translation2d</span>(<span class="n">1.0</span>, <span class="n">2.0</span>);</span>
        <span class="cl"><span class="t">Translation2d</span> t2 = <span class="k">new</span> <span class="t">Translation2d</span>(<span class="n">3.0</span>, <span class="n">1.0</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Plus operator combines them</span></span>
        <span class="cl"><span class="t">Translation2d</span> sum = t1.<span class="me">plus</span>(t2);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// sum.getX() == 4.0</span></span>
        <span class="cl"><span class="c">// sum.getY() == 3.0</span></span>
        <span class="cl"><span class="c">// Order doesn't matter: t1.plus(t2) == t2.plus(t1)</span></span>
      </div>
    </div>`,

    // 7. Kinematic Chaining
    `<span class="tag">// 06 · kinematic.chaining</span>
    <h2>Kinematic <span class="y">Chaining</span></h2>
    <p class="lead">Rigorous naming prevents math bugs: name every vector <b>[startPoint]To[endPoint]</b>.</p>
    <div class="two">
      <div style="background:rgba(4,8,22,0.7);border:1px solid rgba(45,123,255,0.2);border-radius:6px;padding:12px;display:flex;justify-content:center;align-items:center;">
        <svg viewBox="-20 -20 240 220" width="260" height="220">
          <!-- Robot body -->
          <rect x="20" y="80" width="80" height="100" rx="6" fill="rgba(45,123,255,0.18)" stroke="#2d7bff" stroke-width="2"/>
          <!-- Robot center origin -->
          <circle cx="60" cy="130" r="5" fill="#f44767"/>
          <text x="18" y="150" fill="#c8d3e8" font-family="'JetBrains Mono',monospace" font-size="10">Robot Center</text>
          <!-- Camera at front-left corner -->
          <rect x="25" y="85" width="16" height="12" fill="#4ec9b0"/>
          <text x="15" y="75" fill="#4ec9b0" font-family="'JetBrains Mono',monospace" font-size="10">Camera</text>
          <!-- Target in distance -->
          <rect x="180" y="15" width="25" height="15" fill="#f5c842"/>
          <text x="175" y="10" fill="#f5c842" font-family="'JetBrains Mono',monospace" font-size="10">Target</text>
          <!-- Vector vehicle -> camera -->
          <line x1="60" y1="130" x2="33" y2="91" stroke="#e8a020" stroke-width="2"/>
          <!-- Vector camera -> target -->
          <line x1="33" y1="91" x2="185" y2="22" stroke="#5b9bff" stroke-width="2"/>
          <!-- Vector vehicle -> target -->
          <line x1="60" y1="130" x2="185" y2="22" stroke="#4ec9b0" stroke-width="2.5" stroke-dasharray="3,2"/>
        </svg>
      </div>
      <div>
        <div class="code tight">
          <span class="cl"><span class="t">Translation2d</span> vehicleToTarget =</span>
          <span class="cl">&nbsp;&nbsp;vehicleToCamera.<span class="me">plus</span>(cameraToTarget);</span>
        </div>
        <ul class="bullets" style="margin-top:14px;">
          <li><span class="bul">▸</span><span>The <b>inside frames cancel out</b>: <span class="y">vehicleTo<del>Camera</del></span> + <span class="y"><del>camera</del>ToTarget</span> = <span class="g">vehicleToTarget</span>.</span></li>
          <li><span class="bul">▸</span><span>If the inside terms don't match, the math is invalid!</span></li>
        </ul>
      </div>
    </div>`,

    // 8. Translation Inverses
    `<span class="tag">// 07 · inverses</span>
    <h2>Translation <span class="y">Inverses</span></h2>
    <p class="lead">Inverting a translation negates its (X, Y) components, reversing the direction: <b>A to B</b> becomes <b>B to A</b>.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Given vehicle-to-shooter constant:</span></span>
        <span class="cl"><span class="t">Translation2d</span> vehicleToShooter =</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">Translation2d</span>(-<span class="n">0.3</span>, <span class="n">0.2</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// unaryMinus() flips to shooterToVehicle</span></span>
        <span class="cl"><span class="t">Translation2d</span> shooterToVehicle =</span>
        <span class="cl">&nbsp;&nbsp;vehicleToShooter.<span class="me">unaryMinus</span>();</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Chain to find shooterToTarget:</span></span>
        <span class="cl"><span class="t">Translation2d</span> shooterToTarget =</span>
        <span class="cl">&nbsp;&nbsp;shooterToVehicle.<span class="me">plus</span>(vehicleToTarget);</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Rule</div>
          <div class="ftitle"><code>A.unaryMinus()</code></div>
          <div class="fdesc">Flips &lang;x, y&rang; to &lang;-x, -y&rang;. Essential when vision or sensors report target-to-camera instead of camera-to-target.</div>
        </div>
        <div class="frow" style="margin-top:14px;">
          <div class="ftitle"><span class="g">Chain complete:</span><br><span class="y">shooterToVehicle</span> + <span class="y">vehicleToCamera</span> + <span class="y">cameraToTarget</span> = <span class="g">shooterToTarget</span></div>
        </div>
      </div>
    </div>`,

    // 9. Rotation2d
    `<span class="tag">// 08 · rotation2d</span>
    <h2><span class="y">Rotation2d</span>: Orientations &amp; Angles</h2>
    <p class="lead"><span class="t">Rotation2d</span> represents a 2D angle while avoiding costly and repetitive trigonometry calculations.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Construct from degrees or radians</span></span>
        <span class="cl"><span class="t">Rotation2d</span> r1 = <span class="t">Rotation2d</span>.<span class="me">fromDegrees</span>(<span class="n">45.0</span>);</span>
        <span class="cl"><span class="t">Rotation2d</span> r2 = <span class="t">Rotation2d</span>.<span class="me">fromRadians</span>(<span class="t">Math</span>.PI / <span class="n">2</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Cached sine and cosine</span></span>
        <span class="cl"><span class="k">double</span> cos = r1.<span class="me">getCos</span>();</span>
        <span class="cl"><span class="k">double</span> sin = r1.<span class="me">getSin</span>();</span>
        <span class="cl"><span class="k">double</span> deg = r1.<span class="me">getDegrees</span>(); <span class="c">// 45.0</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Adding rotations adds their angles</span></span>
        <span class="cl"><span class="t">Rotation2d</span> sum = r1.<span class="me">plus</span>(r2); <span class="c">// 135.0 deg</span></span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><b>Precomputes sin/cos</b> on construction so matrix multiplications are instant.</span></li>
          <li><span class="bul">▸</span><span><span class="me">rotateBy()</span> and <span class="me">plus()</span> smoothly compose rotations.</span></li>
          <li><span class="bul">▸</span><span><span class="me">unaryMinus()</span> reverses rotation direction.</span></li>
          <li><span class="bul">▸</span><span>Constants: <span class="t">Rotation2d</span>.<span class="me">kZero</span>, <span class="t">Rotation2d</span>.<span class="me">kPi</span>, <span class="t">Rotation2d</span>.<span class="me">kCW90deg</span>.</span></li>
        </ul>
      </div>
    </div>`,

    // 10. Pose2d & Frames
    `<span class="tag">// 09 · pose2d</span>
    <h2><span class="y">Pose2d</span>: Position + Heading</h2>
    <p class="lead">A <span class="t">Pose2d</span> combines a <span class="t">Translation2d</span> and a <span class="t">Rotation2d</span> to define an absolute object position and a <b>local frame</b>.</p>
    <div class="two">
      <div style="background:rgba(4,8,22,0.7);border:1px solid rgba(45,123,255,0.2);border-radius:6px;padding:12px;display:flex;justify-content:center;align-items:center;">
        <svg viewBox="-30 -140 220 170" width="260" height="200">
          <line x1="0" y1="0" x2="160" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <line x1="0" y1="0" x2="0" y2="-120" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <!-- Pose at (60, -70) facing 45 deg -->
          <circle cx="60" cy="-70" r="5" fill="#e8a020"/>
          <!-- Local X' (red) -->
          <line x1="60" y1="-70" x2="95" y2="-105" stroke="#f44767" stroke-width="3"/>
          <text x="100" y="-105" fill="#f44767" font-family="'JetBrains Mono',monospace" font-size="10">+X'</text>
          <!-- Local Y' (green) -->
          <line x1="60" y1="-70" x2="25" y2="-105" stroke="#4ec9b0" stroke-width="3"/>
          <text x="12" y="-105" fill="#4ec9b0" font-family="'JetBrains Mono',monospace" font-size="10">+Y'</text>
          <text x="65" y="-55" fill="#f5c842" font-family="'JetBrains Mono',monospace" font-size="11">(x, y, θ)</text>
        </svg>
      </div>
      <div class="code">
        <span class="cl"><span class="c">// Position at (2.0m, 1.5m), facing 45°</span></span>
        <span class="cl"><span class="t">Pose2d</span> robotPose = <span class="k">new</span> <span class="t">Pose2d</span>(</span>
        <span class="cl">&nbsp;&nbsp;<span class="n">2.0</span>, <span class="n">1.5</span>, <span class="t">Rotation2d</span>.<span class="me">fromDegrees</span>(<span class="n">45.0</span>)</span>
        <span class="cl">);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="t">Translation2d</span> pos = robotPose.<span class="me">getTranslation</span>();</span>
        <span class="cl"><span class="t">Rotation2d</span> heading = robotPose.<span class="me">getRotation</span>();</span>
        <span class="cl"><span class="k">double</span> x = robotPose.<span class="me">getX</span>();</span>
        <span class="cl"><span class="k">double</span> y = robotPose.<span class="me">getY</span>();</span>
      </div>
    </div>`,

    // 11. Global Field Frame vs Local Frames
    `<span class="tag">// 10 · frames</span>
    <h2>Global &amp; <span class="y">Local Frames</span></h2>
    <p class="lead">The <b>Field Frame</b> (global origin) is placed at the right corner of the Blue Alliance wall.</p>
    <div class="two">
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Global Frame</div>
          <div class="ftitle">Field Frame</div>
          <div class="fdesc">Origin at blue wall right corner. +X points down field length toward red wall; +Y points across width to the left.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Local Frame</div>
          <div class="ftitle">fieldToVehicle</div>
          <div class="fdesc">Robot frame tracked relative to the field origin via odometry &amp; vision estimation.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Subsystem Frame</div>
          <div class="ftitle">vehicleToCamera</div>
          <div class="fdesc">Constant offset measured in CAD from robot center to camera lens.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Detection Frame</div>
          <div class="ftitle">cameraToTarget</div>
          <div class="fdesc">Relative vector measured by vision pipeline from camera to AprilTag.</div>
        </div>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span>Expressing hardware in local frames keeps constants fixed even as the robot turns and drives.</span></li>
          <li><span class="bul">▸</span><span>Pose math maps everything to global coordinates effortlessly!</span></li>
        </ul>
      </div>
    </div>`,

    // 12. Transform2d & Applying Transforms
    `<span class="tag">// 11 · transforms</span>
    <h2><span class="y">Transform2d</span>: Moving Frames</h2>
    <p class="lead">A <span class="t">Transform2d</span> represents the spatial difference between two poses and moves one frame into another.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Start pose</span></span>
        <span class="cl"><span class="t">Pose2d</span> start = <span class="k">new</span> <span class="t">Pose2d</span>(<span class="n">2.0</span>, <span class="n">1.0</span>, <span class="t">Rotation2d</span>.<span class="me">fromDegrees</span>(<span class="n">45</span>));</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Move forward 2.0m in the ROBOT's local frame:</span></span>
        <span class="cl"><span class="t">Transform2d</span> forward2m = <span class="k">new</span> <span class="t">Transform2d</span>(</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">Translation2d</span>(<span class="n">2.0</span>, <span class="n">0.0</span>),</span>
        <span class="cl">&nbsp;&nbsp;<span class="t">Rotation2d</span>.<span class="me">kZero</span></span>
        <span class="cl">);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// plus() / transformBy() applies in local frame</span></span>
        <span class="cl"><span class="t">Pose2d</span> end = start.<span class="me">plus</span>(forward2m);</span>
      </div>
      <div>
        <div class="bigq">Transforms are evaluated <b>locally</b> in the frame of the pose they are applied to.</div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span>Moving &lang;2, 0&rang; on a robot facing 45° moves it diagonally in field space automatically.</span></li>
          <li><span class="bul">▸</span><span><span class="me">poseA.minus(poseB)</span> calculates the <span class="t">Transform2d</span> from B to A.</span></li>
        </ul>
      </div>
    </div>`,

    // 13. Vision Target Transformation
    `<span class="tag">// 12 · vision.transform</span>
