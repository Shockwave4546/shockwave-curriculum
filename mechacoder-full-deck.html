<script>
window.registerLesson('repo-1', {
  title: 'Git & GitHub Basics',
  tag: '// git.basics()',
  slides: [
    // 1. HERO
    `<div data-center>
      <span class="tag">// git.basics() · intro</span>
      <h1>Git &amp; <span class="y">GitHub</span> Basics</h1>
      <p class="lead">The fundamental tools for collaboration, history,<br>and safety in FRC software development.</p>
      <div>
        <span class="badge by">Level 1</span>
        <span class="badge bb">Version Control</span>
        <span class="badge bg">Collaboration</span>
      </div>
    </div>`,

    // 2. WHY VERSION CONTROL
    `<div class="inner">
      <span class="tag">// 01 · why.version_control()</span>
      <h2>Why use <span class="y">Version Control</span>?</h2>
      <div class="two">
        <ul class="bullets">
          <li><span class="bul">▸</span><span><span class="y">History</span>: Go back in time to when the code actually worked.</span></li>
          <li><span class="bul">▸</span><span><span class="b">Collaboration</span>: Many students working on the same files simultaneously.</span></li>
          <li><span class="bul">▸</span><span><span class="g">Safety Net</span>: Experiment without fear of breaking the "main" robot code.</span></li>
          <li><span class="bul">▸</span><span><span class="p">Blame</span>: See exactly who changed what line (and why).</span></li>
        </ul>
        <div class="bigq">
          "It worked yesterday, but I don't know what I changed."<br>
          <span class="m" style="font-size:0.7em">— Every programmer, before they learned Git.</span>
        </div>
      </div>
    </div>`,

    // 3. KEY CONCEPTS
    `<div class="inner">
      <span class="tag">// 02 · key.concepts()</span>
      <h2>Git <span class="y">Fundamentals</span></h2>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Storage</div>
          <div class="ftitle b">Repository (Repo)</div>
          <div class="fdesc">Your project's folder, including its entire history and metadata.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Snapshot</div>
          <div class="ftitle y">Commit</div>
          <div class="fdesc">A saved version of the project. Like a "save point" in a game.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Parallel Universe</div>
          <div class="ftitle g">Branch</div>
          <div class="fdesc">A separate line of development (e.g., "feature/auto-intake").</div>
        </div>
        <div class="fcard">
          <div class="flabel">The Cloud</div>
          <div class="ftitle p">Remote (Origin)</div>
          <div class="fdesc">The version of your repo stored on GitHub's servers.</div>
        </div>
      </div>
    </div>`,

    // 4. GITHUB NAVIGATION
    `<div class="inner">
      <span class="tag">// 03 · github.tour()</span>
      <h2>Navigating <span class="y">GitHub</span></h2>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="b">Repositories</span>: Home for your code, README, and license.</span></li>
        <li><span class="bul">▸</span><span><span class="y">Branch Dropdown</span>: Switch between <span class="k">main</span> and feature branches.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Commits</span>: View the chronological "paper trail" of the project.</span></li>
        <li><span class="bul">▸</span><span><span class="p">Issues &amp; PRs</span>: Track bugs and propose code changes for review.</span></li>
        <li><span class="bul">▸</span><span><span class="b">README.md</span>: The front page of your project with setup instructions.</span></li>
      </ul>
    </div>`,

    // 5. CLONE
    `<div class="inner">
      <span class="tag">// 04 · git.clone()</span>
      <h2>Getting the <span class="y">Code</span></h2>
      <p class="lead">Download the repository to your local machine to start working.</p>
      <div class="code">
        <span class="cl"><span class="c"># Clone using HTTPS (Simple)</span></span>
        <span class="cl"><span class="k">git</span> clone <span class="s">"https://github.com/Team6328/RobotCode2026.git"</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># Or clone using SSH (Secure/No Password)</span></span>
        <span class="cl"><span class="k">git</span> clone <span class="s">"git@github.com:Team6328/RobotCode2026.git"</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="k">cd</span> RobotCode2026</span>
      </div>
      <p class="m" style="margin-top:15px; font-size:0.85em;">Use SSH if you've added your public key to GitHub settings.</p>
    </div>`,

    // 6. BRANCH
    `<div class="inner">
      <span class="tag">// 05 · git.branch()</span>
      <h2>Working on <span class="y">Features</span></h2>
      <p class="lead">Never work directly on <span class="b">main</span>. Create a branch for your specific task.</p>
      <div class="code">
        <span class="cl"><span class="c"># Create and switch to a new branch</span></span>
        <span class="cl"><span class="k">git</span> switch -c <span class="s">"feature/intake-logic"</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># To see what branch you are on</span></span>
        <span class="cl"><span class="k">git</span> branch</span>
      </div>
      <p class="m" style="margin-top:15px; font-size:0.85em;">Naming convention: <span class="y">feature/description</span> or <span class="y">fix/description</span>.</p>
    </div>`,

    // 7. MODIFY & STAGE
    `<div class="inner">
      <span class="tag">// 06 · git.commit()</span>
      <h2>Saving <span class="y">Progress</span></h2>
      <p class="lead">The cycle of making changes and committing them.</p>
      <div class="code">
        <span class="cl"><span class="c"># Check what has changed</span></span>
        <span class="cl"><span class="k">git</span> status</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># Stage all changes for the next commit</span></span>
        <span class="cl"><span class="k">git</span> add .</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># Commit with a descriptive message</span></span>
        <span class="cl hl"><span class="k">git</span> commit -m <span class="s">"Add basic intake control logic"</span></span>
      </div>
      <p class="m" style="margin-top:15px; font-size:0.85em;">Good messages use <span class="g">present tense</span> (e.g. "Add feature", not "Added feature").</p>
    </div>`,

    // 8. PUSH
    `<div class="inner">
      <span class="tag">// 07 · git.push()</span>
      <h2>Sharing with the <span class="y">Team</span></h2>
      <p class="lead">Upload your local commits to the remote repository on GitHub.</p>
      <div class="code">
        <span class="cl"><span class="c"># The first time you push a new branch</span></span>
        <span class="cl hl"><span class="k">git</span> push -u origin <span class="s">"feature/intake-logic"</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># After the first time, just:</span></span>
        <span class="cl"><span class="k">git</span> push</span>
      </div>
      <p class="m" style="margin-top:15px; font-size:0.85em;">This makes your code visible to others for review.</p>
    </div>`,

    // 9. PULL REQUEST BASICS
    `<div class="inner">
      <span class="tag">// 08 · pull_request.flow()</span>
      <h2>The <span class="y">Pull Request</span> (PR)</h2>
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle"><span class="y">Open PR</span></div><div class="tldesc">On GitHub, propose merging your branch into main. Write a good description.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--blue2);box-shadow:0 0 0 2px var(--blue2)"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle"><span class="b">Review &amp; Feedback</span></div><div class="tldesc">Mentors or other students check your code, leave comments, and suggest fixes.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle"><span class="g">CI Checks</span></div><div class="tldesc">Automated tests run to ensure the code compiles and follows team standards.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--purple);box-shadow:0 0 0 2px var(--purple)"></div></div>
          <div class="tlc"><div class="tltitle"><span class="p">Merge</span></div><div class="tldesc">Once approved and checks pass, your code is joined with the main project.</div></div>
        </div>
      </div>
    </div>`,

    // 10. CODE REVIEW ETIQUETTE
    `<div class="inner">
      <span class="tag">// 09 · code_review.etiquette()</span>
      <h2>Code Review <span class="y">Etiquette</span></h2>
      <div class="fgrid">
        <div class="fcard no-bracket">
          <div class="flabel">As Author</div>
          <div class="ftitle b">Keep PRs Small</div>
          <div class="fdesc">A 100-line PR gets a real review. A 1,000-line PR gets a shrug and an approve. Explain the WHY in your description.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">As Author</div>
          <div class="ftitle y">Feedback Isn't Personal</div>
          <div class="fdesc">Comments are about the code, not about you. Respond to every comment — even just "fixed" or "good catch."</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">As Reviewer</div>
          <div class="ftitle g">Ask, Don't Accuse</div>
          <div class="fdesc">"What happens if the sensor is null here?" beats "this is broken." Questions teach; accusations shut people down.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">As Reviewer</div>
          <div class="ftitle p">Approve Good-Enough</div>
          <div class="fdesc">Perfect is the enemy of merged. Praise good ideas out loud — reviews are how the team levels up together.</div>
        </div>
      </div>
    </div>`,

    // 11. HABITS / MISTAKES
    `<div class="inner">
      <span class="tag">// 10 · git.best_practices()</span>
      <h2>Habits &amp; <span class="y">Heuristics</span></h2>
      <div class="fgrid">
        <div class="fcard no-bracket">
          <div class="flabel">Good Habit</div>
          <div class="ftitle g">Commit Small, Commit Often</div>
          <div class="fdesc">Easier to debug many small changes than one massive 1,000-line update.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">Mistake</div>
          <div class="ftitle r">The "Commit Everything" Bot</div>
          <div class="fdesc">Don't use 'git add .' blindly if you have temp files or secrets in your folder.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">Good Habit</div>
          <div class="ftitle b">Pull Before You Start</div>
          <div class="fdesc">Run 'git pull' frequently to stay in sync with what others have merged.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">Mistake</div>
          <div class="ftitle p">The "Force Push"</div>
          <div class="fdesc">NEVER 'git push --force' on shared branches like main. It overwrites history.</div>
        </div>
      </div>
    </div>`,

    // 11. RECAP
    `<div data-center>
      <span class="tag">// git.basics() · recap</span>
      <h2>Git <span class="y">Mastery</span> Starts Here</h2>
      <ul class="bullets" style="display:inline-flex; flex-direction:column; text-align:left;">
        <li><span class="bul">▸</span><span><span class="b">Clone</span> to get the code.</span></li>
        <li><span class="bul">▸</span><span><span class="y">Branch</span> to start new work.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Commit</span> often with clear messages.</span></li>
        <li><span class="bul">▸</span><span><span class="p">Push</span> to GitHub for review.</span></li>
        <li><span class="bul">▸</span><span><span class="y">Pull Request</span> to merge into main.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Review</span> each other's code with kindness and curiosity.</span></li>
      </ul>
      <p class="lead" style="margin-top:30px;">Don't be afraid to ask for help with merge conflicts!<br>Even seniors get them.</p>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('repo-2', {
  title: 'Git — History & Merging',
  tag: '// git.history.merge()',
  slides: [
    // 1. Hero
    `<div data-center>
      <span class="tag">// git.history.merge()</span>
      <h1>Git — <span class="y">History</span> &amp; Merging</h1>
      <p class="lead">Moving beyond simple commits. Learn to navigate the timeline, <br>linearize your work, and resolve conflicts with confidence.</p>
      <div>
        <span class="badge by">Level 2</span>
        <span class="badge bb">Advanced Workflow</span>
        <span class="badge bg">Conflict Resolution</span>
      </div>
    </div>`,

    // 2. Reading History
    `<div class="inner">
      <span class="tag">// 01 · reading.history()</span>
      <h2>Reading the <span class="y">Timeline</span></h2>
      <p class="lead">Context is everything. Use logs to understand how the code reached its current state.</p>
      <div class="code">
        <span class="cl"><span class="c"># See a condensed graph of all branches</span></span>
        <span class="cl"><span class="k">git</span> log --oneline --graph --all</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># Inspect a specific commit's changes</span></span>
        <span class="cl"><span class="k">git</span> show <span class="s">"a1b2c3d"</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># Compare your branch to main</span></span>
        <span class="cl"><span class="k">git</span> diff main..feature-arm-pid</span>
      </div>
      <ul class="bullets" style="margin-top:20px;">
        <li><span class="bul">▸</span><span><span class="b">--oneline</span>: One commit per line for high-level scanning.</span></li>
        <li><span class="bul">▸</span><span><span class="b">--graph</span>: Visualizes merges and branch departures.</span></li>
      </ul>
    </div>`,

    // 3. Finding Changes
    `<div class="inner">
      <span class="tag">// 02 · finding.changes()</span>
      <h2>Who changed <span class="y">this</span>?</h2>
      <p class="lead">When a bug appears, you need to find when and why the logic changed.</p>
      <div class="code">
        <span class="cl"><span class="c"># See author and commit for every line in a file</span></span>
        <span class="cl"><span class="k">git</span> blame src/main/java/frc/robot/Robot.java</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># Search commit history for a specific string</span></span>
        <span class="cl"><span class="k">git</span> log -S <span class="s">"setReference"</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># See history of changes for a specific file</span></span>
        <span class="cl"><span class="k">git</span> log -p <span class="s">"Constants.java"</span></span>
      </div>
      <ul class="bullets" style="margin-top:20px;">
        <li><span class="bul">▸</span><span><span class="y">git blame</span>: Finds the "point of origin" for specific lines.</span></li>
        <li><span class="bul">▸</span><span><span class="y">git log -S</span>: The "pickaxe" — finds where a string was added or removed.</span></li>
      </ul>
    </div>`,

    // 4. Merge vs Rebase
    `<div class="inner">
      <span class="tag">// 03 · merge.vs.rebase()</span>
      <h2>Two Paths to <span class="y">Integration</span></h2>
      <div class="two">
        <div>
          <div class="badge bb">git merge</div>
          <ul class="bullets">
            <li><span class="bul">▸</span><span><span class="b">Non-destructive</span>: Keeps the actual history exactly as it happened.</span></li>
            <li><span class="bul">▸</span><span>Creates a "Merge Commit" to join the two timelines.</span></li>
            <li><span class="bul">▸</span><span>Can get "messy" with many tiny merge bubbles.</span></li>
          </ul>
        </div>
        <div>
          <div class="badge bp">git rebase</div>
          <ul class="bullets">
            <li><span class="bul">▸</span><span><span class="p">Linear History</span>: Rewrites your commits as if they started from the latest main.</span></li>
            <li><span class="bul">▸</span><span>Keeps the project history clean and easy to read.</span></li>
            <li><span class="bul">▸</span><span>Rewrites history — dangerous on shared branches!</span></li>
          </ul>
        </div>
      </div>
    </div>`,

    // 5. Rebasing
    `<div class="inner">
      <span class="tag">// 04 · rebasing.logic()</span>
      <h2>The <span class="y">Golden Rule</span> of Rebasing</h2>
      <p class="lead">Never rebase a branch that others are working on. It changes commit IDs and breaks their history.</p>
      <div class="code">
        <span class="cl"><span class="c"># Sync with main while keeping your history linear</span></span>
        <span class="cl"><span class="k">git</span> fetch origin</span>
        <span class="cl"><span class="k">git</span> rebase origin/main</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># Pro tip: Pull and rebase in one step</span></span>
        <span class="cl"><span class="k">git</span> pull --rebase origin main</span>
      </div>
      <ul class="bullets" style="margin-top:20px;">
        <li><span class="bul">▸</span><span>Use rebase for <span class="g">local cleanup</span> before you push your final work.</span></li>
        <li><span class="bul">▸</span><span>If you get stuck: <span class="r">git rebase --abort</span> returns you to safety.</span></li>
      </ul>
    </div>`,

    // 6. Merge Conflicts
    `<div class="inner">
      <span class="tag">// 05 · resolving.conflicts()</span>
      <h2>Handling <span class="y">Conflicts</span></h2>
      <p class="lead">Conflicts happen when two people edit the same line. Git stops and asks for your help.</p>
      <div class="code">
        <span class="cl">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</span>
        <span class="cl"><span class="me">motor</span>.<span class="me">set</span>(<span class="n">0.5</span>); <span class="c">// Current change</span></span>
        <span class="cl">=======</span>
        <span class="cl"><span class="me">motor</span>.<span class="me">set</span>(<span class="n">0.7</span>); <span class="c">// Incoming change</span></span>
        <span class="cl">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-speed</span>
      </div>
      <ul class="bullets" style="margin-top:20px;">
        <li><span class="bul">▸</span><span><span class="y">Resolve</span>: Edit the file to keep the correct code (remove markers).</span></li>
        <li><span class="bul">▸</span><span><span class="y">Continue</span>: Run <span class="y">git add .</span> then <span class="y">git rebase --continue</span>.</span></li>
      </ul>
    </div>`,

    // 7. Squashing & Amending
    `<div class="inner">
      <span class="tag">// 06 · history.cleanup()</span>
      <h2>Cleaning Up <span class="y">History</span></h2>
      <p class="lead">Before you push to main, you can clean up "work in progress" commits so the team sees a polished story.</p>
      <div class="code">
        <span class="cl"><span class="c"># Fix the last commit (mistyped message or forgot a file)</span></span>
        <span class="cl"><span class="k">git</span> commit --amend -m <span class="s">"The correct message"</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c"># Combine the last 3 commits into one (Interactive Rebase)</span></span>
        <span class="cl"><span class="k">git</span> rebase -i HEAD~3</span>
      </div>
      <ul class="bullets" style="margin-top:20px;">
        <li><span class="bul">▸</span><span><span class="y">Amending</span>: Perfect for fixing a typo without creating a new commit.</span></li>
        <li><span class="bul">▸</span><span><span class="y">Squashing</span>: Use interactive rebase to merge "debug" commits together.</span></li>
      </ul>
    </div>`,

    // 8. Reverting vs Resetting
    `<div class="inner">
      <span class="tag">// 07 · undoing.work()</span>
      <h2>Revert vs <span class="y">Reset</span></h2>
      <div class="two">
        <div class="fcard">
          <div class="flabel">safe &amp; public</div>
          <div class="ftitle g">git revert</div>
          <div class="fdesc">Creates a NEW commit that does the exact opposite of a previous one. Use this for errors already pushed to GitHub.</div>
        </div>
        <div class="fcard">
          <div class="flabel">destructive &amp; local</div>
          <div class="ftitle r">git reset</div>
          <div class="fdesc">Moves the branch pointer back in time. Effectively deletes commits. Only use this for local mistakes not yet pushed!</div>
        </div>
      </div>
      <div class="code" style="margin-top:20px;">
        <span class="cl"><span class="k">git</span> revert <span class="s">"a1b2c3d"</span>  <span class="c">// Add "undo" commit</span></span>
        <span class="cl"><span class="k">git</span> reset --hard HEAD~1 <span class="c">// Delete last commit</span></span>
      </div>
    </div>`,

    // 9. Undo Scenarios
    `<div class="inner">
      <span class="tag">// 08 · undo.scenarios()</span>
      <h2>Common <span class="y">"Oops"</span> Scenarios</h2>
      <div class="fgrid">
        <div class="fcard no-bracket">
          <div class="flabel">scenario</div>
          <div class="ftitle b">Uncommitted Mess</div>
          <div class="fdesc">Discard local changes in a file: <span class="y">git restore &lt;file&gt;</span></div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">scenario</div>
          <div class="ftitle r">Bad Commit Pushed</div>
          <div class="fdesc">Don't delete history! Use <span class="y">git revert</span> to fix it publicly.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">scenario</div>
          <div class="ftitle g">Wrong Branch</div>
          <div class="fdesc">Commit on main by accident? <span class="y">git cherry-pick</span> it to the right branch.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">scenario</div>
          <div class="ftitle p">Detached HEAD</div>
          <div class="fdesc">Git is confused? Just <span class="y">git switch -c new-branch</span> to save your work.</div>
        </div>
      </div>
    </div>`,

    // 10. Best Practice Workflow
    `<div class="inner">
      <span class="tag">// 09 · workflow.best_practice()</span>
      <h2>A Clean <span class="y">History</span> Workflow</h2>
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle"><span class="y">1. Sync Daily</span></div><div class="tldesc">Start with <span class="y">git pull --rebase</span> to ensure you are building on the latest code.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--blue2);box-shadow:0 0 0 2px var(--blue2)"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle"><span class="b">2. Atomic Commits</span></div><div class="tldesc">Small, focused commits. One feature or one bug fix per commit.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle"><span class="g">3. Local Rebase</span></div><div class="tldesc">Before pushing, rebase against main to resolve conflicts locally where it is easiest.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--purple);box-shadow:0 0 0 2px var(--purple)"></div></div>
          <div class="tlc"><div class="tltitle"><span class="p">4. PR &amp; Merge</span></div><div class="tldesc">Push to GitHub and create a Pull Request. Once approved, merge into main.</div></div>
        </div>
      </div>
    </div>`,

    // 11. Recap
    `<div data-center>
      <span class="tag">// 10 · session.recap()</span>
      <h1>History is <span class="y">Power</span></h1>
      <p class="lead">Git is more than a save button. It is a time machine <br>and a collaboration engine.</p>
      <div class="stats">
        <div class="stat"><div class="sn">LOG</div><div class="sl">Understand context</div></div>
        <div class="stat"><div class="sn">REBASE</div><div class="sl">Keep history linear</div></div>
        <div class="stat"><div class="sn">REVERT</div><div class="sl">Fix mistakes safely</div></div>
      </div>
      <p class="m" style="margin-top:40px;">Next: Collaboration &amp; Pull Requests</p>
    </div>`
  ]
});

</script>

<!-- ===== subsystems-1.js ===== -->
<script>
window.registerLesson('subsystems-1', {
  title: 'Subsystems I — IO & Simple',
  tag: '// subsystems.io()',
  slides: [
    // 1. Hero
    `<div data-center>
      <span class="tag">// subsystems.io() · level 1</span>
      <h1>Subsystems <span class="y">I</span></h1>
      <p class="lead">Building hardware abstractions using the<br>AdvantageKit <span class="b">IO-layer</span> pattern.</p>
      <div class="stats">
        <div class="stat"><div class="sn">01</div><div class="sl">Hardware Abstraction</div></div>
        <div class="stat"><div class="sn">02</div><div class="sl">Sim & Replay</div></div>
        <div class="stat"><div class="sn">03</div><div class="sl">AdvantageKit</div></div>
      </div>
    </div>`,

    // 2. What is a subsystem?
    `<div>
      <span class="tag">// 01 · definition</span>
      <h2>What is a <span class="y">Subsystem</span>?</h2>
      <p class="lead">The fundamental building block of robot logic.</p>
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Extends <span class="t">SubsystemBase</span> to integrate with WPILib's Command scheduler.</span></li>
        <li><span class="bul">▸</span><span><span class="y">Encapsulates hardware</span>: owns the motors, sensors, and solenoids for one part of the robot.</span></li>
        <li><span class="bul">▸</span><span>Provides a <span class="b">high-level API</span> for commands (e.g., <span class="me">setIntakeSpeed</span> rather than <span class="me">motor.set</span>).</span></li>
        <li><span class="bul">▸</span><span>Runs <span class="me">periodic()</span> every 20ms for sensor updates and closed-loop monitoring.</span></li>
      </ul>
    </div>`,

    // 3. The Problem: Tight Coupling
    `<div>
      <span class="tag">// 02 · motivation</span>
      <h2>Why use an <span class="y">IO Layer</span>?</h2>
      <div class="two">
        <div>
          <p class="m">The "Old" Way (Coupled)</p>
          <ul class="bullets" style="gap:8px;">
            <li><span class="bul">▸</span><span>Logic is mixed with vendor APIs (TalonFX, SparkMax).</span></li>
            <li><span class="bul">▸</span><span>Impossible to unit test without a physical robot.</span></li>
            <li><span class="bul">▸</span><span>Simulation requires messy if-statements everywhere.</span></li>
          </ul>
        </div>
        <div class="bracket-tl" style="padding-left:20px;position:relative;">
          <p class="g">The AdvantageKit Way (Decoupled)</p>
          <ul class="bullets" style="gap:8px;">
            <li><span class="bul">▸</span><span>Logic is separated from hardware implementation.</span></li>
            <li><span class="bul">▸</span><span><span class="y">Replay</span>: run logic on logs from a previous match.</span></li>
            <li><span class="bul">▸</span><span>Seamless switching between Real, Sim, and Replay.</span></li>
          </ul>
        </div>
      </div>
    </div>`,

    // 4. The IO-Layer Pattern
    `<div>
      <span class="tag">// 03 · architecture</span>
      <h2>Architecture <span class="y">Overview</span></h2>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">interface</div>
          <div class="ftitle b">The IO Interface</div>
          <div class="fdesc">Defines what the hardware <i>can do</i> (inputs and outputs) without saying <i>how</i>.</div>
        </div>
        <div class="fcard">
          <div class="flabel">implementation</div>
          <div class="ftitle g">Hardware Impl</div>
          <div class="fdesc">The "Real" code that talks to CAN devices (CTRE/REV). Only exists for the real robot.</div>
        </div>
        <div class="fcard">
          <div class="flabel">implementation</div>
          <div class="ftitle p">Sim Impl</div>
          <div class="fdesc">Replaces motors with physics models (WPILib Sim). Allows coding without a robot.</div>
        </div>
        <div class="fcard">
          <div class="flabel">orchestrator</div>
          <div class="ftitle y">The Subsystem</div>
          <div class="fdesc">Contains the state machine and logic. It only talks to the Interface.</div>
        </div>
      </div>
    </div>`,

    // 5. IO Interface Definition
    `<div>
      <span class="tag">// 04 · code.interface</span>
      <h2>Defining the <span class="y">IO Interface</span></h2>
      <div class="code">
<span class="cl"><span class="k">public interface</span> <span class="t">IntakeIO</span> {</span>
<span class="cl">&nbsp;&nbsp;<span class="me">@AutoLog</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">public static class</span> <span class="t">IntakeIOInputs</span> {</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">public double</span> positionRad = <span class="n">0.0</span>;</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">public double</span> velocityRadPerSec = <span class="n">0.0</span>;</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">public double</span> appliedVolts = <span class="n">0.0</span>;</span>
<span class="cl">&nbsp;&nbsp;}</span>
<span class="cl">&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="k">default void</span> <span class="me">updateInputs</span>(<span class="t">IntakeIOInputs</span> inputs) {}</span>
<span class="cl">&nbsp;&nbsp;<span class="k">default void</span> <span class="me">setVoltage</span>(<span class="k">double</span> volts) {}</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 6. IO Implementation: Real Hardware
    `<div>
      <span class="tag">// 05 · code.implementation</span>
      <h2>Real <span class="y">Hardware</span> Impl</h2>
      <div class="code">
<span class="cl"><span class="k">public class</span> <span class="t">IntakeIOTalonFX</span> <span class="k">implements</span> <span class="t">IntakeIO</span> {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">private final</span> <span class="t">TalonFX</span> motor = <span class="k">new</span> <span class="t">TalonFX</span>(<span class="n">1</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="me">@Override</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">public void</span> <span class="me">updateInputs</span>(<span class="t">IntakeIOInputs</span> inputs) {</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;inputs.positionRad = motor.<span class="me">getPosition</span>().<span class="me">getValue</span>();</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;inputs.appliedVolts = motor.<span class="me">getMotorVoltage</span>().<span class="me">getValue</span>();</span>
<span class="cl">&nbsp;&nbsp;}</span>
<span class="cl">&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="me">@Override</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">public void</span> <span class="me">setVoltage</span>(<span class="k">double</span> volts) {</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;motor.<span class="me">setControl</span>(<span class="k">new</span> <span class="t">VoltageOut</span>(volts));</span>
<span class="cl">&nbsp;&nbsp;}</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 7. Sim Implementation
    `<div>
      <span class="tag">// 06 · simulation</span>
      <h2>The <span class="y">Simulation</span> Impl</h2>
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Uses WPILib's physics classes like <span class="t">DCMotorSim</span> or <span class="t">FlywheelSim</span>.</span></li>
        <li><span class="bul">▸</span><span><span class="y">Simulates voltage-to-motion</span>: "If I apply 6V, how fast should it spin in 20ms?"</span></li>
        <li><span class="bul">▸</span><span>Allows testing intake logic, auto routines, and setpoints without a robot.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Replay capability</span>: AdvantageKit can feed logged inputs into the <i>exact same</i> subsystem code later.</span></li>
      </ul>
    </div>`,

    // 8. Vendor Independence
    `<div>
      <span class="tag">// 07 · abstraction</span>
      <h2>Vendor <span class="y">Independence</span></h2>
      <div class="bigq">The Subsystem doesn't care if you use <span class="y">CTRE</span>, <span class="y">REV</span>, or <span class="y">Sim</span>.</div>
      <ul class="bullets">
        <li><span class="bul">▸</span><span>You can swap a TalonFX for a SparkMax by only changing the IO implementation.</span></li>
        <li><span class="bul">▸</span><span>Keeps vendor-specific "quirks" (units, config objects) out of your main logic.</span></li>
        <li><span class="bul">▸</span><span>Clean, readable subsystem code that focuses on <i>robot behavior</i>.</span></li>
      </ul>
    </div>`,

    // 9. Reading a Subsystem
    `<div>
      <span class="tag">// 08 · code.subsystem</span>
      <h2>Reading the <span class="y">Subsystem</span></h2>
      <div class="code">
<span class="cl"><span class="k">public</span> <span class="t">Intake</span>(<span class="t">IntakeIO</span> io) { <span class="k">this</span>.io = io; }</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="me">@Override</span></span>
<span class="cl"><span class="k">public void</span> <span class="me">periodic</span>() {</span>
<span class="cl">&nbsp;&nbsp;io.<span class="me">updateInputs</span>(inputs); <span class="c">// Fetch from HW/Sim</span></span>
<span class="cl">&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">processInputs</span>(<span class="s">"Intake"</span>, inputs); <span class="c">// Log it!</span></span>
<span class="cl">}</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">public void</span> <span class="me">runIntake</span>(<span class="k">double</span> speed) {</span>
<span class="cl">&nbsp;&nbsp;io.<span class="me">setVoltage</span>(speed * <span class="n">12.0</span>);</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 10. Steps to Add a New Subsystem
    `<div>
      <span class="tag">// 09 · workflow</span>
      <h2>Adding a <span class="y">New</span> Subsystem</h2>
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle">Define the IO Interface</div><div class="tldesc">Create the Inputs class with @AutoLog and required methods.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle">Create Hardware/Sim Impls</div><div class="tldesc">Write the TalonFX/SparkMax and Sim versions.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle">Write Subsystem Logic</div><div class="tldesc">Implement behavior using the IO methods.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div></div>
          <div class="tlc"><div class="tltitle">Register in RobotContainer</div><div class="tldesc">Check Robot.isReal() to instantiate the correct IO.</div></div>
        </div>
      </div>
    </div>`,

    // 11. Instantiation Logic
    `<div>
      <span class="tag">// 10 · robot.container</span>
      <h2>Choosing the <span class="y">Correct</span> IO</h2>
      <div class="code">
<span class="cl"><span class="k">if</span> (<span class="t">Robot</span>.<span class="me">isReal</span>()) {</span>
<span class="cl">&nbsp;&nbsp;intake = <span class="k">new</span> <span class="t">Intake</span>(<span class="k">new</span> <span class="t">IntakeIOTalonFX</span>());</span>
<span class="cl">} <span class="k">else if</span> (<span class="t">Robot</span>.<span class="me">isSimulation</span>()) {</span>
<span class="cl">&nbsp;&nbsp;intake = <span class="k">new</span> <span class="t">Intake</span>(<span class="k">new</span> <span class="t">IntakeIOSim</span>());</span>
<span class="cl">} <span class="k">else</span> {</span>
<span class="cl">&nbsp;&nbsp;intake = <span class="k">new</span> <span class="t">Intake</span>(<span class="k">new</span> <span class="t">IntakeIO</span>() {}); <span class="c">// Replay</span></span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 12. Best Practices
    `<div>
      <span class="tag">// 11 · best.practices()</span>
      <h2>IO Layer <span class="y">Golden Rules</span></h2>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">logging</div>
          <div class="ftitle b">Log Everything</div>
          <div class="fdesc">If it comes from the hardware (current, temp, position), it must be in the Inputs class.</div>
        </div>
        <div class="fcard">
          <div class="flabel">logic</div>
          <div class="ftitle y">No Logic in IO</div>
          <div class="fdesc">IO implementations should be "dumb." Keep the smarts in the Subsystem.</div>
        </div>
        <div class="fcard">
          <div class="flabel">types</div>
          <div class="ftitle g">Standard Units</div>
          <div class="fdesc">Use SI units (Radians, Meters, Volts) in the IO interface regardless of vendor.</div>
        </div>
        <div class="fcard">
          <div class="flabel">replay</div>
          <div class="ftitle p">Deterministic</div>
          <div class="fdesc">Don't use Timer.getFPGATimestamp() in the subsystem; use the log's timestamp.</div>
        </div>
      </div>
    </div>`,

    // 13. Recap
    `<div data-center>
      <span class="tag">// summary.exec()</span>
      <h1><span class="y">Abstraction</span> is Power</h1>
      <p class="lead">By separating IO from logic, we build robots that are<br><span class="b">testable</span>, <span class="g">simulatable</span>, and <span class="p">resilient</span>.</p>
      <ul class="bullets" style="display:inline-block; text-align:left;">
        <li><span class="bul">▸</span><span><span class="y">IO Interface</span>: The contract between logic and hardware.</span></li>
        <li><span class="bul">▸</span><span><span class="y">AutoLog</span>: Automatic telemetry and replay support.</span></li>
        <li><span class="bul">▸</span><span><span class="y">Sim/Real</span>: Seamlessly switch environments.</span></li>
      </ul>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('subsystems-2', {
  title: 'Subsystems II — Advanced',
  tag: '// subsystems.advanced()',
  slides: [
    // 1. Hero
    `<div data-center>
      <span class="tag">// subsystems.advanced()</span>
      <h1>Subsystems II <br><span class="y">— Advanced</span></h1>
      <p class="lead">Moving beyond simple motor control to state machines, <br>closed-loop control, and physics-based simulation.</p>
      <div style="margin-top:20px;">
        <span class="badge by">Level 2</span>
        <span class="badge bb">Closed-Loop</span>
        <span class="badge bg">Simulation</span>
        <span class="badge bp">AdvantageKit</span>
      </div>
    </div>`,

    // 2. Roadmap
    `<span class="tag">// 01 · roadmap.next()</span>
    <h2>The Advanced <span class="y">Subsystem</span></h2>
    <p class="lead">A "pro" subsystem manages its own complexity so the rest of the robot doesn't have to.</p>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">Closed-Loop Control</span>: Using Profiled PID and Feedforward.</span></li>
      <li><span class="bul">▸</span><span><span class="b">State Machines</span>: Managing complex behaviors with enums and goals.</span></li>
      <li><span class="bul">▸</span><span><span class="g">Simulation</span>: Writing code that works in the pits and on the screen.</span></li>
      <li><span class="bul">▸</span><span><span class="p">Hardware Abstraction</span>: Separating logic from hardware via IO interfaces.</span></li>
    </ul>`,

    // 3. Closed-loop
    `<span class="tag">// 02 · control.closed_loop()</span>
    <h2>Control in <span class="y">Periodic</span></h2>
    <p class="lead">Instead of raw speed, we calculate the voltage needed to reach a goal.</p>
    <div class="code">
<span class="cl"><span class="k">public void</span> <span class="me">periodic</span>() {</span>
<span class="cl">&nbsp;&nbsp;io.<span class="me">updateInputs</span>(inputs);</span>
<span class="cl">&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">processInputs</span>(<span class="s">"Arm"</span>, inputs);</span>
<span class="cl">&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="c">// Calculate voltage using Profiled PID + Feedforward</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">double</span> feedback = controller.<span class="me">calculate</span>(inputs.positionRad, goalRad);</span>
<span class="cl">&nbsp;&nbsp;<span class="k">double</span> feedforward = ff.<span class="me">calculate</span>(goalRad, <span class="n">0.0</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl hl">&nbsp;&nbsp;io.<span class="me">setVoltage</span>(feedback + feedforward);</span>
<span class="cl">}</span>
    </div>`,

    // 4. State
    `<span class="tag">// 03 · state.management()</span>
    <h2>Subsystem <span class="y">State</span></h2>
    <p class="lead">Use Enums to define logical modes and target positions.</p>
    <div class="code">
<span class="cl"><span class="k">public enum</span> <span class="t">State</span> { <span class="t">STOWED</span>, <span class="t">INTAKE</span>, <span class="t">SCORE</span> }</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">public</span> <span class="t">Command</span> <span class="me">setGoal</span>(<span class="t">State</span> newState) {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">return</span> <span class="me">runOnce</span>(() -&gt; {</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">this</span>.state = newState;</span>
<span class="cl hl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">this</span>.goalRad = newState.targetRad;</span>
<span class="cl">&nbsp;&nbsp;});</span>
<span class="cl">}</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">public boolean</span> <span class="me">atGoal</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">return</span> <span class="t">Math</span>.<span class="me">abs</span>(inputs.positionRad - goalRad) &lt; <span class="n">0.05</span>;</span>
<span class="cl">}</span>
    </div>`,

    // 5. Tunable Gains
    `<span class="tag">// 04 · tuning.telemetry()</span>
    <h2>Tunable <span class="y">Gains</span></h2>
    <p class="lead">Don't re-deploy code just to change a PID value. Use <span class="t">LoggedTunableNumber</span>.</p>
    <div class="code">
<span class="cl"><span class="k">private final</span> <span class="t">LoggedTunableNumber</span> kP = </span>
<span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">LoggedTunableNumber</span>(<span class="s">"Arm/kP"</span>, <span class="n">2.0</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">public void</span> <span class="me">periodic</span>() {</span>
<span class="cl hl">&nbsp;&nbsp;<span class="k">if</span> (kP.<span class="me">hasChanged</span>(<span class="me">hashCode</span>())) {</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;controller.<span class="me">setP</span>(kP.<span class="me">get</span>());</span>
<span class="cl">&nbsp;&nbsp;}</span>
<span class="cl">&nbsp;&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Arm/Goal"</span>, goalRad);</span>
<span class="cl">&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Arm/AtGoal"</span>, <span class="me">atGoal</span>());</span>
<span class="cl">}</span>
    </div>`,

    // 6. Workflow
    `<span class="tag">// 05 · design.workflow()</span>
    <h2>Design <span class="y">Workflow</span></h2>
    <div class="tl">
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle"><span class="y">Define IO Interface</span></div><div class="tldesc">Specify what inputs (sensors) and outputs (volts) the hardware needs.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot" style="background:var(--blue2);box-shadow:0 0 0 2px var(--blue2)"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle"><span class="b">Implement Real &amp; Sim IO</span></div><div class="tldesc">Write the TalonFX code for the robot and physics code for the simulator.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle"><span class="g">Subsystem Logic</span></div><div class="tldesc">Add PID/FF controllers, state management, and periodic logging.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot" style="background:var(--purple);box-shadow:0 0 0 2px var(--purple)"></div></div>
        <div class="tlc"><div class="tltitle"><span class="p">Command Factories</span></div><div class="tldesc">Build high-level commands like <span class="me">score()</span> or <span class="me">intake()</span>.</div></div>
      </div>
    </div>`,

    // 7. Simulation
    `<span class="tag">// 06 · physics.sim()</span>
    <h2>Wired for <span class="y">Simulation</span></h2>
    <p class="lead">Simulation allows you to test your code without a robot.</p>
    <div class="code">
<span class="cl"><span class="k">public class</span> <span class="t">ArmIOSim</span> <span class="k">implements</span> <span class="t">ArmIO</span> {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">private</span> <span class="t">SingleJointedArmSim</span> sim = <span class="k">new</span> <span class="t">SingleJointedArmSim</span>(</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">DCMotor</span>.<span class="me">getKrakenX60</span>(<span class="n">1</span>), <span class="n">75.0</span>, <span class="n">0.5</span>, <span class="n">0.4</span>, <span class="n">0.0</span>, <span class="n">1.5</span>, <span class="k">true</span>, <span class="n">0.0</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public void</span> <span class="me">updateInputs</span>(<span class="t">ArmIOInputs</span> inputs) {</span>
<span class="cl hl">&nbsp;&nbsp;&nbsp;&nbsp;sim.<span class="me">update</span>(<span class="n">0.020</span>);</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;inputs.positionRad = sim.<span class="me">getAngleRads</span>();</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;inputs.velocityRadPerSec = sim.<span class="me">getVelocityRadPerSec</span>();</span>
<span class="cl">&nbsp;&nbsp;}</span>
<span class="cl">}</span>
    </div>`,

    // 8. Telemetry
    `<span class="tag">// 07 · visualization.tools()</span>
    <h2>Telemetry &amp; <span class="y">Logging</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">AdvantageScope</span>: Visualize setpoints vs. actual position in real-time.</span></li>

<span class="cl"><span class="k">private static final</span> <span class="t">LoggedTunableNumber</span> kP = </span>

    // Slide 1: Hero
    `<div data-center>

    // Slide 3: AprilTagFieldLayout
    `<div class="inner">

<span class="cl"><span class="c">// Load the official layout for the current year</span></span>
<span class="cl"><span class="t">AprilTagFieldLayout</span> layout = <span class="t">AprilTagFieldLayout</span>.<span class="me">loadField</span>(</span>

<script>
window.registerLesson('troubleshooting-1', {
  title: 'Troubleshooting I — Runtime Debug',
  tag: '// debug.runtime()',
  slides: [
    `<div data-center>
      <span class="tag">// debug.runtime()</span>
      <h1>Troubleshooting I — <span class="y">Runtime Debug</span></h1>
      <p class="lead">Diagnostics, logs, and the art of figuring out why the robot isn't doing what you thought you told it to do.</p>
      <div class="frow" style="justify-content:center; border:none; background:none; box-shadow:none;">
        <span class="badge by">Level 1</span>
        <span class="badge bb">Diagnostics</span>
        <span class="badge bg">On-Robot</span>
      </div>
    </div>`,

    `<span class="tag">// 01 · the.mindset()</span>
    <h2>The Debugging <span class="y">Mindset</span></h2>
    <div class="bigq">"If you haven't seen it happen, <span class="y">you haven't fixed it.</span>"</div>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">Reproduce</span>: Make the error happen on command. If it's random, you can't be sure it's gone.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Isolate</span>: Remove variables. Does it happen in a simple test project? Without the mechanism attached?</span></li>
      <li><span class="bul">▸</span><span><span class="y">Read the Error</span>: Don't just see red text and panic. Read the FIRST line of the stack trace.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Change ONE Thing</span>: If you change three things and it works, you don't know why.</span></li>
    </ul>`,

    `<span class="tag">// 02 · log.sources()</span>
    <h2>Where are the <span class="y">Messages?</span></h2>
    <p class="lead">Robot code sends information to several places simultaneously.</p>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">Primary</div>
        <div class="ftitle b">Driver Station Console</div>
        <div class="fdesc">The most immediate view. High-level errors and explicit print statements appear here.</div>
      </div>
      <div class="fcard">
        <div class="flabel">VS Code</div>
        <div class="ftitle y">RioLog</div>
        <div class="fdesc">Integrated into the IDE. Shows the same data as DS, but allows searching and better scrolling.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Advanced</div>
        <div class="ftitle g">AdvantageScope Console</div>
        <div class="fdesc">View logged console messages alongside timeline data. Perfect for time-syncing errors.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Offline</div>
        <div class="ftitle p">Data Log Files</div>
        <div class="fdesc">Everything stored to the flash drive (.wpilog). Essential for "what happened in that match?"</div>
      </div>
    </div>`,

    `<span class="tag">// 03 · stack.trace()</span>
    <h2>Reading a <span class="y">Stack Trace</span></h2>
    <p class="lead">An Exception is just the robot's way of saying "I give up."</p>
    <div class="code">
      <span class="cl"><span class="c">// The Exception Type and Message</span></span>
      <span class="cl"><span class="r">java.lang.NullPointerException</span>: Cannot invoke "Object.toString()"</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// The "Stack" (Where it happened)</span></span>
      <span class="cl hl">at frc.robot.subsystems.Intake.<span class="me">periodic</span>(Intake.java:<span class="n">42</span>)</span>
      <span class="cl">at edu.wpi.first.wpilibj2.command.CommandScheduler.<span class="me">run</span>(...)</span>
      <span class="cl">at frc.robot.Robot.<span class="me">robotPeriodic</span>(Robot.java:<span class="n">30</span>)</span>
    </div>
    <ul class="bullets" style="margin-top:20px;">
      <li><span class="bul">▸</span><span><span class="y">Top frame</span>: Usually the line in YOUR code that triggered the crash.</span></li>
      <li><span class="bul">▸</span><span><span class="r">NullPointerException</span>: You tried to use a variable that hasn't been <span class="k">new</span>-ed yet.</span></li>
      <li><span class="bul">▸</span><span><span class="r">ArrayIndexOutOfBounds</span>: You asked for element 5 in a list of 4 things.</span></li>
    </ul>`,

    `<span class="tag">// 04 · stack.trace.detective()</span>
    <h2>Stack Trace <span class="y">Detective Work</span></h2>
    <p class="lead">You know the anatomy. Real traces are longer — and 90% noise. Learn to skim.</p>
    <div class="code">
      <span class="cl"><span class="r">java.lang.RuntimeException</span>: error running periodic</span>
      <span class="cl">at edu.wpi.first.wpilibj.<span class="me">TimedRobot</span>... <span class="c">// framework noise</span></span>
      <span class="cl">at edu.wpi.first.wpilibj.<span class="me">RobotBase</span>... <span class="c">// more noise</span></span>
      <span class="cl hl"><span class="y">Caused by</span>: <span class="r">java.lang.NullPointerException</span></span>
      <span class="cl hl">at frc.robot.subsystems.Arm.<span class="me">periodic</span>(Arm.java:<span class="n">41</span>) <span class="c">// &lt;-- THE clue</span></span>
    </div>
    <ul class="bullets" style="margin-top:20px;">
      <li><span class="bul">▸</span><span>Scan for the first <span class="y">frc.robot.*</span> frame — that's YOUR code. Framework lines above and below are noise.</span></li>
      <li><span class="bul">▸</span><span><span class="b">Caused by:</span> chains — always read the <span class="g">bottom-most</span> cause first. That's the original crime.</span></li>
      <li><span class="bul">▸</span><span>The <span class="y">File.java:line</span> reference is clickable in RioLog and VS Code.</span></li>
      <li><span class="bul">▸</span><span><span class="r">ConcurrentModificationException</span> = you edited a list while looping over it. An uncaught crash in periodic() restarts robot code in a loop.</span></li>
    </ul>`,

    `<span class="tag">// 05 · print.methods()</span>
    <h2>Print <span class="y">Debugging</span></h2>
    <div class="code">
      <span class="cl"><span class="c">// Use for quick, temporary checks</span></span>
      <span class="cl"><span class="t">System</span>.out.<span class="me">println</span>(<span class="s">"Motor Power: "</span> + power);</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Best practice: use the Logger (AdvantageKit)</span></span>
      <span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Debug/ArmAngle"</span>, angle);</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Important status that MUST be seen (sticky)</span></span>
      <span class="cl"><span class="k">new</span> <span class="t">Alert</span>(<span class="s">"CAN ID 5 missing"</span>, <span class="t">Alert.AlertType</span>.ERROR).<span class="me">set</span>(<span class="k">true</span>);</span>
    </div>
    <ul class="bullets" style="margin-top:20px;">
      <li><span class="bul">▸</span><span><span class="b">println</span>: Fast, but clutters the console. Remove before competition!</span></li>
      <li><span class="bul">▸</span><span><span class="g">recordOutput</span>: Invisible to the driver, but captured for analysis.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Alerts</span>: For "broken" things that need immediate human attention.</span></li>
    </ul>`,

    `<span class="tag">// 06 · common.issues()</span>
    <h2>Common <span class="y">Symptoms</span></h2>
    <div class="fgrid">
      <div class="fcard no-bracket">
        <div class="flabel">Symptom</div>
        <div class="ftitle r">Robot Code: No</div>
        <div class="fdesc">Code crashed on startup. Check RioLog for a stack trace or syntax error.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="flabel">Symptom</div>
        <div class="ftitle y">No Communications</div>
        <div class="fdesc">Radio disconnected, wrong IP address, or the laptop's WiFi is off.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="flabel">Symptom</div>
        <div class="ftitle b">Motor Not Moving</div>
        <div class="fdesc">Check CAN IDs in Tuner/Rev Client. Verify the motor is enabled.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="flabel">Symptom</div>
        <div class="ftitle p">Joystick Not Detected</div>
        <div class="fdesc">Check the USB tab in Driver Station. Is it index 0? Rescan with F1.</div>
      </div>
    </div>`,

    `<span class="tag">// 07 · performance()</span>
    <h2>Watchdog &amp; <span class="y">Loop Overruns</span></h2>
    <p class="lead">"Loop time of 0.02s overrun" — The robot is stuttering.</p>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">Cause</span>: Doing too much work in <span class="me">periodic</span>(). Heavy math or long loops.</span></li>
      <li><span class="bul">▸</span><span><span class="y">NetworkTables</span>: Writing thousands of values every loop can choke the CPU.</span></li>
      <li><span class="bul">▸</span><span><span class="y">The Fix</span>: Move heavy calculations to another thread, or run them less often.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Impact</span>: High loop times make PID controllers unstable and controls feel "laggy."</span></li>
    </ul>`,

    `<span class="tag">// 08 · electrical()</span>
    <h2>Brownouts &amp; <span class="y">Power</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">Voltage Sag</span>: When motors pull huge current, the battery voltage drops.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Brownout (12V &rarr; &lt;7V)</span>: The RoboRIO disables motor controllers to save itself.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Symptoms</span>: Motors "stuttering" or cutting out under load; DS voltage bar turns red.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Prevention</span>: Charge batteries! Use current limits: <span class="me">setSmartCurrentLimit</span>(<span class="n">40</span>).</span></li>
    </ul>`,

    `<span class="tag">// 09 · procedure()</span>
    <h2>Systematic <span class="y">Procedure</span></h2>
    <div class="tl">
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Observe the Symptom</div><div class="tldesc">Exactly what happened? When? Did a breaker trip? Did a light flash red?</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Check the Console</div><div class="tldesc">Look for Exceptions or "Missing Device" warnings in the RioLog.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Form a Hypothesis</div><div class="tldesc">"I think the limit switch is unplugged or broken."</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div></div>
        <div class="tlc"><div class="tltitle">Test the Hypothesis</div><div class="tldesc">Check the value of the switch in AdvantageScope. If it stays TRUE, you found it!</div></div>
      </div>
    </div>`,

    `<div data-center>
      <span class="tag">// session.recap()</span>
      <h2>Stay <span class="y">Methodical</span></h2>
      <p class="lead">Troubleshooting is a skill that improves with every "unsolvable" bug you beat.</p>
      <div class="stats">
        <div class="stat"><div class="sn">01</div><div class="sl">Reproduce it</div></div>
        <div class="stat"><div class="sn">02</div><div class="sl">Read the log</div></div>
        <div class="stat"><div class="sn">03</div><div class="sl">Fix root cause</div></div>
      </div>
      <p class="m" style="margin-top:20px;">Next: Troubleshooting II — Advanced Logs & Log Replay</p>
    </div>`
  ]
});

</script>

<!-- ===== troubleshooting-2.js ===== -->
<script>
window.registerLesson('troubleshooting-2', {
  title: 'Troubleshooting II — CAN & Sim',
  tag: '// debug.can.sim()',
  slides: [
    // 1. Hero
    `<div data-center>
      <span class="tag">// advanced.diagnostics()</span>
      <h1>Troubleshooting II:<br><span class="y">CAN</span> &amp; <span class="y">Sim</span></h1>
      <p class="lead">Hunting gremlins in the wires and the code.<br>From physical bus health to simulation breakpoints.</p>
      <div class="stats">
        <div class="stat"><div class="sn">120Ω</div><div class="sl">Termination</div></div>
        <div class="stat"><div class="sn">1Mbps</div><div class="sl">Bus Speed</div></div>
        <div class="stat"><div class="sn">Sim</div><div class="sl">Debugger</div></div>
      </div>
    </div>`,

    // 2. The CAN bus basics
    `<div>
      <span class="tag">// 01 · can.bus.phys()</span>
      <h2>The <span class="y">CAN</span> Bus Basics</h2>
      <p class="lead">A shared highway where every device must take turns speaking.</p>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="b">2-Wire Shared Bus</span>: Green (CAN-L) and Yellow (CAN-H) twisted pairs.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Daisy Chain</span>: Signal travels from the RIO, through each device, to the end.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Termination</span>: Requires a 120Ω resistor at the physical ends to prevent signal echoes.</span></li>
      </ul>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">topology</div>
          <div class="ftitle b">Daisy Chain</div>
          <div class="fdesc">Simple wiring, but a single break can disconnect everything downstream.</div>
        </div>
        <div class="fcard">
          <div class="flabel">identification</div>
          <div class="ftitle y">Device IDs</div>
          <div class="fdesc">Each motor controller must have a unique ID (0–62) to receive commands.</div>
        </div>
      </div>
    </div>`,

    // 3. Kitbot 2026 bringup
    `<div>
      <span class="tag">// 02 · bringup.checklist()</span>
      <h2>Kitbot 2026 <span class="y">Bringup</span></h2>
      <p class="lead">First-power checklist for a successful robot reveal.</p>
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc">
            <div class="tltitle">Physical Audit</div>
            <div class="tldesc">Tug-test every CAN connector. Ensure Green stays with Green and Yellow with Yellow.</div>
          </div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc">
            <div class="tltitle">Termination Check</div>
            <div class="tldesc">Verify the resistor is present (usually on the Power Distribution Hub or a separate plug).</div>
          </div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc">
            <div class="tltitle">Assign IDs</div>
            <div class="tldesc">Connect one motor at a time or use vendor tools to give every Talon/Spark a unique number.</div>
          </div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div></div>
          <div class="tlc">
            <div class="tltitle g">Firmware Update</div>
            <div class="tldesc">Flash the latest season-specific firmware to avoid "version mismatch" errors.</div>
          </div>
        </div>
      </div>
    </div>`,

    // 4. Symptoms of CAN trouble
    `<div>
      <span class="tag">// 03 · can.diagnostics()</span>
      <h2>Symptoms of <span class="y">Trouble</span></h2>
      <p class="lead">How to read the robot's "body language" when the bus fails.</p>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">symptom</div>
          <div class="ftitle r">Missing Device</div>
          <div class="fdesc">Device shows in code but not in Tuner. Check wiring before/at that device.</div>
        </div>
        <div class="fcard">
          <div class="flabel">symptom</div>
          <div class="ftitle p">CAN Bus Off</div>
          <div class="fdesc">Critical failure. Usually a short between Green/Yellow or a ground loop.</div>
        </div>
        <div class="fcard">
          <div class="flabel">symptom</div>
          <div class="ftitle y">High Utilization</div>
          <div class="fdesc">>80% in Driver Station. Too many status signals flooding the bus.</div>
        </div>
        <div class="fcard">
          <div class="flabel">symptom</div>
          <div class="ftitle g">Blinking Red</div>
          <div class="fdesc">Device has power but NO CAN signal. It is "blind" to the RIO.</div>
        </div>
      </div>
    </div>`,

    // 5. Tools
    `<div>
      <span class="tag">// 04 · hardware.tools()</span>
      <h2>The <span class="y">Utility</span> Belt</h2>
      <p class="lead">Software tools for hardware problems.</p>
      <div class="two">
        <ul class="bullets">
          <li><span class="bul">▸</span><span><span class="b">Phoenix Tuner X</span>: The gold standard for CTRE (TalonFX, CANcoder, Pigeon).</span></li>
          <li><span class="bul">▸</span><span><span class="b">REV Hardware Client</span>: Essential for Spark Max and Spark Flex motors.</span></li>
          <li><span class="bul">▸</span><span><span class="g">Blink Test</span>: Always use the "Blink" button to confirm which motor is which.</span></li>
          <li><span class="bul">▸</span><span><span class="g">Self-Test</span>: Captures a "snapshot" of motor faults and temperatures.</span></li>
        </ul>
        <div class="code">
          <span class="cl"><span class="c">// Identification via code</span></span>
          <span class="cl"><span class="t">TalonFX</span> motor = <span class="k">new</span> <span class="t">TalonFX</span>(<span class="n">1</span>);</span>
          <span class="cl"></span>
          <span class="cl"><span class="c">// If ID 1 isn't on the bus,</span></span>
          <span class="cl"><span class="c">// code will log errors</span></span>
          <span class="cl"><span class="c">// every 20ms!</span></span>
        </div>
      </div>
    </div>`,

    // 6. Duplicate / wrong IDs
    `<div>
      <span class="tag">// 05 · conflict.resolution()</span>
      <h2>The #1 Issue: <span class="y">Duplicates</span></h2>
      <p class="lead">Two devices, one ID. The robot gets confused.</p>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="r">Symptoms</span>: Intermittent data, controls "fighting", or devices flickering in the hardware list.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Detection</span>: If you blink ID 4 and two motors flash, you've found the conflict.</span></li>
        <li><span class="bul">▸</span><span><span class="b">The Fix</span>: Disconnect part of the bus to isolate one device, then change its ID.</span></li>
      </ul>
      <div class="frow">
        <div class="ftitle y">Pro Tip:</div>
        <div class="fdesc">Label your motors with a Sharpie! Matching the physical ID to the code ID saves hours of debugging.</div>
      </div>
    </div>`,

    // 7. Reading status
    `<div>
      <span class="tag">// 06 · status.check()</span>
      <h2>Reading the <span class="y">Pulse</span></h2>
      <p class="lead">Don't guess. Check the telemetry.</p>
      <div class="stats">
        <div class="stat">
          <div class="sn y">~12V</div>
          <div class="sl">Bus Voltage</div>
        </div>
        <div class="stat">
          <div class="sn b">&lt;70%</div>
          <div class="sl">Utilization</div>
        </div>
        <div class="stat">
          <div class="sn g">Solid</div>
          <div class="sl">LED Status</div>
        </div>
      </div>
      <ul class="bullets" style="margin-top:20px;">
        <li><span class="bul">▸</span><span><span class="b">Driver Station</span>: Check the "CAN" tab for "Comms Faults" and utilization percentages.</span></li>
        <li><span class="bul">▸</span><span><span class="b">LED Codes</span>: Rapid blinking red/yellow usually means a fault or missing signal.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Bus Voltage</span>: If it drops below 6V, motors may brown out and lose CAN comms.</span></li>
      </ul>
    </div>`,

    // 8. Breakpoints in simulation
    `<div>
      <span class="tag">// 07 · sim.debugger()</span>
      <h2>Breakpoints in <span class="y">Simulation</span></h2>
      <p class="lead">Stopping time to see exactly what the robot is thinking.</p>
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc">
            <div class="tltitle">Launch Simulation</div>
            <div class="tldesc">Run <span class="badge bb">simulateJava</span> from the WPILib menu or terminal.</div>
          </div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc">
            <div class="tltitle">Attach Debugger</div>
            <div class="tldesc">In VS Code, go to "Run and Debug" and select <span class="b">WPILib Java (Simulate)</span>.</div>
          </div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div></div>
          <div class="tlc">
            <div class="tltitle">Set a Breakpoint</div>
            <div class="tldesc">Click the red dot next to a line of code. The robot will PAUSE there.</div>
          </div>
        </div>
      </div>
      <div class="code">
        <span class="cl"><span class="k">public void</span> <span class="me">periodic</span>() {</span>
        <span class="cl">&nbsp;&nbsp;<span class="t">double</span> speed = m_encoder.<span class="me">getVelocity</span>();</span>
        <span class="cl hl">&nbsp;&nbsp;<span class="c">// If I set a breakpoint here, I can inspect 'speed'</span></span>
        <span class="cl">&nbsp;&nbsp;<span class="k">if</span> (speed &gt; <span class="n">100</span>) { <span class="me">stop</span>(); }</span>
        <span class="cl">}</span>
      </div>
    </div>`,

    // 9. Sim debugging tips
    `<div>
      <span class="tag">// 08 · sim.pro_tips()</span>
      <h2>Debugging like a <span class="y">Pro</span></h2>
      <p class="lead">Mastering the flow of execution.</p>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="b">Inspect Variables</span>: Hover over any variable while paused to see its current value.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Step Over/Into</span>: Execute code line-by-line to find the exact moment a bug appears.</span></li>
        <li><span class="bul">▸</span><span><span class="r">Watchdog Warning</span>: Real-world timers keep running! If you pause too long, the RIO watchdog will disable the robot.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Conditional Breakpoints</span>: Only pause if <span class="t">speed</span> &lt; <span class="n">0</span> (Right-click the red dot).</span></li>
      </ul>
    </div>`,

    // 10. Checklist
    `<div>
      <span class="tag">// 09 · troubleshooting.summary()</span>
      <h2>The <span class="y">Final</span> Checklist</h2>
      <p class="lead">Follow these steps when everything stops working.</p>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Step 1</div>
          <div class="ftitle b">Physical Check</div>
          <div class="fdesc">Tug the wires. Check for Green/Yellow shorts. Verify termination.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Step 2</div>
          <div class="ftitle y">Vendor Tools</div>
          <div class="fdesc">Open Tuner X or REV Client. Can you see every device? Do IDs match code?</div>
        </div>
        <div class="fcard">
          <div class="flabel">Step 3</div>
          <div class="ftitle p">Simulate</div>
          <div class="fdesc">Run in Sim. Is the logic correct? Use breakpoints to verify the math.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Step 4</div>
          <div class="ftitle g">Status LEDs</div>
          <div class="fdesc">Look at the motor. Solid Green/Orange = Good. Blinking Red = No Signal.</div>
        </div>
      </div>
    </div>`,

    // 11. Recap
    `<div data-center>
      <span class="tag">// troubleshoot.complete()</span>
      <h1>Gremlins <span class="y">Exterminated</span></h1>
      <p class="lead">You now have the tools to debug the bus and the brain.</p>
      <div class="stats">
        <div class="stat"><div class="sn">CAN</div><div class="sl">Mastered</div></div>
        <div class="stat"><div class="sn">Sim</div><div class="sl">Debugging</div></div>
        <div class="stat"><div class="sn">100%</div><div class="sl">Bringup Ready</div></div>
      </div>
      <p class="m" style="margin-top:20px;">Next up: Advanced Subsystems &amp; Sensor Fusion</p>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('vendorlibs-1', {
  title: 'Vendor Libraries — TalonFX',
  tag: '// vendor.talonfx()',
  slides: [
    // 1. Hero
    `<div data-center>
      <span class="tag">// vendor.talonfx()</span>
      <h1>Vendor Libraries:<br><span class="y">TalonFX</span></h1>
      <p class="lead">Mastering the Phoenix 6 Java API for Falcon 500 and Kraken X60 motor controllers.</p>
      <div class="frow">
        <span class="badge bb">CTRE Phoenix 6</span>
        <span class="badge bg">Java API</span>
        <span class="badge bp">Level 1</span>
      </div>
    </div>`,

    // 2. What are vendordeps
    `<span class="tag">// 01 · vendor.deps()</span>
    <h2>What are <span class="y">Vendordeps</span>?</h2>
    <p class="lead">Third-party libraries provided by hardware manufacturers to interface with their devices.</p>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="b">Phoenix 6</span>: For CTRE devices (TalonFX, CANcoder, Pigeon 2).</span></li>
      <li><span class="bul">▸</span><span><span class="y">REVLib</span>: For REV Robotics devices (Spark Max, Spark Flex).</span></li>
      <li><span class="bul">▸</span><span>Added via a <span class="g">JSON URL</span> in VS Code (WPILib menu).</span></li>
      <li><span class="bul">▸</span><span>Required because WPILib does not include manufacturer-specific code.</span></li>
    </ul>`,

    // 3. TalonFX intro
    `<span class="tag">// 02 · hardware.intro()</span>
    <h2>The <span class="y">TalonFX</span> Ecosystem</h2>
    <p class="lead">The gold standard for high-performance FRC motion control.</p>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">hardware</div>
        <div class="ftitle b">Falcon 500 / Kraken X60</div>
        <div class="fdesc">Integrated motor + controller + high-resolution encoder.</div>
      </div>
      <div class="fcard">
        <div class="flabel">communication</div>
        <div class="ftitle y">CAN / CAN FD</div>
        <div class="fdesc">Standard CAN or high-speed CAN FD (via CANivore).</div>
      </div>
      <div class="fcard">
        <div class="flabel">firmware</div>
        <div class="ftitle g">Phoenix 6</div>
        <div class="fdesc">Modern, object-oriented API with millisecond-fresh data.</div>
      </div>
      <div class="fcard">
        <div class="flabel">features</div>
        <div class="ftitle p">Advanced Control</div>
        <div class="fdesc">On-board PID, Motion Magic, and FOC (Field Oriented Control).</div>
      </div>
    </div>`,

    // 4. Construction & configuration
    `<span class="tag">// 03 · talonfx.config()</span>
    <h2>Setup &amp; <span class="y">Configuration</span></h2>
    <div class="two">
      <div class="code">
<span class="cl"><span class="t">TalonFX</span> motor = <span class="k">new</span> <span class="t">TalonFX</span>(<span class="n">1</span>);</span>
<span class="cl"><span class="t">TalonFXConfiguration</span> cfg =</span>
<span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">TalonFXConfiguration</span>();</span>
<span class="cl"></span>
<span class="cl"><span class="c">// Set current limits</span></span>
<span class="cl">cfg.<span class="t">CurrentLimits</span>.<span class="t">StatorCurrentLimit</span> = <span class="n">40</span>;</span>
<span class="cl">cfg.<span class="t">CurrentLimits</span>.<span class="t">StatorCurrentLimitEnable</span> = <span class="k">true</span>;</span>
<span class="cl"></span>
<span class="cl"><span class="c">// Apply the config</span></span>
<span class="cl">motor.<span class="me">getConfigurator</span>().<span class="me">apply</span>(cfg);</span>
      </div>
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Construct with a <span class="b">CAN ID</span>.</span></li>
        <li><span class="bul">▸</span><span>Use <span class="y">TalonFXConfiguration</span> for bulk setup.</span></li>
        <li><span class="bul">▸</span><span>Always <span class="g">apply()</span> to push settings to the device.</span></li>
        <li><span class="bul">▸</span><span>Config includes: current limits, neutral mode, and gear ratios.</span></li>
      </ul>
    </div>`,

    // 5. Open-loop control
