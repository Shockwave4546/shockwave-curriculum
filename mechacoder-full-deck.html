    // Slide 2: Why PathPlanner
    `<div class="inner">
      <span class="tag">// 02 · trajectory.overview()</span>
      <h2>Why <span class="y">PathPlanner</span>?</h2>
      <p class="lead">Writing coordinates by hand is slow and error-prone. PathPlanner provides a professional toolset for complex autos.</p>
      <div class="bigq">
        "Don't just drive to a point. <span class="y">Follow a path</span> that respects the laws of physics and your robot's limits."
      </div>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="g">Visual Design</span>: Draw paths on a map of the FRC field with smooth Bezier curves.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Full Autos</span>: Chain multiple paths and robot actions into a single sequence.</span></li>
        <li><span class="bul">▸</span><span><span class="y">Feedback Control</span>: Automatically corrects for drift using high-speed PID controllers.</span></li>
        <li><span class="bul">▸</span><span><span class="p">Hot Reload</span>: Update paths in the GUI and see changes on the robot instantly.</span></li>
      </ul>
    </div>`,

    // Slide 3: The GUI
    `<div class="inner">
      <span class="tag">// 03 · pathplanner.app()</span>
      <h2>The <span class="y">Visual</span> Editor</h2>
      <p class="lead">The PathPlanner application is where you define how the robot "sees" the field.</p>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">design</div>
          <div class="ftitle b">Waypoints &amp; Handles</div>
          <div class="fdesc">Click to add points. Drag handles to adjust the entry and exit velocity vectors for smooth curves.</div>
        </div>
        <div class="fcard">
          <div class="flabel">holonomic</div>
          <div class="ftitle y">Rotation Targets</div>
          <div class="fdesc">Separate the robot's heading from its travel direction. Spin while driving for faster scoring.</div>
        </div>
        <div class="fcard">
          <div class="flabel">physics</div>
          <div class="ftitle g">Constraints</div>
          <div class="fdesc">Set global or per-segment speed and acceleration limits to keep your robot from tipping.</div>
        </div>
        <div class="fcard">
          <div class="flabel">logic</div>
          <div class="ftitle p">Event Markers</div>
          <div class="fdesc">Place triggers on the path to start intaking or prepare the shooter exactly when needed.</div>
        </div>
      </div>
    </div>`,

    // Slide 4: AutoBuilder configuration
    `<div class="inner">
      <span class="tag">// 04 · autobuilder.configure()</span>
      <h2>Configuring <span class="y">AutoBuilder</span></h2>
      <p class="lead">Tell PathPlanner how to talk to your drivetrain. This is usually done in your Drive Subsystem.</p>
      <div class="code">
<span class="cl"><span class="t">AutoBuilder</span>.<span class="me">configureHolonomic</span>(</span>
<span class="cl">&nbsp;&nbsp;<span class="k">this</span>::<span class="me">getPose</span>, <span class="c">// Robot pose supplier</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">this</span>::<span class="me">resetPose</span>, <span class="c">// Method to reset odometry</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">this</span>::<span class="me">getRobotRelativeSpeeds</span>,</span>
<span class="cl">&nbsp;&nbsp;<span class="k">this</span>::<span class="me">driveRobotRelative</span>, <span class="c">// Output speeds</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">HolonomicPathFollowerConfig</span>(</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">new</span> <span class="t">PIDConstants</span>(<span class="n">5.0</span>, <span class="n">0.0</span>, <span class="n">0.0</span>), <span class="c">// Translation PID</span></span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">new</span> <span class="t">PIDConstants</span>(<span class="n">5.0</span>, <span class="n">0.0</span>, <span class="n">0.0</span>), <span class="c">// Rotation PID</span></span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="n">4.5</span>, <span class="n">0.4</span>, <span class="k">new</span> <span class="t">ReplanningConfig</span>()</span>
<span class="cl">&nbsp;&nbsp;),</span>
<span class="cl">&nbsp;&nbsp;() -&gt; <span class="t">DriverStation</span>.<span class="me">getAlliance</span>().<span class="me">get</span>() == <span class="t">Alliance</span>.Red,</span>
<span class="cl">&nbsp;&nbsp;<span class="k">this</span> <span class="c">// Drive subsystem reference</span></span>
<span class="cl">);</span>
      </div>
    </div>`,

    // Slide 5: Named commands
    `<div class="inner">
      <span class="tag">// 05 · namedcommands.register()</span>
      <h2>Connecting <span class="y">Actions</span></h2>
      <p class="lead">Register your commands by name so they can be triggered from the GUI editor.</p>
      <div class="code">
<span class="cl"><span class="c">// In Constants.java or RobotContainer.java</span></span>
<span class="cl"><span class="t">NamedCommands</span>.<span class="me">registerCommand</span>(<span class="s">"intake"</span>,</span>
<span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">IntakeCommand</span>(intakeSubsystem));</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="t">NamedCommands</span>.<span class="me">registerCommand</span>(<span class="s">"shoot"</span>,</span>
<span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">ShootCommand</span>(shooterSubsystem));</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="t">NamedCommands</span>.<span class="me">registerCommand</span>(<span class="s">"prepareShooter"</span>,</span>
<span class="cl">&nbsp;&nbsp;shooterSubsystem.<span class="me">spinUpCommand</span>());</span>
      </div>
      <p class="m" style="font-size:14px; margin-top:15px;">Note: You MUST register commands BEFORE building any autos or the chooser.</p>
    </div>`,

    // Slide 6: Following a path
    `<div class="inner">
      <span class="tag">// 06 · pathfollower.build()</span>
      <h2>Following <span class="y">Single</span> Paths</h2>
      <p class="lead">You can load a single ".path" file and turn it into a standard WPILib Command.</p>
      <div class="code">
<span class="cl"><span class="c">// Load path from file (deploy/pathplanner/paths/...)</span></span>
<span class="cl"><span class="t">PathPlannerPath</span> path = <span class="t">PathPlannerPath</span>.<span class="me">fromPathFile</span>(<span class="s">"Example Path"</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Create a command to follow it</span></span>
<span class="cl"><span class="t">Command</span> followCommand = <span class="t">AutoBuilder</span>.<span class="me">followPath</span>(path);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Use it like any other command</span></span>
<span class="cl">joystick.<span class="me">a</span>().<span class="me">onTrue</span>(followCommand);</span>
      </div>
    </div>`,

    // Slide 6b: Event Markers
    `<div class="inner">
      <span class="tag">// 07 · event.markers()</span>
      <h2>Event <span class="y">Markers</span></h2>
      <div class="two">
        <ul class="bullets">
          <li><span class="bul">▸</span><span>Drop a marker at any point <span class="y">along the path</span> in the GUI editor.</span></li>
          <li><span class="bul">▸</span><span>When the robot reaches it, the marker fires the <span class="b">NamedCommand</span> you registered two slides ago.</span></li>
          <li><span class="bul">▸</span><span><span class="g">Zoned triggers</span> stay active for a stretch of path; <span class="p">one-shot markers</span> fire once at a position.</span></li>
          <li><span class="bul">▸</span><span>Markers can also be bound in code as triggers.</span></li>
        </ul>
        <div class="code">
<span class="cl"><span class="c">// GUI: place marker "intake" at 40% of path</span></span>
<span class="cl"><span class="c">// It fires the registered NamedCommand.</span></span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Or bind marker events in code:</span></span>
<span class="cl"><span class="k">new</span> <span class="t">EventTrigger</span>(<span class="s">"intake"</span>)</span>
<span class="cl">&nbsp;&nbsp;.<span class="me">whileTrue</span>(intakeSubsystem.<span class="me">run</span>());</span>
        </div>
      </div>
    </div>`,

    // Slide 6c: Scoring Auto
    `<div class="inner">
      <span class="tag">// 08 · scoring.auto()</span>
      <h2>Anatomy of a <span class="y">Scoring Auto</span></h2>
      <p class="lead">Markers do the MECHANISM work in parallel while the path does the DRIVING — that's how 3-piece autos fit in 15 seconds.</p>
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle">Leave + Deploy</div><div class="tldesc">Path 1 starts toward the game piece. Marker "intake" deploys the intake MID-PATH — no stopping.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle">Collect</div><div class="tldesc">Arrive at the piece with the intake already spinning. Beam break confirms the grab.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle">Return + Spin Up</div><div class="tldesc">Path 2 heads home. Marker "prepareShooter" spins the flywheel DURING the drive back.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div></div>
          <div class="tlc"><div class="tltitle">Score</div><div class="tldesc">Arrive at speed, already aimed, flywheel ready: "shoot" fires at the endpoint. Repeat.</div></div>
        </div>
      </div>
    </div>`,

    // Slide 7: Running a full auto
    `<div class="inner">
      <span class="tag">// 09 · full.auto.chooser()</span>
      <h2>The <span class="y">Auto</span> Chooser</h2>
      <p class="lead">PathPlanner makes it easy to select different autonomous routines from the Dashboard.</p>
      <div class="code">
<span class="cl"><span class="c">// In RobotContainer</span></span>
<span class="cl"><span class="k">private final</span> <span class="t">SendableChooser</span>&lt;<span class="t">Command</span>&gt; autoChooser;</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">public</span> <span class="me">RobotContainer</span>() {</span>
<span class="cl">&nbsp;&nbsp;autoChooser = <span class="t">AutoBuilder</span>.<span class="me">buildAutoChooser</span>();</span>
<span class="cl">&nbsp;&nbsp;<span class="t">SmartDashboard</span>.<span class="me">putData</span>(<span class="s">"Auto Chooser"</span>, autoChooser);</span>
<span class="cl">}</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">public</span> <span class="t">Command</span> <span class="me">getAutonomousCommand</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">return</span> autoChooser.<span class="me">getSelected</span>();</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // Slide 8: Tuning & Gotchas
    `<div class="inner">
      <span class="tag">// 10 · troubleshooting.tips()</span>
      <h2>Tuning <span class="y">&amp;</span> Gotchas</h2>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">PID Tuning</span>: Start with Translation P. If the robot drifts, increase it. If it oscillates, back off.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Odometry Accuracy</span>: Pathing only works if your robot knows exactly where it is. Check your wheel diameters and gyro!</span></li>
        <li><span class="bul">▸</span><span><span class="b">Alliance Flipping</span>: PathPlanner automatically mirrors paths for Red alliance. Ensure your flip supplier is correct.</span></li>
        <li><span class="bul">▸</span><span><span class="r">Starting Pose</span>: Your first auto path MUST set the robot's initial position, or it will try to "drive home" across the field.</span></li>
      </ul>
    </div>`,

    // Slide 9: Reliability Checklist
    `<div class="inner">
      <span class="tag">// 11 · reliability.checklist()</span>
      <h2>Reliability <span class="y">Checklist</span></h2>
      <div class="fgrid">
        <div class="fcard no-bracket">
          <div class="flabel">step 1</div>
          <div class="ftitle b">Odometry Test</div>
          <div class="fdesc">Push the robot 5 meters. Does the dashboard show exactly 5.0m? If not, fix constants first.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">step 2</div>
          <div class="ftitle y">Rotation Check</div>
          <div class="fdesc">Spin the robot 360°. Does it show 0° (or 360°)? Gyro drift is the enemy of paths.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">step 3</div>
          <div class="ftitle g">Slow Mo First</div>
          <div class="fdesc">Run new paths at 20% speed. Keep your hand on the Disable button until you trust the curve.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">step 4</div>
          <div class="ftitle p">Alliance Mirror</div>
          <div class="fdesc">Test on both Blue and Red sides. Flipping logic is the #1 cause of "oops" in week 1.</div>
        </div>
      </div>
    </div>`,

    // Slide 10: Recap
    `<div data-center>
      <span class="tag">// 12 · autonomous.complete()</span>
      <h1>PathPlanner <span class="y">Mastery</span></h1>
      <p class="lead">You've unlocked the power of precise, repeatable autonomous movement.</p>
      <div class="stats">
        <div class="stat"><div class="sn">15s</div><div class="sl">Of Pure Glory</div></div>
        <div class="stat"><div class="sn" style="color:var(--green)">✓</div><div class="sl">Smooth Curves</div></div>
        <div class="stat"><div class="sn" style="color:var(--blue3)">✓</div><div class="sl">Reliable Scoring</div></div>
      </div>
      <div class="code" style="margin-top:20px; padding: 15px 30px;">
        <span class="k">return</span> <span class="s">"Autonomous success!"</span>;
      </div>
    </div>`
  ]
});

</script>

<script>
registerLesson('claude-usage', {
  title: 'Working with Claude & LLMs',
  tag: '// ai.assisted.engineering()',
  slides: [
    // Slide 1: Hero
    `<div data-center>
      <span class="tag">// ai.assisted.engineering()</span>
      <h1>Working with <span class="y">Claude</span></h1>
      <p class="lead">AI is a power tool for the modern engineer. Like a lathe or a CNC, you must learn to operate it safely and effectively to build better robots.</p>
      <div>
        <span class="badge bb">Prompting</span>
        <span class="badge bg">Context</span>
        <span class="badge bp">Claude Code</span>
        <span class="badge by">Limits</span>
      </div>
    </div>`,

    // Slide 2: Mental Model
    `<span class="tag">Mental Model</span>
    <h2>What is an <span class="y">LLM?</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><strong>Next-Token Predictor:</strong> Trained on massive datasets to predict the most likely next word in a sequence.</span></li>
      <li><span class="bul">▸</span><span><strong>Reasoning via Correlation:</strong> Newer models do reason step-by-step ("extended thinking") before answering, but it's still pattern-based — not human thought.</span></li>
      <li><span class="bul">▸</span><span><strong>NOT a Database:</strong> It doesn't "look up" facts; it reconstructs them from probabilistic weights.</span></li>
      <li><span class="bul">▸</span><span><strong>NOT a Compiler:</strong> It cannot verify if code works unless you give it the tools to run it.</span></li>
    </ul>`,

    // Slide 3: Prompting Basics
    `<span class="tag">Prompting Basics</span>
    <h2>The Art of <span class="y">Specifics</span></h2>
    <div class="bigq">"Clear context is more valuable than clever phrasing."</div>
    <div class="two">
      <div class="fcard">
        <div class="flabel">Vague (Bad)</div>
        <div class="fdesc m">"Write a command to move a motor."</div>
      </div>
      <div class="fcard no-bracket">
        <div class="flabel">Detailed (Good)</div>
        <div class="fdesc">"Write a WPILib Command-based Java class to run a TalonFX at 50% output while a button is held. Use the ShooterSubsystem."</div>
      </div>
    </div>`,

    // Slide 4: Prompting for Code
    `<span class="tag">Prompting for Code</span>
    <h2>Coding with <span class="y">Context</span></h2>
    <p class="lead">Claude is most effective when it knows your environment.</p>
    <div class="fgrid">
      <div class="fcard">
        <div class="ftitle">Define Your Stack</div>
        <div class="fdesc">"Java 17, WPILib 2026, Command-based, CTRE Phoenix 6."</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Paste the Error</div>
        <div class="fdesc">Don't describe the bug; paste the full stack trace and relevant files.</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Ask for 'Why'</div>
        <div class="fdesc">"Explain how this PID loop calculation differs from the standard implementation."</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Iterative Refinement</div>
        <div class="fdesc">Start small. Get the logic right, then ask for logging and error handling.</div>
      </div>
    </div>`,

    // Slide: Starter Prompts
    `<span class="tag">Starter Prompts</span>
    <h2>Good First <span class="y">Prompts</span></h2>
    <p class="lead">Steal these. Each one gives Claude a specific task and the context to do it.</p>
    <div class="fgrid">
      <div class="fcard">
        <div class="ftitle">Understand Code</div>
        <div class="fdesc">"Explain what this Command does, line by line. I'm new to the command-based framework."</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Debug Control Loops</div>
        <div class="fdesc">"Why is my PID oscillating? Here's my config and a log excerpt from AdvantageScope."</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Decode Errors</div>
        <div class="fdesc">"I'm getting this stack trace when I enable the robot — what's the likely cause? [paste full trace]"</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Learn Actively</div>
        <div class="fdesc">"Quiz me on WPILib geometry classes. Ask one question at a time and correct my answers."</div>
      </div>
    </div>`,

    // Slide 5: Context Windows
    `<span class="tag">Architecture</span>
    <h2>The <span class="y">Context Window</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><strong>Token Budget:</strong> Every model has a limit on how much text it can "see" at once.</span></li>
      <li><span class="bul">▸</span><span><strong>Degradation:</strong> As chats get very long, the model loses track of earlier instructions.</span></li>
      <li><span class="bul">▸</span><span><strong>Statelessness:</strong> Each prompt sends the <em>entire</em> previous chat back to the model.</span></li>
    </ul>
    <div class="stats">
      <div class="stat">
        <div class="sn">200k&ndash;1M</div>
        <div class="sl">Token Limit (model dependent, 2026)</div>
      </div>
      <div class="stat">
        <div class="sn">~750k</div>
        <div class="sl">Approx. Words at 1M Tokens</div>
      </div>
      <div class="stat">
        <div class="sn">100%</div>
        <div class="sl">Of History Resent Every Prompt</div>
      </div>
    </div>`,

    // Slide 6: Context Management
    `<span class="tag">Workflow</span>
    <h2>Managing <span class="y">Context</span></h2>
    <div class="tl">
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Start Fresh</div><div class="tldesc">Start a new session for every new task to clear old baggage. In Claude Code: <strong>/clear</strong> resets the context, <strong>/compact</strong> summarizes a long one.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Targeted Files</div><div class="tldesc">Only paste the files directly relevant to the current bug.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Summarize Progress</div><div class="tldesc">Ask Claude to "summarize our current progress" before starting a new chat.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div></div>
        <div class="tlc"><div class="tltitle">CLAUDE.md</div><div class="tldesc">A memory file in your repo that Claude reads every session. Put in it: build commands (<strong>./gradlew build</strong>), deploy steps, and team conventions like our AdvantageKit IO-layer pattern.</div></div>
      </div>
    </div>`,

    // Slide 7: Claude Code
    `<span class="tag">Tooling</span>
    <h2>Claude <span class="y">Code</span></h2>
    <p class="lead">An agentic CLI that lives in your terminal and "operates" your project.</p>
    <div class="fgrid">
      <div class="fcard">
        <div class="ftitle">File Access</div>
        <div class="fdesc">Reads and edits files directly based on your natural language requests.</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Command Execution</div>
        <div class="fdesc">Can run builds, tests, and git commands to verify its own work.</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Multi-Step Tasks</div>
        <div class="fdesc">"Refactor this subsystem to use the new Vendor API across all files."</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Tool Use</div>
        <div class="fdesc">Uses search and file tools (grep, glob) to explore unfamiliar codebases.</div>
      </div>
    </div>`,

    // Slide 8: Claude Code in Practice
    `<span class="tag">Execution</span>
    <h2>The Claude <span class="y">Loop</span></h2>
    <div class="code">
      <span class="cl"><span class="m">$</span> <span class="me">claude</span> <span class="s">"Fix the periodic log output in DriveSubsystem"</span></span>
      <span class="cl"><span class="c"># Claude explores the files...</span></span>
      <span class="cl"><span class="c"># Claude proposes a diff to src/main/java/...</span></span>
      <span class="cl">Reviewing changes: <span class="y">LoggedTunableNumber</span> support</span>
      <span class="cl hl"><span class="m">$</span> ./gradlew build</span>
      <span class="cl"><span class="g">BUILD SUCCESSFUL</span> in 2s</span>
    </div>`,

    // Slide: Permission Model
    `<span class="tag">Safety</span>
    <h2>You Hold the <span class="y">Keys</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><strong>Asks Before Acting:</strong> Claude Code requests permission before editing files or running commands — you are the approval gate.</span></li>
      <li><span class="bul">▸</span><span><strong>Read the Prompt:</strong> Before clicking "yes," read what it wants to run. Approving without reading defeats the safety model.</span></li>
      <li><span class="bul">▸</span><span><strong>Scope Your Approvals:</strong> "Allow once" for anything unusual; reserve "always allow" for safe, repeated commands like builds.</span></li>
      <li><span class="bul">▸</span><span><strong>Robot Deploys are Sacred:</strong> Never auto-approve a deploy to a real robot. A human reviews every deploy, every time.</span></li>
    </ul>`,

    // Slide 9: Limitations
    `<span class="tag">Safety</span>
    <h2>Know the <span class="y">Limits</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><strong>Hallucinations:</strong> Claude will confidently invent methods like <span class="r">motor.setHyperSpeed()</span> if it sounds plausible.</span></li>
      <li><span class="bul">▸</span><span><strong>Knowledge Cutoff:</strong> It may not know about the latest WPILib breaking changes from last week.</span></li>
      <li><span class="bul">▸</span><span><strong>Precision Weakness:</strong> It can struggle with complex math or counting specific characters in a long string.</span></li>
      <li><span class="bul">▸</span><span><strong>No Physical Intuition:</strong> It doesn't know that 100% motor power will snap your intake's polycord.</span></li>
    </ul>`,

    // Slide 10: Verification
    `<span class="tag">Verification</span>
    <h2>Trust, but <span class="y">Verify</span></h2>
    <div class="fgrid">
      <div class="fcard">
        <div class="ftitle">Read Every Line</div>
        <div class="fdesc">Never commit code you haven't read and understood yourself.</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Check the Docs</div>
        <div class="fdesc">Cross-reference AI-suggested APIs with the official WPILib Javadoc.</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Run the Tests</div>
        <div class="fdesc">Use Simulation (covered in the Simulation Basics micro-skill) or unit tests to verify logic before deploying to the robot.</div>
      </div>
      <div class="fcard">
        <div class="ftitle">Static Analysis</div>
        <div class="fdesc">Let VS Code and the compiler catch syntax errors early.</div>
      </div>
    </div>`,

    // Slide 11: Vibe Coding
    `<span class="tag">Philosophy</span>
    <h2>"Vibe <span class="y">Coding"</span></h2>
    <p class="lead">Building by prompting and iterating without fully reading the implementation.</p>
    <div class="two">
      <div class="fcard">
        <div class="flabel g">When it's Great</div>
        <div class="fdesc">Rapid prototyping, exploring new libraries, writing one-off scripts, or generating UI boilerplate.</div>
      </div>
      <div class="fcard">
        <div class="flabel r">When it's Deadly</div>
        <div class="fdesc">Safety-critical robot code, complex state machines, or anything you'll have to debug at a competition.</div>
      </div>
    </div>`,

    // Slide 12: Ethics
    `<span class="tag">Ethics</span>
    <h2>Responsible <span class="y">Usage</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><strong>Learning vs Outsourcing:</strong> Use Claude to explain concepts, not to avoid thinking. You are the engineer.</span></li>
      <li><span class="bul">▸</span><span><strong>Academic Honesty:</strong> Be transparent about AI usage in school or team projects.</span></li>
      <li><span class="bul">▸</span><span><strong>Data Privacy:</strong> Never paste team secrets, private API keys, or sensitive personal data.</span></li>
      <li><span class="bul">▸</span><span><strong>Attribution:</strong> Note in your PRs or comments if a complex algorithm was AI-generated.</span></li>
    </ul>`,

    // Slide 13: Enduring Skill
    `<span class="tag">Conclusion</span>
    <h2>The Enduring <span class="y">Skill</span></h2>
    <div class="bigq">"AI amplifies the engineer; it does not replace them. The person who understands the fundamentals will always be more effective than the person who only knows how to prompt."</div>
    <p class="lead">The best 'prompters' are often the best engineers, because they know exactly what to ask for—and when the answer is wrong.</p>`,

    // Slide 14: Closing
    `<div data-center>
      <span class="tag">// final.output()</span>
      <h1>Operate with <span class="y">Intent</span></h1>
      <p class="lead">Claude is your co-pilot, but you are the Captain. Keep your hands on the controls.</p>
      <span class="badge bb">Ready to Build</span>
    </div>`
  ]
});

</script>

<!-- ===== control-1.js ===== -->
<script>
window.registerLesson('control-1', {
  title: 'Control Fundamentals',
  tag: '// control.fundamentals()',
  slides: [
    // 1: Hero
    `<div data-center>
      <span class="tag">// control.fundamentals()</span>
      <h1>Control <span class="y">Fundamentals</span></h1>
      <p class="lead">Moving mechanisms with precision, stability,<br>and repeatable accuracy.</p>
      <div>
        <span class="badge by">Level 1</span>
        <span class="badge bb">PID Control</span>
        <span class="badge bg">WPILib</span>
      </div>
    </div>`,

    // 2: Open-loop
    `<div class="inner">
      <span class="tag">// 01 · open.loop()</span>
      <h2>The <span class="y">Simple</span> Path</h2>
      <p class="lead">Open-loop control commands a value without checking the result.</p>
      <div class="two">
        <div class="fcard no-bracket">
          <div class="flabel b">Pros</div>
          <ul class="bullets">
            <li><span class="bul">▸</span><span>Extremely simple to code</span></li>
            <li><span class="bul">▸</span><span>No sensors required</span></li>
          </ul>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel r">Cons</div>
          <ul class="bullets">
            <li><span class="bul">▸</span><span>Doesn't correct for load</span></li>
            <li><span class="bul">▸</span><span>Inaccurate &amp; inconsistent</span></li>
          </ul>
        </div>
      </div>
      <div class="code" style="margin-top:20px;">
        <span class="cl"><span class="c">// commanding 50% voltage — no idea how fast it's actually going</span></span>
        <span class="cl">motor.<span class="me">set</span>(<span class="n">0.5</span>);</span>
      </div>
    </div>`,

    // 3: Feedback
    `<div class="inner">
      <span class="tag">// 02 · closed.loop()</span>
      <h2>The Need for <span class="y">Feedback</span></h2>
      <p class="lead">To get accuracy, we must observe the system and adjust.</p>
      <div class="bigq">Closed-loop control compares where we <span class="y">are</span> to where we <span class="y">want to be</span>, and calculates a correction.</div>
      <div class="stats">
        <div class="stat"><div class="sn b">Setpoint</div><div class="sl">The Goal (e.g. 90°)</div></div>
        <div class="stat"><div class="sn g">Measurement</div><div class="sl">The Reality (e.g. 85°)</div></div>
        <div class="stat"><div class="sn r">Error</div><div class="sl">The Gap (5°)</div></div>
      </div>
    </div>`,

    // 4: PID Intro
    `<div class="inner">
      <span class="tag">// 03 · pid.logic()</span>
      <h2>Meet <span class="y">PID</span></h2>
      <p class="lead">Three components working together to minimize error.</p>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">P - Proportional</div>
          <div class="ftitle b">The Present</div>
          <div class="fdesc">Responds to current error. The farther away, the harder it pushes.</div>
        </div>
        <div class="fcard">
          <div class="flabel">I - Integral</div>
          <div class="ftitle g">The Past</div>
          <div class="fdesc">Accumulates error over time. Clears out small, stubborn steady-state gaps.</div>
        </div>
        <div class="fcard">
          <div class="flabel">D - Derivative</div>
          <div class="ftitle p">The Future</div>
          <div class="fdesc">Responds to the rate of change. "Brakes" to prevent overshooting.</div>
        </div>
      </div>
    </div>`,

    // 5: WPILib PID
    `<div class="inner">
      <span class="tag">// 04 · wpilib.pid()</span>
      <h2>PID in <span class="y">Code</span></h2>
      <div class="code">
        <span class="cl"><span class="t">PIDController</span> controller = <span class="k">new</span> <span class="t">PIDController</span>(<span class="n">0.1</span>, <span class="n">0.0</span>, <span class="n">0.01</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="me">@Override</span></span>
        <span class="cl"><span class="k">public void</span> <span class="me">teleopPeriodic</span>() {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">double</span> measurement = encoder.<span class="me">getPosition</span>();</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">double</span> setpoint = <span class="n">90.0</span>;</span>
        <span class="cl">&nbsp;</span>
        <span class="cl">&nbsp;&nbsp;<span class="c">// Calculate how much voltage to apply</span></span>
        <span class="cl">&nbsp;&nbsp;<span class="k">double</span> output = controller.<span class="me">calculate</span>(measurement, setpoint);</span>
        <span class="cl">&nbsp;&nbsp;motor.<span class="me">set</span>(output);</span>
        <span class="cl">}</span>
      </div>
    </div>`,

    // 6: Tuning
    `<div class="inner">
      <span class="tag">// 05 · tuning.strategy()</span>
      <h2>The Tuning <span class="y">Procedure</span></h2>
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle">Increase <span class="y">P</span> Gain</div><div class="tldesc">Start at zero. Increase until the mechanism oscillates (wobbles) consistently.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--blue2);box-shadow:0 0 0 2px var(--blue2)"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle">Add <span class="b">D</span> Gain</div><div class="tldesc">Increase D to dampen the oscillations and smooth out the stop.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div></div>
          <div class="tlc"><div class="tltitle">Sprinkle <span class="g">I</span> (Optional)</div><div class="tldesc">If the mechanism stops just short of the goal, add a tiny bit of I to bridge the gap.</div></div>
        </div>
      </div>
      <ul class="bullets" style="margin-top:15px;">
        <li><span class="bul">▸</span><span>Units matter: Gains convert <span class="y">Error</span> (e.g. degrees) to <span class="y">Output</span> (-1.0 to 1.0).</span></li>
      </ul>
    </div>`,

    // 7: Feedforward Intro
    `<div class="inner">
      <span class="tag">// 06 · feedforward.physics()</span>
      <h2>Physics-Based <span class="y">Feedforward</span></h2>
      <p class="lead">Why wait for error? If we know the physics, we can "predict" the voltage.</p>
      <div class="fgrid three">
        <div class="fcard no-bracket">
          <div class="flabel">kS</div>
          <div class="ftitle y">Static</div>
          <div class="fdesc">Voltage to overcome friction.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">kV</div>
          <div class="ftitle b">Velocity</div>
          <div class="fdesc">Voltage per unit of speed.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">kA</div>
          <div class="ftitle g">Acceleration</div>
          <div class="fdesc">Voltage to change speed.</div>
        </div>
      </div>
    </div>`,

    // 8: Combining FF + PID
    `<div class="inner">
      <span class="tag">// 07 · combining.control()</span>
      <h2>The <span class="y">Winning</span> Combination</h2>
      <p class="lead">Feedforward does the heavy lifting; PID cleans up the small errors.</p>
      <div class="code">
        <span class="cl"><span class="t">SimpleMotorFeedforward</span> ff = </span>
        <span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">SimpleMotorFeedforward</span>(kS, kV, kA);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="k">double</span> pidOutput = controller.<span class="me">calculate</span>(measurement, setpoint);</span>
        <span class="cl"><span class="k">double</span> ffOutput = ff.<span class="me">calculate</span>(setpointVelocity);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Sum them together</span></span>
        <span class="cl">motor.<span class="me">set</span>(pidOutput + ffOutput);</span>
      </div>
    </div>`,

    // 8b: Gravity Compensation
    `<div class="inner">
      <span class="tag">// 08 · gravity.compensation()</span>
      <h2>Fighting <span class="y">Gravity</span>: kG</h2>
      <div class="two">
        <ul class="bullets">
          <li><span class="bul">▸</span><span><span class="y">kG</span> is the voltage needed to hold the mechanism still against gravity.</span></li>
          <li><span class="bul">▸</span><span><span class="b">Elevator</span>: gravity is constant — kG is one fixed voltage.</span></li>
          <li><span class="bul">▸</span><span><span class="g">Arm</span>: gravity torque varies with angle — kG &times; cos(&theta;), so the feedforward needs the current angle.</span></li>
          <li><span class="bul">▸</span><span><span class="p">Tuning tip</span>: kG is the voltage where the mechanism just barely holds still.</span></li>
        </ul>
        <div class="code">
          <span class="cl"><span class="c">// Elevator: constant gravity</span></span>
          <span class="cl"><span class="t">ElevatorFeedforward</span> ff =</span>
          <span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">ElevatorFeedforward</span>(kS, kG, kV, kA);</span>
          <span class="cl">ff.<span class="me">calculate</span>(velocity);</span>
          <span class="cl">&nbsp;</span>
          <span class="cl"><span class="c">// Arm: gravity depends on angle</span></span>
          <span class="cl"><span class="t">ArmFeedforward</span> armFf =</span>
          <span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">ArmFeedforward</span>(kS, kG, kV, kA);</span>
          <span class="cl hl">armFf.<span class="me">calculate</span>(angleRad, velocity);</span>
        </div>
      </div>
    </div>`,

    // 9: Drive Parameters
    `<div class="inner">
      <span class="tag">// 09 · drivetrain.config()</span>
      <h2>Drivetrain <span class="y">Parameters</span></h2>
      <div class="two">
        <ul class="bullets">
          <li><span class="bul">▸</span><span><span class="b">Track Width</span>: Distance between wheels.</span></li>
          <li><span class="bul">▸</span><span><span class="b">Gearing</span>: Essential for unit conversion.</span></li>
          <li><span class="bul">▸</span><span><span class="y">Slew Rate</span>: Limit acceleration to save motors.</span></li>
          <li><span class="bul">▸</span><span><span class="y">Deadbands</span>: Ignore tiny joystick noise.</span></li>
        </ul>
        <div class="code">
          <span class="cl"><span class="c">// Smooth out jerky inputs</span></span>
          <span class="cl"><span class="t">SlewRateLimiter</span> filter = </span>
          <span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">SlewRateLimiter</span>(<span class="n">3.0</span>);</span>
          <span class="cl">&nbsp;</span>
          <span class="cl"><span class="c">// Ignore 5% joystick noise</span></span>
          <span class="cl"><span class="k">double</span> input = <span class="t">MathUtil</span>.<span class="me">applyDeadband</span>(</span>
          <span class="cl">&nbsp;&nbsp;joy.<span class="me">getY</span>(), <span class="n">0.05</span>);</span>
        </div>
      </div>
    </div>`,

    // 10: Pitfalls
    `<div class="inner">
      <span class="tag">// 10 · common.pitfalls()</span>
      <h2>Watch Your <span class="y">Step</span></h2>
      <div class="fgrid">
        <div class="fcard">
          <div class="ftitle r">Wrong Sign</div>
          <div class="fdesc">Motor moves AWAY from setpoint. Error increases, motor pushes harder. Result: Runaway!</div>
        </div>
        <div class="fcard">
          <div class="ftitle y">Unit Mismatch</div>
          <div class="fdesc">Asking for 90 degrees but the sensor gives 0.25 rotations. Check your math!</div>
        </div>
        <div class="fcard">
          <div class="ftitle b">Sensor Phase</div>
          <div class="fdesc">Forward on the motor is "backward" on the encoder. Most APIs have an 'invert' for this.</div>
        </div>
        <div class="fcard">
          <div class="ftitle g">Integral Windup</div>
          <div class="fdesc">If the mechanism is stuck, I grows to infinity. Use <span class="me">setIZone</span> to limit its range.</div>
        </div>
      </div>
    </div>`,

    // 11: Recap
    `<div data-center>
      <span class="tag">// 11 · control.summary()</span>
      <h1>Master the <span class="y">Loop</span></h1>
      <p class="lead">Precise movement is the difference between<br>a robot and a machine.</p>
      <div class="stats" style="max-width:600px;margin:0 auto;">
        <div class="stat"><div class="sn">P.I.D.</div><div class="sl">Feedback logic</div></div>
        <div class="stat"><div class="sn">S.V.A.</div><div class="sl">Feedforward physics</div></div>
      </div>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('control-2', {
  title: 'Motion Profiles',
  tag: '// motion.profiles()',
  slides: [
    // Slide 1: Hero
    `<div data-center>
      <span class="tag">// control.profiles()</span>
      <h1>Motion <span class="y">Profiles</span></h1>
      <p class="lead">Smooth, fast, and controlled movement for robot mechanisms. No more jerky starts or mechanical stress.</p>
      <div>
        <span class="badge by">TrapezoidProfile</span>
        <span class="badge bb">ProfiledPIDController</span>
        <span class="badge bg">Feedforward</span>
      </div>
    </div>`,

    // Slide 2: Why motion profiles
    `<div class="inner">
      <span class="tag">// 01 · why.profile()</span>
      <h2>Beyond <span class="y">Raw PID</span></h2>
      <div class="bigq">PID is great, but it has no <span class="y">speed limit</span>. It just wants to get to the target as fast as possible.</div>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="r">The Jerk</span>: Sudden jumps in voltage stress motors and strip gears.</span></li>
        <li><span class="bul">▸</span><span><span class="r">Overshoot</span>: Going full speed until you hit the target often leads to oscillations.</span></li>
        <li><span class="bul">▸</span><span><span class="g">The Solution</span>: A profile defines a "flight plan" that respects physical constraints.</span></li>
      </ul>
    </div>`,

    // Slide 3: Trapezoidal profile
    `<div class="inner">
      <span class="tag">// 02 · trapezoid.concept()</span>
      <h2>The <span class="y">Trapezoid</span></h2>
      <p class="lead">A standard profile follows a three-phase speed curve:</p>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Phase 1</div>
          <div class="ftitle b">Acceleration</div>
          <div class="fdesc">Speed up at a constant rate until reaching max velocity.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Phase 2</div>
          <div class="ftitle g">Cruise</div>
          <div class="fdesc">Stay at the speed limit for as long as possible.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Phase 3</div>
          <div class="ftitle p">Deceleration</div>
          <div class="fdesc">Slow down perfectly to stop exactly at the target.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Constraints</div>
          <div class="ftitle y">Max V & Max A</div>
          <div class="fdesc">The profile shape depends entirely on what the robot can physically handle.</div>
        </div>
      </div>
    </div>`,

    // Slide 4: WPILib TrapezoidProfile
    `<div class="inner">
      <span class="tag">// 03 · TrapezoidProfile.java</span>
      <h2>Calculating <span class="y">Setpoints</span></h2>
      <div class="code">
<span class="cl"><span class="c">// Define how fast and how hard we can move</span></span>
<span class="cl"><span class="k">var</span> constraints = <span class="k">new</span> <span class="t">TrapezoidProfile.Constraints</span>(<span class="n">5.0</span>, <span class="n">10.0</span>);</span>
<span class="cl"><span class="k">var</span> profile = <span class="k">new</span> <span class="t">TrapezoidProfile</span>(constraints);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Current state and Goal state</span></span>
<span class="cl"><span class="k">var</span> current = <span class="k">new</span> <span class="t">TrapezoidProfile.State</span>(<span class="n">0</span>, <span class="n">0</span>);</span>
<span class="cl"><span class="k">var</span> goal = <span class="k">new</span> <span class="t">TrapezoidProfile.State</span>(<span class="n">2.0</span>, <span class="n">0</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Step the profile 20ms forward</span></span>
<span class="cl">current = profile.<span class="me">calculate</span>(<span class="n">0.020</span>, current, goal);</span>
<span class="cl"><span class="c">// current.position and current.velocity are the new targets</span></span>
      </div>
    </div>`,

    // Slide 5: ProfiledPIDController
    `<div class="inner">
      <span class="tag">// 04 · ProfiledPIDController.java</span>
      <h2>The <span class="y">Complete Package</span></h2>
      <div class="code">
<span class="cl"><span class="c">// PID constants + Profile constraints</span></span>
<span class="cl"><span class="t">ProfiledPIDController</span> controller = <span class="k">new</span> <span class="t">ProfiledPIDController</span>(</span>
<span class="cl">&nbsp;&nbsp;<span class="n">1.0</span>, <span class="n">0.0</span>, <span class="n">0.1</span>, <span class="k">new</span> <span class="t">TrapezoidProfile.Constraints</span>(<span class="n">2.0</span>, <span class="n">4.0</span>));</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Set where you want to go</span></span>
<span class="cl">controller.<span class="me">setGoal</span>(<span class="n">1.5</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Every periodic loop:</span></span>
<span class="cl hl"><span class="k">double</span> output = controller.<span class="me">calculate</span>(currentPos);</span>
<span class="cl"><span class="c">// PID follows the profile setpoint, not the final goal!</span></span>
      </div>
    </div>`,

    // Slide 6: Adding feedforward
    `<div class="inner">
      <span class="tag">// 05 · feedforward.profiles()</span>
      <h2>Proactive <span class="y">Power</span></h2>
      <div class="lead">PID reacts to error. Feedforward predicts the voltage needed to move at a specific velocity.</div>
      <div class="code">
<span class="cl"><span class="t">ElevatorFeedforward</span> ff = <span class="k">new</span> <span class="t">ElevatorFeedforward</span>(kS, kG, kV, kA);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Get the planned setpoint from the controller</span></span>
<span class="cl"><span class="k">var</span> setpoint = controller.<span class="me">getSetpoint</span>();</span>
<span class="cl">&nbsp;</span>
<span class="cl hl"><span class="k">double</span> ffVoltage = ff.<span class="me">calculate</span>(setpoint.velocity);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Final Output = PID + Feedforward</span></span>
<span class="cl">motor.<span class="me">setVoltage</span>(output + ffVoltage);</span>
      </div>
    </div>`,

    // Slide 7: Practical example
    `<div class="inner">
      <span class="tag">// 06 · elevator.example()</span>
      <h2>Elevator <span class="y">Control</span></h2>
      <div class="code">
<span class="cl"><span class="k">public void</span> <span class="me">periodic</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="c">// 1. Calculate the PID output to follow the profile</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">double</span> pid = m_controller.<span class="me">calculate</span>(m_encoder.<span class="me">getPosition</span>());</span>
<span class="cl">&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="c">// 2. Add Feedforward for gravity and velocity setpoint</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">var</span> setpoint = m_controller.<span class="me">getSetpoint</span>();</span>
<span class="cl hl">&nbsp;&nbsp;<span class="k">double</span> ff = m_feedforward.<span class="me">calculate</span>(setpoint.velocity);</span>
<span class="cl">&nbsp;</span>
<span class="cl">&nbsp;&nbsp;m_motor.<span class="me">setVoltage</span>(pid + ff);</span>
<span class="cl">}</span>
      </div>
      <p class="m" style="font-size: 0.8em; margin-top: 10px;">The elevator moves smoothly, stops precisely, and never exceeds mechanical limits.</p>
    </div>`,

    // Slide 8: Tuning & gotchas
    `<div class="inner">
      <span class="tag">// 07 · profile.tuning()</span>
      <h2>Tuning & <span class="y">Gotchas</span></h2>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">Units Matter</span>: Ensure your constraints (m/s) match your PID units.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Aggressive Constraints</span>: If the robot can\'t physically accelerate that fast, the profile will drift.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Goal vs Setpoint</span>: Use <span class="me">getSetpoint()</span> for Feedforward; use <span class="me">getGoal()</span> only to check if you are done.</span></li>
        <li><span class="bul">▸</span><span><span class="p">Feedforward First</span>: Tune kG (gravity) and kV (velocity) before adding PID gain for the best response.</span></li>
      </ul>
    </div>`,

    // Slide 9: SysId — Characterization

      <div class="code">

        <span class="cl">routine.<span class="me">quasistatic</span>(<span class="t">Direction</span>.kForward);</span>
        <span class="cl">routine.<span class="me">dynamic</span>(<span class="t">Direction</span>.kForward);</span>

    </div>`,

    `<div class="inner">
