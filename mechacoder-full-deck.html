<script>
window.registerLesson('general-2', {
  title: 'Unit Testing',
  tag: '// testing.junit()',
  slides: [
    // 1. HERO
    `<div data-center>
      <span class="tag">// testing.junit()</span>
      <h1>Unit <span class="y">Testing</span></h1>
      <p class="lead">Prove your code works before it ever touches the robot.</p>
      <div style="margin-top: 20px;">
        <span class="badge by">Level 2</span>
        <span class="badge bb">JUnit 5</span>
        <span class="badge bg">GradleRIO</span>
        <span class="badge bp">CI</span>
      </div>
    </div>`,

    // 2. WHY TEST
    `<span class="tag">// 01 · why.test()</span>
    <h2>Why <span class="y">Test?</span></h2>
    <div class="bigq">"Robot time is the scarcest resource on the team. Tests run with zero robots."</div>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">Catch regressions instantly:</span> Change code in January, know by lunch if you broke October's work.</span></li>
      <li><span class="bul">▸</span><span><span class="b">No hardware required:</span> Tests run on your laptop — in class, on the bus, at 11pm.</span></li>
      <li><span class="bul">▸</span><span><span class="g">Refactor with confidence:</span> A green test suite means your cleanup didn't change behavior.</span></li>
      <li><span class="bul">▸</span><span><span class="p">CI blocks broken merges:</span> The checks step from the Pull Request flow? This is what it runs.</span></li>
    </ul>`,

    // 3. JUNIT ANATOMY
    `<span class="tag">// 02 · junit.anatomy()</span>
    <h2>Anatomy of a <span class="y">Test</span></h2>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Tests live in <span class="y">src/test/java</span>, mirroring your main package structure.</span></li>
        <li><span class="bul">▸</span><span>Pattern: <span class="b">Arrange</span> (set up), <span class="g">Act</span> (call the method), <span class="p">Assert</span> (check the result).</span></li>
        <li><span class="bul">▸</span><span>One behavior per test. The method name should say what it proves.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="k">import</span> org.junit.jupiter.api.Test;</span>
<span class="cl"><span class="k">import static</span> org.junit.jupiter.api.Assertions.*;</span>
<span class="cl"></span>
<span class="cl"><span class="k">class</span> <span class="t">OIUtilTest</span> {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">@Test</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">void</span> <span class="me">deadbandKillsStickNoise</span>() {</span>
<span class="cl hl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="me">assertEquals</span>(<span class="n">0.0</span>, <span class="t">OIUtil</span>.<span class="me">deadband</span>(<span class="n">0.03</span>), <span class="n">1e-9</span>);</span>
<span class="cl">&nbsp;&nbsp;}</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 4. GRADLE TEST
    `<span class="tag">// 03 · gradle.test()</span>
    <h2>Running the <span class="y">Suite</span></h2>
    <p class="lead">WPILib templates ship with JUnit 5 already wired up — no setup needed.</p>
    <div class="code">
<span class="cl"><span class="c"># Run every test in the project</span></span>
<span class="cl"><span class="m">$</span> ./gradlew test</span>
<span class="cl"></span>
<span class="cl"><span class="c"># Run just one test class</span></span>
<span class="cl"><span class="m">$</span> ./gradlew test --tests <span class="s">"*ArmTest"</span></span>
<span class="cl"></span>
<span class="cl"><span class="c"># Detailed HTML report lands here:</span></span>
<span class="cl"><span class="c"># build/reports/tests/test/index.html</span></span>
    </div>
    <p class="lead">Tests also run automatically as part of <span class="y">./gradlew build</span> — a failing test fails the build.</p>`,

    // 5. ASSERTIONS TOOLBOX
    `<span class="tag">// 04 · assertions.toolbox()</span>
    <h2>The Assertion <span class="y">Toolbox</span></h2>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">numbers</div>
        <div class="ftitle b">assertEquals(exp, act, delta)</div>
        <div class="fdesc">Always pass a delta when comparing doubles — floating point is never exact.</div>
      </div>
      <div class="fcard">
        <div class="flabel">booleans</div>
        <div class="ftitle g">assertTrue / assertFalse</div>
        <div class="fdesc">For state checks: "after intake runs, hasGamePiece() should be true."</div>
      </div>
      <div class="fcard">
        <div class="flabel">errors</div>
        <div class="ftitle r">assertThrows</div>
        <div class="fdesc">Verify your guard clauses actually fire on bad input instead of corrupting state.</div>
      </div>
      <div class="fcard">
        <div class="flabel">scale</div>
        <div class="ftitle p">@ParameterizedTest</div>
        <div class="fdesc">One test method, many inputs — perfect for unit conversions and deadband edges.</div>
      </div>
    </div>`,

    // 6. TEST PURE LOGIC
    `<span class="tag">// 05 · test.pure_logic()</span>
    <h2>Start with <span class="y">Pure Logic</span></h2>
    <p class="lead">The easiest wins: classes that take numbers in and give numbers out. No hardware, no scheduler.</p>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">Unit conversions:</span> rotations to meters, degrees to radians.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Geometry math:</span> distance-to-target, angle wrapping.</span></li>
        <li><span class="bul">▸</span><span><span class="g">State machine transitions:</span> given state X and event Y, expect state Z.</span></li>
        <li><span class="bul">▸</span><span><span class="p">Input shaping:</span> deadbands, squaring, slew limits.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="k">@Test</span></span>
<span class="cl"><span class="k">void</span> <span class="me">wheelRotationsToMeters</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="c">// 1 rotation of a 4in wheel = pi * 0.1016 m</span></span>
<span class="cl">&nbsp;&nbsp;<span class="me">assertEquals</span>(<span class="n">0.3192</span>,</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">DriveMath</span>.<span class="me">rotationsToMeters</span>(<span class="n">1.0</span>), <span class="n">1e-3</span>);</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 7. SIM SUBSYSTEM TESTS
    `<span class="tag">// 06 · sim.subsystem_tests()</span>
    <h2>Testing <span class="y">Subsystems</span></h2>
    <p class="lead">The IO layer pays off again: swap in the sim IO and test whole subsystems headlessly.</p>
    <div class="code">
<span class="cl"><span class="k">@BeforeEach</span></span>
<span class="cl"><span class="k">void</span> <span class="me">setup</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">assert</span> <span class="t">HAL</span>.<span class="me">initialize</span>(<span class="n">500</span>, <span class="n">0</span>); <span class="c">// boot the sim HAL</span></span>
<span class="cl">&nbsp;&nbsp;intake = <span class="k">new</span> <span class="t">Intake</span>(<span class="k">new</span> <span class="t">IntakeIOSim</span>());</span>
<span class="cl">}</span>
<span class="cl"></span>
<span class="cl"><span class="k">@Test</span></span>
<span class="cl"><span class="k">void</span> <span class="me">intakeStopsWhenPieceDetected</span>() {</span>
<span class="cl">&nbsp;&nbsp;intake.<span class="me">run</span>();</span>
<span class="cl hl">&nbsp;&nbsp;<span class="k">for</span> (<span class="k">int</span> i = <span class="n">0</span>; i &lt; <span class="n">50</span>; i++) <span class="t">CommandScheduler</span>.<span class="me">getInstance</span>().<span class="me">run</span>();</span>
<span class="cl">&nbsp;&nbsp;<span class="me">assertEquals</span>(<span class="n">0.0</span>, intake.<span class="me">getAppliedVolts</span>(), <span class="n">1e-9</span>);</span>
<span class="cl">}</span>
    </div>`,

    // 8. SETUP / TEARDOWN
    `<span class="tag">// 07 · setup.teardown()</span>
    <h2>Clean Slate <span class="y">Every Test</span></h2>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">@BeforeEach</span> builds fresh objects so tests can't contaminate each other.</span></li>
        <li><span class="bul">▸</span><span><span class="b">@AfterEach</span> tears down shared HAL and scheduler state — this part is easy to forget.</span></li>
        <li><span class="bul">▸</span><span>Hardware objects (motors, encoders) must be <span class="r">close()</span>d so the next test can re-create them on the same ports.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="k">@AfterEach</span></span>
<span class="cl"><span class="k">void</span> <span class="me">teardown</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="t">CommandScheduler</span>.<span class="me">getInstance</span>().<span class="me">cancelAll</span>();</span>
<span class="cl">&nbsp;&nbsp;<span class="t">CommandScheduler</span>.<span class="me">getInstance</span>().<span class="me">unregisterAllSubsystems</span>();</span>
<span class="cl">&nbsp;&nbsp;intake.<span class="me">close</span>();</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 9. CI
    `<span class="tag">// 08 · ci.github_actions()</span>
    <h2>Tests on <span class="y">Every PR</span></h2>
    <p class="lead">GitHub Actions runs the suite in the cloud. A red X means the build is broken — don't merge.</p>
    <div class="code">
<span class="cl"><span class="c"># .github/workflows/build.yml</span></span>
<span class="cl"><span class="k">on</span>: [push, pull_request]</span>
<span class="cl"><span class="k">jobs</span>:</span>
<span class="cl">&nbsp;&nbsp;<span class="k">build</span>:</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">runs-on</span>: ubuntu-latest</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">container</span>: wpilib/roborio-cross-ubuntu:2026-22.04</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">steps</span>:</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- <span class="k">uses</span>: actions/checkout@v4</span>
<span class="cl hl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- <span class="k">run</span>: ./gradlew build</span>
    </div>
    <p class="lead">Build includes test — every pull request proves itself before a human even looks at it.</p>`,

    // 10. STRATEGY
    `<span class="tag">// 09 · strategy()</span>
    <h2>What to <span class="y">Test</span> (and Skip)</h2>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel g">DO test</div>
        <div class="ftitle g">Your Logic</div>
        <div class="fdesc">Math, unit conversions, state machines, command sequencing, config validation — anything you wrote that can be wrong.</div>
      </div>
      <div class="fcard">
        <div class="flabel r">DON'T test</div>
        <div class="ftitle r">Other People's Code</div>
        <div class="fdesc">Vendor APIs, WPILib internals, getters with no logic, the laws of physics. Trust the libraries; test your use of them.</div>
      </div>
    </div>
    <div class="bigq">"Aim for confidence, not coverage percentage. Five tests on your auto logic beat fifty on getters."</div>`,

    // 11. CLOSING
    `<div data-center>
      <span class="tag">// testing.complete()</span>
      <h2>Ship with <span class="y">Confidence</span></h2>
      <div class="stats">
        <div class="stat">
          <div class="sn">0</div>
          <div class="sl">Robots Required</div>
        </div>
        <div class="stat">
          <div class="sn">&lt;10s</div>
          <div class="sl">Feedback Loop</div>
        </div>
        <div class="stat">
          <div class="sn">100%</div>
          <div class="sl">Confidence on Merge</div>
        </div>
      </div>
      <p class="lead" style="margin-top:30px;">The best bug is the one that never reached the robot.</p>
    </div>`
  ]
});

</script>

<!-- ===== hardware-1.js ===== -->
<script>
window.registerLesson('hardware-1', {
  title: 'Hardware I — CAN, Encoders & Power',
  tag: '// hardware.fundamentals()',
  slides: [
    // 1. HERO
    `<div data-center>
      <span class="tag">// hardware.fundamentals()</span>
      <h1>Hardware <span class="y">Fundamentals</span></h1>
      <p class="lead">What the software is actually talking to.</p>
      <div style="margin-top: 20px;">
        <span class="badge by">Level 1</span>
        <span class="badge bb">CAN Bus</span>
        <span class="badge bg">Encoders</span>
        <span class="badge bp">Power</span>
      </div>
    </div>`,

    // 2. CAN OVERVIEW
    `<span class="tag">// 01 · can.overview()</span>
    <h2>The <span class="y">CAN Bus</span></h2>
    <p class="lead">One twisted yellow/green pair, daisy-chained through every smart device on the robot.</p>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span>roboRIO &rarr; motor controllers &rarr; CANcoders &rarr; PDH — <span class="y">one shared wire</span>.</span></li>
        <li><span class="bul">▸</span><span>Everyone hears everything; messages are addressed by <span class="b">device ID</span>.</span></li>
        <li><span class="bul">▸</span><span>Bandwidth is shared: roughly <span class="g">1 Mbps</span> for the whole robot.</span></li>
      </ul>
      <div class="fcard">
        <div class="flabel">why it matters</div>
        <div class="ftitle">Two Wires, Whole Robot</div>
        <div class="fdesc">Every motor command, every sensor reading, every status frame your code sees travels over this single pair. If it's unhealthy, everything is unhealthy.</div>
      </div>
    </div>`,

    // 3. DEVICE IDS
    `<span class="tag">// 02 · device.ids()</span>
    <h2>Device <span class="y">IDs</span></h2>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span>IDs are unique <span class="y">per device type</span> — set them in Phoenix Tuner X.</span></li>
        <li><span class="bul">▸</span><span><span class="r">Duplicate IDs</span> = two motors answering the same name: both move, or neither does.</span></li>
        <li><span class="bul">▸</span><span>Keep every ID in <span class="b">Constants.java</span> — never a bare number at a call site.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Label devices physically</span> with their ID. Future-you in the pit will be grateful.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="c">// Constants.java — the single source of truth</span></span>
<span class="cl"><span class="k">public static final int</span> kElevatorMotorId = <span class="n">13</span>;</span>
<span class="cl"></span>
<span class="cl"><span class="c">// Subsystem — name + bus, no magic numbers</span></span>
<span class="cl"><span class="t">TalonFX</span> motor =</span>
<span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">TalonFX</span>(kElevatorMotorId, <span class="s">"rio"</span>);</span>
      </div>
    </div>`,

    // 4. CAN HEALTH
    `<span class="tag">// 03 · can.health()</span>
    <h2>Keeping the Bus <span class="y">Healthy</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">Termination:</span> the bus needs a 120 &#937; resistor at <span class="y">both ends</span> — the roboRIO terminates one end internally; the PDH has a termination jumper for the other.</span></li>
      <li><span class="bul">▸</span><span><span class="b">Bus utilization:</span> watch the % in Driver Station diagnostics. Sustained <span class="r">&gt;80%</span> means dropped frames and laggy controls.</span></li>
      <li><span class="bul">▸</span><span><span class="r">Flaky bus symptoms:</span> blinking orange status lights, devices vanishing and reappearing in Tuner X, intermittent "motor not found" errors.</span></li>
      <li><span class="bul">▸</span><span>Most "code bugs" during bring-up are <span class="g">actually wiring</span>: a loose CAN connector mid-chain takes out everything downstream.</span></li>
    </ul>
    <p class="lead">Deep-dive triage lives in Troubleshooting II — CAN Bus Debugging.</p>`,

    // 5. CANIVORE
    `<span class="tag">// 04 · canivore()</span>
    <h2><span class="y">CANivore</span> — the Second Bus</h2>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">what</div>
        <div class="ftitle b">CAN FD over USB</div>
        <div class="fdesc">A USB-attached second bus running CAN FD — faster frames, more bandwidth than the rio bus.</div>
      </div>
      <div class="fcard">
        <div class="flabel">code</div>
        <div class="ftitle g">Just a Bus Name</div>
        <div class="fdesc">new TalonFX(13, "canivore") instead of "rio". Same API, different wire.</div>
      </div>
      <div class="fcard">
        <div class="flabel">why</div>
        <div class="ftitle y">Offload Swerve</div>
        <div class="fdesc">8 motors + 4 CANcoders of a swerve drive saturate the rio bus. Move them to the CANivore.</div>
      </div>
      <div class="fcard">
        <div class="flabel">bonus</div>
        <div class="ftitle p">Synced Signals</div>
        <div class="fdesc">Devices on a CANivore can timestamp and synchronize signals for better odometry.</div>
      </div>
    </div>`,

    // 6. RELATIVE ENCODERS
    `<span class="tag">// 05 · encoders.relative()</span>
    <h2><span class="y">Relative</span> Encoders</h2>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Every TalonFX has a built-in <span class="y">rotor encoder</span> — high resolution, always present.</span></li>
        <li><span class="bul">▸</span><span>But it's <span class="r">relative</span>: it reads zero wherever the motor wakes up.</span></li>
        <li><span class="bul">▸</span><span>Great for <span class="g">velocity</span> and "move 3 rotations from here."</span></li>
        <li><span class="bul">▸</span><span>Useless alone for <span class="b">"where is the arm right now?"</span></span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="c">// Convert rotor rotations to mechanism units</span></span>
<span class="cl"><span class="t">FeedbackConfigs</span> fb = cfg.Feedback;</span>
<span class="cl hl">fb.SensorToMechanismRatio = <span class="n">25.0</span>; <span class="c">// 25:1 gearbox</span></span>
<span class="cl"></span>
<span class="cl"><span class="c">// Now getPosition() reads mechanism rotations</span></span>
<span class="cl">motor.<span class="me">getPosition</span>().<span class="me">getValue</span>();</span>
      </div>
    </div>`,

    // 7. ABSOLUTE ENCODERS
    `<span class="tag">// 06 · encoders.absolute()</span>
    <h2><span class="y">Absolute</span> Encoders</h2>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">the point</div>
        <div class="ftitle g">Knows at Power-On</div>
        <div class="fdesc">A magnet on the shaft gives true position within one rotation the instant the robot boots. No homing routine.</div>
      </div>
      <div class="fcard">
        <div class="flabel">devices</div>
        <div class="ftitle b">CANcoder / Through-Bore</div>
        <div class="fdesc">CANcoder lives on the CAN bus; through-bore duty-cycle encoders plug into the rio. Both read absolute angles.</div>
      </div>
      <div class="fcard">
        <div class="flabel">use for</div>
        <div class="ftitle y">Swerve &amp; Arms</div>
        <div class="fdesc">Swerve azimuth and arm angles MUST know where they are at enable — these are absolute-encoder jobs.</div>
      </div>
      <div class="fcard">
        <div class="flabel">trade-off</div>
        <div class="ftitle r">Lower Resolution</div>
        <div class="fdesc">Coarser than the rotor encoder, and the magnet must be mounted concentric on the shaft.</div>
      </div>
    </div>`,

    // 8. OFFSETS & ZEROING
    `<span class="tag">// 07 · offsets.zeroing()</span>
    <h2>Offsets &amp; <span class="y">Zeroing</span></h2>
    <p class="lead">The magnet doesn't know where "level" is. You have to tell it — once, carefully.</p>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Move the mechanism to a <span class="y">known position</span> (hard stop, level, straight ahead).</span></li>
        <li><span class="bul">▸</span><span>Read the raw value, store its negation as the <span class="b">magnet offset</span>.</span></li>
        <li><span class="bul">▸</span><span><span class="g">FusedCANcoder</span> ties absolute truth to rotor resolution — best of both.</span></li>
        <li><span class="bul">▸</span><span><span class="r">Warning:</span> an arm with a wrong offset will happily drive through the robot.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="c">// CANcoder config: zero = arm level</span></span>
<span class="cl">cc.MagnetSensor.MagnetOffset = <span class="n">-0.314</span>;</span>
<span class="cl"></span>
<span class="cl"><span class="c">// TalonFX: fuse it with the rotor</span></span>
<span class="cl">fb.FeedbackRemoteSensorID = kCancoderId;</span>
<span class="cl hl">fb.FeedbackSensorSource =</span>
<span class="cl hl">&nbsp;&nbsp;<span class="t">FeedbackSensorSourceValue</span>.FusedCANcoder;</span>
      </div>
    </div>`,

    // 9. CURRENT LIMITS
    `<span class="tag">// 08 · current.limits()</span>
    <h2>Current <span class="y">Limits</span></h2>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">Stator limit:</span> caps torque and heat at the motor — protects the mechanism and the motor windings.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Supply limit:</span> caps what the battery and breaker see — protects the power system.</span></li>
        <li><span class="bul">▸</span><span>40A breakers are slow-blow, <span class="r">not infinite</span> — and wheels slip past a current threshold anyway.</span></li>
        <li><span class="bul">▸</span><span>Set limits <span class="g">before first enable</span>, not after the first burnt motor.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="t">CurrentLimitsConfigs</span> limits = cfg.CurrentLimits;</span>
<span class="cl">limits.StatorCurrentLimit = <span class="n">60</span>;</span>
<span class="cl">limits.StatorCurrentLimitEnable = <span class="k">true</span>;</span>
<span class="cl">limits.SupplyCurrentLimit = <span class="n">40</span>;</span>
<span class="cl">limits.SupplyCurrentLimitEnable = <span class="k">true</span>;</span>
      </div>
    </div>`,

    // 10. BROWNOUT
    `<span class="tag">// 09 · brownout()</span>
    <h2><span class="y">Brownout</span></h2>
    <p class="lead">Motors pull amps &rarr; battery voltage sags &rarr; the roboRIO protects itself.</p>
    <ul class="bullets">
      <li><span class="bul">▸</span><span>Below the brownout threshold (<span class="y">~6.75V</span> on roboRIO 2), motor outputs are <span class="r">cut</span> until voltage recovers.</span></li>
      <li><span class="bul">▸</span><span><span class="b">Symptoms:</span> robot stutters under load, DS voltage graph diving, lights flickering on hard accelerations.</span></li>
      <li><span class="bul">▸</span><span><span class="g">Prevention:</span> fresh batteries, sane current limits, stagger high-draw mechanisms.</span></li>
      <li><span class="bul">▸</span><span>Watch per-channel currents from the PDH in AdvantageScope — the Power Visualization skill from AdvantageScope I.</span></li>
    </ul>`,

    // 11. BRING-UP CHECKLIST
    `<span class="tag">// 10 · bringup.checklist()</span>
    <h2>Bring-Up <span class="y">Checklist</span></h2>
    <div class="tl">
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Set &amp; Label IDs</div><div class="tldesc">Assign every device a unique ID in Tuner X. Label the device physically.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Verify Every Device Responds</div><div class="tldesc">All devices visible in Tuner X, firmware updated, lights steady.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Check Termination &amp; Utilization</div><div class="tldesc">120&#937; at both ends, bus utilization comfortably under 80%.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Configure Current Limits</div><div class="tldesc">BEFORE first enable. Every motor, every time.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div></div>
        <div class="tlc"><div class="tltitle">Zero Absolute Encoders</div><div class="tldesc">At mechanical hard stops or measured positions. Record offsets in Constants.</div></div>
      </div>
    </div>`,

    // 12. CLOSING
    `<div data-center>
      <span class="tag">// hardware.complete()</span>
      <h2>Respect the <span class="y">Physics</span></h2>
      <div class="stats">
        <div class="stat">
          <div class="sn">2</div>
          <div class="sl">Wires Running Everything</div>
        </div>
        <div class="stat">
          <div class="sn">120&#937;</div>
          <div class="sl">At Both Ends</div>
        </div>
        <div class="stat">
          <div class="sn">40A</div>
          <div class="sl">Respect the Breaker</div>
        </div>
      </div>
      <p class="lead" style="margin-top:30px;">Software bugs reboot. Hardware bugs smoke.</p>
    </div>`
  ]
});

</script>

<!-- ===== java-1.js ===== -->
<script>
registerLesson('java-1', {
  title: 'Java I — Language Foundations',
  tag: '// java.fundamentals()',
  slides: [
    // 1. HERO
    `<div data-center>
      <h1>Java <span class="y">I</span></h1>
      <p class="lead">The powerhouse language of FRC. Building the foundations to bring your robot to life.</p>
      <div>
        <span class="badge by">BEGINNER</span>
        <span class="badge bb">CORE JAVA</span>
        <span class="badge bg">WPILIB READY</span>
      </div>
    </div>`,

    // 2. WHY JAVA
    `<div>
      <span class="tag">// 01 · introduction()</span>
      <h2>Why <span class="y">Java</span> for FRC?</h2>
      <p class="lead">Java is one of the most popular languages in the world and the standard for most FRC teams.</p>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><strong>Static Typing:</strong> Catch errors at compile-time before they reach the robot.</span></li>
        <li><span class="bul">▸</span><span><strong>Object-Oriented:</strong> Perfect for modeling physical systems like motors and sensors.</span></li>
        <li><span class="bul">▸</span><span><strong>Performance:</strong> The JVM (Java Virtual Machine) is fast enough for real-time control loops.</span></li>
        <li><span class="bul">▸</span><span><strong>Ecosystem:</strong> Access to WPILib, thousands of libraries, and years of documentation.</span></li>
      </ul>
    </div>`,

    // 3. VARIABLES & TYPES
    `<div>
      <span class="tag">// 02 · variables.and.types()</span>
      <h2>Variables & <span class="y">Types</span></h2>
      <div class="two">
        <div>
          <p class="lead">Variables store data. In Java, every variable must have a <strong>type</strong>.</p>
          <ul class="bullets">
            <li><span class="bul">▸</span><span><span class="k">int</span>: Whole numbers (IDs, counts)</span></li>
            <li><span class="bul">▸</span><span><span class="k">double</span>: Decimals (speed, voltage)</span></li>
            <li><span class="bul">▸</span><span><span class="k">boolean</span>: True/False (switches)</span></li>
          </ul>
        </div>
        <div class="code">
          <span class="cl"><span class="k">int</span> motorID = <span class="n">14</span>; <span class="c">// CAN ID</span></span>
          <span class="cl"><span class="k">double</span> maxSpeed = <span class="n">0.85</span>;</span>
          <span class="cl"><span class="k">boolean</span> isHomed = <span class="k">false</span>;</span>
          <span class="cl"><span class="k">var</span> name = <span class="s">"Drivetrain"</span>;</span>
        </div>
      </div>
    </div>`,

    // 4. DATASTRUCTURES
    `<div>
      <span class="tag">// 03 · collections()</span>
      <h2>Storing <span class="y">Data</span></h2>
      <p class="lead">When one variable isn't enough, use Arrays or Collections to manage groups of objects.</p>
      <div class="code">
        <span class="cl"><span class="c">// Fixed-size Array</span></span>
        <span class="cl"><span class="k">int</span>[] canBusIds = {<span class="n">1</span>, <span class="n">2</span>, <span class="n">3</span>, <span class="n">4</span>};</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Dynamic List (Size can change)</span></span>
        <span class="cl"><span class="t">List</span>&lt;<span class="t">String</span>&gt; logs = <span class="k">new</span> <span class="t">ArrayList</span>&lt;&gt;();</span>
        <span class="cl">logs.<span class="me">add</span>(<span class="s">"Robot Initialized"</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Key-Value Mapping</span></span>
        <span class="cl"><span class="t">Map</span>&lt;<span class="t">Integer</span>, <span class="t">Double</span>&gt; offsets = <span class="k">new</span> <span class="t">HashMap</span>&lt;&gt;();</span>
      </div>
    </div>`,

    // 5. CONTROL STRUCTURES
    `<div>
      <span class="tag">// 04 · logic.and.loops()</span>
      <h2>Control <span class="y">Structures</span></h2>
      <div class="code">
        <span class="cl"><span class="k">if</span> (joystick.<span class="me">getRawButton</span>(<span class="n">1</span>)) {</span>
        <span class="cl">&nbsp;&nbsp;intake.<span class="me">spin</span>(<span class="n">0.5</span>);</span>
        <span class="cl">} <span class="k">else</span> {</span>
        <span class="cl">&nbsp;&nbsp;intake.<span class="me">stop</span>();</span>
        <span class="cl">}</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Iterating through a list</span></span>
        <span class="cl"><span class="k">for</span> (<span class="k">var</span> sensor : sensors) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">if</span> (sensor.<span class="me">isFaulty</span>()) <span class="me">report</span>(sensor);</span>
        <span class="cl">}</span>
      </div>
    </div>`,

    // 6. FUNCTIONS (METHODS)
    `<div>
      <span class="tag">// 05 · modularity()</span>
      <h2>Reusable <span class="y">Methods</span></h2>
      <p class="lead">Break complex logic into small, testable chunks. Methods define behavior.</p>
      <div class="code">
        <span class="cl"><span class="k">public</span> <span class="k">double</span> <span class="me">calculateOutput</span>(<span class="k">double</span> input) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">if</span> (<span class="t">Math</span>.<span class="me">abs</span>(input) &lt; <span class="n">0.05</span>) {</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">return</span> <span class="n">0.0</span>; <span class="c">// Deadband</span></span>
        <span class="cl">&nbsp;&nbsp;}</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return</span> input * maxSpeed;</span>
        <span class="cl">}</span>
      </div>
    </div>`,

    // 7. CLASSES
    `<div>
      <span class="tag">// 06 · oop.basics()</span>
      <h2>The <span class="y">Class</span> Blueprint</h2>
      <p class="lead">A class is a template for an <strong>Object</strong>. Think of "Motor" as the class and "Left Front Motor" as the object.</p>
      <div class="code">
        <span class="cl"><span class="k">public class</span> <span class="t">Subsystem</span> {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">private double</span> currentSpeed = <span class="n">0.0</span>; <span class="c">// Field</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">public void</span> <span class="me">setSpeed</span>(<span class="k">double</span> s) {</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">this</span>.currentSpeed = s;</span>
        <span class="cl">&nbsp;&nbsp;}</span>
        <span class="cl">}</span>
      </div>
    </div>`,

    // 8. CONSTRUCTORS
    `<div>
      <span class="tag">// 07 · initialization()</span>
      <h2>Constructors & <span class="y">"this"</span></h2>
      <p class="lead">Constructors run once when an object is created. Use <span class="k">this</span> to distinguish fields from parameters.</p>
      <div class="code">
        <span class="cl"><span class="k">public class</span> <span class="t">Climber</span> {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">private int</span> motorPort;</span>
        <span class="cl">&nbsp;</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">public</span> <span class="me">Climber</span>(<span class="k">int</span> motorPort) {</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">this</span>.motorPort = motorPort;</span>
        <span class="cl">&nbsp;&nbsp;}</span>
        <span class="cl">}</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Usage:</span></span>
        <span class="cl"><span class="k">var</span> leftHook = <span class="k">new</span> <span class="t">Climber</span>(<span class="n">5</span>);</span>
      </div>
    </div>`,

    // 9. ENUMS
    `<div>
      <span class="tag">// 08 · enums()</span>
      <h2>Enums: <span class="y">Named Choices</span></h2>
      <div class="two">
        <div>
          <p class="lead">An enum is a type with a fixed set of named values. No magic numbers, no invalid states.</p>
          <ul class="bullets">
            <li><span class="bul">▸</span><span>The compiler rejects anything not in the list.</span></li>
            <li><span class="bul">▸</span><span><span class="k">switch</span> over an enum reads like English.</span></li>
            <li><span class="bul">▸</span><span>This becomes the <strong>State Machine</strong> pattern in Java II.</span></li>
          </ul>
        </div>
        <div class="code">
          <span class="cl"><span class="k">public enum</span> <span class="t">ArmPosition</span> {</span>
          <span class="cl">&nbsp;&nbsp;STOWED, INTAKE, SCORE</span>
          <span class="cl">}</span>
          <span class="cl">&nbsp;</span>
          <span class="cl"><span class="k">switch</span> (position) {</span>
          <span class="cl">&nbsp;&nbsp;<span class="k">case</span> STOWED -&gt; arm.<span class="me">setAngle</span>(<span class="n">0</span>);</span>
          <span class="cl">&nbsp;&nbsp;<span class="k">case</span> INTAKE -&gt; arm.<span class="me">setAngle</span>(<span class="n">35</span>);</span>
          <span class="cl">&nbsp;&nbsp;<span class="k">case</span> SCORE&nbsp; -&gt; arm.<span class="me">setAngle</span>(<span class="n">110</span>);</span>
          <span class="cl">}</span>
        </div>
      </div>
    </div>`,

    // 10. PACKAGES & IMPORTS
    `<div>
      <span class="tag">// 09 · project.structure()</span>
      <h2>Packages & <span class="y">Imports</span></h2>
      <p class="lead">Organize your code like folders. Use <span class="k">import</span> to use code from other files or libraries.</p>
      <div class="code tight">
        <span class="cl"><span class="k">package</span> frc.robot.subsystems;</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="k">import</span> edu.wpi.first.wpilibj2.command.<span class="t">SubsystemBase</span>;</span>
        <span class="cl"><span class="k">import</span> com.revrobotics.<span class="t">CANSparkMax</span>;</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="k">public class</span> <span class="t">DriveTrain</span> <span class="k">extends</span> <span class="t">SubsystemBase</span> { ... }</span>
      </div>
    </div>`,

    // 11. EXCEPTIONS
    `<div>
      <span class="tag">// 10 · exceptions.try_catch()</span>
      <h2>Exceptions & <span class="y">try/catch</span></h2>
      <div class="two">
        <div>
          <p class="lead">When something goes wrong, Java <strong>throws</strong> an exception. Uncaught, it crashes the program.</p>
          <ul class="bullets">
            <li><span class="bul">▸</span><span>An uncaught exception in <span class="me">periodic()</span> = <span class="r">"Robot Code: No"</span> on the Driver Station.</span></li>
            <li><span class="bul">▸</span><span><span class="k">catch</span> where you can recover; let it crash where you can't.</span></li>
            <li><span class="bul">▸</span><span>Never catch-and-ignore — at minimum, report it.</span></li>
          </ul>
        </div>
        <div class="code">
          <span class="cl"><span class="k">try</span> {</span>
          <span class="cl">&nbsp;&nbsp;config = <span class="me">loadFromFile</span>(<span class="s">"tuning.json"</span>);</span>
          <span class="cl">} <span class="k">catch</span> (<span class="t">IOException</span> e) {</span>
          <span class="cl">&nbsp;&nbsp;<span class="c">// Recover: fall back to defaults</span></span>
          <span class="cl">&nbsp;&nbsp;config = <span class="t">Config</span>.<span class="me">defaults</span>();</span>
          <span class="cl">&nbsp;&nbsp;<span class="me">reportWarning</span>(<span class="s">"Using default tuning"</span>);</span>
          <span class="cl">}</span>
        </div>
      </div>
    </div>`,

    // 12. LAMBDAS
    `<div>
      <span class="tag">// 11 · lambdas.method_refs()</span>
      <h2>Lambdas & <span class="y">Method References</span></h2>
      <div class="two">
        <div>
          <p class="lead">A lambda is a tiny unnamed function you pass around like a value. <strong>This is the syntax WPILib commands and Suppliers are built on.</strong></p>
          <ul class="bullets">
            <li><span class="bul">▸</span><span><span class="k">() -&gt;</span> value: "when asked, compute this."</span></li>
            <li><span class="bul">▸</span><span><span class="me">intake::stop</span> is shorthand for <span class="k">() -&gt;</span> intake.<span class="me">stop</span>().</span></li>
            <li><span class="bul">▸</span><span>You'll meet these again immediately in WPILib I.</span></li>
          </ul>
        </div>
        <div class="code">
          <span class="cl"><span class="c">// A supplier: called every loop for fresh values</span></span>
          <span class="cl"><span class="t">DoubleSupplier</span> speed = () -&gt; joystick.<span class="me">getY</span>();</span>
          <span class="cl">&nbsp;</span>
          <span class="cl"><span class="c">// A runnable action</span></span>
          <span class="cl"><span class="t">Runnable</span> stopAll = () -&gt; intake.<span class="me">stop</span>();</span>
          <span class="cl">&nbsp;</span>
          <span class="cl"><span class="c">// Method reference — same thing, shorter</span></span>
          <span class="cl"><span class="t">Runnable</span> stopAll2 = intake::stop;</span>
        </div>
      </div>
    </div>`,

    // 13. COMMON GOTCHAS
    `<div>
      <span class="tag">// 12 · debugging()</span>
      <h2>Common <span class="y">Gotchas</span></h2>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">COMPARISON</div>
          <div class="ftitle">== vs .equals()</div>
          <div class="fdesc">Use <span class="k">==</span> for primitives (int, double). Use <span class="me">.equals()</span> for Objects (Strings).</div>
        </div>
        <div class="fcard">
          <div class="flabel">MATH</div>
          <div class="ftitle">Integer Division</div>
          <div class="fdesc"><span class="n">5</span> / <span class="n">2</span> is <span class="n">2</span>. Use <span class="n">5.0</span> / <span class="n">2.0</span> to get <span class="n">2.5</span>.</div>
        </div>
        <div class="fcard">
          <div class="flabel">SAFETY</div>
          <div class="ftitle">NullPointerExceptions</div>
          <div class="fdesc">Always initialize your objects before using them, or the robot code will crash.</div>
        </div>
        <div class="fcard">
          <div class="flabel">LOGIC</div>
          <div class="ftitle">Off-by-One</div>
          <div class="fdesc">Arrays start at index <span class="n">0</span>. An array of size 10 goes from 0 to 9.</div>
        </div>
      </div>
    </div>`,

    // 14. TIMELINE
    `<div>
      <span class="tag">// 13 · roadmap()</span>
      <h2>How to <span class="y">Practice</span></h2>
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc">
            <div class="tltitle">Read the Code</div>
            <div class="tldesc">Open last year's robot project. Follow the logic from the joystick to the motor.</div>
          </div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc">
            <div class="tltitle">Modify Small Things</div>
            <div class="tldesc">Change a constant, swap a button ID, or add a print statement to see it work.</div>
          </div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc">
            <div class="tltitle">Write from Scratch</div>
            <div class="tldesc">Try implementing a simple subsystem like a "Grabber" without looking at examples.</div>
          </div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot"></div></div>
          <div class="tlc">
            <div class="tltitle">Debug & Refactor</div>
            <div class="tldesc">Fix the errors that pop up. Clean up your code until it's easy for others to read.</div>
          </div>
        </div>
      </div>
    </div>`,

    // 12. CLOSING
    `<div data-center>
      <h2>Ready to <span class="y">Deploy?</span></h2>
      <p class="lead">Language is just a tool. The real magic happens when you see your code move 150 lbs of aluminum.</p>
      <div class="code" style="display:inline-flex;align-items:center;justify-content:center;padding:14px 40px;min-height:110px;">
        <span class="cl">robot.<span class="me">enable</span>(); <span class="c">// Let's build something.</span></span>
      </div>
    </div>`
  ]
});

<script>
window.registerLesson('java-2', {
  title: 'Java II — OOP & Patterns',
  tag: '// java.oop.patterns()',
  slides: [
    // 0: HERO
    `<div data-center>
      <span class="tag">// java.oop.patterns()</span>
      <h1>Java <span class="y">II</span>:<br>OOP &amp; Patterns</h1>
      <p class="lead">Moving beyond variables and loops to build modular,<br>maintainable, and "pro-level" robot software.</p>
      <div>
        <span class="badge by">Level 2</span>
        <span class="badge bb">Object Oriented Design</span>
        <span class="badge bg">FRC Architecture</span>
      </div>
    </div>`,

    // 1: WHY PATTERNS
    `<div class="inner">
      <span class="tag">// 01 · introduction.why()</span>
      <h2>Why Design <span class="y">Patterns?</span></h2>
      <div class="bigq">"Code is read much more often than it is written."<br><span class="m" style="font-size:0.6em;font-weight:400;">— Guido van Rossum (adapted)</span></div>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">Scalability</span>: Patterns keep code organized as the robot gets more complex.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Common Language</span>: "I'm using a Factory" tells other mentors exactly what you mean.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Testing</span>: Decoupled code is easier to simulate and test without a real robot.</span></li>
      </ul>
    </div>`,

    // 2: ADVANCED DATASTRUCTURES
    `<div class="inner">
      <span class="tag">// 02 · collections.generics()</span>
      <h2>Advanced <span class="y">Collections</span></h2>
      <div class="two">
        <ul class="bullets">
          <li><span class="bul">▸</span><span><span class="y">Set&lt;T&gt;</span>: Unordered, unique items. No duplicates allowed.</span></li>
          <li><span class="bul">▸</span><span><span class="b">Queue&lt;T&gt;</span>: First-in, first-out (FIFO). Great for command buffers.</span></li>
          <li><span class="bul">▸</span><span><span class="g">Map&lt;K, V&gt;</span>: Key-value pairs. Fast lookups (e.g., constants by name).</span></li>
        </ul>
        <div class="code">
<span class="cl"><span class="t">Map</span>&lt;<span class="t">String</span>, <span class="t">Double</span>&gt; gains = <span class="k">new</span> <span class="t">HashMap</span>&lt;&gt;();</span>
<span class="cl">gains.<span class="me">put</span>(<span class="s">"kP"</span>, <span class="n">0.1</span>);</span>
<span class="cl">gains.<span class="me">put</span>(<span class="s">"kD"</span>, <span class="n">0.01</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">double</span> p = gains.<span class="me">get</span>(<span class="s">"kP"</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="t">Queue</span>&lt;<span class="t">Command</span>&gt; q = <span class="k">new</span> <span class="t">LinkedList</span>&lt;&gt;();</span>
<span class="cl">q.<span class="me">add</span>(autonomousCommand);</span>
        </div>
      </div>
    </div>`,

    // 2b: GENERICS
    `<div class="inner">
      <span class="tag">// 03 · generics.type_params()</span>
      <h2>Writing Your Own <span class="y">Generics</span></h2>
      <p class="lead">You've been <em>using</em> <span class="t">List</span>&lt;<span class="t">T</span>&gt;. Now write your own — one class, any type, full compiler protection.</p>
      <div class="two">
        <ul class="bullets">
          <li><span class="bul">▸</span><span><span class="y">&lt;T&gt;</span> is a type parameter — a placeholder filled in at use time.</span></li>
          <li><span class="bul">▸</span><span>The compiler rejects a <span class="t">String</span> where a <span class="t">Double</span> belongs — <span class="g">at build time</span>, not on the field.</span></li>
          <li><span class="bul">▸</span><span>You'll see this shape in tunable values and IO-inputs wrappers.</span></li>
        </ul>
        <div class="code">
<span class="cl"><span class="k">public class</span> <span class="t">LoggedValue</span>&lt;<span class="t">T</span>&gt; {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">private</span> <span class="t">T</span> value;</span>
<span class="cl">&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public void</span> <span class="me">set</span>(<span class="t">T</span> v) { value = v; }</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public</span> <span class="t">T</span> <span class="me">get</span>() { <span class="k">return</span> value; }</span>
<span class="cl">}</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="t">LoggedValue</span>&lt;<span class="t">Double</span>&gt; setpoint = <span class="k">new</span> <span class="t">LoggedValue</span>&lt;&gt;();</span>
<span class="cl">setpoint.<span class="me">set</span>(<span class="n">3.5</span>);&nbsp;&nbsp;<span class="c">// OK</span></span>
<span class="cl">setpoint.<span class="me">set</span>(<span class="s">"fast"</span>); <span class="c">// Compile error!</span></span>
        </div>
      </div>
    </div>`,

    // 3: INHERITANCE
    `<div class="inner">
      <span class="tag">// 04 · inheritance.extends()</span>
      <h2>Inheritance &amp; <span class="y">Abstractions</span></h2>
      <p class="lead">Use <span class="k">extends</span> to share logic between related classes.</p>
      <div class="code">
<span class="cl"><span class="k">public abstract class</span> <span class="t">BaseSubsystem</span> {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public abstract void</span> <span class="me">stop</span>();</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public void</span> <span class="me">log</span>(<span class="t">String</span> msg) { <span class="t">System</span>.out.<span class="me">println</span>(msg); }</span>
<span class="cl">}</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">public class</span> <span class="t">Intake</span> <span class="k">extends</span> <span class="t">BaseSubsystem</span> {</span>
<span class="cl">&nbsp;&nbsp;<span class="me">@Override</span></span>
<span class="cl">&nbsp;&nbsp;<span class="k">public void</span> <span class="me">stop</span>() { motor.<span class="me">set</span>(<span class="n">0</span>); }</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 4: POLYMORPHISM
    `<div class="inner">
      <span class="tag">// 05 · polymorphism.override()</span>
      <h2>Polymorphism: <span class="y">Many Forms</span></h2>
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Treat a <span class="t">TalonFX</span> or <span class="t">SparkMax</span> as just a <span class="t">MotorController</span>.</span></li>
        <li><span class="bul">▸</span><span><span class="y">super</span>: Call a method in the parent class (e.g. <span class="k">super</span>.<span class="me">periodic</span>()).</span></li>
        <li><span class="bul">▸</span><span><span class="b">@Override</span>: Tells the compiler you are intentionally redefining a method.</span></li>
      </ul>
      <div class="frow">
        <div class="ftitle">Pro Tip: Always use @Override to catch typos in method names!</div>
      </div>
    </div>`,

    // 5: INTERFACES (CONTRACT)
    `<div class="inner">
      <span class="tag">// 06 · interfaces.contracts()</span>
      <h2>Interfaces as <span class="y">Contracts</span></h2>
      <p class="lead">An interface defines <strong>what</strong> an object can do, without caring <strong>how</strong> it does it.</p>
      <div class="code">
<span class="cl"><span class="k">public interface</span> <span class="t">IntakeIO</span> {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public default void</span> <span class="me">updateInputs</span>(<span class="t">IntakeInputs</span> inputs) {}</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public default void</span> <span class="me">setVoltage</span>(<span class="k">double</span> volts) {}</span>
<span class="cl">}</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Multiple interfaces? No problem!</span></span>
<span class="cl"><span class="k">public class</span> <span class="t">Robot</span> <span class="k">implements</span> <span class="t">Loggable</span>, <span class="t">Sendable</span> { ... }</span>
      </div>
    </div>`,

    // 6: IO LAYER
    `<div class="inner">
      <span class="tag">// 07 · architecture.io_layer()</span>
      <h2>The <span class="y">IO-Layer</span> Pattern</h2>
      <p class="lead">This is how Team 6328 handles Simulation vs Real hardware.</p>
      <div class="fgrid">
        <div class="fcard no-bracket">
          <div class="flabel">Implementation A</div>
          <div class="ftitle g">IntakeIOSparkMax</div>
          <div class="fdesc">Uses real CAN IDs and hardware APIs to move physical rollers.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">Implementation B</div>
          <div class="ftitle b">IntakeIOSim</div>
          <div class="fdesc">Uses physics math (moment of inertia) to "fake" the robot in code.</div>
        </div>
      </div>
      <div class="frow">
        <div class="ftitle">The Subsystem only talks to the <strong>Interface</strong>, so it never knows which one is running!</div>
      </div>
    </div>`,

    // 7: FACTORIES
    `<div class="inner">
      <span class="tag">// 08 · factory.static_methods()</span>
      <h2>Static <span class="y">Factories</span></h2>
      <p class="lead">Why use <span class="t">Subsystem</span>.<span class="me">create</span>() instead of <span class="k">new</span> <span class="t">Subsystem</span>()?</p>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">Descriptive Names</span>: "fromId(5)" is clearer than just passing 5 to a constructor.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Caching</span>: You can return an existing instance instead of creating a new one.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="k">public static</span> <span class="t">Command</span> <span class="me">printMessage</span>(<span class="t">String</span> msg) {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">InstantCommand</span>(() -&gt; <span class="t">System</span>.out.<span class="me">println</span>(msg));</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 8: BUILDERS
    `<div class="inner">
      <span class="tag">// 09 · builder.fluent_api()</span>
      <h2>The <span class="y">Builder</span> Pattern</h2>
      <p class="lead">Avoid "Constructor Hell" with many optional parameters.</p>
      <div class="code">
<span class="cl"><span class="t">ProfiledPIDController</span> controller = <span class="k">new</span> <span class="t">ProfiledPIDController</span>(<span class="n">1</span>, <span class="n">0</span>, <span class="n">0</span>,</span>
<span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">Constraints</span>(<span class="n">2</span>, <span class="n">4</span>));</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Versus a Fluent Builder:</span></span>
<span class="cl"><span class="t">MotorConfig</span> cfg = <span class="t">MotorConfig</span>.<span class="me">builder</span>()</span>
<span class="cl">&nbsp;&nbsp;.<span class="me">withCurrentLimit</span>(<span class="n">40</span>)</span>
<span class="cl">&nbsp;&nbsp;.<span class="me">inverted</span>(<span class="k">true</span>)</span>
<span class="cl">&nbsp;&nbsp;.<span class="me">build</span>();</span>
      </div>
    </div>`,

    // 9: ENCAPSULATION
    `<div class="inner">
      <span class="tag">// 10 · encapsulation.private()</span>
      <h2>Encapsulation &amp; <span class="y">Final</span></h2>
      <p class="lead">Protect your robot's internal state from outside interference.</p>
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Use <span class="k">private</span> for all fields. Use Getters/Setters if needed.</span></li>
        <li><span class="bul">▸</span><span>Use <span class="k">final</span> for things that should never change (like motor objects).</span></li>
        <li><span class="bul">▸</span><span><span class="y">Immutability</span>: Immutable objects (like <span class="t">Pose2d</span>) are thread-safe and predictable.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="k">private final</span> <span class="t">TalonFX</span> motor = <span class="k">new</span> <span class="t">TalonFX</span>(<span class="n">1</span>);</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">public double</span> <span class="me">getVelocity</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">return</span> motor.<span class="me">getVelocity</span>().<span class="me">getValue</span>();</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 9b: OPTIONAL
    `<div class="inner">
      <span class="tag">// 11 · optional.empty_or_value()</span>
      <h2><span class="y">Optional</span>: Maybe a Value</h2>
      <p class="lead">An <span class="t">Optional</span>&lt;<span class="t">T</span>&gt; either holds a value or is explicitly empty — no nulls, no surprises.</p>
      <div class="two">
        <ul class="bullets">
          <li><span class="bul">▸</span><span>The motivating case: <span class="y">vision pose estimators</span> return <span class="t">Optional</span> because the camera may see no tags.</span></li>
          <li><span class="bul">▸</span><span><span class="r">Never call .get() blind</span> — that's just a NullPointerException with extra steps.</span></li>
          <li><span class="bul">▸</span><span>Use <span class="me">ifPresent</span> or <span class="me">orElse</span> to handle both cases honestly.</span></li>
        </ul>
        <div class="code">
<span class="cl"><span class="t">Optional</span>&lt;<span class="t">Pose2d</span>&gt; visionPose = vision.<span class="me">getPose</span>();</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Run logic only when a value exists</span></span>
<span class="cl">visionPose.<span class="me">ifPresent</span>(pose -&gt;</span>
<span class="cl">&nbsp;&nbsp;estimator.<span class="me">addVisionMeasurement</span>(pose, time));</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Or supply a fallback</span></span>
<span class="cl"><span class="t">Pose2d</span> pose = visionPose.<span class="me">orElse</span>(lastKnownPose);</span>
        </div>
      </div>
    </div>`,

    // 10: STATE MACHINES (ENUM)
    `<div class="inner">
      <span class="tag">// 12 · states.enums()</span>
      <h2>State Machines: <span class="y">Logic</span></h2>
      <p class="lead">Don't use 20 booleans. Use one <span class="k">enum</span>.</p>
      <div class="code">
<span class="cl"><span class="k">public enum</span> <span class="t">IntakeState</span> {</span>
<span class="cl">&nbsp;&nbsp;<span class="t">IDLE</span>,</span>
<span class="cl">&nbsp;&nbsp;<span class="t">INTAKING</span>,</span>
<span class="cl">&nbsp;&nbsp;<span class="t">HOLDING</span>,</span>
<span class="cl">&nbsp;&nbsp;<span class="t">SCORING</span></span>
<span class="cl">}</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="k">private</span> <span class="t">IntakeState</span> currentState = <span class="t">IntakeState</span>.<span class="t">IDLE</span>;</span>
      </div>
    </div>`,

    // 11: STATE MACHINES (SWITCH)
    `<div class="inner">
      <span class="tag">// 13 · states.transitions()</span>
      <h2>Managing <span class="y">Transitions</span></h2>
      <div class="code">
<span class="cl"><span class="me">@Override</span></span>
<span class="cl"><span class="k">public void</span> <span class="me">periodic</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">switch</span> (currentState) {</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">case</span> <span class="t">INTAKING</span>:</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;motor.<span class="me">set</span>(<span class="n">0.5</span>);</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">if</span> (sensor.<span class="me">get</span>()) currentState = <span class="t">IntakeState</span>.<span class="t">HOLDING</span>;</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">break</span>;</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">case</span> <span class="t">IDLE</span>: motor.<span class="me">set</span>(<span class="n">0</span>); <span class="k">break</span>;</span>
<span class="cl">&nbsp;&nbsp;}</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 12: EVENT LOOPS
    `<div class="inner">
      <span class="tag">// 14 · event.loops()</span>
      <h2>Event Loops &amp; <span class="y">Triggers</span></h2>
      <ul class="bullets">
        <li><span class="bul">▸</span><span>The <span class="me">periodic</span>() method runs every 20ms. This is your "Main Loop".</span></li>
        <li><span class="bul">▸</span><span><strong>Polling</strong>: Checking a value every loop (if(sensor.get())).</span></li>
        <li><span class="bul">▸</span><span><strong>Callbacks</strong>: Wiring logic to run only when something changes.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="c">// WPILib Triggers use high-level event logic</span></span>
<span class="cl"><span class="k">new</span> <span class="t">Trigger</span>(intake::isLoaded)</span>
<span class="cl">&nbsp;&nbsp;.<span class="me">onTrue</span>(<span class="t">Commands</span>.<span class="me">print</span>(<span class="s">"Loaded!"</span>));</span>
      </div>
    </div>`,

    // 13: DESIGN TAKEAWAYS
    `<div class="inner">
      <span class="tag">// 15 · design.takeaways()</span>
      <h2>Architecture <span class="y">Takeaways</span></h2>
      <div class="fgrid three">
        <div class="fcard no-bracket">
          <div class="flabel">Principle</div>
          <div class="ftitle y">DRY</div>
          <div class="fdesc">Don't Repeat Yourself. Use inheritance or utils.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">Principle</div>
          <div class="ftitle b">YAGNI</div>
          <div class="fdesc">You Ain't Gonna Need It. Don't over-engineer early.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">Principle</div>
          <div class="ftitle g">SOLID</div>
          <div class="fdesc">One class, one responsibility. Keep it simple.</div>
        </div>
      </div>
    </div>`,

    // 14: RECAP
    `<div data-center>
      <span class="tag">// java.oop.complete()</span>
      <h1>OOP <span class="y">Complete</span></h1>
      <p class="lead">You've leveled up from a "coder" to a "software architect."<br>You are ready for WPILib Advanced.</p>
      <div class="stats">
        <div class="stat"><div class="sn">II</div><div class="sl">Java Level</div></div>
        <div class="stat"><div class="sn">04+</div><div class="sl">Design Patterns</div></div>
        <div class="stat"><div class="sn" style="color:var(--green)">100%</div><div class="sl">Modular</div></div>
      </div>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('limelight-1', {
  title: 'Limelight Vision',
  tag: '// limelight.vision()',
  slides: [
    // Slide 1: Hero
    `<div data-center>
      <span class="tag">// FRC Software · Vision Systems</span>
      <h1>Limelight <span class="y">Vision</span></h1>
      <p class="lead">The plug-and-play smart camera solution for FRC.<br>Low latency, high speed, and easy integration.</p>
      <div class="stats">
        <div class="stat"><div class="sn">90</div><div class="sl">FPS Tracking</div></div>
        <div class="stat"><div class="sn">0</div><div class="sl">Config Headaches</div></div>
      </div>
    </div>`,

    // Slide 2: What is a Limelight
    `<div>
      <span class="tag">// 01 · limelight.overview()</span>
      <h2>Smart <span class="y">Camera</span> Power</h2>
      <p class="lead">Limelight is an "all-in-one" sensor that handles everything from photon to field-coordinates.</p>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">Onboard Processing</span>: No load on the RoboRIO CPU. All CV happens on the camera.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Easy I/O</span>: Communication happens entirely over NetworkTables (NT4).</span></li>
        <li><span class="bul">▸</span><span><span class="g">Versatility</span>: Detects AprilTags, retroreflective tape, and custom neural objects.</span></li>
        <li><span class="bul">▸</span><span><span class="p">Global Shutter</span>: High-speed tracking without "rolling shutter" distortion.</span></li>
      </ul>
    </div>`,

    // Slide 3: Web interface access
    `<div>
      <span class="tag">// 02 · limelight.web_ui()</span>
      <h2>Accessing the <span class="y">Dashboard</span></h2>
      <p class="lead">Configure your pipelines and field maps via the browser-based UI.</p>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Connection</div>
          <div class="ftitle b">limelight.local:5801</div>
          <div class="fdesc">Plug into the robot radio and navigate to this URL to see the dashboard.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Monitoring</div>
          <div class="ftitle y">Visual Streams</div>
          <div class="fdesc">View raw, processed, and 3D pose streams to verify your tracking logic.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Switching</div>
          <div class="ftitle g">Pipeline Selector</div>
          <div class="fdesc">Switch between Tag tracking and Retroreflective modes on the fly.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Diagnostics</div>
          <div class="ftitle p">Status Logs</div>
          <div class="fdesc">Check FPS, latency, and temperature to ensure hardware health.</div>
        </div>
      </div>
    </div>`,

    // Slide 4: Configuration
    `<div>
      <span class="tag">// 03 · limelight.config()</span>
      <h2>Tuning <span class="y">Pipelines</span></h2>
      <p class="lead">A "Pipeline" is a set of CV instructions. Tuning them is key to robust vision.</p>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="y">Field Map</span>: Upload the official year's .fmap for accurate AprilTag 3D localization.</span></li>
        <li><span class="bul">▸</span><span><span class="b">Exposure/Threshold</span>: Lower exposure stops motion blur; thresholding isolates targets.</span></li>
        <li><span class="bul">▸</span><span><span class="g">Robot Pose</span>: Enter the camera's X/Y/Z and Pitch/Yaw/Roll relative to robot center.</span></li>
        <li><span class="bul">▸</span><span><span class="p">Targeting Filters</span>: Filter targets by area (ta), aspect ratio, or "fullness."</span></li>
      </ul>
    </div>`,

    // Slide 5: The NetworkTables interface
    `<div>
      <span class="tag">// 04 · limelight.network_tables()</span>
      <h2>The <span class="y">Raw Data</span> Flow</h2>
      <p class="lead">Data flows from the camera to the "limelight" table in NetworkTables.</p>
      <div class="code">
        <span class="cl"><span class="c">// Reading 'tx' (horizontal offset) manually via NT4</span></span>
        <span class="cl"><span class="t">NetworkTable</span> table = <span class="t">NetworkTableInstance</span>.<span class="me">getDefault</span>()</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">getTable</span>(<span class="s">"limelight"</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="k">double</span> tx = table.<span class="me">getEntry</span>(<span class="s">"tx"</span>).<span class="me">getDouble</span>(<span class="n">0.0</span>);</span>
        <span class="cl"><span class="k">double</span> ty = table.<span class="me">getEntry</span>(<span class="s">"ty"</span>).<span class="me">getDouble</span>(<span class="n">0.0</span>);</span>
        <span class="cl"><span class="k">boolean</span> hasTarget = table.<span class="me">getEntry</span>(<span class="s">"tv"</span>).<span class="me">getDouble</span>(<span class="n">0</span>) == <span class="n">1</span>;</span>
      </div>
      <p class="m" style="font-size:12px; margin-top:10px;">Note: 'tv' is returned as a double (0 or 1) in the NT table.</p>
    </div>`,

    // Slide 6: LimelightHelpers
    `<div>
      <span class="tag">// 05 · limelight.helpers()</span>
      <h2>Using <span class="y">LimelightHelpers</span></h2>
      <p class="lead">Most teams use the official Java helper class for cleaner, type-safe access.</p>
      <div class="code">
        <span class="cl"><span class="c">// Much cleaner syntax using the static helper</span></span>
        <span class="cl"><span class="k">double</span> tx = <span class="t">LimelightHelpers</span>.<span class="me">getTX</span>(<span class="s">"limelight"</span>);</span>
        <span class="cl"><span class="k">double</span> ty = <span class="t">LimelightHelpers</span>.<span class="me">getTY</span>(<span class="s">"limelight"</span>);</span>
        <span class="cl"><span class="k">boolean</span> tv = <span class="t">LimelightHelpers</span>.<span class="me">getTV</span>(<span class="s">"limelight"</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Snap a snapshot for debugging later</span></span>
        <span class="cl"><span class="t">LimelightHelpers</span>.<span class="me">takeSnapshot</span>(<span class="s">"limelight"</span>, <span class="s">"missed_shot"</span>);</span>
      </div>
    </div>`,

    // Slide 7: AprilTags & pose
    `<div>
      <span class="tag">// 06 · limelight.apriltag_pose()</span>
      <h2>AprilTags & <span class="y">Pose</span></h2>
      <p class="lead">MegaTag 3D allows the Limelight to solve its own position on the field.</p>
      <div class="code">
        <span class="cl"><span class="c">// Get the robot's pose on the field (Blue coordinate system)</span></span>
        <span class="cl"><span class="t">LimelightHelpers</span>.<span class="t">PoseEstimate</span> mt2 = </span>
        <span class="cl">&nbsp;&nbsp;<span class="t">LimelightHelpers</span>.<span class="me">getBotPoseEstimate_wpiBlue</span>(<span class="s">"limelight"</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="t">Pose2d</span> fieldPose = mt2.pose;</span>
        <span class="cl"><span class="k">double</span> timestamp = mt2.timestampSeconds;</span>
        <span class="cl"><span class="k">int</span> tagCount = mt2.tagCount;</span>
      </div>
      <p class="m" style="font-size:12px; margin-top:10px;">The helper handles latency compensation and unit conversion for you.</p>
    </div>`,

    // Slide 8: Feeding the pose estimator
    `<div>
      <span class="tag">// 07 · limelight.pose_estimation()</span>
      <h2>Fusing <span class="y">Odometry</span></h2>
      <p class="lead">Merge vision data into your Drive Subsystem for a rock-solid field pose.</p>
      <div class="code">
        <span class="cl"><span class="c">// Inside periodic() or a vision update thread</span></span>
        <span class="cl"><span class="k">if</span> (mt2.tagCount &gt; <span class="n">0</span>) {</span>
        <span class="cl">&nbsp;&nbsp;poseEstimator.<span class="me">addVisionMeasurement</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;mt2.pose,</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;mt2.timestampSeconds</span>
        <span class="cl">&nbsp;&nbsp;);</span>
        <span class="cl">}</span>
      </div>
      <p class="m" style="font-size:12px; margin-top:10px;">This corrects "drift" in your wheels by using fixed field landmarks.</p>
    </div>`,

    // Slide 9: Aiming
    `<div>
      <span class="tag">// 08 · limelight.aim_pid()</span>
      <h2>PID <span class="y">Aiming</span></h2>
      <p class="lead">Use the horizontal offset (tx) to turn your robot toward a target.</p>
      <div class="code">
        <span class="cl"><span class="c">// A simple command to lock onto a target</span></span>
        <span class="cl"><span class="k">double</span> tx = <span class="t">LimelightHelpers</span>.<span class="me">getTX</span>(<span class="s">"limelight"</span>);</span>
        <span class="cl"><span class="k">double</span> rotationOutput = turnPid.<span class="me">calculate</span>(tx, <span class="n">0</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl">drive.<span class="me">drive</span>(<span class="n">0</span>, <span class="n">0</span>, rotationOutput, <span class="k">true</span>);</span>
      </div>
      <ul class="bullets" style="margin-top:15px;">
        <li><span class="bul">▸</span><span><span class="b">Setpoint</span>: We want 'tx' to be 0 (center of crosshair).</span></li>
        <li><span class="bul">▸</span><span><span class="y">Deadband</span>: Stop turning once tx is within ±1.0 degree.</span></li>
      </ul>
    </div>`,

    // Slide 10: Gotchas
    `<div>
      <span class="tag">// 09 · limelight.gotchas()</span>
      <h2>Vision <span class="y">Gotchas</span></h2>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Latency</div>
          <div class="ftitle r">Timestamping</div>
          <div class="fdesc">The image you see is ~20ms old. Always use vision timestamps when updating odometry.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Ambiguity</div>
          <div class="ftitle r">Single Tags</div>
          <div class="fdesc">One AprilTag can produce two possible poses. Use multiple tags to eliminate "flipping."</div>
        </div>
        <div class="fcard">
          <div class="flabel">Lighting</div>
          <div class="ftitle r">Stage Lights</div>
          <div class="fdesc">Venue lights are brighter than your lab. Tune your pipelines on-site at the event!</div>
        </div>
        <div class="fcard">
          <div class="flabel">Trust</div>
          <div class="ftitle r">Standard Devs</div>
          <div class="fdesc">Don't trust vision when the robot is moving 5m/s or the target is 10m away.</div>
        </div>
      </div>
    </div>`,

    // Slide 11: Recap
    `<div data-center>
      <span class="tag">// recap.complete()</span>
      <h1>See <span class="y">Clearly</span></h1>
      <p class="lead">You've unlocked the power of 3D vision tracking.</p>
      <ul class="bullets" style="display:inline-flex; text-align:left;">
        <li><span class="bul">▸</span><span>Dashboard at limelight.local:5801</span></li>
        <li><span class="bul">▸</span><span>Use LimelightHelpers for Java access</span></li>
        <li><span class="bul">▸</span><span>Feed Botpose into your PoseEstimator</span></li>
        <li><span class="bul">▸</span><span>Always tune for event-specific lighting</span></li>
      </ul>
      <div class="bigq" style="margin-top:30px;">"Vision doesn't replace odometry;<br>it keeps odometry honest."</div>
    </div>`
  ]
});

</script>
