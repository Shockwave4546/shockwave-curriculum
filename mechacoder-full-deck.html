:root{
  /* Mech-A Coder deep navy palette */
  --bg:#09101f;
  --bg-card:rgba(8,16,46,0.50);
  --bg-card-h:rgba(12,24,60,0.65);
  --gold:#e8a020;
  --gold2:#f5c842;
  --blue:#2d7bff;
  --blue2:#5b9bff;
  --blue3:#8ab4f8;
  /* VS Code Dark+ syntax palette */

  --vsc-ty:#4ec9b0;
  --vsc-st:#ce9178;
  --vsc-nu:#b5cea8;
  --vsc-cm:#6a9955;
  --vsc-me:#dcdcaa;
  --vsc-op:#d4d4d4;

  --orange:#ce9178;

/* ── STAGE (hosts one deck at a time) ────────────────────────────────────── */
.stage{
  position:relative;overflow:hidden;height:100%;width:100%;
  background:
    radial-gradient(ellipse 80% 70% at 8%  8%,  rgba(15,55,200,0.28) 0%,transparent 100%),
    radial-gradient(ellipse 70% 60% at 92% 92%,  rgba(70,15,180,0.22) 0%,transparent 100%),
    radial-gradient(ellipse 50% 45% at 50% 50%,  rgba(9,18,42,0.50) 0%,transparent 100%),
    radial-gradient(ellipse 35% 35% at 78% 22%,  rgba(45,123,255,0.09) 0%,transparent 100%),
    #09101f;
}

.blob{position:absolute;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);}

canvas#bgc{position:absolute;inset:0;z-index:1;pointer-events:none;}
canvas#asc{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 0.28s;}
.scanline{position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.02) 3px,rgba(0,0,0,0.02) 4px);
  pointer-events:none;z-index:2;}

/* ── SLIDES ──────────────────────────────────────────────────────────────── */
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:flex-start;

.bracket-tl::before,

  border-left:2px solid var(--gold);
  border-radius:2px 0 0 0;
  pointer-events:none;z-index:1;
}
.bracket-br::after,
.fcard::after, .stat::after, .frow::after, .bigq::after {
  content:'';position:absolute;bottom:-2px;right:-2px;
  width:20px;height:20px;
  border-bottom:2px solid var(--gold);
  border-right:2px solid var(--gold);

.bigq{

.code{

  const C = { kw:'#569cd6', ty:'#4ec9b0', st:'#ce9178', nu:'#b5cea8', cm:'#6a9955', me:'#dcdcaa', op:'#d4d4d4', tx:'#d4d4d4' };

  const ease = t => t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
  const easeOut = t => 1 - (1 - t) * (1 - t);
  const easeIn = t => t * t * t;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const norm = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

  function buildJavaChars() {
    const KW = new Set(['public','private','protected','class','interface','extends','implements','new','return','void','static','final','this','super','if','else','for','while','do','try','catch','import','var','abstract','enum','null','true','false','boolean','int','double','float','long','override','synchronized']);
    const src = [
      'public class DriveSubsystem extends SubsystemBase {',
      '  private final TalonFX leftMotor = new TalonFX(1);',
      '  private final TalonFX rightMotor = new TalonFX(2);',
      '  private static final double MAX_SPEED = 0.85;',
      '  public DriveSubsystem() {',
      '    var cfg = new TalonFXConfiguration();',
      '    cfg.Slot0.kP = 0.1; cfg.Slot0.kD = 0.002;',
      '    leftMotor.getConfigurator().apply(cfg);',
      '    rightMotor.getConfigurator().apply(cfg);',
      '  }',
      '  @Override public void periodic() {',
      '    SmartDashboard.putNumber("leftVel", leftMotor.getVelocity().getValue());',
      '    SmartDashboard.putNumber("rightVel", rightMotor.getVelocity().getValue());',
      '  }',
      '  public Command arcadeDrive(DoubleSupplier fwd, DoubleSupplier rot) {',
      '    return run(() -> {',
      '      double f = fwd.getAsDouble();',
      '      double r = rot.getAsDouble();',
      '      differentialDrive.arcadeDrive(f, r * 0.7);',
      '    });',
      '  }',
      '}',
      'public class ShooterSubsystem extends SubsystemBase {',
      '  private SparkMax shooter = new SparkMax(5, SparkMax.MotorType.kBrushless);',
      '  private static final int TARGET_RPM = 3500;',
      '  public Command shoot() {',
      '    return startEnd(() -> shooter.set(TARGET_RPM / 5700.0), () -> shooter.set(0));',
      '  }',
      '}',
      'public class RobotContainer {',
      '  private final DriveSubsystem drive = new DriveSubsystem();',
      '  private final ShooterSubsystem shooter = new ShooterSubsystem();',
      '  public RobotContainer() {',
      '    drive.setDefaultCommand(drive.arcadeDrive(ctrl::getLeftY, ctrl::getRightX));',
      '  }',
      '  private void configureBindings() {',
      '    ctrl.a().onTrue(shooter.shoot());',
      '  }',
      '}'
    ].join('\n');
    const chars = [];
    let i = 0;
    while (i < src.length) {
      if (src[i] === '\n') { chars.push({char:' ', color:C.tx}); i++; continue; }
      if (src[i]==='/' && src[i+1]==='/') {
        let j=i; while(j<src.length&&src[j]!=='\n')j++;
        for(let k=i;k<j;k++) chars.push({char:src[k],color:C.cm});
        i=j; continue;
      }
      if (src[i]==='"') {
        let j=i+1; while(j<src.length&&src[j]!=='"')j++;
        for(let k=i;k<=j&&k<src.length;k++) chars.push({char:src[k],color:C.st});
        i=j+1; continue;
      }
      if (/[0-9]/.test(src[i]) && (i===0||!/[a-zA-Z_]/.test(src[i-1]))) {
        let j=i; while(j<src.length&&/[0-9.]/.test(src[j]))j++;
        for(let k=i;k<j;k++) chars.push({char:src[k],color:C.nu});
        i=j; continue;
      }
      if (src[i]==='@') {
        let j=i+1; while(j<src.length&&/[a-zA-Z]/.test(src[j]))j++;
        for(let k=i;k<j;k++) chars.push({char:src[k],color:C.me});
        i=j; continue;
      }
      if (/[a-zA-Z_]/.test(src[i])) {
        let j=i; while(j<src.length&&/[a-zA-Z0-9_]/.test(src[j]))j++;
        const w=src.slice(i,j);
        const col = KW.has(w) ? C.kw : /^[A-Z]/.test(w) ? C.ty : (j<src.length&&src[j]==='(') ? C.me : C.tx;
        for(const ch of w) chars.push({char:ch,color:col});
        i=j; continue;
      }
      chars.push({char:src[i], color:'=+-*/<>!&|?:'.includes(src[i])?C.op:C.tx});
      i++;
    }
    return chars;
  }

  function renderBgCode() {
    if (!javaChars.length) javaChars = buildJavaChars();
    if (!bgCtx) return;
    bgCtx.clearRect(0,0,bgc.width,bgc.height);
    bgCtx.font = Math.round(CH*0.72)+'px "JetBrains Mono",monospace';
    bgCtx.textBaseline = 'top';
    const cols = Math.ceil(bgc.width/CW)+1;
    const rows = Math.ceil(bgc.height/CH)+1;
    bgcCols = cols;
    bgcGrid = new Array(cols * rows);
    let idx = Math.floor(Math.random()*9999);
    for (let r=0; r<rows; r++) {
      for (let c=0; c<cols; c++) {
        const jc = javaChars[idx++%javaChars.length];
        bgcGrid[r*cols+c] = jc;
        bgCtx.globalAlpha = 0.048 + (((r*cols+c)*2654435761)>>>0)/0xffffffff * 0.032;
        bgCtx.fillStyle = jc.color;
        bgCtx.fillText(jc.char, c*CW, r*CH);
      }
    }
    bgCtx.globalAlpha = 1;
  }

  function flashKeyword() {
    if (!bgcGrid.length || !bgcCols || !kwEl) return;
    let cell = -1;
    for (let attempt = 0; attempt < 40; attempt++) {
      const c = Math.floor(Math.random() * bgcGrid.length);
      const jc = bgcGrid[c];
      if (jc && jc.char !== ' ' && jc.color !== '#d4d4d4') { cell = c; break; }
    }
    if (cell === -1) return;
    const targetColor = bgcGrid[cell].color;
    const row = Math.floor(cell / bgcCols);
    const rowStart = row * bgcCols;
    const rowEnd = rowStart + bgcCols;
    let tokStart = cell;
    while (tokStart > rowStart) {
      const prev = bgcGrid[tokStart - 1];
      if (!prev || prev.char === ' ' || prev.color !== targetColor) break;
      tokStart--;
    }
    let tokEnd = cell;
    while (tokEnd + 1 < rowEnd) {
      const next = bgcGrid[tokEnd + 1];
      if (!next || next.char === ' ' || next.color !== targetColor) break;
      tokEnd++;
    }
    let token = '';
    for (let i = tokStart; i <= tokEnd; i++) token += bgcGrid[i].char;
    token = token.trim();
    if (token.length < 2) return;
    const col = tokStart % bgcCols;
    const fs = Math.round(CH * 0.72);
    kwEl.textContent = token;
    kwEl.style.fontSize = fs + 'px';
    kwEl.style.left = (col * CW) + 'px';
    kwEl.style.top = (row * CH) + 'px';
    kwEl.style.color = targetColor;
    kwEl.style.opacity = '0';
    kwEl.style.textShadow = 'none';
    kwEl.style.transition = 'none';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      kwEl.style.transition = 'opacity 0.66s ease, text-shadow 0.66s ease';
      kwEl.style.opacity = '0.46';
      kwEl.style.textShadow = `0 0 2px ${targetColor}, 0 0 7px ${targetColor}, 0 0 14px ${targetColor}`;
      setTimeout(() => {
        kwEl.style.transition = 'opacity 1.44s ease, text-shadow 1.44s ease';
        kwEl.style.opacity = '0';
        kwEl.style.textShadow = 'none';
      }, 1560);
    }));
  }

  function getZones(el) {
    const z = [];
    const stageRect = stage.getBoundingClientRect();
    const sel = 'h1,h2,.bigq,.code,.bullets li,.fcard,.stat,.tag,.tltitle,.tldesc,.lead,.ftitle,.sn,.flabel,.badge';
    el.querySelectorAll(sel).forEach(node => {
      const r = node.getBoundingClientRect();
      if (r.width > 8 && r.height > 8) {
        z.push({ left: r.left - stageRect.left, right: r.right - stageRect.left, top: r.top - stageRect.top, bottom: r.bottom - stageRect.top });
      }
    });
    return z;
  }

  function hitAny(px, py, zones) {
    for (const z of zones) if (px >= z.left && px < z.right && py >= z.top && py < z.bottom) return true;
    return false;
  }

  function initParticles(fromSlide, toSlide) {
    particles = [];
    const cw = asc.width, ch = asc.height;
    const cols = Math.ceil(cw / CW) + 1, rows = Math.ceil(ch / CH) + 1;
    const fromZ = getZones(fromSlide), toZ = getZones(toSlide);
    const cx2 = cw / 2, cy2 = ch / 2;
    let idx = Math.floor(Math.random() * javaChars.length);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const gx = c * CW, gy = r * CH;
        const mx = gx + CW * 0.5, my = gy + CH * 0.5;
        const jc = javaChars[idx++ % javaChars.length];
        const isToContent = hitAny(mx, my, toZ);
        let sx, sy;
        if (isToContent) {
          const angle = Math.random() * Math.PI * 2;
          const push = 180 + Math.random() * 230;
          sx = gx + Math.cos(angle) * push;
          sy = gy + Math.sin(angle) * push;
        } else {
          const dx = mx - cx2, dy = my - cy2, len = Math.sqrt(dx * dx + dy * dy) || 1;
          const push = 90 + Math.random() * 140;
          sx = gx + (dx / len) * push + (Math.random() - 0.5) * 90;
          sy = gy + (dy / len) * push * 0.75 + (Math.random() - 0.5) * 70;
        }
        particles.push({ gx, gy, sx, sy, char: jc.char, color: jc.color, fa: hitAny(mx, my, fromZ) ? 0.55 + Math.random() * 0.45 : 0.04 + Math.random() * 0.07, ta: isToContent ? 0.55 + Math.random() * 0.45 : 0.04 + Math.random() * 0.07, d: Math.random() * 0.08 });
      }
    }
  }

  function drawFrame(t) {
    ascCtx.clearRect(0, 0, asc.width, asc.height);
    ascCtx.font = Math.round(CH * 0.72) + 'px "JetBrains Mono",monospace';
    ascCtx.textBaseline = 'top';
    const alphaBlend = ease(norm(t, 0.31, 0.59));
    const globalFade = easeIn(norm(t, 0.857, 1.0));
    for (const p of particles) {
      const td = Math.max(0, t - p.d);
      let px, py;
      if (td <= 0.286) { px = p.gx; py = p.gy; }
      else if (td <= 0.571) { const st = ease(norm(td, 0.286, 0.571)); px = lerp(p.gx, p.sx, st); py = lerp(p.gy, p.sy, st); }
      else { const ct = ease(norm(td, 0.571, 0.82)); px = lerp(p.sx, p.gx, ct); py = lerp(p.sy, p.gy, ct); }
      const appear = easeOut(norm(td, 0, 0.22));
      const baseA = lerp(p.fa, p.ta, alphaBlend);
      const alpha = baseA * appear * (1 - globalFade);
      if (alpha < 0.015) continue;
      ascCtx.globalAlpha = alpha;
      ascCtx.fillStyle = p.color;
      ascCtx.fillText(p.char, px, py);
    }
    ascCtx.globalAlpha = 1;
  }

  function go(to) {
    if (!curLesson || to === curSlideIdx || busy) return;
    if (rafId) cancelAnimationFrame(rafId);
    const fromSlide = slidesWrap.children[curSlideIdx];
    const toSlide = slidesWrap.children[to];
    curSlideIdx = to;
    updateUI();
    if (!animEnabled) {
      fromSlide.classList.remove('active');
      toSlide.classList.add('active');
      asc.style.opacity = '0';
      ascCtx.clearRect(0, 0, asc.width, asc.height);
      rafId = null;
      return;
    }
    busy = true;
    initParticles(fromSlide, toSlide);
    fromSlide.classList.remove('active');
    asc.style.opacity = '1';
    let frame = 0, toShown = false;
    function tick() {
      const t = frame / FRAMES;
      if (t > 0.28 && t < 0.60) {
        const intensity = Math.sin((t - 0.28) * Math.PI / 0.32);
        const rate = 0.011 * intensity;
        for (const p of particles) {
          if (Math.random() < rate) {
            const jc = javaChars[Math.floor(Math.random() * javaChars.length)];
            p.char = jc.char; p.color = jc.color;
          }
        }
      }
      if (!toShown && t >= 0.714) { toSlide.classList.add('active'); toShown = true; }
      drawFrame(t);
      frame++;
      if (frame <= FRAMES) rafId = requestAnimationFrame(tick);
      else { asc.style.opacity = '0'; ascCtx.clearRect(0, 0, asc.width, asc.height); busy = false; rafId = null; }
    }
    rafId = requestAnimationFrame(tick);
  }

  function updateUI() {
    if (!curLesson) return;
    const n = curLesson.slides.length;
    ctrEl.textContent = `${curSlideIdx + 1} / ${n}`;
    slnumEl.textContent = String(curSlideIdx + 1).padStart(2, '0');
    dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === curSlideIdx));
  }

      if (e.key === 'ArrowLeft') { e.preventDefault(); if (curSlideIdx > 0) go(curSlideIdx - 1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); if (window.selectAdjacentLesson) window.selectAdjacentLesson(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); if (window.selectAdjacentLesson) window.selectAdjacentLesson(-1); }

          cancelAnimationFrame(rafId);
          rafId = null;

      }
    });

  function load(lesson) {
    if (rafId) cancelAnimationFrame(rafId);
    busy = false;
    curLesson = lesson;
    curSlideIdx = 0;
    slidesWrap.innerHTML = '';
    lesson.slides.forEach((html, i) => {
      const s = document.createElement('section');
      s.className = 'slide' + (i === 0 ? ' active' : '');
      if (html.includes('data-center')) s.classList.add('center');
      s.innerHTML = `<div class="inner">${html}</div>`;
      slidesWrap.appendChild(s);
    });
    dotsEl.innerHTML = '';
    lesson.slides.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' on' : '');
      d.onclick = () => go(i);
      dotsEl.appendChild(d);
    });
    updateUI();
    asc.style.opacity = '0';
    ascCtx.clearRect(0, 0, asc.width, asc.height);
  }

  return { mount, load };
})();

  <script>
(function() {
  const LESSON_CACHE = {};
  const LOADED_SCRIPTS = new Set();
  let currentLessonId = null;

  /**
   * Registry for lesson content. Each lesson file calls this.
   */
  window.registerLesson = function(id, lesson) {
    LESSON_CACHE[id] = lesson;
    if (id === currentLessonId) {
      Deck.load(lesson);
      document.title = lesson.title + ' · Team 6328 FRC Training';
    }
  };

  /**
   * Returns a placeholder lesson for unbuilt content.
   */
  function placeholderLesson(title) {
    return {
      title: title,
      tag: '// FUTURE CONTENT',
      slides: [
        `<div data-center>
          <h2 class="spaced">${title}</h2>
          <p class="lead">This lesson is coming soon.</p>
          <span class="badge by">Planned</span>
        </div>`
      ]
    };
  }

  /**
   * Main selection logic.
   */
  window.selectLesson = function(id) {
    if (!id) return;
    
    // Find lesson in manifest
    let lessonData = null;
    for (const group of window.MANIFEST) {
      lessonData = group.lessons.find(l => l.id === id);
      if (lessonData) break;
    }
    if (!lessonData) return;

    currentLessonId = id;
    window.location.hash = '#' + id;

    // Update UI highlights
    document.querySelectorAll('.lesson-row').forEach(row => {
      row.classList.toggle('active', row.dataset.id === id);
    });

    // Handle loading
    if (LESSON_CACHE[id]) {
      window.registerLesson(id, LESSON_CACHE[id]);
    } else if (lessonData.built) {
      if (LOADED_SCRIPTS.has(lessonData.file)) return;
      
      const script = document.createElement('script');
      script.src = lessonData.file;
      script.onerror = () => {
        console.error('Failed to load lesson:', lessonData.file);
        Deck.load(placeholderLesson(lessonData.title));
      };
      document.body.appendChild(script);
      LOADED_SCRIPTS.add(lessonData.file);
    } else {
      Deck.load(placeholderLesson(lessonData.title));
      document.title = lessonData.title + ' · Team 6328 FRC Training';
    }
  };

  /**
   * Select the previous (-1) or next (+1) lesson in manifest order.
   */
  window.selectAdjacentLesson = function(delta) {
    const flat = [];
    for (const group of window.MANIFEST) {
      for (const lesson of group.lessons) flat.push(lesson.id);
    }
    const idx = flat.indexOf(currentLessonId);
    if (idx === -1) return;
    const nextId = flat[idx + delta];
    if (nextId) window.selectLesson(nextId);
  };

  /**
   * Build the sidebar from manifest.
   */
  function buildSidebar() {
    const nav = document.getElementById('sidebar-nav');
    window.MANIFEST.forEach(group => {
      // Category Header
      const header = document.createElement('div');
      header.className = 'nav-category';
      header.textContent = group.category;
      nav.appendChild(header);

      // Lesson Rows
      group.lessons.forEach(lesson => {
        const row = document.createElement('div');
        row.className = 'lesson-row';
        row.dataset.id = lesson.id;
        row.innerHTML = `
          <div class="lesson-title">${lesson.title}</div>
          <div class="level-badge">L${lesson.level}</div>
        `;
        row.onclick = () => window.selectLesson(lesson.id);
        nav.appendChild(row);
      });
    });
  }

  /**
   * Initialization.
   */
  document.addEventListener('DOMContentLoaded', () => {
    // 1. Mount the deck engine to the stage
    const stage = document.getElementById('stage');
    if (window.Deck) {
      Deck.mount(stage);
    }

    // 2. Build the navigation
    buildSidebar();

    // 3. Sidebar toggle logic
    const toggle = document.getElementById('sidebar-toggle');
    if (toggle) {
      if (localStorage.getItem('nav-collapsed') === 'true') {
        document.body.classList.add('nav-collapsed');
      }
      toggle.onclick = () => {
        const collapsed = document.body.classList.toggle('nav-collapsed');
        localStorage.setItem('nav-collapsed', collapsed);
        // Deck needs to re-size its canvases after the sidebar transition finishes
        setTimeout(() => {
          window.dispatchEvent(new Event('resize'));
        }, 300);
      };
    }

    // 4. Initial routing
    let initialId = window.location.hash.substring(1);
    
    // Validate initialId or fallback to first built lesson
    let firstBuiltId = null;
    let isValid = false;
    for (const group of window.MANIFEST) {
      for (const lesson of group.lessons) {
        if (!firstBuiltId && lesson.built) firstBuiltId = lesson.id;
        if (lesson.id === initialId) isValid = true;
      }
    }

    window.selectLesson(isValid ? initialId : (firstBuiltId || window.MANIFEST[0].lessons[0].id));
  });

  window.onhashchange = () => {
    const id = window.location.hash.substring(1);
    if (id !== currentLessonId) {
      window.selectLesson(id);
    }
  };

})();

  </script>

    `<span class="tag">// 01 · introduction()</span>
    <h2>Beyond <span class="y">Normal</span> Logging</h2>
    <p class="lead">AdvantageKit records ALL inputs so a match can be replayed bit-for-bit in simulation.</p>
    <div class="bigq">"Deterministic replay allows you to find bugs that only happen once in a thousand runs."</div>
    <div class="fgrid">
      <div class="fcard no-bracket">
        <div class="flabel">modes</div>
        <div class="ftitle b">REAL / SIM / REPLAY</div>
        <div class="fdesc">Switch between hardware, physics simulation, or replaying log data.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="flabel">guarantee</div>
        <div class="ftitle g">Bit-for-Bit Accuracy</div>
        <div class="fdesc">If you have the log, you have the exact state of the robot at every loop.</div>
      </div>
    </div>`,

    // 3. THE BIG IDEA
    `<span class="tag">// 02 · the_architecture()</span>
    <h2>The <span class="y">IO Boundary</span></h2>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Log every input (sensors, joysticks) at the <span class="y">moment of entry</span>.</span></li>
        <li><span class="bul">▸</span><span>Robot logic becomes a <span class="b">pure function</span> of those inputs.</span></li>
        <li><span class="bul">▸</span><span>Replaying the same inputs <span class="g">guarantees</span> the same outputs.</span></li>
      </ul>
      <div class="fcard">
        <div class="ftitle">Normal vs Deterministic</div>
        <div class="tl">
          <div class="tli">
            <div class="tll"><div class="tldot" style="background:var(--red);box-shadow:0 0 0 2px var(--red)"></div><div class="tlline"></div></div>
            <div class="tlc"><div class="tltitle">Normal Logging</div><div class="tldesc">Log some values; try to guess what happened later.</div></div>
          </div>
          <div class="tli">
            <div class="tll"><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div></div>
            <div class="tlc"><div class="tltitle">AdvantageKit</div><div class="tldesc">Log EVERYTHING; recreate the exact match in Sim.</div></div>
          </div>
        </div>
      </div>
    </div>`,

    // 4. @AUTOLOG
    `<span class="tag">// 03 · data.structures()</span>
    <h2>The <span class="y">@AutoLog</span> Annotation</h2>
    <p class="lead">Automatically generate boilerplate code for logging data classes.</p>
    <div class="code">
<span class="cl"><span class="k">@AutoLog</span></span>
<span class="cl"><span class="k">public static class</span> <span class="t">DriveIOInputs</span> {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public double</span> leftPositionRad = <span class="n">0.0</span>;</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public double</span> rightPositionRad = <span class="n">0.0</span>;</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public double</span> gyroYawRad = <span class="n">0.0</span>;</span>
<span class="cl">&nbsp;&nbsp;<span class="k">public double</span>[] motorTemps = <span class="k">new double</span>[<span class="n">4</span>];</span>
<span class="cl">}</span>
<span class="cl"></span>
<span class="cl"><span class="c">// AdvantageKit generates DriveIOInputsAutoLogged</span></span>
<span class="cl"><span class="c">// with toLog() and fromLog() methods.</span></span>
    </div>`,

    // 5. IO + PROCESSINPUTS
    `<span class="tag">// 04 · update.loop()</span>
    <h2>Periodic <span class="y">Updates</span></h2>
    <p class="lead">Update your inputs from hardware, then process them into the Logger.</p>
    <div class="code">
<span class="cl"><span class="k">public void</span> <span class="me">periodic</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="c">// 1. Pull data from hardware into the inputs object</span></span>
<span class="cl">&nbsp;&nbsp;io.<span class="me">updateInputs</span>(inputs);</span>
<span class="cl">&nbsp;&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="c">// 2. Record inputs to log (or read them in Replay)</span></span>
<span class="cl hl">&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">processInputs</span>(<span class="s">"Drive"</span>, inputs);</span>
<span class="cl">&nbsp;&nbsp;</span>
<span class="cl">&nbsp;&nbsp;<span class="c">// 3. Use inputs for robot logic</span></span>
<span class="cl">&nbsp;&nbsp;<span class="me">drive</span>(inputs.leftPositionRad, inputs.rightPositionRad);</span>
<span class="cl">}</span>
    </div>`,

    // 6. RECORDOUTPUT
    `<span class="tag">// 05 · debugging.outputs()</span>
    <h2>Logging <span class="y">Outputs</span></h2>
    <p class="lead">Use recordOutput for values computed by your code (not direct sensor inputs).</p>
    <div class="code">
<span class="cl"><span class="c">// Log simple values, Poses, or even Arrays</span></span>
<span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Drive/Pose"</span>, currentPose);</span>
<span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Drive/Setpoint"</span>, <span class="n">5.2</span>);</span>
<span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Arm/State"</span>, <span class="s">"EXTENDED"</span>);</span>
<span class="cl"></span>
<span class="cl"><span class="c">// These show up in AdvantageScope for visualization!</span></span>
    </div>`,

    // 7. SETTING UP THE LOGGER
    `<span class="tag">// 06 · initialization()</span>
    <h2>Robot <span class="y">Setup</span></h2>
    <p class="lead">Configure the Logger in RobotInit to handle different run modes.</p>
    <div class="code">
<span class="cl"><span class="k">public void</span> <span class="me">robotInit</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">recordMetadata</span>(<span class="s">"ProjectName"</span>, <span class="s">"MyRobot"</span>);</span>
<span class="cl">&nbsp;&nbsp;<span class="k">if</span> (<span class="me">isReal</span>()) {</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">addDataReceiver</span>(<span class="k">new</span> <span class="t">WPILOGWriter</span>());</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">addDataReceiver</span>(<span class="k">new</span> <span class="t">NT4Publisher</span>());</span>
<span class="cl">&nbsp;&nbsp;}</span>
<span class="cl">&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">start</span>();</span>
<span class="cl">}</span>
    </div>`,

    // 8. WHY IT MATTERS
    `<span class="tag">// 07 · the.value()</span>
    <h2>Supercharged <span class="y">Debugging</span></h2>
    <div class="fgrid three">
      <div class="fcard">
        <div class="flabel">triage</div>
        <div class="ftitle b">Find Match Bugs</div>
        <div class="fdesc">Download logs from the field, hit play in Sim, and see the exact bug happen on your laptop.</div>
      </div>
      <div class="fcard">
        <div class="flabel">tuning</div>
        <div class="ftitle y">Offline Tuning</div>
        <div class="fdesc">Tune PID constants or logic using real sensor data from previous match runs.</div>
      </div>
      <div class="fcard">
        <div class="flabel">visibility</div>
        <div class="ftitle g">Total Insight</div>
        <div class="fdesc">AdvantageScope provides 3D field views and high-speed charts for every recorded variable.</div>
      </div>
    </div>`,

    // 9. RECAP
    `<div data-center>
      <span class="tag">// advantagekit.summary()</span>
      <h2>The <span class="y">Data</span> Advantage</h2>
      <ul class="bullets" style="margin-top:20px; text-align:left; display:inline-block;">
        <li><span class="bul">▸</span><span><span class="y">Deterministic Replay</span>: Re-run match code bit-for-bit.</span></li>
        <li><span class="bul">▸</span><span><span class="b">@AutoLog</span>: Zero-effort data class logging.</span></li>
        <li><span class="bul">▸</span><span><span class="g">IO Boundary</span>: Decouple logic from hardware.</span></li>
        <li><span class="bul">▸</span><span><span class="p">AdvantageScope</span>: Visualize everything you record.</span></li>
      </ul>
      <p class="lead" style="margin-top:30px;">Log everything. Replay anywhere. Win matches.</p>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('advkit-2', {
  title: 'AdvantageKit — Log Replay',
  tag: '// advantagekit.replay()',
  slides: [
    // 1. HERO
    `<div data-center>
      <span class="tag">// advantagekit.replay()</span>
      <h1>Log <span class="y">Replay</span></h1>
      <p class="lead">Re-run any match, bit-for-bit, on your laptop.</p>
      <div style="margin-top: 20px;">
        <span class="badge by">Team 6328</span>
        <span class="badge bb">Deterministic</span>
        <span class="badge bg">Level 2</span>
      </div>
    </div>`,

    // 2. THE PROMISE
    `<span class="tag">// 01 · the.promise()</span>
    <h2>The <span class="y">Promise</span></h2>
    <div class="bigq">"The robot at the field and the sim on your laptop produce identical outputs — every loop, every time."</div>
    <ul class="bullets">
      <li><span class="bul">▸</span><span>AutoLogging captured <span class="y">every input</span> at the IO boundary (that was AdvantageKit I).</span></li>
      <li><span class="bul">▸</span><span>Your robot logic is a <span class="b">pure function</span> of those inputs — no hidden state.</span></li>
      <li><span class="bul">▸</span><span>Feed the same inputs back in, and the <span class="g">same outputs must come out</span>. That's replay.</span></li>
    </ul>`,

    // 3. THREE MODES
    `<span class="tag">// 02 · three.modes()</span>
    <h2>The Three <span class="y">Modes</span></h2>
    <div class="fgrid three">
      <div class="fcard">
        <div class="flabel">on the robot</div>
        <div class="ftitle b">REAL</div>
        <div class="fdesc">IO classes talk to hardware. Every input logged to USB stick / roboRIO storage.</div>
      </div>
      <div class="fcard">
        <div class="flabel">on your laptop</div>
        <div class="ftitle g">SIM</div>
        <div class="fdesc">IO classes run physics models. Great for testing code that hasn't met the robot yet.</div>
      </div>
      <div class="fcard">
        <div class="flabel">time travel</div>
        <div class="ftitle y">REPLAY</div>
        <div class="fdesc">Inputs come FROM a log file. Hardware IO is never constructed. Logic re-runs exactly.</div>
      </div>
    </div>`,

    // 4. REPLAY SETUP
    `<span class="tag">// 03 · replay.setup()</span>
    <h2>Wiring Up <span class="y">Replay</span></h2>
    <p class="lead">One switch statement in your Robot constructor selects the mode.</p>
    <div class="code">
<span class="cl"><span class="k">case</span> REPLAY:</span>
<span class="cl">&nbsp;&nbsp;<span class="c">// Run as fast as the CPU allows, not at 20ms per loop</span></span>
<span class="cl">&nbsp;&nbsp;<span class="me">setUseTiming</span>(<span class="k">false</span>);</span>
<span class="cl">&nbsp;&nbsp;<span class="t">String</span> logPath = <span class="t">LogFileUtil</span>.<span class="me">findReplayLog</span>();</span>
<span class="cl hl">&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">setReplaySource</span>(<span class="k">new</span> <span class="t">WPILOGReader</span>(logPath));</span>
<span class="cl">&nbsp;&nbsp;<span class="t">Logger</span>.<span class="me">addDataReceiver</span>(</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">new</span> <span class="t">WPILOGWriter</span>(<span class="t">LogFileUtil</span>.<span class="me">addPathSuffix</span>(logPath, <span class="s">"_sim"</span>)));</span>
<span class="cl">&nbsp;&nbsp;<span class="k">break</span>;</span>
    </div>
    <p class="lead">Output goes to a new <span class="y">_sim</span> log so you can compare it against the original.</p>`,

    // 5. RUNNING REPLAY
    `<span class="tag">// 04 · running.replay()</span>
    <h2>The Replay <span class="y">Workflow</span></h2>
    <div class="tl">
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Grab the Log</div><div class="tldesc">Pull the .wpilog off the robot — USB stick, SFTP, or AdvantageScope's download tab.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Set Mode to REPLAY</div><div class="tldesc">Flip the mode constant and point it at the log file.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Run simulateJava</div><div class="tldesc">Replay chews through an entire match in seconds — no 20ms waits.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div></div>
        <div class="tlc"><div class="tltitle">Compare in AdvantageScope</div><div class="tldesc">Open the original and the _sim log side by side. They should match — and now you can dig.</div></div>
      </div>
    </div>`,

    // 6. THE SUPERPOWER
    `<span class="tag">// 05 · the.superpower()</span>
    <h2>The <span class="y">Superpower</span></h2>
    <p class="lead">Add logging for a value you never recorded during the match — then replay.</p>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Wish you'd logged the shooter's internal setpoint during Q42? <span class="y">Add it now.</span></span></li>
        <li><span class="bul">▸</span><span>Replay regenerates it <span class="g">as if it had been logged live</span> — the logic is deterministic.</span></li>
        <li><span class="bul">▸</span><span>This is <span class="b">debugging time travel</span>: instrument the past.</span></li>
      </ul>
      <div class="code">
<span class="cl"><span class="c">// Added AFTER the match. Still works.</span></span>
<span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Shooter/Setpoint"</span>,</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;setpointRpm);</span>
<span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Shooter/AtSpeed"</span>,</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="me">atSpeed</span>());</span>
      </div>
    </div>`,

    // 7. DETERMINISM RULES
    `<span class="tag">// 06 · determinism.rules()</span>
    <h2>The <span class="y">Determinism</span> Rules</h2>
    <p class="lead">Replay only works if your logic is a pure function of logged inputs. These break it:</p>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel r">banned</div>
        <div class="ftitle r">Random &amp; Wall-Clock Time</div>
        <div class="fdesc">Math.random() and System.currentTimeMillis() differ every run. Use Logger.getTimestamp() instead.</div>
      </div>
      <div class="fcard">
        <div class="flabel r">banned</div>
        <div class="ftitle r">Hardware Reads in Logic</div>
        <div class="fdesc">Every sensor read must go through an IO class and processInputs(). A sneaky direct read poisons replay.</div>
      </div>
      <div class="fcard">
        <div class="flabel r">banned</div>
        <div class="ftitle r">Logic Inside IO Classes</div>
        <div class="fdesc">IO implementations don't run in replay. Any decision-making hiding in there silently vanishes.</div>
      </div>
      <div class="fcard">
        <div class="flabel r">banned</div>
        <div class="ftitle r">Direct NetworkTables Reads</div>
        <div class="fdesc">Dashboard and vision values must arrive through logged inputs, not raw NT calls in subsystem logic.</div>
      </div>
    </div>`,

    // 8. GOTCHAS
    `<span class="tag">// 07 · gotchas()</span>
    <h2>Replay <span class="y">Gotchas</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">Same code version:</span> Replay against the exact commit that ran on the robot. Log the git hash with <span class="b">Logger.recordMetadata</span> and check it first.</span></li>
      <li><span class="bul">▸</span><span><span class="r">Extra threads</span> break determinism — keep logic on the main loop.</span></li>
      <li><span class="bul">▸</span><span>If replay outputs <span class="r">differ</span> from the original log, you have a non-deterministic input leak. That's not a replay failure — <span class="g">that's a bug report</span>.</span></li>
    </ul>`,

    // 9. CASE STUDY
    `<span class="tag">// 08 · case.study()</span>
    <h2>Case Study: <span class="y">"Auto Missed in Q42"</span></h2>
    <div class="tl">
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Pull the Log</div><div class="tldesc">Download Q42's .wpilog in the pit, minutes after the match.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Replay with New Outputs</div><div class="tldesc">Add recordOutput for the internal shoot-gate conditions. Replay regenerates them.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle">Find the Cause</div><div class="tldesc">A stale vision pose held the "aligned" check false for 0.4s — the auto timed out waiting.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div></div>
        <div class="tlc"><div class="tltitle">Fix and Re-Replay</div><div class="tldesc">Run the SAME log against the fixed logic and watch it take the shot. Proven before the next match.</div></div>
      </div>
    </div>`,

    // 10. CLOSING
    `<div data-center>
      <span class="tag">// replay.complete()</span>
      <h2>Never Say <span class="y">"Couldn't Reproduce"</span></h2>
      <div class="stats">
        <div class="stat">
          <div class="sn">1:1</div>
          <div class="sl">Bit-for-Bit Accuracy</div>
        </div>
        <div class="stat">
          <div class="sn">&#8734;</div>
          <div class="sl">Re-Runs of Every Match</div>
        </div>
        <div class="stat">
          <div class="sn">0</div>
          <div class="sl">Unreproducible Bugs</div>
        </div>
      </div>
      <p class="lead" style="margin-top:30px;">Every match you play is now a test case you keep forever.</p>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('advscope-1', {
  title: 'AdvantageScope I — Visualization',
  tag: '// advantagescope.viz()',
  slides: [
    // 1. Hero
    `<div data-center>
      <span class="tag">// ADVANTAGESCOPE · LEVEL 1</span>
      <h1>AdvantageScope I<br><span class="y">Visualization</span></h1>
      <p class="lead">Mastering the ultimate tool for robot data analysis and real-time telemetry.</p>
      <div>
        <span class="badge bb">Log Analysis</span>
        <span class="badge bg">Live NT4</span>
        <span class="badge bp">3D Field</span>
      </div>
    </div>`,

    // 2. What is AdvantageScope
    `<span class="tag">// 01 · what.is.it()</span>
    <h2>What is <span class="y">AdvantageScope</span>?</h2>
    <p class="lead">A powerful robot telemetry and log viewer built by Team 6328.</p>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="b">Unified Viewer</span>: One tool for live data (NT4) and historical logs (.wpilog, .hoot).</span></li>
      <li><span class="bul">▸</span><span><span class="g">Multiple Tabs</span>: View data as line graphs, tables, 2D/3D fields, or swerve states.</span></li>
      <li><span class="bul">▸</span><span><span class="p">Visual Logic</span>: Drag-and-drop interface for building custom data dashboards instantly.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Fast Performance</span>: Capable of scrubbing through millions of data points smoothly.</span></li>
    </ul>`,

    // 3. Connecting
    `<span class="tag">// 02 · connecting.to.data()</span>
    <h2>Connecting to <span class="y">Data</span></h2>
    <div class="two">
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="b">Live Connection</span>: Connect to a robot or sim via IP address (NetworkTables 4).</span></li>
        <li><span class="bul">▸</span><span><span class="g">Log Files</span>: Open .wpilog or .hoot files for deep post-match analysis.</span></li>
        <li><span class="bul">▸</span><span><span class="y">Sidebar</span>: All available fields (Odometry, Motors, Sensors) appear in the left tree.</span></li>
      </ul>
      <div class="fgrid">
        <div class="fcard no-bracket">
          <div class="flabel">NT4 Live</div>
          <div class="ftitle">Robot IP</div>
          <div class="fdesc">Usually 10.TE.AM.2 or localhost for sim.</div>
        </div>
        <div class="fcard no-bracket">
          <div class="flabel">Static Logs</div>
          <div class="ftitle">File System</div>
          <div class="fdesc">Drag and drop log files directly into the window.</div>
        </div>
      </div>
    </div>`,

    // 4. Custom variable log/visualization
    `<span class="tag">// 03 · line.graphs()</span>
    <h2>Visualizing <span class="y">Variables</span></h2>
    <p class="lead">Line Graphs are the foundation of data-driven debugging.</p>
    <div class="tl">
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc">
          <div class="tltitle">Drag & Drop</div>
          <div class="tldesc">Drag numeric fields from the sidebar into a Line Graph tab.</div>
        </div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc">
          <div class="tltitle">Configure Axes</div>
          <div class="tldesc">Use multiple Y-axes for variables with different units (Volts vs. RPM).</div>
        </div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot"></div></div>
        <div class="tlc">
          <div class="tltitle">Continuous vs Discrete</div>
          <div class="tldesc">Choose step-wise lines for discrete states (e.g., Idle → Shooting).</div>
        </div>
      </div>
    </div>`,

    // 5. Logging values to see them
    `<span class="tag">// 04 · telemetry.logging()</span>
    <h2>Logging <span class="y">Custom Values</span></h2>
    <p class="lead">To see data in AdvantageScope, you must publish it from your robot code.</p>
    <div class="code">
      <span class="cl"><span class="c">// Using AdvantageKit (Logger)</span></span>
      <span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Shooter/TargetRPM"</span>, targetRpm);</span>
      <span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Shooter/CurrentRPM"</span>, encoder.<span class="me">getVelocity</span>());</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Using standard SmartDashboard</span></span>
      <span class="cl"><span class="t">SmartDashboard</span>.<span class="me">putNumber</span>(<span class="s">"Drivetrain/LeftVolts"</span>, leftVolts);</span>
      <span class="cl"><span class="t">SmartDashboard</span>.<span class="me">putBoolean</span>(<span class="s">"Intake/Loaded"</span>, sensor.<span class="me">get</span>());</span>
    </div>`,

    // 6. Pose visualization
    `<span class="tag">// 05 · odometry.viz()</span>
    <h2>Visualizing <span class="y">Poses & Paths</span></h2>
    <div class="two">
      <div>
        <p class="lead">View your robot's position on a 2D field map or in 3D space.</p>
        <ul class="bullets">
          <li><span class="bul">▸</span><span>Publish <span class="t">Pose2d</span> or <span class="t">Pose3d</span> objects.</span></li>
          <li><span class="bul">▸</span><span>Select field images for any FRC season.</span></li>
          <li><span class="bul">▸</span><span>Overlay trajectories and vision targets.</span></li>
        </ul>
      </div>
      <div class="code">
        <span class="cl hl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Odometry/Robot"</span>, pose);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Arrays for multiple poses</span></span>
        <span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"Vision/Targets"</span>, </span>
        <span class="cl">&nbsp;&nbsp;targetPoses);</span>
      </div>
    </div>`,

    // 7. Power visualization
    `<span class="tag">// 06 · power.analysis()</span>
    <h2>Power & <span class="y">Current</span> Analysis</h2>
    <p class="lead">Diagnose electrical and mechanical issues through the PDH tab.</p>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="r">Battery Health</span>: Monitor voltage dips during high-acceleration brownout risks.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Channel Current</span>: View the Amps used by every motor individually.</span></li>
      <li><span class="bul">▸</span><span><span class="b">Diagnosing Friction</span>: Unusually high current often means mechanical binding.</span></li>
      <li><span class="bul">▸</span><span><span class="g">Stall Detection</span>: Watch for current spikes when a mechanism hits a hard stop.</span></li>
    </ul>`,

    // 8. Gyro visualization
    `<span class="tag">// 07 · navigation.viz()</span>
    <h2>Gyro & <span class="y">Rotation</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="b">Heading Stability</span>: Verify your gyro isn't drifting or inverted.</span></li>
      <li><span class="bul">▸</span><span><span class="g">Swerve Visualization</span>: Dedicated tab to see module angles and speeds.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Rotation Components</span>: View Pitch and Roll to detect tipping or collisions.</span></li>
      <li><span class="bul">▸</span><span><span class="p">PID Tuning</span>: Overlay target rotation vs actual rotation on one graph.</span></li>
    </ul>`,

    // 9. Timeline Scrubbing
    `<span class="tag">// 08 · timeline.control()</span>
    <h2>Mastering the <span class="y">Timeline</span></h2>
    <p class="lead">Logs are powerful because you can "travel through time."</p>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="b">Scrubbing</span>: Drag the playhead to see the robot state at any millisecond.</span></li>
      <li><span class="bul">▸</span><span><span class="g">Synchronized Views</span>: All tabs (Graphs, 3D, Video) move together.</span></li>
      <li><span class="bul">▸</span><span><span class="y">Bookmarks</span>: Add markers to highlight events like "Auto Start" or "Impact."</span></li>
      <li><span class="bul">▸</span><span><span class="p">Playback Speed</span>: Slow down to 0.1x to see transient mechanical glitches.</span></li>
    </ul>`,

    // 10. Useful tabs fgrid
    `<span class="tag">// 09 · toolset.summary()</span>
    <h2>Powerful <span class="y">Visualization</span> Tabs</h2>
    <div class="fgrid three">
      <div class="fcard no-bracket">
        <div class="ftitle b">Line Graph</div>
        <div class="fdesc">Standard X/Y plotting for numeric data.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle g">Odometry</div>
        <div class="fdesc">2D/3D robot position and field map.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle y">Table</div>
        <div class="fdesc">Raw values in a structured list.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle p">Swerve</div>
        <div class="fdesc">Direction and speed of all 4 modules.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle r">Joysticks</div>
        <div class="fdesc">Visual feedback of driver inputs.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle b">Console</div>
        <div class="fdesc">View standard output and log messages.</div>
      </div>
    </div>`,

    // 11. Recap
    `<div data-center>
      <span class="tag">// SUMMARY · recap()</span>
      <h1>Analyze Like a <span class="y">Pro</span></h1>
      <p class="lead">AdvantageScope turns raw numbers into intuitive robot behavior.</p>
      <div class="stats">
        <div class="stat"><div class="sn">LIVE</div><div class="sl">NT4 Telemetry</div></div>
        <div class="stat"><div class="sn">LOGS</div><div class="sl">Historical Data</div></div>
        <div class="stat"><div class="sn">3D</div><div class="sl">Spatial Viz</div></div>
      </div>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('advscope-2', {
  title: 'AdvantageScope II — Custom Assets',
  tag: '// advantagescope.assets()',
  slides: [
    // Slide 1: Hero
    `<div data-center>
      <span class="tag">// ADVANTAGESCOPE · ASSETS</span>
      <h1>AdvantageScope <span class="y">II</span></h1>
      <h2>Custom <span class="y">3D Assets</span></h2>
      <p class="lead">Bring your own robot and field models into the visualization environment for high-fidelity debugging and playback.</p>
      <div>
        <span class="badge by">Level 2</span>
        <span class="badge bb">3D Visualization</span>
        <span class="badge bg">Custom Models</span>
      </div>
    </div>`,

    // Slide 2: Why custom assets
    `<span class="tag">// 01 · the.visual.advantage()</span>
    <h2>Why <span class="y">Custom</span> Assets?</h2>
    <div class="bigq">
      "Debugging a ghost is hard. Debugging <span class="y">YOUR robot</span> in its real dimensions makes anomalies jump out instantly."
    </div>
    <p class="lead">Standard boxes and cylinders only go so far. Custom assets allow you to:</p>
    <ul class="bullets">
      <li><span class="bul">▸</span><span>Verify <span class="g">mechanism clearance</span> and range of motion in 3D space.</span></li>
      <li><span class="bul">▸</span><span>Match logged telemetry to the <span class="b">physical robot's scale</span> and coordinate system.</span></li>
      <li><span class="bul">▸</span><span>Create high-quality visualizations for <span class="p">driver training</span> and strategy reviews.</span></li>
    </ul>`,

    // Slide 3: Asset types
    `<span class="tag">// 02 · asset.catalog()</span>
    <h2>Types of <span class="y">Assets</span></h2>
    <p class="lead">AdvantageScope supports several types of custom data stored in its application assets folder.</p>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">robot</div>
        <div class="ftitle b">3D Robot Models</div>
        <div class="fdesc">Full assemblies (.glb) representing the robot chassis and static parts.</div>
      </div>
      <div class="fcard">
        <div class="flabel">moving parts</div>
        <div class="ftitle y">Components</div>
        <div class="fdesc">Sub-models (arms, elevators) that move independently based on logged poses.</div>
      </div>
      <div class="fcard">
        <div class="flabel">environment</div>
        <div class="ftitle g">Fields</div>
        <div class="fdesc">Custom field layouts or obstacles used for specific game year visualizations.</div>
      </div>
      <div class="fcard">
        <div class="flabel">utility</div>
        <div class="ftitle p">Config Files</div>
        <div class="fdesc">JSON files that define how models are rotated, scaled, and linked together.</div>
      </div>
    </div>`,

    // Slide 4: Custom robot import
    `<span class="tag">// 03 · robot.config()</span>
    <h2>Importing Your <span class="y">Robot</span></h2>
    <p class="lead">Models are placed in the <span class="m">/assets</span> folder alongside a <span class="y">config.json</span> that describes the robot.</p>
    <div class="code">
      <span class="cl">{</span>
      <span class="cl">&nbsp;&nbsp;<span class="s">"name"</span>: <span class="s">"Team6328"</span>,</span>
      <span class="cl">&nbsp;&nbsp;<span class="s">"model"</span>: <span class="s">"chassis.glb"</span>,</span>
      <span class="cl">&nbsp;&nbsp;<span class="s">"position"</span>: [<span class="n">0</span>, <span class="n">0</span>, <span class="n">0</span>],</span>
      <span class="cl">&nbsp;&nbsp;<span class="s">"rotation"</span>: [<span class="n">0</span>, <span class="n">0</span>, <span class="n">0</span>],</span>
      <span class="cl">&nbsp;&nbsp;<span class="s">"components"</span>: [</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;{ <span class="s">"name"</span>: <span class="s">"Arm"</span>, <span class="s">"model"</span>: <span class="s">"arm.glb"</span> }</span>
      <span class="cl">&nbsp;&nbsp;]</span>
      <span class="cl">}</span>
    </div>
    <ul class="bullets" style="margin-top:15px;">
      <li><span class="bul">▸</span><span>Ensure models use <span class="g">GLB</span> format (standard for web 3D).</span></li>
      <li><span class="bul">▸</span><span>The <span class="b">coordinate system</span> (NWU vs. EDN) must match your WPILib setup.</span></li>
    </ul>`,

    // Slide 5: Articulated components
    `<span class="tag">// 04 · component.poses()</span>
    <h2>Articulated <span class="y">Components</span></h2>
    <p class="lead">To see mechanisms move, you must log an array of <span class="t">Pose3d</span> objects that map to your component definitions.</p>
    <div class="code">
      <span class="cl"><span class="c">// In your periodic loop</span></span>
      <span class="cl"><span class="t">Logger</span>.<span class="me">recordOutput</span>(<span class="s">"MechanismPoses"</span>, </span>
      <span class="cl">&nbsp;&nbsp;<span class="k">new</span> <span class="t">Pose3d</span>[] { </span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;arm.<span class="me">getPose</span>(),</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;elevator.<span class="me">getPose</span>()</span>
      <span class="cl">&nbsp;&nbsp;}</span>
      <span class="cl">);</span>
    </div>
    <p class="lead" style="margin-top:20px;">AdvantageScope matches the <span class="y">order</span> of the poses to the order of components in your JSON configuration.</p>`,

    // Slide 6: Tips
    `<span class="tag">// 05 · performance.tips()</span>
    <h2>Best <span class="y">Practices</span></h2>
    <ul class="bullets">
      <li><span class="bul">▸</span><span><span class="y">Simplify Models</span>: Decimate high-poly CAD models to keep AdvantageScope responsive.</span></li>
      <li><span class="bul">▸</span><span><span class="b">Model Origins</span>: Set the origin (0,0,0) of mechanism parts at their pivot or base point.</span></li>
      <li><span class="bul">▸</span><span><span class="g">Unit Alignment</span>: WPILib and AdvantageScope use <span class="y">Meters</span>. Verify your export scale!</span></li>
      <li><span class="bul">▸</span><span><span class="p">Textures</span>: Use simple PBR materials instead of large image textures to save memory.</span></li>
    </ul>`,

    // Slide 7: Recap
    `<div data-center>
      <span class="tag">// 06 · lesson.summary()</span>
      <h1>Ready to <span class="y">Visualize</span></h1>
      <p class="lead">You've mastered custom assets in AdvantageScope.</p>
      <div class="stats">
        <div class="stat"><div class="sn">GLB</div><div class="sl">Model Format</div></div>
        <div class="stat"><div class="sn">JSON</div><div class="sl">Configuration</div></div>
        <div class="stat"><div class="sn">3D</div><div class="sl">Spatial Debugging</div></div>
      </div>
      <div class="bigq" style="margin-top:30px;">
        "A robot in code is an idea. A robot in 3D is an engineering reality."
      </div>
    </div>`
  ]
});

</script>

<!-- ===== auto-1.js ===== -->
<script>
window.registerLesson('auto-1', {
  title: 'Autonomous I — Basics',
  tag: '// auto.basics()',
  slides: [
    // 1. Hero
    `<div data-center>
      <span class="tag">// auto.basics()</span>
      <h1>Autonomous <span class="y">I</span></h1>
      <p class="lead">The basics of robot autonomy: scoring points while the drivers wait.</p>
      <div class="stats">
        <div class="stat"><div class="sn">15</div><div class="sl">Seconds of Auto</div></div>
        <div class="stat"><div class="sn">100%</div><div class="sl">Reliability Goal</div></div>
      </div>
    </div>`,

    // 2. What is autonomous
    `<div>
      <span class="tag">// 01 · what.is.auto()</span>
      <h2>The First <span class="y">15 Seconds</span></h2>
      <p class="lead">Matches begin with the autonomous period. No human interaction is allowed.</p>
      <div class="bigq">A reliable, simple auto that scores <span class="y">every single time</span> beats a fancy, complex auto that breaks half the time.</div>
      <ul class="bullets">
        <li><span class="bul">▸</span><span>Autonomous routines are pre-programmed sets of instructions.</span></li>
        <li><span class="bul">▸</span><span>Points scored in auto often count for more than teleop.</span></li>
        <li><span class="bul">▸</span><span>It provides a critical advantage for the rest of the match.</span></li>
      </ul>
    </div>`,

    // 3. Simple move auto (open loop)
    `<div>
      <span class="tag">// 02 · open_loop.drive()</span>
      <h2>Simple <span class="y">Time-Based</span> Move</h2>
      <p class="lead">Drive forward for a duration, then stop. This is called "Open Loop" control.</p>
      <div class="code">
<span class="cl"><span class="k">public</span> <span class="t">Command</span> <span class="me">driveForwardAuto</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">return</span> <span class="me">run</span>(() -&gt; drive.<span class="me">arcadeDrive</span>(<span class="n">0.5</span>, <span class="n">0</span>))</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;.<span class="me">withTimeout</span>(<span class="n">2.0</span>)</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;.<span class="me">andThen</span>(<span class="me">runOnce</span>(() -&gt; drive.<span class="me">stop</span>()));</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 4. Drive a distance
    `<div>
      <span class="tag">// 03 · closed_loop.distance()</span>
      <h2>Driving a <span class="y">Distance</span></h2>
      <ul class="bullets">
        <li><span class="bul">▸</span><span><span class="b">Time is fragile</span>: battery voltage and carpet friction vary.</span></li>
        <li><span class="bul">▸</span><span>Use <span class="g">Encoders</span> to measure actual wheel rotation.</span></li>
        <li><span class="bul">▸</span><span>Closed-loop control ensures you travel exactly the distance requested.</span></li>
      </ul>
      <div class="code" style="margin-top:20px;">
<span class="cl"><span class="c">// Using a drive distance command</span></span>
<span class="cl"><span class="k">new</span> <span class="t">DriveDistance</span>(driveSubsystem, <span class="n">3.0</span> /* meters */);</span>
      </div>
    </div>`,

    // 5. Composing an auto
    `<div>
      <span class="tag">// 04 · command.sequences()</span>
      <h2>Composing <span class="y">Routines</span></h2>
      <p class="lead">Chain simple commands together using <span class="me">sequence()</span> or <span class="me">andThen()</span>.</p>
      <div class="code">
<span class="cl"><span class="k">public</span> <span class="t">Command</span> <span class="me">scoreAndTaxi</span>() {</span>
<span class="cl">&nbsp;&nbsp;<span class="k">return</span> <span class="t">Commands</span>.<span class="me">sequence</span>(</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;shooter.<span class="me">spinUp</span>(),</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;shooter.<span class="me">feed</span>().<span class="me">withTimeout</span>(<span class="n">0.5</span>),</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;drive.<span class="me">driveDistance</span>(<span class="n">2.0</span>)</span>
<span class="cl">&nbsp;&nbsp;);</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 6. The autonomous command hook
    `<div>
      <span class="tag">// 05 · robot.hook()</span>
      <h2>The <span class="y">Autonomous</span> Hook</h2>
      <p class="lead">The <span class="t">Robot</span> class calls <span class="me">getAutonomousCommand()</span> when auto begins.</p>
      <div class="code">
<span class="cl"><span class="c">// Robot.java</span></span>
<span class="cl"><span class="me">@Override</span></span>
<span class="cl"><span class="k">public void</span> <span class="me">autonomousInit</span>() {</span>
<span class="cl">&nbsp;&nbsp;m_autonomousCommand = m_robotContainer.<span class="me">getAutonomousCommand</span>();</span>
<span class="cl">&nbsp;&nbsp;<span class="k">if</span> (m_autonomousCommand != <span class="k">null</span>) {</span>
<span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;m_autonomousCommand.<span class="me">schedule</span>();</span>
<span class="cl">&nbsp;&nbsp;}</span>
<span class="cl">}</span>
      </div>
    </div>`,

    // 7. Auto chooser
    `<div>
      <span class="tag">// 06 · dashboard.chooser()</span>
      <h2>Picking a <span class="y">Routine</span></h2>
      <p class="lead">Use <span class="y">SendableChooser</span> to select your path from the dashboard.</p>
      <div class="code">
<span class="cl"><span class="k">private final</span> <span class="t">SendableChooser</span>&lt;<span class="t">Command</span>&gt; chooser = <span class="k">new</span> <span class="t">SendableChooser</span>&lt;&gt;();</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="c">// Setup</span></span>
<span class="cl">chooser.<span class="me">setDefaultOption</span>(<span class="s">"Do Nothing"</span>, <span class="k">new</span> <span class="t">InstantCommand</span>());</span>
<span class="cl">chooser.<span class="me">addOption</span>(<span class="s">"Score One"</span>, <span class="me">scoreAndTaxi</span>());</span>
<span class="cl">&nbsp;</span>
<span class="cl"><span class="t">SmartDashboard</span>.<span class="me">putData</span>(<span class="s">"Auto Mode"</span>, chooser);</span>
      </div>
    </div>`,

    // 8. Best practices
    `<div>
      <span class="tag">// 07 · best.practices()</span>
      <h2>Auto Best <span class="y">Practices</span></h2>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Consistency</div>
          <div class="ftitle">Reset Odometry</div>
          <div class="fdesc">Always reset your gyro and encoders to match the robot's physical starting pose.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Reliability</div>
          <div class="ftitle">Use Timeouts</div>
          <div class="fdesc">Wrap sensor-based commands in .withTimeout() so the robot doesn't get stuck.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Workflow</div>
          <div class="ftitle">Test Each Piece</div>
          <div class="fdesc">Test individual commands in teleop before chaining them into an auto sequence.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Setup</div>
          <div class="ftitle">Start Pose</div>
          <div class="fdesc">Mark your starting spot with tape. 1cm off can lead to a missed shot.</div>
        </div>
      </div>
    </div>`,

    // 9. Recap
    `<div data-center>
      <span class="tag">// auto.basics() · recap</span>
      <h2>Master the <span class="y">Start</span></h2>
      <ul class="bullets" style="display:inline-block; text-align:left;">
        <li><span class="bul">▸</span><span>Autonomous is the first 15 seconds of no-driver code.</span></li>
        <li><span class="bul">▸</span><span>Use <span class="y">Commands.sequence</span> to chain behaviors together.</span></li>
        <li><span class="bul">▸</span><span>Expose routines to the dashboard via <span class="y">SendableChooser</span>.</span></li>
        <li><span class="bul">▸</span><span>Consistency and resets are the foundation of success.</span></li>
      </ul>
      <p class="lead" style="margin-top:30px;">Reliability > Complexity.</p>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('auto-2', {
  title: 'Autonomous II — PathPlanner',
  tag: '// auto.pathplanner()',
  slides: [
    // Slide 1: Hero
    `<div data-center>
      <span class="tag">// 01 · autonomous.advanced()</span>
      <h1>Autonomous <span class="y">II</span></h1>
      <h2>PathPlanner <span class="y">&amp;</span> Trajectories</h2>
      <p class="lead">Moving beyond simple timed commands to precise, high-speed movement using the industry-standard pathing library.</p>
      <div class="stats">
        <div class="stat"><div class="sn">2024+</div><div class="sl">PathPlannerLib v2</div></div>
        <div class="stat"><div class="sn" style="color:var(--green)">GUI</div><div class="sl">Visual Design</div></div>
        <div class="stat"><div class="sn" style="color:var(--blue3)">PID</div><div class="sl">Closed-Loop</div></div>
