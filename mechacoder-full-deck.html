    <h2>Transforming <span class="y">Vision Targets</span></h2>
    <p class="lead">Combining robot odometry, camera mounts, and vision measurements to locate targets on the field.</p>
    <div class="code">
      <span class="cl"><span class="c">// 1. Robot pose on field from odometry:</span></span>
      <span class="cl"><span class="t">Pose2d</span> fieldToVehicle = drive.<span class="me">getPose</span>();</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// 2. Camera offset relative to robot (constant from CAD):</span></span>
      <span class="cl"><span class="t">Transform2d</span> vehicleToCamera = <span class="k">new</span> <span class="t">Transform2d</span>(<span class="n">0.3</span>, <span class="n">0.2</span>, <span class="t">Rotation2d</span>.<span class="me">fromDegrees</span>(<span class="n">15</span>));</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// 3. Target relative to camera (from Limelight / PhotonVision):</span></span>
      <span class="cl"><span class="t">Transform2d</span> cameraToTarget = vision.<span class="me">getTargetTransform</span>();</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// 4. Field pose of the target:</span></span>
      <span class="cl hl"><span class="t">Pose2d</span> fieldToTarget = fieldToVehicle.<span class="me">plus</span>(vehicleToCamera).<span class="me">plus</span>(cameraToTarget);</span>
    </div>`,

    // 14. Motion Profiles & Waypoints
    `<span class="tag">// 13 · motion.profiles</span>
    <h2>Waypoints &amp; <span class="y">Trajectories</span></h2>
    <p class="lead">Autonomous path planning defines a sequence of waypoint poses in field coordinates.</p>
    <div class="two">
      <div style="background:rgba(4,8,22,0.7);border:1px solid rgba(45,123,255,0.2);border-radius:6px;padding:12px;display:flex;justify-content:center;align-items:center;">
        <svg viewBox="0 0 240 180" width="260" height="180">
          <!-- Field box -->
          <rect x="10" y="10" width="220" height="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <!-- Spline path -->
          <path d="M 30 140 C 70 140, 90 40, 140 50 S 190 120, 210 120" fill="none" stroke="#2d7bff" stroke-width="3"/>
          <!-- Waypoint 1 -->
          <circle cx="30" cy="140" r="5" fill="#4ec9b0"/>
          <line x1="30" y1="140" x2="50" y2="140" stroke="#4ec9b0" stroke-width="2"/>
          <!-- Waypoint 2 -->
          <circle cx="140" cy="50" r="5" fill="#f5c842"/>
          <line x1="140" y1="50" x2="160" y2="60" stroke="#f5c842" stroke-width="2"/>
          <!-- Waypoint 3 -->
          <circle cx="210" cy="120" r="5" fill="#f44767"/>
          <line x1="210" y1="120" x2="230" y2="120" stroke="#f44767" stroke-width="2"/>
          <text x="35" y="160" fill="#4ec9b0" font-family="'JetBrains Mono',monospace" font-size="10">P1 (Start)</text>
          <text x="145" y="40" fill="#f5c842" font-family="'JetBrains Mono',monospace" font-size="10">P2 (Mid)</text>
          <text x="165" y="140" fill="#f44767" font-family="'JetBrains Mono',monospace" font-size="10">P3 (Score)</text>
        </svg>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span>You define key <span class="y">waypoint poses</span> (position + travel heading).</span></li>
          <li><span class="bul">▸</span><span>Trajectory generators (PathPlanner / WPILib) fit a smooth spline with velocity &amp; acceleration limits.</span></li>
          <li><span class="bul">▸</span><span>The robot's follower controller runs at 50Hz to track intermediate target poses.</span></li>
        </ul>
      </div>
    </div>`,

    // 15. Recap (data-center)
    `<div data-center>
      <span class="tag">// end.geometry()</span>
      <h2>Geometry <span class="y">Mastery</span></h2>
      <p class="lead">You now understand 2D vectors, rotations, coordinate frames, and kinematic chaining.</p>
      <div class="fgrid">
        <div class="fcard no-bracket"><div class="sn">01</div><div class="sl">Translation2d · &lang;x, y&rang; displacement</div></div>
        <div class="fcard no-bracket"><div class="sn">02</div><div class="sl">Rotation2d · Fast cached angles</div></div>
        <div class="fcard no-bracket"><div class="sn">03</div><div class="sl">Pose2d · Frames &amp; Robot positions</div></div>
        <div class="fcard no-bracket"><div class="sn">04</div><div class="sl">Transform2d · Local movements &amp; Vision</div></div>
      </div>
    </div>`
  ]
});

</script>

<!-- ===== wpilib-nt.js ===== -->
<script>
window.registerLesson('wpilib-nt', {
  title: 'WPILib — NetworkTables',
  tag: '// wpilib.networktables()',
  slides: [
    // 1. Hero / Title (data-center)
    `<div data-center>
      <span class="tag">// wpilib.networktables()</span>
      <h1><span class="y">NetworkTables</span></h1>
      <p class="lead">Publish-subscribe networking for dashboards, driver stations, and vision coprocessors.</p>
      <div class="stats">
        <div class="stat"><div class="sn">NT4</div><div class="sl">Modern Protocol</div></div>
        <div class="stat"><div class="sn">Pub/Sub</div><div class="sl">Topic Architecture</div></div>
        <div class="stat"><div class="sn">Coprocessor</div><div class="sl">Vision &amp; Dashboards</div></div>
      </div>
    </div>`,

    // 2. What is NetworkTables?
    `<span class="tag">// 01 · architecture</span>
    <h2>Cross-Device <span class="y">Communication</span></h2>
    <p class="lead">NetworkTables (NT4) is a distributed key-value store synchronized across the robot Ethernet network.</p>
    <div class="two">
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Server (Master)</div>
          <div class="ftitle">roboRIO</div>
          <div class="fdesc">Hosts the central NetworkTable server managing all topics, subscriptions, and clients.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Client</div>
          <div class="ftitle">Driver Station Laptop</div>
          <div class="fdesc">Runs dashboards (Elastic, AdvantageScope, Shuffleboard) to view data and send inputs.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Client</div>
          <div class="ftitle">Vision Coprocessors</div>
          <div class="fdesc">Limelight, Raspberry Pi, Orange Pi running PhotonVision to publish detected target poses.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Protocol</div>
          <div class="ftitle">WebSockets / NT4</div>
          <div class="fdesc">Low-latency, type-safe streaming protocol optimized for competition Wi-Fi conditions.</div>
        </div>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><b>Topic Paths:</b> Organized hierarchically like a file system (e.g. <code>/limelight/botpose</code>, <code>/SmartDashboard/AutoChooser</code>).</span></li>
          <li><span class="bul">▸</span><span><b>Auto-Synchronization:</b> Any update published on one device is broadcast to all subscribers automatically.</span></li>
        </ul>
      </div>
    </div>`,

    // 3. Crucial Context: Direct NT vs AdvantageKit
    `<span class="tag">// 02 · design.rule</span>
    <h2>Telemetry vs <span class="y">Direct NT</span></h2>
    <p class="lead">In modern 6328 architecture, we <b>do not use the direct NetworkTables API for general robot telemetry</b>.</p>
    <div class="two">
      <div class="fcard">
        <div class="flabel">Robot Telemetry</div>
        <div class="ftitle g">AdvantageKit Logger</div>
        <div class="fdesc">All subsystem telemetry, odometry, and motor diagnostics use <code>Logger.recordOutput()</code>. AdvantageKit logs to disk AND streams to NetworkTables under the hood automatically!</div>
      </div>
      <div class="fcard">
        <div class="flabel">Direct NT API Uses</div>
        <div class="ftitle y">Coprocessors &amp; Dashboards</div>
        <div class="fdesc">The direct NT API is reserved strictly for:
          <br>1. Reading data from <b>vision coprocessors</b> (Limelight, PhotonVision)
          <br>2. Reading <b>interactive dashboard inputs</b> (tuning values, auto selectors).
        </div>
      </div>
    </div>
    <div class="frow" style="margin-top:16px;">
      <div class="ftitle"><span class="r">Rule of Thumb:</span> Use AdvantageKit for output telemetry; use direct NetworkTables for external coprocessor inputs &amp; dashboard controls.</div>
    </div>`,

    // 4. Table Hierarchy & Paths
    `<span class="tag">// 03 · hierarchy</span>
    <h2>Hierarchical <span class="y">Paths</span></h2>
    <p class="lead">Tables organize data into clean logical trees using forward-slash path separators.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="t">NetworkTableInstance</span> inst =</span>
        <span class="cl">&nbsp;&nbsp;<span class="t">NetworkTableInstance</span>.<span class="me">getDefault</span>();</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Access a top-level table</span></span>
        <span class="cl"><span class="t">NetworkTable</span> visionTable =</span>
        <span class="cl">&nbsp;&nbsp;inst.<span class="me">getTable</span>(<span class="s">"limelight-front"</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Access a nested sub-table</span></span>
        <span class="cl"><span class="t">NetworkTable</span> driveTable =</span>
        <span class="cl">&nbsp;&nbsp;inst.<span class="me">getTable</span>(<span class="s">"Drive"</span>).<span class="me">getSubTable</span>(<span class="s">"Odometry"</span>);</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Common Table Roots</div>
          <div class="ftitle">Standard Conventions</div>
          <div class="fdesc">
            <code>/limelight/...</code> &rarr; Vision pipelines<br>
            <code>/SmartDashboard/...</code> &rarr; Driver controls<br>
            <code>/Preferences/...</code> &rarr; Persistent settings
          </div>
        </div>
      </div>
    </div>`,

    // 5. NT4 Type-Safe Publishers & Subscribers
    `<span class="tag">// 04 · nt4.topics</span>
    <h2>Publishers &amp; <span class="y">Subscribers</span></h2>
    <p class="lead">NT4 uses dedicated topic objects for type safety and zero-allocation high-speed streaming.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// 1. Reading from a Vision Coprocessor</span></span>
        <span class="cl"><span class="t">DoubleSubscriber</span> targetYawSub = visionTable</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">getDoubleTopic</span>(<span class="s">"tx"</span>)</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">subscribe</span>(<span class="n">0.0</span>); <span class="c">// Default value 0.0</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="k">double</span> currentYaw = targetYawSub.<span class="me">get</span>();</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// 2. Publishing to a Dashboard Control</span></span>
        <span class="cl"><span class="t">DoublePublisher</span> statusPub = dashboardTable</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">getDoubleTopic</span>(<span class="s">"TargetRPM"</span>)</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">publish</span>();</span>
        <span class="cl">&nbsp;</span>
        <span class="cl">statusPub.<span class="me">set</span>(<span class="n">4500.0</span>);</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><b>Subscribe once:</b> Create subscriber instances during initialization, not inside the 50Hz periodic loop.</span></li>
          <li><span class="bul">▸</span><span><b>Default Value:</b> Subscribers return the default value if the coprocessor is disconnected or offline.</span></li>
        </ul>
      </div>
    </div>`,

    // 6. Interactive Dashboard Controls
    `<span class="tag">// 05 · dashboards</span>
    <h2>Dashboard <span class="y">Inputs &amp; Choosers</span></h2>
    <p class="lead">Reading auto choices and configuration settings set by the drive team before a match.</p>
    <div class="code">
      <span class="cl"><span class="c">// Reading operator-selected autonomous routine:</span></span>
      <span class="cl"><span class="t">NetworkTable</span> autoTable = inst.<span class="me">getTable</span>(<span class="s">"Autonomous"</span>);</span>
      <span class="cl"><span class="t">StringSubscriber</span> autoRoutineSub = autoTable</span>
      <span class="cl">&nbsp;&nbsp;.<span class="me">getStringTopic</span>(<span class="s">"SelectedRoutine"</span>)</span>
      <span class="cl">&nbsp;&nbsp;.<span class="me">subscribe</span>(<span class="s">"DefaultTwoPiece"</span>);</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="t">String</span> chosenAuto = autoRoutineSub.<span class="me">get</span>();</span>
    </div>
    <div class="frow" style="margin-top:14px;">
      <div class="ftitle"><span class="g">Elastic Dashboard &amp; Shuffleboard:</span> Custom dashboard widgets bind directly to these keys so drivers can toggle alliance color, starting position, and routine without touching code.</div>
    </div>`,

    // 7. Struct Topics for Complex Objects (Pose2d)
    `<span class="tag">// 06 · struct.topics</span>
    <h2>Modern <span class="y">Struct Topics</span></h2>
    <p class="lead">NT4 uses high-efficiency binary Struct serialization for WPILib geometry objects like <span class="t">Pose2d</span>.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Create a typed Struct publisher for Pose2d:</span></span>
        <span class="cl"><span class="t">StructPublisher</span>&lt;<span class="t">Pose2d</span>&gt; posePub = inst</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">getTable</span>(<span class="s">"Field"</span>)</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">getStructTopic</span>(<span class="s">"RobotPose"</span>, <span class="t">Pose2d</span>.struct)</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">publish</span>();</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Publish Pose2d directly without array packing!</span></span>
        <span class="cl">posePub.<span class="me">set</span>(<span class="k">new</span> <span class="t">Pose2d</span>(<span class="n">2.5</span>, <span class="n">4.0</span>, <span class="t">Rotation2d</span>.<span class="me">fromDegrees</span>(<span class="n">90</span>)));</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">NT4 Struct Protocol</div>
          <div class="ftitle">Native Serialization</div>
          <div class="fdesc">No more manual <code>double[] { x, y, deg }</code> arrays! NT4 automatically transmits the binary schema to dashboards like AdvantageScope, Elastic, and Glass.</div>
        </div>
        <ul class="bullets" style="margin-top:14px;">
          <li><span class="bul">▸</span><span>Built-in structs for <span class="y">Pose2d</span>, <span class="y">Translation2d</span>, <span class="y">Rotation2d</span>, <span class="y">Transform2d</span>, and <span class="y">ChassisSpeeds</span>.</span></li>
          <li><span class="bul">▸</span><span>Use <span class="t">getStructArrayTopic</span>(..., <span class="t">Pose2d</span>.struct) to publish multiple trajectories or AprilTag poses in one topic.</span></li>
        </ul>
      </div>
    </div>`,

    // 8. Bandwidth & Best Practices
    `<span class="tag">// 07 · best.practices</span>
    <h2>NetworkTables <span class="y">Best Practices</span></h2>
    <div class="fgrid">
      <div class="fcard no-bracket">
        <div class="ftitle y">FMS Bandwidth Limits</div>
        <div class="fdesc">Competition field networks cap bandwidth at 4-7 Mbps. Never stream uncompressed raw images or high-frequency telemetry over direct NT.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle g">Cached Handles</div>
        <div class="fdesc">Cache <code>Publisher</code> and <code>Subscriber</code> references as class fields. Avoid re-looking up table string paths on every loop.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle b">AdvantageKit Separation</div>
        <div class="fdesc">Keep all robot telemetry in AdvantageKit's log infrastructure to maintain perfect log replay capabilities.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle p">Default Values</div>
        <div class="fdesc">Always provide sensible fallback defaults when subscribing so the robot continues safely even if vision cameras reboot.</div>
      </div>
    </div>`,

    // 9. Recap (data-center)
    `<div data-center>
      <span class="tag">// end.networktables()</span>
      <h2>NetworkTables <span class="y">Mastered</span></h2>
      <p class="lead">You know how NetworkTables fits into modern FRC robot architectures.</p>
      <div class="fgrid">
        <div class="fcard no-bracket"><div class="sn">01</div><div class="sl">AdvantageKit vs NT · Telemetry vs Coprocessors</div></div>
        <div class="fcard no-bracket"><div class="sn">02</div><div class="sl">Publishers &amp; Subscribers · Type-safe NT4 topics</div></div>
        <div class="fcard no-bracket"><div class="sn">03</div><div class="sl">Coprocessor Ingest · Fast vision targeting feeds</div></div>
        <div class="fcard no-bracket"><div class="sn">04</div><div class="sl">Dashboard Control · Bidirectional operator UI</div></div>
      </div>
    </div>`
  ]
});

</script>

<!-- ===== wpilib-sched.js ===== -->
<script>
window.registerLesson('wpilib-sched', {
  title: 'WPILib — Command Scheduler',
  tag: '// wpilib.scheduler()',
  slides: [
    // 1. Hero / Title (data-center)
    `<div data-center>
      <span class="tag">// wpilib.scheduler()</span>
      <h1>Command <span class="y">Scheduler</span></h1>
      <p class="lead">Under the hood of the 20ms robot loop: resource allocation, default commands, and lifecycle coordination.</p>
      <div class="stats">
        <div class="stat"><div class="sn">50Hz</div><div class="sl">Loop Execution</div></div>
        <div class="stat"><div class="sn">Singleton</div><div class="sl">CommandScheduler</div></div>
        <div class="stat"><div class="sn">Mutex</div><div class="sl">Subsystem Locking</div></div>
      </div>
    </div>`,

    // 2. The 20ms Heartbeat
    `<span class="tag">// 01 · the.heartbeat</span>
    <h2>The 20ms <span class="y">Heartbeat</span></h2>
    <p class="lead">Inside <code>Robot.java</code>, a single line powers the entire command-based architecture.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="me">@Override</span></span>
        <span class="cl"><span class="k">public void</span> <span class="me">robotPeriodic</span>() {</span>
        <span class="cl">&nbsp;&nbsp;<span class="c">// The engine that drives everything:</span></span>
        <span class="cl hl">&nbsp;&nbsp;<span class="t">CommandScheduler</span>.<span class="me">getInstance</span>().<span class="me">run</span>();</span>
        <span class="cl">}</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span>Runs continuously at <b>50 Hz (every 20 milliseconds)</b> in Disabled, Autonomous, and Teleop modes.</span></li>
          <li><span class="bul">▸</span><span>Maintains a central registry of all active commands, subsystems, and trigger bindings.</span></li>
          <li><span class="bul">▸</span><span><span class="r">Never block this thread:</span> Calls to <code>Thread.sleep()</code> will stall all robot control and cause watchdog loop overruns!</span></li>
        </ul>
      </div>
    </div>`,

    // 3. Scheduler Execution Order
    `<span class="tag">// 02 · execution.order</span>
    <h2>Scheduler <span class="y">Loop Order</span></h2>
    <p class="lead">During every 20ms tick, <code>CommandScheduler.run()</code> executes operations in a deterministic sequence.</p>
    <div class="tl">
      <div class="tli">
        <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle y">1. Subsystem periodic()</div><div class="tldesc">Runs <code>periodic()</code> on every registered subsystem to update sensor inputs and logging.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot" style="background:var(--blue2);box-shadow:0 0 0 2px var(--blue2)"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle b">2. Poll Triggers</div><div class="tldesc">Evaluates all Triggers / button edges and schedules or cancels bound commands.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot" style="background:var(--purple);box-shadow:0 0 0 2px var(--purple)"></div><div class="tlline"></div></div>
        <div class="tlc"><div class="tltitle p">3. Execute Active Commands</div><div class="tldesc">Calls <code>execute()</code> on each active command, checks <code>isFinished()</code>, and calls <code>end()</code> for completed commands.</div></div>
      </div>
      <div class="tli">
        <div class="tll"><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div></div>
        <div class="tlc"><div class="tltitle g">4. Schedule Default Commands</div><div class="tldesc">Schedules the registered default command for any subsystem that has no active command.</div></div>
      </div>
    </div>`,

    // 4. Scheduling & Cancelling Commands
    `<span class="tag">// 03 · schedule.cancel</span>
    <h2>Manual <span class="y">Scheduling &amp; Canceling</span></h2>
    <p class="lead">While triggers handle most scheduling, you can interact with the scheduler directly in Java.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="t">CommandScheduler</span> sched = <span class="t">CommandScheduler</span>.<span class="me">getInstance</span>();</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// 1. Check if already running:</span></span>
        <span class="cl"><span class="k">if</span> (!sched.<span class="me">isScheduled</span>(autoCommand)) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="c">// 2. Schedule command manually:</span></span>
        <span class="cl">&nbsp;&nbsp;sched.<span class="me">schedule</span>(autoCommand);</span>
        <span class="cl">}</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// 3. Cancel command:</span></span>
        <span class="cl">sched.<span class="me">cancel</span>(autoCommand);</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Idempotency</div>
          <div class="ftitle"><code>schedule()</code> Safety</div>
          <div class="fdesc">Scheduling an already-running command does nothing. Calling <code>cancel()</code> calls the command's <code>end(true)</code> (interrupted = true) and removes it from the active list.</div>
        </div>
      </div>
    </div>`,

    // 5. Requirements & Interruption
    `<span class="tag">// 04 · requirements</span>
    <h2>Subsystem <span class="y">Requirements</span></h2>
    <p class="lead">WPILib prevents conflicting motor commands through exclusive subsystem locking.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Command A requires Drive</span></span>
        <span class="cl"><span class="t">Command</span> drivePath = <span class="me">followTrajectory</span>(drive);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Command B ALSO requires Drive</span></span>
        <span class="cl"><span class="t">Command</span> eStop = <span class="me">lockDrive</span>(drive);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// When eStop is scheduled:</span></span>
        <span class="cl"><span class="c">// 1. drivePath receives end(true) [interrupted]</span></span>
        <span class="cl"><span class="c">// 2. eStop receives initialize() and takes over</span></span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Conflict Rule</div>
          <div class="ftitle r">Mutual Exclusion</div>
          <div class="fdesc">If Command B requires Subsystem X while Command A is currently using Subsystem X, scheduling Command B immediately cancels Command A!</div>
        </div>
      </div>
    </div>`,

    // 6. Default Commands
    `<span class="tag">// 05 · default.commands</span>
    <h2>Default <span class="y">Commands</span></h2>
    <p class="lead">A <b>Default Command</b> runs automatically whenever no other command is using that subsystem.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Register default command in RobotContainer:</span></span>
        <span class="cl">driveSubsystem.<span class="me">setDefaultCommand</span>(</span>
        <span class="cl">&nbsp;&nbsp;driveSubsystem.<span class="me">arcadeDrive</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;() -&gt; -driver.<span class="me">getLeftY</span>(),</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;() -&gt; -driver.<span class="me">getRightX</span>()</span>
        <span class="cl">&nbsp;&nbsp;)</span>
        <span class="cl">);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Or via scheduler:</span></span>
        <span class="cl"><span class="t">CommandScheduler</span>.<span class="me">getInstance</span>()</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">setDefaultCommand</span>(driveSubsystem, driveCmd);</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><b>Must require the subsystem</b> it is registered to.</span></li>
          <li><span class="bul">▸</span><span><b>Must not finish:</b> Default commands typically run indefinitely (e.g. teleop driving).</span></li>
          <li><span class="bul">▸</span><span>Only one default command per subsystem.</span></li>
        </ul>
      </div>
    </div>`,

    // 7. Default Command Lifecycle & Recovery
    `<span class="tag">// 06 · default.lifecycle</span>
    <h2>Default Command <span class="y">Auto-Recovery</span></h2>
    <p class="lead">How default commands gracefully yield to button commands and resume seamlessly.</p>
    <div class="two">
      <div class="tl">
        <div class="tli">
          <div class="tll"><div class="tldot"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle y">Idle State</div><div class="tldesc">Teleop driving default command is actively running.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--blue2);box-shadow:0 0 0 2px var(--blue2)"></div><div class="tlline"></div></div>
          <div class="tlc"><div class="tltitle b">Button Pressed</div><div class="tldesc">Driver presses 'A' to auto-align to AprilTag. Default drive command is <b>interrupted</b>.</div></div>
        </div>
        <div class="tli">
          <div class="tll"><div class="tldot" style="background:var(--green);box-shadow:0 0 0 2px var(--green)"></div></div>
          <div class="tlc"><div class="tltitle g">Action Finishes &rarr; Auto-Resume</div><div class="tldesc">When auto-align completes, the scheduler immediately re-schedules the default driving command!</div></div>
        </div>
      </div>
      <div class="code">
        <span class="cl"><span class="c">// Test if default command is running:</span></span>
        <span class="cl"><span class="k">public static boolean</span> <span class="me">isDefaultActive</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Subsystem</span> subsystem) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="t">Command</span> def = <span class="t">CommandScheduler</span></span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;.<span class="me">getInstance</span>().<span class="me">getDefaultCommand</span>(subsystem);</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return</span> def != <span class="k">null</span> &amp;&amp;</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">CommandScheduler</span>.<span class="me">getInstance</span>().<span class="me">isScheduled</span>(def);</span>
        <span class="cl">}</span>
      </div>
    </div>`,

    // 8. Canceling All Commands for a Subsystem
    `<span class="tag">// 07 · cancel.subsystem</span>
    <h2>Canceling a <span class="y">Subsystem</span></h2>
    <p class="lead">Cancel any active action on a subsystem to bring it back to a safe or default state.</p>
    <div class="code">
      <span class="cl"><span class="c">// Cancels whatever command is currently holding this subsystem:</span></span>
      <span class="cl"><span class="k">public static void</span> <span class="me">cancelActive</span>(<span class="t">Subsystem</span> subsystem) {</span>
      <span class="cl">&nbsp;&nbsp;<span class="t">Command</span> current = <span class="t">CommandScheduler</span>.<span class="me">getInstance</span>().<span class="me">requiring</span>(subsystem);</span>
      <span class="cl">&nbsp;&nbsp;<span class="k">if</span> (current != <span class="k">null</span>) {</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">CommandScheduler</span>.<span class="me">getInstance</span>().<span class="me">cancel</span>(current);</span>
      <span class="cl">&nbsp;&nbsp;}</span>
      <span class="cl">}</span>
    </div>`,

    // 9. Best Practices & Gotchas
    `<span class="tag">// 08 · best.practices</span>
    <h2>Scheduler <span class="y">Gotchas</span></h2>
    <div class="fgrid">
      <div class="fcard no-bracket">
        <div class="ftitle r">Never Reuse Command Instances</div>
        <div class="fdesc">A command instance cannot be scheduled twice simultaneously. Always use factory methods to produce fresh command instances.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle r">Subsystem periodic() vs Command execute()</div>
        <div class="fdesc"><code>Subsystem.periodic()</code> runs every loop regardless of commands. <code>Command.execute()</code> only runs while that command is active.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle r">Subsystem Lockouts</div>
        <div class="fdesc">If a command fails to terminate and has no timeout, it permanently locks that subsystem and blocks the default command.</div>
      </div>
      <div class="fcard no-bracket">
        <div class="ftitle r">Disabled Mode Execution</div>
        <div class="fdesc">By default, commands cancel when the robot is disabled unless marked with <code>.ignoringDisable(true)</code>.</div>
      </div>
    </div>`,

    // 10. Recap (data-center)
    `<div data-center>
      <span class="tag">// end.scheduler()</span>
      <h2>CommandScheduler <span class="y">Mastered</span></h2>
      <p class="lead">You understand the 20ms engine that executes commands, enforces mutual exclusion, and manages defaults.</p>
      <div class="fgrid">
        <div class="fcard no-bracket"><div class="sn">01</div><div class="sl">20ms Loop · Deterministic phase order</div></div>
        <div class="fcard no-bracket"><div class="sn">02</div><div class="sl">Requirements · Automatic interrupt on conflict</div></div>
        <div class="fcard no-bracket"><div class="sn">03</div><div class="sl">Default Commands · Automatic idle recovery</div></div>
        <div class="fcard no-bracket"><div class="sn">04</div><div class="sl">Cancellation · Safe termination &amp; cleanup</div></div>
      </div>
    </div>`
  ]
});

</script>

<script>
window.registerLesson('wpilib-timer', {
  title: 'WPILib — Timers & Timing',
  tag: '// wpilib.timers()',
  slides: [
    // 1. Hero / Title (data-center)
    `<div data-center>
      <span class="tag">// wpilib.timers()</span>
      <h1>WPILib <span class="y">Timers</span></h1>
      <p class="lead">Mastering non-blocking real-time clocks, rate limiting, and hardware timestamps.</p>
      <div class="stats">
        <div class="stat"><div class="sn">0ms</div><div class="sl">Blocking Allowed</div></div>
        <div class="stat"><div class="sn">FPGA</div><div class="sl">Microsecond Clock</div></div>
        <div class="stat"><div class="sn">Non-Blocking</div><div class="sl">Polled Time Architecture</div></div>
      </div>
    </div>`,

    // 2. The Non-Blocking Rule
    `<span class="tag">// 01 · timing.philosophy</span>
    <h2>The Non-Blocking <span class="y">Rule</span></h2>
    <p class="lead">In real-time robotics, sleeping the main thread is a catastrophic failure mode.</p>
    <div class="two">
      <div class="fcard">
        <div class="flabel">Forbidden</div>
        <div class="ftitle r">Thread.sleep()</div>
        <div class="fdesc">Halts the entire 20ms periodic thread. Motor updates freeze, watchdogs trip, odometry skips integration steps, and the robot becomes unresponsive.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Standard</div>
        <div class="ftitle g">WPILib Timer</div>
        <div class="fdesc">A non-blocking stopwatch. The 20ms loop keeps running at full 50Hz while code queries how much time has elapsed since a milestone.</div>
      </div>
    </div>
    <div class="frow" style="margin-top:16px;">
      <div class="ftitle"><span class="y">Mental Model:</span> Never pause time. Instead, record when an event started and check if enough time has passed.</div>
    </div>`,

    // 3. The Timer Class Lifecycle
    `<span class="tag">// 02 · timer.lifecycle</span>
    <h2>The <span class="y">Timer</span> Class</h2>
    <p class="lead">A lightweight object tracking elapsed duration using the roboRIO's internal clock.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="t">Timer</span> timer = <span class="k">new</span> <span class="t">Timer</span>();</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// 1. Start or restart counting</span></span>
        <span class="cl">timer.<span class="me">start</span>();    <span class="c">// Continues from current</span></span>
        <span class="cl">timer.<span class="me">restart</span>();  <span class="c">// Resets to 0.0 and starts</span></span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// 2. Query elapsed seconds (non-blocking)</span></span>
        <span class="cl"><span class="k">double</span> elapsed = timer.<span class="me">get</span>();</span>
        <span class="cl"><span class="k">boolean</span> done = timer.<span class="me">hasElapsed</span>(<span class="n">1.5</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// 3. Stop or reset</span></span>
        <span class="cl">timer.<span class="me">stop</span>();</span>
        <span class="cl">timer.<span class="me">reset</span>();</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><span class="y">hasElapsed(seconds)</span>: Returns true if the timer has been running for at least the specified duration.</span></li>
          <li><span class="bul">▸</span><span><span class="b">restart()</span>: Equivalent to calling <code>reset()</code> then <code>start()</code> in one atomic step.</span></li>
          <li><span class="bul">▸</span><span><span class="g">State persistence:</span> Stopping a timer pauses the count; starting resumes from that paused value.</span></li>
        </ul>
      </div>
    </div>`,

    // 4. FPGA Timestamps & Hardware Time
    `<span class="tag">// 03 · fpga.clock</span>
    <h2>Hardware Clocks: <span class="y">FPGA Time</span></h2>
    <p class="lead">Why system time (<code>System.currentTimeMillis()</code>) is unsuitable for robotics controls.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Microsecond-precision monotonic hardware time (seconds):</span></span>
        <span class="cl"><span class="k">double</span> now = <span class="t">Timer</span>.<span class="me">getFPGATimestamp</span>();</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Used for calculating accurate dt in feedback loops:</span></span>
        <span class="cl"><span class="k">double</span> dt = now - lastTimestamp;</span>
        <span class="cl">lastTimestamp = now;</span>
      </div>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">Monotonic</div>
          <div class="ftitle">Immune to Clock Skew</div>
          <div class="fdesc">System clocks can jump when syncing NTP time over Wi-Fi. FPGA timestamp strictly counts forward from roboRIO boot.</div>
        </div>
        <div class="fcard">
          <div class="flabel">Latency Compensation</div>
          <div class="ftitle">Timestamping Sensor Data</div>
          <div class="fdesc">Vision and CAN frames include FPGA capture timestamps to synchronize historical poses accurately.</div>
        </div>
      </div>
    </div>`,

    // 5. Pattern: Periodic Pulsing & Rate Limiting
    `<span class="tag">// 04 · patterns.pulse</span>
    <h2>Pattern: <span class="y">Periodic Pulsing</span></h2>
    <p class="lead">Execute an action periodically at a lower frequency than the 50Hz main loop (rate limiting).</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Pulse true once every 'period' seconds</span></span>
        <span class="cl"><span class="k">public static boolean</span> <span class="me">checkPulse</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Timer</span> timer, <span class="k">double</span> period) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">if</span> (timer.<span class="me">hasElapsed</span>(period)) {</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;timer.<span class="me">reset</span>();</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">return true</span>;</span>
        <span class="cl">&nbsp;&nbsp;}</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return false</span>;</span>
        <span class="cl">}</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Application</div>
          <div class="ftitle">Telemetry &amp; LED Blinking</div>
          <div class="fdesc">Use a pulsing timer to flash status LEDs at 2 Hz or send diagnostic pings without overloading CAN bus bandwidth.</div>
        </div>
      </div>
    </div>`,

    // 6. Pattern: Signal Duration Verification
    `<span class="tag">// 05 · patterns.debounce</span>
    <h2>Pattern: <span class="y">Signal Stability</span></h2>
    <p class="lead">Requiring a condition to remain continuously true for a minimum duration before acting.</p>
    <div class="code">
      <span class="cl"><span class="c">// Only declare a beam-break sensor stable if unbroken for 200ms:</span></span>
      <span class="cl"><span class="k">public static boolean</span> <span class="me">isStable</span>(<span class="k">boolean</span> signal, <span class="t">Timer</span> timer, <span class="k">double</span> stableSeconds) {</span>
      <span class="cl">&nbsp;&nbsp;<span class="k">if</span> (!signal) {</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;timer.<span class="me">reset</span>();</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">return false</span>;</span>
      <span class="cl">&nbsp;&nbsp;}</span>
      <span class="cl">&nbsp;&nbsp;<span class="k">return</span> timer.<span class="me">hasElapsed</span>(stableSeconds);</span>
      <span class="cl">}</span>
    </div>
    <div class="frow" style="margin-top:14px;">
      <div class="ftitle"><span class="g">Why:</span> Prevents momentary electrical noise, vibration, or object bouncing from triggering premature state transitions.</div>
    </div>`,

    // 7. Timer vs Command Composition
    `<span class="tag">// 06 · timer.vs.commands</span>
    <h2>When to Use <span class="y">What</span>?</h2>
    <div class="two">
      <div class="fcard">
        <div class="flabel">Low-Level</div>
        <div class="ftitle">WPILib Timer</div>
        <div class="fdesc">Use inside Subsystems and state machines to track sub-task durations, measure loop dt, or compute rate-of-change.</div>
      </div>
      <div class="fcard">
        <div class="flabel">High-Level</div>
        <div class="ftitle">Command Composition</div>
        <div class="fdesc">Use <code>Commands.waitSeconds()</code> and <code>withTimeout()</code> when structuring high-level autonomous routines and button flows.</div>
      </div>
    </div>`,

    // 8. Recap (data-center)
    `<div data-center>
      <span class="tag">// end.timers()</span>
      <h2>Timers <span class="y">Mastered</span></h2>
      <p class="lead">You understand non-blocking temporal logic, hardware timestamps, and rate limiting.</p>
      <div class="fgrid">
        <div class="fcard no-bracket"><div class="sn">01</div><div class="sl">Non-Blocking · Always let the 20ms loop run</div></div>
        <div class="fcard no-bracket"><div class="sn">02</div><div class="sl">getFPGATimestamp · Hardware-precision clock</div></div>
        <div class="fcard no-bracket"><div class="sn">03</div><div class="sl">hasElapsed &amp; restart · Clean interval checks</div></div>
        <div class="fcard no-bracket"><div class="sn">04</div><div class="sl">Pulse &amp; Debounce · Robust signal processing</div></div>
      </div>
    </div>`
  ]
});

</script>

<!-- ===== wpilib-trig.js ===== -->
<script>
window.registerLesson('wpilib-trig', {
  title: 'WPILib — Triggers & Keybindings',
  tag: '// wpilib.triggers()',
  slides: [
    // 1. Hero / Title (data-center)
    `<div data-center>
      <span class="tag">// wpilib.triggers()</span>
      <h1>WPILib <span class="y">Triggers</span></h1>
      <p class="lead">Connecting physical buttons, joysticks, sensors, and state conditions to robot actions.</p>
      <div class="stats">
        <div class="stat"><div class="sn">50Hz</div><div class="sl">Polling Rate</div></div>
        <div class="stat"><div class="sn">Boolean</div><div class="sl">Supplier Core</div></div>
        <div class="stat"><div class="sn">Edge</div><div class="sl">Detection Engine</div></div>
      </div>
    </div>`,

    // 2. The Trigger Abstraction
    `<span class="tag">// 01 · abstraction</span>
    <h2>The <span class="y">Trigger</span> Abstraction</h2>
    <p class="lead">In WPILib, joystick buttons are not special. A <span class="t">Trigger</span> is simply a wrapper around any <code>BooleanSupplier</code> polled every 20ms.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// 1. Physical controller button</span></span>
        <span class="cl"><span class="t">Trigger</span> aButton = controller.<span class="me">a</span>();</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// 2. Sensor condition</span></span>
        <span class="cl"><span class="t">Trigger</span> hasNote = <span class="k">new</span> <span class="t">Trigger</span>(intake::<span class="me">hasGamePiece</span>);</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// 3. System state condition</span></span>
        <span class="cl"><span class="t">Trigger</span> atSpeed = <span class="k">new</span> <span class="t">Trigger</span>(</span>
        <span class="cl">&nbsp;&nbsp;() -&gt; flywheel.<span class="me">getRPM</span>() &gt;= <span class="n">3500</span></span>
        <span class="cl">);</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span><b>Universal Interface:</b> Buttons, sensors, and calculated state conditions all share the same API.</span></li>
          <li><span class="bul">▸</span><span><b>Edge Detection:</b> Triggers automatically track when values transition from false &rarr; true (rising edge) or true &rarr; false (falling edge).</span></li>
        </ul>
      </div>
    </div>`,

    // 3. Binding Methods
    `<span class="tag">// 02 · bindings</span>
    <h2>Trigger <span class="y">Bindings</span></h2>
    <p class="lead">Methods that schedule and cancel commands based on trigger state changes.</p>
    <div class="fgrid">
      <div class="fcard">
        <div class="flabel">Rising Edge</div>
        <div class="ftitle"><code>onTrue(Command)</code></div>
        <div class="fdesc">Schedules command once when condition goes from false to true. Does not cancel when released.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Held State</div>
        <div class="ftitle"><code>whileTrue(Command)</code></div>
        <div class="fdesc">Schedules when true; automatically cancels the command as soon as condition becomes false.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Falling Edge</div>
        <div class="ftitle"><code>onFalse(Command)</code></div>
        <div class="fdesc">Schedules command once when condition transitions from true to false (on release).</div>
      </div>
      <div class="fcard">
        <div class="flabel">Toggle Switch</div>
        <div class="ftitle"><code>toggleOnTrue(Command)</code></div>
        <div class="fdesc">First press starts the command; second press cancels it.</div>
      </div>
    </div>`,

    // 4. Logical Composition (and, or, negate)
    `<span class="tag">// 03 · logic</span>
    <h2>Logical <span class="y">Composition</span></h2>
    <p class="lead">Combine multiple triggers using fluent boolean operators without manual if-statements.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// AND: Ready to shoot only when</span></span>
        <span class="cl"><span class="c">// button is pressed AND flywheel is at speed</span></span>
        <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">readyToShoot</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Trigger</span> buttonHeld, <span class="t">Trigger</span> flywheelAtSpeed) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return</span> buttonHeld.<span class="me">and</span>(flywheelAtSpeed);</span>
        <span class="cl">}</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// OR: Driver OR Operator can intake</span></span>
        <span class="cl"><span class="t">Trigger</span> canIntake = driver.<span class="me">rightTrigger</span>()</span>
        <span class="cl">&nbsp;&nbsp;.<span class="me">or</span>(operator.<span class="me">a</span>());</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// NEGATE: Active when NO game piece</span></span>
        <span class="cl"><span class="t">Trigger</span> emptyIntake = hasGamePiece.<span class="me">negate</span>();</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Composition</div>
          <div class="ftitle"><code>triggerA.and(triggerB)</code></div>
          <div class="fdesc">Evaluates both conditions and fires when both are true simultaneously.</div>
        </div>
        <div class="fcard" style="margin-top:10px;">
          <div class="flabel">Inversion</div>
          <div class="ftitle"><code>trigger.negate()</code></div>
          <div class="fdesc">Creates a trigger that is active whenever the underlying condition is false.</div>
        </div>
      </div>
    </div>`,

    // 5. Custom Sensor & Supplier Triggers
    `<span class="tag">// 04 · sensors</span>
    <h2>Sensor &amp; <span class="y">Supplier Triggers</span></h2>
    <p class="lead">Convert any continuous analog or digital sensor reading into an event trigger.</p>
    <div class="code">
      <span class="cl"><span class="c">// Create a trigger when an ultrasonic/LiDAR distance is within range:</span></span>
      <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">createDistanceTrigger</span>(</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">DoubleSupplier</span> distanceSupplier, <span class="k">double</span> thresholdMeters) {</span>
      <span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">Trigger</span>(() -&gt; distanceSupplier.<span class="me">getAsDouble</span>() &lt; thresholdMeters);</span>
      <span class="cl">}</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Example usage in RobotContainer:</span></span>
      <span class="cl"><span class="me">createDistanceTrigger</span>(laserSensor::<span class="me">getMeters</span>, <span class="n">0.5</span>)</span>
      <span class="cl">&nbsp;&nbsp;.<span class="me">onTrue</span>(feeder.<span class="me">feedNote</span>());</span>
    </div>`,

    // 6. Axis Thresholds
    `<span class="tag">// 05 · axis.thresholds</span>
    <h2>Joystick <span class="y">Axis Thresholds</span></h2>
    <p class="lead">Transform analog joystick axes or trigger pulls into digital triggers.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Generic axis above threshold:</span></span>
        <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">axisAbove</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">DoubleSupplier</span> axis, <span class="k">double</span> threshold) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">Trigger</span>(() -&gt; axis.<span class="me">getAsDouble</span>() &gt; threshold);</span>
        <span class="cl">}</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// CommandXboxController built-in:</span></span>
        <span class="cl"><span class="t">Trigger</span> rightTrigger = controller.<span class="me">rightTrigger</span>(<span class="n">0.5</span>);</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span>Standard analog triggers return values from <code>0.0</code> to <code>1.0</code>.</span></li>
          <li><span class="bul">▸</span><span>Specifying a threshold (e.g. <code>0.5</code>) ignores accidental light touches.</span></li>
        </ul>
      </div>
    </div>`,

    // 7. Debouncing Triggers
    `<span class="tag">// 06 · debouncing</span>
    <h2>Signal <span class="y">Debouncing</span></h2>
    <p class="lead">Mechanical microswitches and optical beam breaks often flicker rapidly upon contact.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Debounce a trigger: requires signal to be</span></span>
        <span class="cl"><span class="c">// steadily true for 100ms before activating</span></span>
        <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">debouncedButton</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Trigger</span> raw, <span class="k">double</span> debounceSeconds) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return</span> raw.<span class="me">debounce</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;debounceSeconds,</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">DebounceType</span>.kRising</span>
        <span class="cl">&nbsp;&nbsp;);</span>
        <span class="cl">}</span>
      </div>
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">kRising</div>
          <div class="ftitle">Rising Edge Filter</div>
          <div class="fdesc">Delays activation until true for N seconds; deactivates immediately when false.</div>
        </div>
        <div class="fcard">
          <div class="flabel">kBoth</div>
          <div class="ftitle">Bidirectional Filter</div>
          <div class="fdesc">Requires signal to stay stable on both press and release transitions.</div>
        </div>
      </div>
    </div>`,

    // 8. Soft Press vs Hard Press (Dual Thresholds)
    `<span class="tag">// 07 · dual.thresholds</span>
    <h2>Dual-Stage <span class="y">Analog Buttons</span></h2>
    <p class="lead">Use the travel of an analog trigger (0.0 to 1.0) to trigger multiple stages of operation.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Stage 1: Soft press (&gt; 0.1) spins up</span></span>
        <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">anyPress</span>(<span class="t">DoubleSupplier</span> axis) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">Trigger</span>(() -&gt; axis.<span class="me">getAsDouble</span>() &gt; <span class="n">0.1</span>);</span>
        <span class="cl">}</span>
        <span class="cl">&nbsp;</span>
        <span class="cl"><span class="c">// Stage 2: Hard press (&gt; 0.9) feeds note</span></span>
        <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">hardPress</span>(<span class="t">DoubleSupplier</span> axis) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">Trigger</span>(() -&gt; axis.<span class="me">getAsDouble</span>() &gt; <span class="n">0.9</span>);</span>
        <span class="cl">}</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Pattern</div>
          <div class="ftitle">Two-Stage Shooting</div>
          <div class="fdesc">Lightly squeezing the trigger warms up the flywheel to full speed; pulling all the way back launches the note into the speaker!</div>
        </div>
      </div>
    </div>`,

    // 9. Bilateral Axis (Forward vs Backward)
    `<span class="tag">// 08 · bilateral</span>
    <h2>Bilateral <span class="y">Axis Triggers</span></h2>
    <p class="lead">Joystick axes range from -1.0 to +1.0. In FRC controllers, pushing forward is <b>negative Y</b>.</p>
    <div class="code">
      <span class="cl"><span class="c">// Trigger active when stick is pushed forward past half-way:</span></span>
      <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">pushedForward</span>(<span class="t">DoubleSupplier</span> yAxis) {</span>
      <span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">Trigger</span>(() -&gt; yAxis.<span class="me">getAsDouble</span>() &lt; -<span class="n">0.5</span>);</span>
      <span class="cl">}</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Trigger active when stick is pulled backward past half-way:</span></span>
      <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">pulledBackward</span>(<span class="t">DoubleSupplier</span> yAxis) {</span>
      <span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">Trigger</span>(() -&gt; yAxis.<span class="me">getAsDouble</span>() &gt; <span class="n">0.5</span>);</span>
      <span class="cl">}</span>
    </div>`,

    // 10. Combining Two Analog Axes
    `<span class="tag">// 09 · multi.axis</span>
    <h2>Combining <span class="y">Axes</span></h2>
    <p class="lead">Detect diagonal stick pushes by checking absolute thresholds on multiple axes.</p>
    <div class="code">
      <span class="cl"><span class="c">// Trigger active when joystick is pushed into any diagonal corner:</span></span>
      <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">diagonal</span>(<span class="t">DoubleSupplier</span> xAxis, <span class="t">DoubleSupplier</span> yAxis) {</span>
      <span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">Trigger</span>(() -&gt;</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Math</span>.<span class="me">abs</span>(xAxis.<span class="me">getAsDouble</span>()) &gt; <span class="n">0.5</span> &amp;&amp;</span>
      <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Math</span>.<span class="me">abs</span>(yAxis.<span class="me">getAsDouble</span>()) &gt; <span class="n">0.5</span></span>
      <span class="cl">&nbsp;&nbsp;);</span>
      <span class="cl">}</span>
    </div>`,

    // 11. Analog Hysteresis (Schmitt Trigger)
    `<span class="tag">// 10 · hysteresis</span>
    <h2>Analog <span class="y">Hysteresis</span></h2>
    <p class="lead">Prevent rapid flickering near threshold boundaries by using separate turn-on and turn-off levels.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="k">public static</span> <span class="t">Trigger</span> <span class="me">hysteresis</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">DoubleSupplier</span> axis, <span class="k">double</span> low, <span class="k">double</span> high) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">boolean</span>[] state = <span class="k">new boolean</span>[<span class="n">1</span>];</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return new</span> <span class="t">Trigger</span>(() -&gt; {</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">double</span> val = axis.<span class="me">getAsDouble</span>();</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">if</span> (val &gt;= high) state[<span class="n">0</span>] = <span class="k">true</span>;</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">else if</span> (val &lt;= low) state[<span class="n">0</span>] = <span class="k">false</span>;</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">return</span> state[<span class="n">0</span>];</span>
        <span class="cl">&nbsp;&nbsp;});</span>
        <span class="cl">}</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Why Hysteresis?</div>
          <div class="ftitle">Schmitt Trigger Logic</div>
          <div class="fdesc">If threshold is 0.50, a noisy signal oscillating between 0.49 and 0.51 toggles continuously. Hysteresis (on at 0.70, off at 0.30) guarantees clean, decisive transitions.</div>
        </div>
      </div>
    </div>`,

    // 12. CommandXboxController Best Practices
    `<span class="tag">// 11 · controller.apis</span>
    <h2><span class="y">CommandXboxController</span></h2>
    <p class="lead">Always use <code>CommandXboxController</code> (in <code>edu.wpi.first.wpilibj2.command.button</code>) instead of the legacy <code>XboxController</code>.</p>
    <div class="code">
      <span class="cl"><span class="t">CommandXboxController</span> driver = <span class="k">new</span> <span class="t">CommandXboxController</span>(<span class="n">0</span>);</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Every button returns a Trigger instance ready for binding:</span></span>
      <span class="cl">driver.<span class="me">a</span>().<span class="me">onTrue</span>(intake.<span class="me">deploy</span>());</span>
      <span class="cl">driver.<span class="me">rightBumper</span>().<span class="me">whileTrue</span>(feeder.<span class="me">feed</span>());</span>
      <span class="cl">driver.<span class="me">povUp</span>().<span class="me">onTrue</span>(climber.<span class="me">extend</span>());</span>
      <span class="cl">driver.<span class="me">leftTrigger</span>(<span class="n">0.7</span>).<span class="me">whileTrue</span>(shooter.<span class="me">spinUp</span>());</span>
    </div>`,

    // 13. Recap (data-center)
    `<div data-center>
      <span class="tag">// end.triggers()</span>
      <h2>Triggers <span class="y">Mastered</span></h2>
      <p class="lead">You know how to turn any input, sensor, or boolean logic into clean event triggers.</p>
      <div class="fgrid">
        <div class="fcard no-bracket"><div class="sn">01</div><div class="sl">onTrue / whileTrue · Event scheduling</div></div>
        <div class="fcard no-bracket"><div class="sn">02</div><div class="sl">and / or / negate · Fluent logic composition</div></div>
        <div class="fcard no-bracket"><div class="sn">03</div><div class="sl">debounce · Noise &amp; chatter filtering</div></div>
        <div class="fcard no-bracket"><div class="sn">04</div><div class="sl">hysteresis · Clean analog threshold latching</div></div>
      </div>
    </div>`
  ]
});

</script>

<!-- ===== wpilib-vendor.js ===== -->
<script>
window.registerLesson('wpilib-vendor', {
  title: 'WPILib — Vendor Units & Conversions',
  tag: '// wpilib.vendor_units()',
  slides: [
    // 1. Hero / Title (data-center)
    `<div data-center>
      <span class="tag">// wpilib.vendor_units()</span>
      <h1>Vendor Units &amp; <span class="y">Conversions</span></h1>
      <p class="lead">Bridging CTRE Phoenix 6 and REVLib hardware with standard WPILib SI units.</p>
      <div class="stats">
        <div class="stat"><div class="sn">SI</div><div class="sl">Meters &amp; Radians</div></div>
        <div class="stat"><div class="sn">Phoenix 6</div><div class="sl">TalonFX &amp; CANcoder</div></div>
        <div class="stat"><div class="sn">REVLib</div><div class="sl">SPARK MAX &amp; Flex</div></div>
      </div>
    </div>`,

    // 2. The Unit Challenge in FRC
    `<span class="tag">// 01 · motivation</span>
    <h2>The Unit <span class="y">Challenge</span></h2>
    <p class="lead">Every motor vendor reports raw telemetry in different units, but robot math requires SI units.</p>
    <div class="two">
      <div class="fgrid">
        <div class="fcard">
          <div class="flabel">CTRE Phoenix 6</div>
          <div class="ftitle">Rotations &amp; RPS</div>
          <div class="fdesc">TalonFX and CANcoder report position in <b>Rotations</b> and velocity in <b>Rotations Per Second (RPS)</b>.</div>
        </div>
        <div class="fcard">
          <div class="flabel">REVLib</div>
          <div class="ftitle">Rotations &amp; RPM</div>
          <div class="fdesc">SPARK MAX and SPARK Flex report position in <b>Rotations</b> and velocity in <b>Revolutions Per Minute (RPM)</b>.</div>
        </div>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Robot Standard</div>
          <div class="ftitle g">WPILib SI Units</div>
          <div class="fdesc">WPILib geometry, path followers, and feedback controllers strictly expect <b>Meters</b>, <b>Radians</b>, and <b>Meters/Second</b>.</div>
        </div>
        <div class="frow" style="margin-top:10px;">
          <div class="ftitle"><span class="y">Goal:</span> Convert at the hardware boundary so high-level robot code never deals with gearboxes or raw RPM!</div>
        </div>
      </div>
    </div>`,

    // 3. WPILib Units Utility
    `<span class="tag">// 02 · wpilib.units</span>
    <h2>WPILib <span class="y">Units Helpers</span></h2>
    <p class="lead">Use <code>edu.wpi.first.math.util.Units</code> for compile-time safe, error-free conversions.</p>
    <div class="code">
      <span class="cl"><span class="c">// Distance conversions</span></span>
      <span class="cl"><span class="k">double</span> meters = <span class="t">Units</span>.<span class="me">inchesToMeters</span>(<span class="n">4.0</span>); <span class="c">// 0.1016 m</span></span>
      <span class="cl"><span class="k">double</span> inches = <span class="t">Units</span>.<span class="me">metersToInches</span>(<span class="n">1.5</span>);</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Angular conversions</span></span>
      <span class="cl"><span class="k">double</span> rads = <span class="t">Units</span>.<span class="me">degreesToRadians</span>(<span class="n">90.0</span>); <span class="c">// π/2</span></span>
      <span class="cl"><span class="k">double</span> rotToRad = <span class="t">Units</span>.<span class="me">rotationsToRadians</span>(<span class="n">1.0</span>); <span class="c">// 2π</span></span>
      <span class="cl"><span class="k">double</span> radsPerSec = <span class="t">Units</span>.<span class="me">rotationsPerMinuteToRadiansPerSecond</span>(<span class="n">6000.0</span>);</span>
    </div>`,

    // 4. Converting Motor Rotations to Mechanism Meters
    `<span class="tag">// 03 · linear.distance</span>
    <h2>Rotations &rarr; <span class="y">Mechanism Distance</span></h2>
    <p class="lead">Computing elevator height, arm reach, or climber displacement from motor rotations.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Formula: (rotations / gearRatio) * (π * diameter)</span></span>
        <span class="cl"><span class="k">public static double</span> <span class="me">rotationsToMeters</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">double</span> motorRotations,</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">double</span> gearRatio,</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">double</span> pulleyDiameterInches) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">double</span> diameterMeters =</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="t">Units</span>.<span class="me">inchesToMeters</span>(pulleyDiameterInches);</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">double</span> circumference = <span class="t">Math</span>.PI * diameterMeters;</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return</span> (motorRotations / gearRatio) * circumference;</span>
        <span class="cl">}</span>
      </div>
      <div>
        <div class="fcard">
          <div class="flabel">Mechanical Steps</div>
          <div class="ftitle">1. Gear Reduction</div>
          <div class="fdesc">Divide motor rotations by gear ratio to get mechanism output shaft rotations.</div>
        </div>
        <div class="fcard" style="margin-top:10px;">
          <div class="flabel">Mechanical Steps</div>
          <div class="ftitle">2. Pulley / Drum Circumference</div>
          <div class="fdesc">Multiply output rotations by $\pi \times d$ (in meters) to get linear travel.</div>
        </div>
      </div>
    </div>`,

    // 5. Converting RPM to Linear Velocity
    `<span class="tag">// 04 · linear.velocity</span>
    <h2>RPM &rarr; <span class="y">Linear Velocity</span></h2>
    <p class="lead">Converting SPARK MAX / NEO encoder RPM into linear chassis speed in meters per second.</p>
    <div class="two">
      <div class="code">
        <span class="cl"><span class="c">// Formula: (rpm / 60 / gearRatio) * (π * wheelDiameter)</span></span>
        <span class="cl"><span class="k">public static double</span> <span class="me">rpmToMetersPerSec</span>(</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">double</span> rpm,</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">double</span> gearRatio,</span>
        <span class="cl">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">double</span> wheelDiameterMeters) {</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">double</span> wheelRps = (rpm / <span class="n">60.0</span>) / gearRatio;</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">double</span> circumference = <span class="t">Math</span>.PI * wheelDiameterMeters;</span>
        <span class="cl">&nbsp;&nbsp;<span class="k">return</span> wheelRps * circumference;</span>
        <span class="cl">}</span>
      </div>
      <div>
        <ul class="bullets">
          <li><span class="bul">▸</span><span>Divide RPM by <b>60</b> to get rotations per second.</span></li>
          <li><span class="bul">▸</span><span>Divide by <b>gear ratio</b> for wheel rotations per second.</span></li>
          <li><span class="bul">▸</span><span>Multiply by wheel <b>circumference ($\pi \times d$)</b> for final speed in m/s.</span></li>
        </ul>
      </div>
    </div>`,

    // 6. CTRE Phoenix 6 Interoperability
    `<span class="tag">// 05 · phoenix6</span>
    <h2>CTRE <span class="y">Phoenix 6</span> Patterns</h2>
    <p class="lead">Phoenix 6 uses strongly-typed signals and modern control request objects.</p>
    <div class="code">
      <span class="cl"><span class="t">TalonFX</span> motor = <span class="k">new</span> <span class="t">TalonFX</span>(<span class="n">1</span>);</span>
      <span class="cl"><span class="t">VoltageOut</span> voltageRequest = <span class="k">new</span> <span class="t">VoltageOut</span>(<span class="n">0.0</span>);</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Apply voltage control:</span></span>
      <span class="cl">motor.<span class="me">setControl</span>(voltageRequest.<span class="me">withOutput</span>(<span class="n">10.5</span>)); <span class="c">// 10.5 Volts</span></span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Read position signal:</span></span>
      <span class="cl"><span class="t">StatusSignal</span>&lt;<span class="t">Angle</span>&gt; posSignal = motor.<span class="me">getPosition</span>();</span>
      <span class="cl"><span class="k">double</span> rotations = posSignal.<span class="me">getValueAsDouble</span>();</span>
    </div>`,

    // 7. REVLib SPARK MAX Patterns
    `<span class="tag">// 06 · revlib</span>
    <h2>REVLib <span class="y">SPARK MAX</span> Patterns</h2>
    <p class="lead">Reading built-in relative encoders and controlling brushless NEO motors.</p>
    <div class="code">
      <span class="cl"><span class="t">SparkMax</span> motor = <span class="k">new</span> <span class="t">SparkMax</span>(<span class="n">2</span>, <span class="t">MotorType</span>.kBrushless);</span>
      <span class="cl"><span class="t">RelativeEncoder</span> encoder = motor.<span class="me">getEncoder</span>();</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Read raw telemetry:</span></span>
      <span class="cl"><span class="k">double</span> motorRotations = encoder.<span class="me">getPosition</span>();</span>
      <span class="cl"><span class="k">double</span> motorRpm = encoder.<span class="me">getVelocity</span>();</span>
      <span class="cl">&nbsp;</span>
      <span class="cl"><span class="c">// Apply voltage output:</span></span>
      <span class="cl">motor.<span class="me">setVoltage</span>(<span class="n">8.0</span>);</span>
    </div>`,

    // 8. The Subsystem IO Boundary
    `<span class="tag">// 07 · architecture</span>
    <h2>The Subsystem <span class="y">IO Boundary</span></h2>
    <p class="lead">Isolate vendor libraries strictly inside Subsystem IO implementations.</p>
    <div class="two">
      <div class="fcard">
        <div class="flabel">IO Implementation</div>
        <div class="ftitle">FlywheelIOTalonFX / FlywheelIOSparkMax</div>
        <div class="fdesc">Reads raw vendor RPM/rotations and converts to radians/meters using <code>Units</code> before saving to inputs.</div>
      </div>
      <div class="fcard">
        <div class="flabel">Robot Code Layer</div>
        <div class="ftitle g">FlywheelSubsystem &amp; Commands</div>
        <div class="fdesc">Only sees clean SI units (<code>rad/s</code>, <code>meters</code>). Remains 100% vendor-agnostic and simulation-ready!</div>
      </div>
    </div>`,

    // 9. Recap (data-center)
    `<div data-center>
      <span class="tag">// end.vendor_units()</span>
      <h2>Vendor Units <span class="y">Mastered</span></h2>
      <p class="lead">You know how to seamlessly integrate vendor motor controllers into standard WPILib architectures.</p>
      <div class="fgrid">
        <div class="fcard no-bracket"><div class="sn">01</div><div class="sl">Units Helpers · Safe dimensional math</div></div>
        <div class="fcard no-bracket"><div class="sn">02</div><div class="sl">Gear Ratios · Converting motor &rarr; mechanism</div></div>
        <div class="fcard no-bracket"><div class="sn">03</div><div class="sl">RPM &rarr; m/s · Linear velocity calculations</div></div>
        <div class="fcard no-bracket"><div class="sn">04</div><div class="sl">IO Layer Isolation · Clean SI boundary</div></div>
      </div>
    </div>`
  ]
});
